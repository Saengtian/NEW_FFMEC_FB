<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFM NPI Ops — NMB-Minebea Thai Ltd.</title>

  <!-- Theme: restore the saved choice (or the OS preference) before first paint -->
  <script>
    (function () {
      var dark = false;
      try {
        var saved = localStorage.getItem('ffm-theme');
        dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {}
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- Compiled Tailwind CSS (tools/build.mjs) — no CDN, no runtime scanning -->
  <?!= include('Styles') ?>

  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html { color-scheme: light; }
    html.dark { color-scheme: dark; }
    html.dark, html.dark body, html.dark #root { background-color: #020617; }
    .ffm-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      gap: 14px;
    }
    .ffm-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(148, 163, 184, 0.25);
      border-top-color: #38bdf8;
      border-radius: 9999px;
      animation: ffm-spin 0.8s linear infinite;
    }
    @keyframes ffm-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="ffm-splash">
      <div class="ffm-spinner"></div>
      <div style="font-size:15px;font-weight:700;letter-spacing:0.02em;">FFM NPI Ops</div>
      <div style="font-size:12px;color:#94a3b8;">Initializing FDB Fan Assembly Command Center &amp; Google Sheets Sync...</div>
    </div>
  </div>

  <!-- Server-injected GAS Config -->
  <script>
    window.__FFM_GAS_CONFIG__ = <?!= serverConfigJson ?>;
    window.addEventListener('error', function(ev) {
      var root = document.getElementById('root');
      if (root && root.querySelector('.ffm-splash')) {
        root.innerHTML =
          '<div style="max-width:560px;margin:48px auto;padding:24px;background:#fff;border:1px solid #fecdd3;border-radius:12px;font-family:system-ui,sans-serif;">' +
          '<h2 style="margin:0 0 8px;color:#be123c;font-size:16px;">FFM NPI Ops Startup Error</h2>' +
          '<p style="margin:0 0 12px;color:#475569;font-size:13px;">Reload the page. If it keeps happening, send the message below to the maintainer.</p>' +
          '<pre style="background:#f8fafc;padding:12px;border-radius:8px;font-size:11px;overflow:auto;color:#0f172a;">' +
          String((ev.error && (ev.error.stack || ev.error.message)) || ev.message || 'Unknown error') + '</pre></div>';
      console.error('FFM NPI Ops startup error:', ev.error || ev.message, ev);
      }
    });
  </script>

  <!-- Compiled application bundle: React 18 + all views (tools/build.mjs) -->
  <?!= include('Bundle') ?>
</body>
</html>
