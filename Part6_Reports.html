<script type="text/babel" data-presets="react">
// ============================================================================
// VIEW 8: EXECUTIVE KPI REPORT — SCOPE, SNAPSHOT ANALYSIS & SLIDE EXPORT
// ============================================================================

const REPORT_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const REPORT_KPI_DEFS = [
  {
    id: 'fpy',
    label: 'First Pass Yield (FPY)',
    short: 'FPY',
    unit: '%',
    digits: 1,
    target: KPI_TARGETS.fpy,
    targetLabel: `≥ ${KPI_TARGETS.fpy.toFixed(1)}%`,
    better: 'high',
    source: 'Production Records'
  },
  {
    id: 'fy',
    label: 'Final Yield (FY)',
    short: 'Final Yield',
    unit: '%',
    digits: 1,
    target: KPI_TARGETS.fy,
    targetLabel: `≥ ${KPI_TARGETS.fy.toFixed(1)}%`,
    better: 'high',
    source: 'Production Records'
  },
  {
    id: 'efficiency',
    label: 'Line Efficiency',
    short: 'Efficiency',
    unit: '%',
    digits: 1,
    target: KPI_TARGETS.efficiency,
    targetLabel: `≥ ${KPI_TARGETS.efficiency.toFixed(1)}%`,
    better: 'high',
    source: 'Production Records'
  },
  {
    id: 'claims',
    label: 'Customer Claims',
    short: 'Claims',
    unit: '',
    digits: 0,
    target: KPI_TARGETS.customerClaims,
    targetLabel: `≤ ${KPI_TARGETS.customerClaims}`,
    better: 'low',
    source: 'Customer Feedback'
  },
  {
    id: 'saving',
    label: 'Annual Cost Saving',
    short: 'Cost Saving',
    unit: '',
    digits: 0,
    target: KPI_TARGETS.annualSavingThb,
    targetLabel: `≥ ${formatThbCompact(KPI_TARGETS.annualSavingThb)}`,
    better: 'high',
    source: 'Cost Saving'
  },
  {
    id: 'mih',
    label: 'Shipment to MIH Achieved',
    short: 'Shipment to MIH',
    unit: '%',
    digits: 0,
    target: KPI_TARGETS.mihAchievement,
    targetLabel: `${KPI_TARGETS.mihAchievement}%`,
    better: 'high',
    source: 'Gate Sign-Off'
  }
];

function reportEsc(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function reportMonthKey(iso) {
  const day = String(iso || '').slice(0, 7);
  return /^\d{4}-\d{2}$/.test(day) ? day : '';
}

function reportMonthLabel(key) {
  const parts = String(key || '').split('-');
  const month = REPORT_MONTHS[Number(parts[1]) - 1] || parts[1];
  return `${month} ${String(parts[0] || '').slice(2)}`;
}

function reportInRange(iso, from, to) {
  const day = String(iso || '').slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(day) && day >= from && day <= to;
}

/** Report-side name for the shared fiscal-year rule (see currentFiscalYear). */
function reportFiscalYearOf(iso) {
  return currentFiscalYear(iso);
}

function reportIsoShift(iso, days) {
  const date = new Date(`${iso}T00:00:00Z`);
  date.setUTCDate(date.getUTCDate() + days);
  return date.toISOString().slice(0, 10);
}

function reportWeekStartIso(iso) {
  const date = new Date(`${iso}T00:00:00Z`);
  const mondayOffset = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - mondayOffset);
  return date.toISOString().slice(0, 10);
}

function reportSpanDays(from, to) {
  const span = (Date.parse(`${to}T00:00:00Z`) - Date.parse(`${from}T00:00:00Z`)) / 86400000;
  return Math.max(1, Math.round(span) + 1);
}

function reportIsoDaysAgo(days, today = todayIso()) {
  const date = new Date(`${today}T00:00:00Z`);
  date.setUTCDate(date.getUTCDate() - days);
  return date.toISOString().slice(0, 10);
}

function reportFormatValue(def, value) {
  if (def.id === 'saving') return formatThbCompact(value);
  if (def.id === 'claims') return String(Math.round(Number(value) || 0));
  return `${(Number(value) || 0).toFixed(def.digits)}%`;
}

function reportFormatDelta(def, diff) {
  const value = Number(diff) || 0;
  const sign = value >= 0 ? '+' : '';
  if (def.id === 'saving') return `${sign}${formatThbCompact(value)}`;
  if (def.id === 'claims') return `${sign}${Math.round(value)} claims`;
  return `${sign}${value.toFixed(1)} pts`;
}

/** Same weighted roll-up as the Program Overview KPI strip, for any period. */
function reportAggregateProduction(rows) {
  let input = 0;
  let fallout = 0;
  let salvage = 0;
  let plannedHr = 0;
  let downtimeMin = 0;

  (rows || []).forEach((record) => {
    const metrics = computeProductionMetrics(record);
    input += metrics.input;
    fallout += metrics.fallout;
    salvage += metrics.salvage;
    plannedHr += metrics.plannedTimeHr;
    downtimeMin += metrics.downtimeMin;
  });

  const fpy = input > 0 ? ((input - fallout) / input) * 100 : 0;
  const fy = input > 0 ? Math.min(100, ((input - fallout + salvage) / input) * 100) : 0;
  const finalGood = Math.max(0, input - Math.max(0, fallout - salvage));
  const uph = plannedHr > 0 ? finalGood / plannedHr : 0;
  const runHr = Math.max(0, plannedHr - downtimeMin / 60);
  const inputUph = runHr > 0 ? input / runHr : 0;
  const efficiency = inputUph > 0 ? Math.min(100, (uph / inputUph) * 100) : 0;

  return {
    input,
    fpy,
    fy,
    efficiency,
    uph,
    fallout,
    salvage,
    plannedHr,
    downtimeMin,
    runs: (rows || []).length
  };
}

/**
 * Period-scoped MIH achievement: due lines are those whose FATP→MIH date falls in
 * the report window and has already passed. Mirrors the Program Overview helper,
 * which is pinned to the current fiscal year and so cannot scope a custom period.
 */
function reportBuildMihAchievement(projects, gateRecords, from, to) {
  const today = todayIso();
  const lines = [];

  (projects || []).forEach((project) => {
    getLineVariantsForProject(project).forEach((variant) => {
      const due = String(variant.fatpMih || project.mihDate || '');
      if (!reportInRange(due, from, to)) return;
      const gate = gateRecords && gateRecords[project.id] && gateRecords[project.id][variant.key]
        ? gateRecords[project.id][variant.key].mih
        : null;
      const approved = gate && gate.status === 'Approved';
      lines.push({
        project: project.model || project.name || project.id,
        due,
        approved,
        approvedAt: approved ? mihApprovalIso(gateRecords, project.id, variant.key, today) : ''
      });
    });
  });

  const dueLines = lines.filter((line) => line.due <= today);
  const onTimeFlags = dueLines.map((line) => line.approved && (!line.approvedAt || line.approvedAt <= line.due));
  const onTime = onTimeFlags.filter(Boolean).length;
  const late = dueLines.length - onTime;

  const byProject = new Map();
  dueLines.forEach((line, index) => {
    const row = byProject.get(line.project) || { label: line.project, due: 0, onTime: 0 };
    row.due += 1;
    if (onTimeFlags[index]) row.onTime += 1;
    byProject.set(line.project, row);
  });

  const bars = Array.from(byProject.values())
    .map((row) => ({
      label: row.label,
      value: row.due > 0 ? (row.onTime / row.due) * 100 : 0,
      due: row.due,
      onTime: row.onTime
    }))
    .sort((a, b) => a.value - b.value);

  const upcoming = lines.map((line) => line.due).filter((due) => due > today).sort();

  return {
    tracked: lines.length,
    nextDue: upcoming[0] || '',
    due: dueLines.length,
    onTime,
    late,
    pct: dueLines.length > 0 ? (onTime / dueLines.length) * 100 : 0,
    bars
  };
}

function reportTrendLine(def, bars) {
  if (!Array.isArray(bars) || bars.length < 2) return null;
  const first = bars[0];
  const last = bars[bars.length - 1];
  const diff = last.value - first.value;
  const best = bars.reduce((a, b) => (b.value > a.value ? b : a), bars[0]);
  const worst = bars.reduce((a, b) => (b.value < a.value ? b : a), bars[0]);
  const format = (value) => reportFormatValue(def, value);

  if (Math.abs(diff) < 0.05) {
    return `The monthly series is flat between ${first.label} and ${last.label}; best ${best.label} at ${format(best.value)}, weakest ${worst.label} at ${format(worst.value)}.`;
  }
  return `${diff > 0 ? 'Improved' : 'Declined'} from ${format(first.value)} in ${first.label} to ${format(last.value)} in ${last.label} (${reportFormatDelta(def, diff)}); best month ${best.label} at ${format(best.value)}, weakest ${worst.label} at ${format(worst.value)}.`;
}

/** Shared SVG bar chart: same markup is used in-app and in the exported deck. */
function reportBarChartSvg(bars, reference, formatter) {
  const format = formatter || ((value) => String(value));
  if (!Array.isArray(bars) || bars.length === 0) {
    return '<div class="report-chart-empty" style="padding:28px 8px;text-align:center;font-size:11px;color:#64748b;">No data inside this period.</div>';
  }

  // A small viewBox keeps the axis and value labels readable in the card-sized
  // tile the chart actually renders in, instead of shrinking them to ~5px.
  const width = 400;
  const height = 190;
  const values = bars.map((bar) => Math.max(0, Number(bar.value) || 0));
  const referenceValue = reference === null || reference === undefined ? null : Number(reference);
  const hasReference = referenceValue !== null;
  const padL = 8;
  // The target label is the same two-line block KpiTrendChart draws — see the
  // TARGET_LABEL_* block in Part5: 9px lines TARGET_LABEL_GAP apart, anchored
  // TARGET_LABEL_INSET inside the right edge, gutter sized from the widest line
  // this chart can print ("98.0%" at 26.5 units), which resolves to 44 here.
  const referenceText = hasReference ? format(referenceValue) : '';
  const padR = hasReference ? targetLabelGutter(TARGET_LABEL_WIDEST.deck) : 8;
  const padT = 22;
  const padB = 30;
  const labelFont = 10.5;
  const valueFont = 10.5;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const low = Math.min.apply(null, hasReference ? values.concat([referenceValue]) : values);
  const high = Math.max.apply(null, hasReference ? values.concat([referenceValue]) : values);
  const span = Math.max(high - low, Math.abs(high) * 0.02, 0.5);
  const floor = Math.max(0, low - span * 0.3);
  const ceiling = Math.max(high + span * 0.2, floor + span * 0.5);
  const yOf = (value) => padT + (1 - (value - floor) / (ceiling - floor)) * plotH;
  const slot = plotW / bars.length;
  const barWidth = Math.max(5, Math.min(46, slot * 0.62));
  const labelEvery = bars.length > 9 ? 2 : 1;
  const parts = [];

  for (let i = 0; i <= 3; i += 1) {
    const value = floor + (i / 3) * (ceiling - floor);
    const y = yOf(value);
    parts.push(
      `<line x1="${padL}" x2="${width - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>`
    );
  }

  bars.forEach((bar, index) => {
    const value = Math.max(0, Number(bar.value) || 0);
    const x = padL + slot * index + (slot - barWidth) / 2;
    const y = yOf(value);
    const barHeight = Math.max(1, padT + plotH - y);
    const center = padL + slot * index + slot / 2;
    parts.push(
      `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barHeight.toFixed(1)}" rx="3" fill="currentColor" fill-opacity="0.85"/>`
    );
    if (index % labelEvery === 0) {
      parts.push(
        `<text x="${center.toFixed(1)}" y="${height - 15}" text-anchor="middle" font-size="${labelFont}" fill="currentColor" fill-opacity="0.65">${reportEsc(bar.label)}</text>`
      );
      parts.push(
        `<text x="${center.toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="${valueFont}" font-weight="700" fill="currentColor">${reportEsc(format(value))}</text>`
      );
    }
  });

  if (hasReference) {
    const y = yOf(referenceValue);
    // Centre the two 9-unit lines on the target line, then keep the block on the
    // canvas when the target sits on the top or bottom edge.
    const labelTop = Math.min(Math.max(y - 5, 10), height - padB - (TARGET_LABEL_GAP + 3));
    parts.push(
      `<line x1="${padL}" x2="${width - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5 4"/>`,
      `<text x="${width - TARGET_LABEL_INSET}" y="${labelTop.toFixed(1)}" text-anchor="end" font-size="9" fill="#e11d48">target</text>`,
      `<text x="${width - TARGET_LABEL_INSET}" y="${(labelTop + TARGET_LABEL_GAP).toFixed(1)}" text-anchor="end" font-size="9" font-weight="700" fill="#e11d48">${reportEsc(referenceText)}</text>`
    );
  }

  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="KPI snapshot chart" style="width:100%;height:auto;display:block">${parts.join('')}</svg>`;
}

/** Pareto bars (fallout) with a cumulative-share line, shared by app and deck. */
function reportParetoSvg(rows) {
  if (!Array.isArray(rows) || rows.length === 0) {
    return '<div class="report-chart-empty" style="padding:28px 8px;text-align:center;font-size:11px;color:#64748b;">No defect data inside this period.</div>';
  }

  const width = 640;
  const height = 240;
  const padL = 10;
  const padR = 38;
  const padT = 24;
  const padB = 44;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const max = Math.max.apply(null, rows.map((row) => Number(row.fallout) || 0)) || 1;
  const slot = plotW / rows.length;
  const barWidth = Math.max(8, Math.min(54, slot * 0.55));
  const yOfCount = (value) => padT + (1 - value / max) * plotH;
  const yOfCum = (value) => padT + (1 - Math.min(100, Math.max(0, value)) / 100) * plotH;
  const parts = [];

  for (let i = 0; i <= 3; i += 1) {
    const y = padT + (i / 3) * plotH;
    parts.push(
      `<line x1="${padL}" x2="${width - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>`
    );
  }

  rows.forEach((row, index) => {
    const value = Number(row.fallout) || 0;
    const x = padL + slot * index + (slot - barWidth) / 2;
    const y = yOfCount(value);
    const center = padL + slot * index + slot / 2;
    const label = String(row.label || '').length > 19 ? `${String(row.label).slice(0, 18)}…` : String(row.label);
    parts.push(
      `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${Math.max(1, padT + plotH - y).toFixed(1)}" rx="3" fill="currentColor" fill-opacity="0.85"/>`
    );
    parts.push(
      `<text x="${center.toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">${reportEsc(value.toLocaleString())}</text>`
    );
    parts.push(
      `<text x="${center.toFixed(1)}" y="${height - 26}" text-anchor="middle" font-size="8" fill="currentColor" fill-opacity="0.65">${reportEsc(label)}</text>`
    );
    parts.push(
      `<text x="${center.toFixed(1)}" y="${height - 14}" text-anchor="middle" font-size="8" font-weight="700" fill="#e11d48">${reportEsc((Number(row.cumulative) || 0).toFixed(0))}%</text>`
    );
  });

  const points = rows
    .map((row, index) => `${(padL + slot * index + slot / 2).toFixed(1)},${yOfCum(Number(row.cumulative) || 0).toFixed(1)}`)
    .join(' ');
  parts.push(`<polyline points="${points}" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-linejoin="round"/>`);
  rows.forEach((row, index) => {
    parts.push(
      `<circle cx="${(padL + slot * index + slot / 2).toFixed(1)}" cy="${yOfCum(Number(row.cumulative) || 0).toFixed(1)}" r="2.4" fill="#e11d48"/>`
    );
  });
  [0, 50, 100].forEach((tick) => {
    parts.push(
      `<text x="${width - padR + 5}" y="${(yOfCum(tick) + 3).toFixed(1)}" font-size="8" fill="#e11d48" fill-opacity="0.8">${tick}%</text>`
    );
  });

  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Fallout Pareto and cumulative share" style="width:100%;height:auto;display:block">${parts.join('')}</svg>`;
}

function buildKpiReport({ records, costProjects, customerFeedback, projects, gateRecords, from, to, selectedIds, scopeLabel }) {
  const start = from <= to ? from : to;
  const end = from <= to ? to : from;
  const selected = new Set(Array.isArray(selectedIds) ? selectedIds : []);
  const defsById = Object.fromEntries(REPORT_KPI_DEFS.map((def) => [def.id, def]));

  const productionRecords = (records || []).filter((record) => reportInRange(record.date, start, end));
  const claims = (customerFeedback || []).filter(
    (entry) => entry.category === 'Claim' && reportInRange(entry.feedbackDate, start, end)
  );
  const fiscalYear = reportFiscalYearOf(end);
  const savingItems = (costProjects || []).filter((item) => isKpiFiscalYearTag(item.fyTarget, fiscalYear));
  const mih = reportBuildMihAchievement(projects, gateRecords, start, end);
  const mihPending = Math.max(0, mih.tracked - mih.due);
  const production = reportAggregateProduction(productionRecords);

  const productionMonths = Array.from(
    new Set(productionRecords.map((record) => reportMonthKey(record.date)).filter(Boolean))
  ).sort();
  const productionBars = (field) =>
    productionMonths.map((month) => ({
      label: reportMonthLabel(month),
      value: reportAggregateProduction(productionRecords.filter((record) => reportMonthKey(record.date) === month))[field]
    }));

  const claimMonths = Array.from(new Set(claims.map((entry) => reportMonthKey(entry.feedbackDate)).filter(Boolean))).sort();
  const claimBars = claimMonths.map((month) => ({
    label: reportMonthLabel(month),
    value: claims.filter((entry) => reportMonthKey(entry.feedbackDate) === month).length
  }));

  const savingValue = savingItems.reduce((sum, item) => sum + computeCostSavingMetrics(item).annualSavingThb, 0);
  const savingFamilies = new Map();
  savingItems.forEach((item) => {
    const family = getFamilyGroup(item) || 'Other';
    const row = savingFamilies.get(family) || { label: family, value: 0, count: 0 };
    row.value += computeCostSavingMetrics(item).annualSavingThb;
    row.count += 1;
    savingFamilies.set(family, row);
  });
  const savingBars = Array.from(savingFamilies.values()).sort((a, b) => b.value - a.value).slice(0, 8);
  const topSavingFamily = savingBars[0];

  const entries = [];

  const makeKpi = (def, config) => {
    const value = Number(config.value) || 0;
    const bars = Array.isArray(config.bars) ? config.bars : [];
    const reference = config.reference === undefined ? null : config.reference;
    const hasData = Boolean(config.hasData);
    const onTarget = hasData ? (def.better === 'high' ? value >= def.target : value <= def.target) : false;
    const diff = value - def.target;
    const analysis = [];

    if (!hasData) {
      analysis.push(
        config.emptyNote || `No ${def.source.toLowerCase()} data inside this period, so ${def.label} is not scored.`
      );
    } else {
      analysis.push(
        onTarget
          ? `${def.label} is ${reportFormatValue(def, value)} against ${def.targetLabel} — ahead of target by ${reportFormatDelta(def, Math.abs(diff))}.`
          : `${def.label} is ${reportFormatValue(def, value)} against ${def.targetLabel} — behind target by ${reportFormatDelta(def, Math.abs(diff))}.`
      );
      const trend = reportTrendLine(def, bars);
      if (trend) analysis.push(trend);
      (config.notes || []).forEach((note) => analysis.push(note));
    }

    entries.push({
      id: def.id,
      label: def.label,
      short: def.short,
      source: def.source,
      display: reportFormatValue(def, value),
      value,
      target: def.target,
      targetLabel: def.targetLabel,
      better: def.better,
      hasData,
      onTarget,
      status: !hasData ? 'neutral' : onTarget ? 'good' : 'bad',
      deltaLabel: hasData ? reportFormatDelta(def, diff) : 'No data',
      coverage: config.coverage || '',
      bars,
      reference,
      analysis,
      chartSvg: reportBarChartSvg(bars, reference, (barValue) => reportFormatValue(def, barValue))
    });
  };

  if (selected.has('fpy')) {
    makeKpi(defsById.fpy, {
      value: production.fpy,
      bars: productionBars('fpy'),
      reference: defsById.fpy.target,
      hasData: production.runs > 0,
      coverage: `${production.runs} run${production.runs === 1 ? '' : 's'} · ${production.input.toLocaleString()} units input`
    });
  }

  if (selected.has('fy')) {
    makeKpi(defsById.fy, {
      value: production.fy,
      bars: productionBars('fy'),
      reference: defsById.fy.target,
      hasData: production.runs > 0,
      coverage: `${production.runs} run${production.runs === 1 ? '' : 's'} · ${production.input.toLocaleString()} units input`
    });
  }

  if (selected.has('efficiency')) {
    makeKpi(defsById.efficiency, {
      value: production.efficiency,
      bars: productionBars('efficiency'),
      reference: defsById.efficiency.target,
      hasData: production.runs > 0,
      coverage: `${production.runs} run${production.runs === 1 ? '' : 's'} · ${production.uph.toFixed(1)} net-good UPH`
    });
  }

  if (selected.has('claims')) {
    const claimsInScope = (customerFeedback || []).filter((entry) => entry.category === 'Claim').length;
    makeKpi(defsById.claims, {
      value: claims.length,
      bars: claimBars,
      reference: null,
      hasData: (customerFeedback || []).length > 0,
      coverage: `${claims.length} claim${claims.length === 1 ? '' : 's'} in period · ${claimsInScope} in scope`,
      notes: [
        claims.length === 0
          ? 'No claim was raised inside the period — the target is met with no open exposure.'
          : `Monthly peak ${claimBars.reduce((a, b) => (b.value > a.value ? b : a), claimBars[0] || { label: '—', value: 0 }).label}.`
      ]
    });
  }

  if (selected.has('saving')) {
    makeKpi(defsById.saving, {
      value: savingValue,
      bars: savingBars,
      reference: null,
      hasData: savingItems.length > 0,
      coverage: `${savingItems.length} initiative${savingItems.length === 1 ? '' : 's'} tagged FY${fiscalYear}`,
      notes: topSavingFamily
        ? [`Largest contributor: ${topSavingFamily.label} at ${formatThbCompact(topSavingFamily.value)} across ${topSavingFamily.count} initiative${topSavingFamily.count === 1 ? '' : 's'}.`]
        : []
    });
  }

  if (selected.has('mih')) {
    const weakest = mih.bars[0];
    makeKpi(defsById.mih, {
      value: mih.pct,
      bars: mih.bars,
      reference: defsById.mih.target,
      hasData: mih.due > 0,
      coverage: `${mih.due} due line${mih.due === 1 ? '' : 's'} · ${mih.tracked} tracked${
        mihPending > 0 ? ` (${mihPending} not yet due)` : ''
      }`,
      emptyNote: mih.tracked > 0
        ? `${mih.tracked} line${mih.tracked === 1 ? '' : 's'} in this period ${mih.tracked === 1 ? 'is' : 'are'} not due yet (next ${mih.nextDue}); achievement is scored once a due date passes.`
        : undefined,
      notes: weakest && weakest.value < 100
        ? [`Weakest model: ${weakest.label} at ${weakest.value.toFixed(0)}% (${weakest.onTime}/${weakest.due} on time).`]
        : []
    });
  }

  // ---- Deep dive: scope composition, loss drivers and period movement ----
  const spanDays = reportSpanDays(start, end);
  const priorEnd = reportIsoShift(start, -1);
  const priorStart = reportIsoShift(priorEnd, -(spanDays - 1));
  const priorProduction = reportAggregateProduction(
    (records || []).filter((record) => reportInRange(record.date, priorStart, priorEnd))
  );
  const priorFeedback = (customerFeedback || []).filter((entry) =>
    reportInRange(entry.feedbackDate, priorStart, priorEnd)
  );
  const priorClaims = priorFeedback.filter((entry) => entry.category === 'Claim').length;

  const familyOf = (entry) => entry.familyGroup || inferFamilyFromModel(entry.model) || 'Other';

  const familyMap = new Map();
  productionRecords.forEach((record) => {
    const label = familyOf(record);
    const row = familyMap.get(label) || { label, runs: 0, input: 0, fallout: 0, salvage: 0 };
    const metrics = computeProductionMetrics(record);
    row.runs += 1;
    row.input += metrics.input;
    row.fallout += metrics.fallout;
    row.salvage += metrics.salvage;
    familyMap.set(label, row);
  });
  const families = Array.from(familyMap.values())
    .map((row) => ({
      ...row,
      fpy: row.input > 0 ? ((row.input - row.fallout) / row.input) * 100 : 0,
      fy: row.input > 0 ? Math.min(100, ((row.input - row.fallout + row.salvage) / row.input) * 100) : 0,
      share: production.input > 0 ? (row.input / production.input) * 100 : 0,
      claims: claims.filter((claim) => familyOf(claim) === row.label).length
    }))
    .sort((a, b) => b.input - a.input);

  const defectMap = new Map();
  productionRecords.forEach((record) => {
    (record.defectItems || []).forEach((item) => {
      const label = item.mode || 'Unspecified';
      const row = defectMap.get(label) || { label, fallout: 0, salvage: 0 };
      row.fallout += Math.max(0, Number(item.falloutQty) || 0);
      row.salvage += Math.max(0, Number(item.salvageQty) || 0);
      defectMap.set(label, row);
    });
  });
  const totalDefectFallout = Array.from(defectMap.values()).reduce((sum, row) => sum + row.fallout, 0);
  let defectCumulative = 0;
  const defects = Array.from(defectMap.values())
    .filter((row) => row.fallout > 0)
    .sort((a, b) => b.fallout - a.fallout)
    .slice(0, 6)
    .map((row) => {
      defectCumulative += row.fallout;
      return {
        ...row,
        share: totalDefectFallout > 0 ? (row.fallout / totalDefectFallout) * 100 : 0,
        cumulative: totalDefectFallout > 0 ? (defectCumulative / totalDefectFallout) * 100 : 0,
        salvageRate: row.fallout > 0 ? (row.salvage / row.fallout) * 100 : 0
      };
    });

  const downtimeMap = new Map();
  productionRecords.forEach((record) => {
    (record.downtimeEvents || []).forEach((event) => {
      const label = event.category || 'Other';
      downtimeMap.set(label, (downtimeMap.get(label) || 0) + Math.max(0, Number(event.durationMin) || 0));
    });
  });
  const downtimeTotal = production.downtimeMin;
  const downtime = Array.from(downtimeMap.entries())
    .map(([label, minutes]) => ({ label, minutes, share: downtimeTotal > 0 ? (minutes / downtimeTotal) * 100 : 0 }))
    .sort((a, b) => b.minutes - a.minutes);

  const severityCounts = { Critical: 0, Major: 0, Minor: 0 };
  claims.forEach((claim) => {
    if (severityCounts[claim.severity] !== undefined) severityCounts[claim.severity] += 1;
  });
  const issueMap = new Map();
  claims.forEach((claim) => {
    const label = claim.issueCategory || 'Unclassified';
    issueMap.set(label, (issueMap.get(label) || 0) + 1);
  });
  const topIssue = Array.from(issueMap.entries()).sort((a, b) => b[1] - a[1])[0] || null;

  const comparisons = [
    { id: 'fpy', label: 'FPY', current: production.fpy, prior: priorProduction.fpy, digits: 1, better: 'high' },
    { id: 'fy', label: 'Final Yield', current: production.fy, prior: priorProduction.fy, digits: 1, better: 'high' },
    { id: 'efficiency', label: 'Efficiency', current: production.efficiency, prior: priorProduction.efficiency, digits: 1, better: 'high' },
    { id: 'claims', label: 'Claims', current: claims.length, prior: priorClaims, digits: 0, better: 'low' }
  ].map((row) => {
    const delta = row.current - row.prior;
    // Each KPI needs its own baseline: yields are only comparable when the
    // earlier window actually produced units, while claims have a real zero
    // baseline when feedback was captured but no claim was raised.
    const hasPrior = row.id === 'claims' ? priorFeedback.length > 0 : priorProduction.input > 0;
    return {
      ...row,
      delta,
      hasPrior,
      deltaLabel: hasPrior
        ? row.digits === 0
          ? `${delta >= 0 ? '+' : ''}${Math.round(delta)}`
          : `${delta >= 0 ? '+' : ''}${delta.toFixed(1)} pts`
        : 'No earlier data',
      improved: row.better === 'high' ? delta >= 0 : delta <= 0
    };
  });

  const deepInsights = [];
  if (production.runs > 0) {
    if (families.length > 0) {
      const lead = families[0];
      const weakest = families.reduce((a, b) => (b.fpy < a.fpy ? b : a), families[0]);
      deepInsights.push(
        `${lead.label} carries ${lead.share.toFixed(0)}% of period input (${lead.runs} run${lead.runs === 1 ? '' : 's'}) at ${lead.fpy.toFixed(1)}% FPY and ${lead.fy.toFixed(1)}% final yield.`
      );
      if (families.length > 1 && weakest.fpy < lead.fpy) {
        deepInsights.push(
          `${weakest.label} is the weakest family at ${weakest.fpy.toFixed(1)}% FPY, ${(production.fpy - weakest.fpy).toFixed(1)} pts below the scope average.`
        );
      }
    }
    if (defects.length > 0) {
      deepInsights.push(
        `${defects[0].label} is the top loss mode: ${defects[0].fallout.toLocaleString()} units, ${defects[0].share.toFixed(0)}% of period fallout, with ${defects[0].salvageRate.toFixed(0)}% recovered by salvage.`
      );
    }
    if (downtime.length > 0 && downtimeTotal > 0) {
      deepInsights.push(
        `Downtime totals ${(downtimeTotal / 60).toFixed(1)} h; ${downtime[0].label} is ${downtime[0].share.toFixed(0)}% of it (${downtime[0].minutes} min).`
      );
    }
  }
  if (claims.length > 0) {
    deepInsights.push(
      `${claims.length} claim${claims.length === 1 ? '' : 's'} in scope: ${severityCounts.Critical} critical, ${severityCounts.Major} major${topIssue ? `; most frequent category ${topIssue[0]}` : ''}.`
    );
  }
  if (priorProduction.input > 0) {
    const fpyDelta = production.fpy - priorProduction.fpy;
    deepInsights.push(
      `FPY is ${fpyDelta >= 0 ? 'up' : 'down'} ${Math.abs(fpyDelta).toFixed(1)} pts versus the preceding ${spanDays}-day window (${priorStart} → ${priorEnd}, ${priorProduction.fpy.toFixed(1)}%).`
    );
  }

  const evaluated = entries.filter((kpi) => kpi.hasData);
  const onTarget = evaluated.filter((kpi) => kpi.onTarget);
  const offTarget = evaluated
    .filter((kpi) => !kpi.onTarget)
    .sort((a, b) => {
      const gap = (kpi) => Math.abs(kpi.value - kpi.target) / Math.max(Math.abs(kpi.target), 1);
      return gap(b) - gap(a);
    });

  const mihEvidence =
    mih.tracked === 0
      ? '0 MIH lines due'
      : `${mih.due} of ${mih.tracked} MIH line${mih.tracked === 1 ? '' : 's'} due${
          mihPending > 0
            ? ` (${mihPending} not yet due${mih.nextDue ? `; next ${mih.nextDue}` : ''})`
            : ''
        }`;

  const bullets = [];
  if (entries.length === 0) {
    bullets.push('Select at least one KPI in Report setup to build the snapshot.');
  } else if (evaluated.length === 0) {
    bullets.push('None of the selected KPIs has data inside this period — widen the period or clear filters.');
  } else {
    bullets.push(
      `${onTarget.length} of ${evaluated.length} evaluated KPI${evaluated.length === 1 ? '' : 's'} meet target for ${start} → ${end}.`
    );
    if (onTarget.length > 0) {
      const margin = (kpi) =>
        (kpi.better === 'high' ? kpi.value - kpi.target : kpi.target - kpi.value) / Math.max(Math.abs(kpi.target), 1);
      const best = onTarget.reduce((a, b) => (margin(b) > margin(a) ? b : a), onTarget[0]);
      bullets.push(`Strongest position: ${best.short} at ${best.display} (${best.deltaLabel} vs ${best.targetLabel}).`);
    }
    if (offTarget.length > 0) {
      bullets.push(`Largest gap: ${offTarget[0].short} at ${offTarget[0].display} (${offTarget[0].deltaLabel} vs ${offTarget[0].targetLabel}).`);
    }
    bullets.push(
      `Evidence base: ${production.runs} production run${production.runs === 1 ? '' : 's'}, ${claims.length} claim${claims.length === 1 ? '' : 's'}, ${savingItems.length} saving initiative${savingItems.length === 1 ? '' : 's'}, ${mihEvidence}.`
    );
    if (entries.some((kpi) => kpi.id === 'mih') && mih.due > 0) {
      bullets.push(`Shipment to MIH: ${mih.onTime} of ${mih.due} due lines approved on time (${mih.pct.toFixed(0)}%).`);
    }
  }

  const watchLines = offTarget.map((kpi) => `${kpi.label}: ${kpi.display} vs ${kpi.targetLabel} (${kpi.deltaLabel})`);
  if (mihPending > 0) {
    watchLines.push(
      `Shipment to MIH: ${mih.due} of ${mih.tracked} tracked line${mih.tracked === 1 ? '' : 's'} due; ${mihPending} not yet due${
        mih.nextDue ? ` (next ${mih.nextDue})` : ''
      } — not scored until the due date passes.`
    );
  }

  const headline = entries.length === 0
    ? 'No KPIs selected.'
    : evaluated.length === 0
    ? 'No evidence inside the selected period.'
    : offTarget.length === 0
    ? `All ${evaluated.length} evaluated KPI${evaluated.length === 1 ? '' : 's'} meet target for ${start} → ${end}.`
    : `${offTarget.length} of ${evaluated.length} evaluated KPI${evaluated.length === 1 ? '' : 's'} behind target; ${onTarget.length} on track.`;

  return {
    from: start,
    to: end,
    periodLabel: `${start} → ${end}`,
    scopeLabel: scopeLabel || 'All programs',
    generatedAt: new Date().toLocaleString(),
    kpis: entries,
    summary: {
      headline,
      bullets,
      good: onTarget.length,
      total: evaluated.length,
      risks: watchLines
    },
    deep: {
      spanDays,
      totals: {
        input: production.input,
        fallout: production.fallout,
        salvage: production.salvage,
        salvageRate: production.fallout > 0 ? (production.salvage / production.fallout) * 100 : 0,
        downtimeMin: production.downtimeMin,
        uph: production.uph
      },
      priorStart,
      priorEnd,
      priorRuns: priorProduction.runs,
      priorClaims,
      comparisons,
      families,
      defects,
      totalDefectFallout,
      downtime,
      downtimeTotal,
      claims: {
        total: claims.length,
        ...severityCounts,
        topIssue: topIssue ? { label: topIssue[0], count: topIssue[1] } : null
      },
      insights: deepInsights
    },
    counts: {
      runs: production.runs,
      claims: claims.length,
      initiatives: savingItems.length,
      mihDue: mih.due,
      mihTracked: mih.tracked,
      mihPending
    }
  };
}

/** Compact 3-page A4-landscape report: no external CSS, fonts or scripts. */
function reportDeckHtml(model) {
  const esc = reportEsc;
  const generated = esc(model.generatedAt);
  const deep = model.deep;

  const statusPill = (kpi) =>
    `<span class="pill ${!kpi.hasData ? 'neutral' : kpi.onTarget ? 'ok' : 'bad'}">${
      !kpi.hasData ? 'No data' : kpi.onTarget ? 'On target' : 'Off target'
    }</span>`;

  const scoreRows = model.kpis.length
    ? model.kpis
        .map(
          (kpi) => `<tr>
        <td>${esc(kpi.label)}</td>
        <td class="num">${esc(kpi.display)}</td>
        <td class="num muted">${esc(kpi.targetLabel)}</td>
        <td>${statusPill(kpi)}</td>
        <td class="muted">${esc(kpi.coverage)}</td>
      </tr>`
        )
        .join('')
    : '<tr><td colspan="5" class="muted">No KPI selected for this report.</td></tr>';

  const kpiTiles = model.kpis.length
    ? model.kpis
        .map(
          (kpi) => `<div class="kpi-tile">
        <div class="tile-head"><strong>${esc(kpi.label)}</strong>${statusPill(kpi)}</div>
        <div class="tile-value"><span class="v">${esc(kpi.display)}</span><span class="meta">vs ${esc(
            kpi.targetLabel
          )} · ${esc(kpi.deltaLabel)}</span></div>
        <div class="chart">${kpi.chartSvg}</div>
        <div class="note">${esc(kpi.coverage)}${kpi.analysis[0] ? ` — ${esc(kpi.analysis[0])}` : ''}</div>
      </div>`
        )
        .join('')
    : '<div class="muted" style="grid-column:1/-1;font-size:11px;">Select at least one KPI to build the snapshot.</div>';

  const familyRows = deep.families.length
    ? deep.families
        .slice(0, 6)
        .map(
          (row) => `<tr>
        <td>${esc(row.label)}</td>
        <td class="num">${row.share.toFixed(0)}%</td>
        <td class="num">${row.fpy.toFixed(1)}%</td>
        <td class="num">${row.fy.toFixed(1)}%</td>
        <td class="num">${row.claims}</td>
      </tr>`
        )
        .join('')
    : '<tr><td colspan="5" class="muted">No production data in this period.</td></tr>';

  const movementRows = deep.comparisons
    .map(
      (row) => `<tr>
        <td>${esc(row.label)}</td>
        <td class="num">${row.digits === 0 ? Math.round(row.current) : `${row.current.toFixed(1)}%`}</td>
        <td class="num muted">${
          row.hasPrior ? (row.digits === 0 ? Math.round(row.prior) : `${row.prior.toFixed(1)}%`) : '—'
        }</td>
        <td class="num ${row.hasPrior ? (row.improved ? 'ok-text' : 'bad-text') : 'muted'}">${esc(row.deltaLabel)}</td>
      </tr>`
    )
    .join('');

  const downtimeRows = deep.downtime.length
    ? deep.downtime
        .slice(0, 3)
        .map((row) => `<li>${esc(row.label)} — ${row.minutes} min (${row.share.toFixed(0)}%)</li>`)
        .join('')
    : '<li>No downtime logged in this period.</li>';

  // The headline and cover already state the on-target count, so the deck drops
  // that first bullet instead of repeating it verbatim.
  const takeawayBullets =
    model.summary.bullets.length > 1 && /^\d+ of \d+/.test(model.summary.bullets[0])
      ? model.summary.bullets.slice(1)
      : model.summary.bullets;
  const takeawayRows = takeawayBullets.map((line) => `<li>${esc(line)}</li>`).join('');
  const riskRows = model.summary.risks.length
    ? model.summary.risks.map((line) => `<li>${esc(line)}</li>`).join('')
    : '<li>No selected KPI is behind target in this period.</li>';
  const insightRows = deep.insights.length
    ? deep.insights.map((line) => `<li>${esc(line)}</li>`).join('')
    : '<li>No production or claim evidence inside this period to analyse.</li>';

  const targetsLine = REPORT_KPI_DEFS.filter((def) => model.kpis.some((kpi) => kpi.id === def.id))
    .map((def) => `${esc(def.short)} ${esc(def.targetLabel)} · ${esc(def.source)}`)
    .join('  ·  ');

  return `<!DOCTYPE html>

function ReportsView({
  projects = [],
  records = [],
  costProjects = [],
  customerFeedback = [],
  gateRecords = {},
  scopeLabel = 'All programs'
}) {
  // The report opens on the fiscal year that contains today, so the FY presets and
  // the default period roll over on 1 April instead of pinning a fixed year.
  const today = todayIso();
  const fiscalYear = reportFiscalYearOf(today);
  const fiscalWindow = fiscalYearWindow(fiscalYear);
  const [from, setFrom] = useState(fiscalWindow.start);
  const [to, setTo] = useState(fiscalWindow.end);
  const [selectedIds, setSelectedIds] = useState(() => REPORT_KPI_DEFS.map((def) => def.id));

  const selected = useMemo(() => new Set(selectedIds), [selectedIds]);

  const model = useMemo(
    () =>
      buildKpiReport({
        records,
        costProjects,
        customerFeedback,
        projects,
        gateRecords,
        from,
        to,
        selectedIds,
        scopeLabel
      }),
    [records, costProjects, customerFeedback, projects, gateRecords, from, to, selectedIds, scopeLabel]
  );

  const toggleKpi = (id) =>
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((entry) => entry !== id) : [...prev, id]));

  const calendarYtdStart = `${today.slice(0, 4)}-01-01`;
  const presets = [
    { id: 'today', label: 'TODAY', from: today, to: today },
    { id: 'wtd', label: 'WTD', from: reportWeekStartIso(today), to: today },
    { id: 'mtd', label: 'MTD', from: `${today.slice(0, 7)}-01`, to: today },
    // YTD means the calendar year; the fiscal-year view stays available as FY YTD.
    { id: 'ytd', label: 'YTD', from: calendarYtdStart, to: today },
    { id: 'fy-ytd', label: 'FY YTD', from: fiscalWindow.start, to: today },
    { id: 'fy', label: `FY${fiscalYear}`, from: fiscalWindow.start, to: fiscalWindow.end },
    { id: 'q', label: 'Last 90 days', from: reportIsoDaysAgo(89), to: today },
    { id: 'y', label: 'Last 12 months', from: reportIsoDaysAgo(364), to: today }
  ];

  const applyPreset = (preset) => {
    setFrom(preset.from);
    setTo(preset.to);
  };

  const handleExportSlides = () => {
    if (model.kpis.length === 0) return;
    const html = reportDeckHtml(model);
    const fileName = `FFM-KPI-Report_${model.from}_to_${model.to}.html`;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  };

  const onTargetPct = model.summary.total > 0 ? (model.summary.good / model.summary.total) * 100 : 0;

  return (
    <div className="space-y-6">
      {/* 1. Report setup — KPI selection and period scope */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-start justify-between gap-3">
          <div>
            <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">Report setup</h2>
            <p className="text-[11px] text-slate-500 dark:text-slate-400">
              {scopeLabel} · {model.periodLabel} · snapshot generated {model.generatedAt}
            </p>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <button
              type="button"
              onClick={() => setSelectedIds(REPORT_KPI_DEFS.map((def) => def.id))}
              className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
            >
              Select all
            </button>
            <button
              type="button"
              onClick={() => setSelectedIds([])}
              className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800"
            >
              Clear
            </button>
            <button
              type="button"
              onClick={handleExportSlides}
              disabled={model.kpis.length === 0}
              className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 text-white text-xs font-semibold inline-flex items-center gap-1.5 hover:bg-slate-800 dark:hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              <Download className="w-3.5 h-3.5" />
              <span>Export report (3 pages)</span>
            </button>
          </div>
        </div>

        <div className="p-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div className="space-y-2">
            <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Period scope</div>
            <div className="flex flex-wrap items-end gap-2">
              <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300">
                From
                <input
                  type="date"
                  value={from}
                  onChange={(event) => setFrom(event.target.value)}
                  className="mt-1 block px-2.5 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 tabular-nums"
                />
              </label>
              <label className="text-[11px] font-semibold text-slate-600 dark:text-slate-300">
                To
                <input
                  type="date"
                  value={to}
                  onChange={(event) => setTo(event.target.value)}
                  className="mt-1 block px-2.5 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 tabular-nums"
                />
              </label>
            </div>
            <div className="flex flex-wrap gap-1.5 pt-1">
              {presets.map((preset) => {
                const active = from === preset.from && to === preset.to;
                return (
                  <button
                    key={preset.id}
                    type="button"
                    title={`${preset.from} → ${preset.to}`}
                    onClick={() => applyPreset(preset)}
                    className={`px-2 py-1 rounded-md text-[10px] font-bold border transition-colors ${
                      active
                        ? 'bg-blue-600 text-white border-blue-600'
                        : 'bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700'
                    }`}
                  >
                    {preset.label}
                  </button>
                );
              })}
            </div>
            {from > to && (
              <p className="text-[10px] font-semibold text-amber-700 dark:text-amber-300">
                The From date is after To — the report reads the two dates in chronological order.
              </p>
            )}
          </div>

          <div className="space-y-2">
            <div className="flex items-center justify-between gap-2">
              <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                KPIs in scope ({selectedIds.length}/{REPORT_KPI_DEFS.length})
              </div>
              <div className="text-[10px] text-slate-500 dark:text-slate-400 tabular-nums">
                {model.counts.runs} runs · {model.counts.claims} claims · {model.counts.initiatives} initiatives ·{' '}
                {model.counts.mihDue} MIH due · {model.counts.mihTracked} tracked
              </div>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {REPORT_KPI_DEFS.map((def) => {
                const isOn = selected.has(def.id);
                return (
                  <button
                    key={def.id}
                    type="button"
                    aria-pressed={isOn}
                    onClick={() => toggleKpi(def.id)}
                    className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-semibold border transition-colors ${
                      isOn
                        ? 'bg-blue-50 dark:bg-blue-950 text-blue-800 dark:text-blue-200 border-blue-300 dark:border-blue-700'
                        : 'bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'
                    }`}
                  >
                    <span
                      aria-hidden="true"
                      className={`w-3 h-3.5 rounded-[3px] border flex items-center justify-center text-[9px] leading-none ${
                        isOn ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 dark:border-slate-600'
                      }`}
                    >
                      {isOn ? '✓' : ''}
                    </span>
                    {def.label}
                  </button>
                );
              })}
            </div>
            <p className="text-[10px] text-slate-500 dark:text-slate-400">
              Production KPIs use weighted totals over the period; claims and cost saving are period totals; MIH is measured on lines already due.
            </p>
          </div>
        </div>
      </section>

      {/* 2. Snapshot visualization & analysis */}
      <section className="space-y-2.5">
        <div className="flex flex-wrap items-center justify-between gap-2">

            </p>
          </div>
          <span className="text-[10px] font-semibold px-2 py-0.5 rounded border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
            Snapshot · {model.periodLabel}
          </span>
        </div>

        {model.kpis.length === 0 ? (
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 p-8 text-center text-xs text-slate-500 dark:text-slate-400">

                      <span>{line}</span>

                </ul>
              </article>

      </section>

                    )}
                  </span>
                </div>
              ))}
            </div>
            <p className="text-[9px] text-slate-500 dark:text-slate-400 mt-1.5">
              {model.deep.priorRuns} runs · {model.deep.priorClaims} claims in baseline
            </p>
          </article>

          <article className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3.5">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <h3 className="text-xs font-bold text-slate-900 dark:text-slate-100">Loss drivers · fallout Pareto</h3>
              <span className="text-[9px] text-slate-500 dark:text-slate-400">bars = units · red = cumulative %</span>
            </div>
            <div
              className="text-emerald-600 dark:text-emerald-400 mt-1"
              dangerouslySetInnerHTML={{ __html: reportParetoSvg(model.deep.defects) }}
            />
            <p className="text-[9px] text-slate-500 dark:text-slate-400">
              Top {model.deep.defects.length} mode{model.deep.defects.length === 1 ? '' : 's'} cover{' '}
              {model.deep.defects.length > 0
                ? `${model.deep.defects[model.deep.defects.length - 1].cumulative.toFixed(0)}%`
                : '0%'}{' '}
              of {model.deep.totalDefectFallout.toLocaleString()} fallout units.
            </p>
            <div className="mt-2.5 pt-2.5 border-t border-slate-100 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <h4 className="text-[9px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Downtime · {(model.deep.downtimeTotal / 60).toFixed(1)} h
                </h4>
                {model.deep.downtime.length === 0 ? (
                  <p className="text-[9px] text-slate-500 dark:text-slate-400 mt-1">No downtime logged.</p>
                ) : (
                  <ul className="mt-1 space-y-0.5 text-[9px] text-slate-600 dark:text-slate-300">
                    {model.deep.downtime.slice(0, 3).map((row) => (
                      <li key={row.label} className="flex justify-between gap-2">
                        <span className="truncate">{row.label}</span>
                        <span className="tabular-nums text-slate-500 dark:text-slate-400 shrink-0">
                          {row.minutes} min · {row.share.toFixed(0)}%
                        </span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
              <div>
                <h4 className="text-[9px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Claims &amp; recovery
                </h4>
                <div className="flex flex-wrap gap-1 mt-1 text-[9px] font-bold">
                  <span className="px-1.5 py-0.5 rounded border border-rose-200 dark:border-rose-800 bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300">
                    {model.deep.claims.Critical} critical
                  </span>
                  <span className="px-1.5 py-0.5 rounded border border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300">
                    {model.deep.claims.Major} major
                  </span>
                  <span className="px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                    {model.deep.claims.Minor} minor
                  </span>
                </div>
                <p className="text-[9px] text-slate-500 dark:text-slate-400 mt-1">
                  Salvage {model.deep.totals.salvage.toLocaleString()} units ·{' '}
                  {model.deep.totals.salvageRate.toFixed(0)}% of fallout
                  {model.deep.claims.topIssue ? ` · top: ${model.deep.claims.topIssue.label}` : ''}
                </p>
              </div>
            </div>
          </article>

          <article className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3.5">
            <h3 className="text-xs font-bold text-slate-900 dark:text-slate-100">Deep analysis summary</h3>
            {model.deep.insights.length === 0 ? (
              <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1.5">
                No production or claim evidence inside this period to analyse.
              </p>
            ) : (
              <ul className="mt-1.5 space-y-1">
                {model.deep.insights.map((line, index) => (
                  <li key={index} className="flex gap-1.5 text-[10px] leading-snug text-slate-600 dark:text-slate-300">
                    <span className="text-blue-600 dark:text-blue-400 font-bold" aria-hidden="true">
                      {index + 1}.
                    </span>
                    <span>{line}</span>
                  </li>
                ))}
              </ul>
            )}
          </article>
        </div>
      </section>

      {/* 3. Executive summary & key takeaways */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-3">
        <div className="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">Executive summary</h2>
            <p className="text-[13px] font-semibold text-slate-800 dark:text-slate-200 mt-1">{model.summary.headline}</p>
          </div>
          <div className="text-right">
            <div className="text-xl font-bold tabular-nums text-slate-900 dark:text-slate-100">
              {model.summary.good} / {model.summary.total}
            </div>
            <div className="text-[10px] text-slate-500 dark:text-slate-400">KPIs on target</div>
          </div>
        </div>

        <div className="h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
          <div className="h-full bg-emerald-500" style={{ width: `${onTargetPct.toFixed(1)}%` }} />
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <h3 className="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Key takeaways</h3>
            <ul className="space-y-1">
              {model.summary.bullets.map((line, index) => (
                <li key={index} className="flex gap-2 text-[10px] leading-snug text-slate-600 dark:text-slate-300">
                  <span className="text-blue-600 dark:text-blue-400 font-bold" aria-hidden="true">›</span>
                  <span>{line}</span>
                </li>
              ))}
            </ul>
          </div>
          <div>
            <h3 className="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Watch list</h3>
            {model.summary.risks.length === 0 ? (
              <p className="text-[11px] text-slate-600 dark:text-slate-300">No selected KPI is behind target in this period.</p>
            ) : (
              <ul className="space-y-1.5">
                {model.summary.risks.map((line, index) => (
                  <li key={index} className="flex gap-2 text-[10px] leading-snug text-amber-800 dark:text-amber-200">
                    <span aria-hidden="true">▲</span>
                    <span>{line}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>

        <p className="text-[10px] text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800 pt-3">
          Scope: {model.scopeLabel} · {model.periodLabel} · snapshot generated {model.generatedAt}. “Export report (3 pages)”
          writes a compact A4-landscape report — summary and scorecard, KPI tiles, deep dive and method — that prints to a
          three-page PDF.
        </p>
      </section>
    </div>
  );
}
</script>
