    trendHeading: 'Trend — cumulative MIH approvals',
    variantHeading: 'By program',
    variantUnit: '%',
    paretoHeading: 'Gates blocking MIH (first unapproved gate per line)',
    paretoUnit: 'lines',
    groupNoun: 'gates',
    lineClass: 'stroke-emerald-600 dark:stroke-emerald-400',
    fillClass: 'fill-emerald-500/10',
    thinNote: 'Hollow dashed points add a single line — treat them as directional.',
    emptyTrend: 'No G8 FATP MIH approvals recorded yet — the trend starts at the first signed MIH dossier.'
  }
};

const KPI_RANGE_OPTIONS = [
  { id: '7D', label: '7D', days: 7 },
  { id: '30D', label: '30D', days: 30 },
  { id: '90D', label: '90D', days: 90 },
  { id: 'ALL', label: 'ALL', days: null }
];

const KPI_METRIC_FIELD = { fpy: 'fpy', fy: 'fy', eff: 'efficiency' };

function kpiInRange(iso, cutoffIso) {
  return !cutoffIso || (Boolean(iso) && iso >= cutoffIso);
}

/** The line identity the quality deep dive groups by; the drill-down reuses it. */
function kpiVariantKey(record) {
  return `${record.model} · ${record.config} ${record.side}`;
}

/**
 * The production rows behind a variant or Pareto row. A Pareto row is a sum over
 * defectItems (fpy/fy) or downtimeEvents (eff); a record is listed only when it
 * actually contributes to the selected key. Variant rows list every record on
 * that line. `selection.keys` carries the modes folded into an Other's row.
 */
function kpiDrillRows({ records, cutoffIso, kpiKey, selection }) {
  if (!selection) return [];
  const ranged = (records || []).filter((record) => record.date && kpiInRange(record.date, cutoffIso));
  const byNewest = (a, b) =>
    String(b.record.date).localeCompare(String(a.record.date)) ||
    String(a.record.model).localeCompare(String(b.record.model)) ||
    String(a.record.station || '').localeCompare(String(b.record.station || ''));

  if (selection.kind === 'variant') {
    return ranged
      .filter((record) => kpiVariantKey(record) === selection.key)
      .map((record) => {
        const metrics = computeProductionMetrics(record);
        return { record, fallout: metrics.fallout, salvage: metrics.salvage, match: null };
      })
      .sort(byNewest);
  }

  const keys = new Set(selection.keys && selection.keys.length ? selection.keys : [selection.key]);
  return ranged
    .filter((record) => !selection.variantKey || kpiVariantKey(record) === selection.variantKey)
    .map((record) => {
      if (kpiKey === 'eff') {
        const minutes = (record.downtimeEvents || []).reduce((sum, event) => {
          const key = event.category || 'Unclassified';
          return keys.has(key) ? sum + Math.max(0, Number(event.durationMin) || 0) : sum;
        }, 0);
        if (minutes <= 0) return null;
        const metrics = computeProductionMetrics(record);
        return { record, fallout: metrics.fallout, salvage: metrics.salvage, match: minutes };
      }

      let fallout = 0;
      let salvage = 0;
      (record.defectItems || []).forEach((defect) => {
        if (!keys.has(defect.mode || 'Unclassified')) return;
        const qty = Math.max(0, Number(defect.falloutQty) || 0);
        fallout += qty;
        salvage += Math.min(qty, Math.max(0, Number(defect.salvageQty) || 0));
      });
      const net = fallout - salvage;
      if (kpiKey === 'fpy' ? fallout <= 0 : net <= 0) return null;
      return { record, fallout, salvage, match: kpiKey === 'fy' ? net : fallout };
    })
    .filter(Boolean)
    .sort(byNewest);
}

function kpiEmptyAcc() {
  return { input: 0, fallout: 0, salvage: 0, plannedHr: 0, downtimeMin: 0, runs: 0 };
}

function kpiAccumulate(acc, rec) {
  const m = computeProductionMetrics(rec);
  acc.input += m.input;
  acc.fallout += m.fallout;
  acc.salvage += m.salvage;
  acc.plannedHr += m.plannedTimeHr;
  acc.downtimeMin += m.downtimeMin;
  acc.runs += 1;
  return acc;
}

// Weighted KPI for a set of runs — computed by the same function that drives the
// tiles, so the deep dive can never drift from the scorecard.
function kpiMetricValue(acc, kpiKey) {
  if (!(acc.input > 0)) return 0;
  const m = computeProductionMetrics({
    input: acc.input,
    fallout: acc.fallout,
    salvage: acc.salvage,
    plannedTimeHr: acc.plannedHr,
    downtimeHr: acc.downtimeMin / 60
  });
  return m[KPI_METRIC_FIELD[kpiKey]] || 0;
}

function kpiTrendPoints(map) {
  return [...map.entries()]
    .sort((a, b) => String(a[0]).localeCompare(String(b[0])))
    .map(([date, acc]) => ({
      label: formatShortDate(date),
      value: kpiMetricValue(acc, acc.kpiKey),
      meta: `${acc.input.toLocaleString()} pcs · ${acc.runs} run${acc.runs === 1 ? '' : 's'}`,
      thin: acc.input < 500 || acc.runs <= 1
    }));
}

function kpiCsvCell(value) {
  const text = value === null || value === undefined ? '' : String(value);
  return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

// One flat sheet (section · label · value · unit · share · cumulative · sample) so the
// download opens cleanly in Excel and the three tables can be filtered or pivoted.
function kpiDeepDiveCsv(meta, view) {
  const rows = [['Section', 'Label', 'Value', 'Unit', 'Share %', 'Cumulative %', 'Sample', 'Thin sample']];
  const trendUnit = (meta.trendUnit || meta.unit || '').trim();
  const trendDigits = meta.trendDigits !== undefined ? meta.trendDigits : meta.digits;
  const round = (value, digits) => Number(Number(value).toFixed(digits));

  view.trend.forEach((point) => {
    rows.push([
      'Trend',
      point.label,
      round(point.value, trendDigits),
      trendUnit,
      '',
      '',
      point.meta || '',
      point.thin ? 'yes' : 'no'
    ]);
  });
  // Variant rows carry no share column: the value is already a rate (quality, MIH),
  // a count (claims) or an amount (saving), so a percentage of the column would mislead.
  view.variant.forEach((row) => {
    rows.push(['Variant', row.label, round(row.value, meta.digits), meta.variantUnit || '', '', '', row.meta || '', '']);
  });

  // Efficiency adds a capacity + per-line balance block ahead of the Pareto rows.
  const eff = view.effAnalysis;
  if (eff) {
    rows.push(['Capacity', 'Actual UPH', round(eff.uph, 0), 'units/hr', '', '', `net good ${eff.netGood}`, '']);
    rows.push(['Capacity', 'Run-rate UPH', round(eff.runUph, 0), 'units/hr', '', '', `input ${eff.input}`, '']);
    rows.push(['Capacity', 'Cycle time', round(eff.ctSec, 1), 's/unit', '', '', `run rate ${round(eff.ctRunSec, 1)} s`, '']);
    rows.push(['Capacity', 'Downtime CT cost', round(eff.ctLossSec, 1), 's/unit', '', '', '', '']);
    rows.push(['Capacity', 'Line balance rate', round(eff.balanceRate, 0), '%', '', '', `bottleneck ${eff.bottleneckLabel}`, '']);
    eff.lines.forEach((line) => {
      rows.push([
        'Balance',
        line.label,
        round(line.ctSec, 1),
        's/unit',
        eff.maxCt > 0 ? ((line.ctSec / eff.maxCt) * 100).toFixed(1) : '',
        '',
        `UPH ${round(line.uph, 0)} · ${line.runs} run${line.runs === 1 ? '' : 's'}`,
        ''
      ]);
    });
  }

  const total = view.pareto.reduce((sum, row) => sum + row.value, 0);
  let cumulative = 0;
  view.pareto.forEach((row) => {
    const share = total > 0 ? (row.value / total) * 100 : 0;
    cumulative += share;
    rows.push([
      'Pareto',
      row.label,
      round(row.value, 2),
      meta.paretoUnit,
      share.toFixed(1),
      Math.min(100, cumulative).toFixed(1),
      '',
      ''
    ]);
  });

  return rows.map((cells) => cells.map(kpiCsvCell).join(',')).join('\r\n');
}

// One builder per KPI family. Everything the modal renders — headline, scope line,
// trend, variant histogram, Pareto — comes back from here, so the layout below has
// no per-KPI conditionals and each family's logic sits in one place.
const KPI_FAMILY_BUILDERS = {
  quality({ records, rangedRecords, kpiKey, meta, rangeLabel, variantKey }) {
    const scope = variantKey ? rangedRecords.filter((rec) => kpiVariantKey(rec) === variantKey) : rangedRecords;
    const groupBy = (keyOf, source = rangedRecords) => {
      const map = new Map();
      source.forEach((rec) => {
        const key = keyOf(rec);
        const acc = map.get(key) || kpiEmptyAcc();
        acc.kpiKey = kpiKey;
        map.set(key, kpiAccumulate(acc, rec));
      });
      return map;
    };
    const sample = (acc) => `${acc.input.toLocaleString()} pcs · ${acc.runs} run${acc.runs === 1 ? '' : 's'}`;

    const trend = kpiTrendPoints(groupBy((rec) => rec.date, scope));

    const variant = [...groupBy(kpiVariantKey).entries()]
      .map(([key, acc]) => {
        const value = kpiMetricValue(acc, kpiKey);
        return {
          key,
          label: key,
          value,
          pct: value,
          valueText: `${value.toFixed(meta.digits)}${meta.unit}`,
          meta: sample(acc),
          barClass: value < meta.target ? 'bg-rose-500' : 'bg-emerald-500'
        };
      })
      .sort((a, b) => a.value - b.value);

    const byMode = new Map();
    scope.forEach((rec) => {
      if (kpiKey === 'eff') {
        (rec.downtimeEvents || []).forEach((evt) => {
          const key = evt.category || 'Unclassified';
          byMode.set(key, (byMode.get(key) || 0) + Math.max(0, Number(evt.durationMin) || 0));
        });
        return;
      }
      (rec.defectItems || []).forEach((defect) => {
        const fallout = Math.max(0, Number(defect.falloutQty) || 0);
        const salvage = Math.min(fallout, Math.max(0, Number(defect.salvageQty) || 0));
        const key = defect.mode || 'Unclassified';
        byMode.set(key, (byMode.get(key) || 0) + (kpiKey === 'fpy' ? fallout : fallout - salvage));
      });
    });
    const pareto = [...byMode.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value]) => ({ key: label, label, value }));

    // UPH / cycle time / line balance only make sense for efficiency.
    let effAnalysis = null;
    if (kpiKey === 'eff') {
      const lines = [...groupBy(kpiVariantKey, scope).entries()]
        .map(([key, acc]) => {
          const m = computeProductionMetrics({
            input: acc.input,
            fallout: acc.fallout,
            salvage: acc.salvage,
            plannedTimeHr: acc.plannedHr,
            downtimeHr: acc.downtimeMin / 60
          });
          const netGood = Math.max(0, acc.input - m.netReject);
          const ctSec = netGood > 0 ? (acc.plannedHr * 3600) / netGood : 0;
          const ctRunSec = netGood > 0 ? (m.runTimeHr * 3600) / netGood : 0;
          return {
            key,
            label: key,
            runs: acc.runs,
            input: acc.input,
            netGood,
            plannedHr: acc.plannedHr,
            runHr: m.runTimeHr,
            uph: acc.plannedHr > 0 ? netGood / acc.plannedHr : 0,
            eff: m.efficiency,
            ctSec,
            ctRunSec,
            ctLossSec: Math.max(0, ctSec - ctRunSec)
          };
        })
        .filter((line) => line.ctSec > 0)
        .sort((a, b) => b.ctSec - a.ctSec);

      if (lines.length > 0) {
        const netGood = lines.reduce((sum, l) => sum + l.netGood, 0);
        const input = lines.reduce((sum, l) => sum + l.input, 0);
        const plannedHr = lines.reduce((sum, l) => sum + l.plannedHr, 0);
        const runHr = lines.reduce((sum, l) => sum + l.runHr, 0);
        const maxCt = lines[0].ctSec;
        const minCt = lines[lines.length - 1].ctSec;
        const ctSum = lines.reduce((sum, l) => sum + l.ctSec, 0);
        const ctSec = netGood > 0 ? (plannedHr * 3600) / netGood : 0;
        const ctRunSec = netGood > 0 ? (runHr * 3600) / netGood : 0;
        effAnalysis = {
          lines: lines.map((l) => ({ ...l, vsFastestPct: minCt > 0 ? (l.ctSec / minCt - 1) * 100 : 0 })),
          input,
          netGood,
          plannedHr,
          runHr,
          uph: plannedHr > 0 ? netGood / plannedHr : 0,
          runUph: runHr > 0 ? input / runHr : 0,
          ctSec,
          ctRunSec,
          ctLossSec: Math.max(0, ctSec - ctRunSec),
          maxCt,
          minCt,
          bottleneckLabel: lines[0].label,
          bottleneckKey: lines[0].key,
          balanceRate: lines.length > 1 && maxCt > 0 ? (ctSum / (lines.length * maxCt)) * 100 : 100,
          // Levelling the same work would raise the pace from the bottleneck CT to the
          // mean CT, i.e. capacity × (n · max CT / Σ CT).
          balanceGainPct: lines.length > 1 && ctSum > 0 ? ((lines.length * maxCt) / ctSum - 1) * 100 : 0
        };
      }
    }

    const headlineSource = variantKey ? (records || []).filter((rec) => kpiVariantKey(rec) === variantKey) : records || [];
    const allRuns = headlineSource.reduce((acc, rec) => kpiAccumulate(acc, rec), kpiEmptyAcc());
    const value = kpiMetricValue(allRuns, kpiKey);
    return {
      headline: { value, text: `${value.toFixed(meta.digits)}${meta.unit}` },
      scopeLabel: `Active scope · ${scope.length} run${scope.length === 1 ? '' : 's'} · ${rangeLabel}`,
      trend,
      variant,
      pareto,
      effAnalysis
    };
  },

  claims({ claims, cutoffIso, rangeDays, variantKey }) {
    // Same fiscal window as the scorecard tile: a claim the tile does not count is
    // not counted here either, so the panel can never contradict its tile.
    const fyClaims = claims.filter((f) => isInKpiFiscalYear(f.feedbackDate));
    const scopeClaims = variantKey ? fyClaims.filter((f) => f.model === variantKey) : fyClaims;
    const inScope = scopeClaims.filter((f) => kpiInRange(f.feedbackDate, cutoffIso));
    const monthly = !rangeDays || rangeDays > 30;
    const byBucket = new Map();
    inScope.forEach((f) => {
      const bucket = monthly ? String(f.feedbackDate).slice(0, 7) : f.feedbackDate;
      byBucket.set(bucket, (byBucket.get(bucket) || 0) + 1);
    });
    const trend = [...byBucket.entries()]
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([bucket, count]) => ({
        label: monthly ? bucket : formatShortDate(bucket),
        value: count,
        meta: `${count} claim${count === 1 ? '' : 's'}`,
        thin: count <= 1
      }));

    const byModel = new Map();
    fyClaims.forEach((f) => byModel.set(f.model, (byModel.get(f.model) || 0) + 1));
    const maxModel = Math.max(1, ...byModel.values());
    const variant = [...byModel.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([model, count]) => ({
        key: model,
        label: model,
        value: count,
        pct: (count / maxModel) * 100,
        valueText: `${count} claim${count === 1 ? '' : 's'}`,
        meta: `${((count / Math.max(1, fyClaims.length)) * 100).toFixed(0)}% of claims`,
        barClass: 'bg-amber-500'
      }));

    const byIssue = new Map();
    scopeClaims.forEach((f) => {
      const key = f.issueItem || f.issueCategory || 'Unclassified';
      byIssue.set(key, (byIssue.get(key) || 0) + Math.max(1, Number(f.ngQty) || 1));
    });
    const pareto = [...byIssue.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value]) => ({ key: label, label, value }));

    const count = scopeClaims.length;
    return {
      headline: { value: count, text: String(count) },
      scopeLabel: kpiFiscalScopeLabel('customer claims'),
      trend,
      variant,
      pareto
    };
  },

  savings({ savingItems, variantKey }) {
    const familyOf = (item) => item.familyGroup || '—';
    // Initiatives are tagged with a fiscal year rather than dated, so the tile's
    // fiscal year is the tag test here too (untagged keeps the current KPI year).
    const fyItems = savingItems.filter(({ item }) => isKpiFiscalYearTag(item.fyTarget));
    const scopeItems = variantKey ? fyItems.filter((s) => familyOf(s.item) === variantKey) : fyItems;
    const total = scopeItems.reduce((sum, s) => sum + s.metrics.annualSavingThb, 0);
    const byFamily = new Map();
    const byCategory = new Map();
    scopeItems.forEach(({ item, metrics }) => {
      const category = item.category || 'Unclassified';
      byCategory.set(category, (byCategory.get(category) || 0) + metrics.annualSavingThb);
    });
    fyItems.forEach(({ item, metrics }) => {
      const family = familyOf(item);
      byFamily.set(family, (byFamily.get(family) || 0) + metrics.annualSavingThb);
    });
    const maxFamily = Math.max(1, ...byFamily.values());

    const variant = [...byFamily.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([family, amount]) => ({
        key: family,
        label: family,
        value: amount,
        pct: (amount / maxFamily) * 100,
        valueText: formatThbCompact(amount),
        meta: `${((amount / KPI_TARGETS.annualSavingThb) * 100).toFixed(0)}% of target`,
        barClass: 'bg-emerald-500'
      }));

    const pareto = [...byCategory.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value]) => ({ key: label, label, value }));

    return {
      headline: { value: total, text: formatThbCompact(total) },
      scopeLabel: kpiFiscalScopeLabel(
        `${fyItems.length} initiatives tagged FY${currentFiscalYear()} · annual run-rate`
      ),
      trend: [],
      variant,
      pareto
    };
  },

  mih({ scopedLines, gateRecords, cutoffIso, variantKey }) {
    const scopeLines = variantKey ? scopedLines.filter((l) => l.project.id === variantKey) : scopedLines;
    const stampDate = (entry) => {
      const stamp = String(entry.time || '');
      if (/^Today/i.test(stamp)) return todayIso();
      const m = stamp.match(/^(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : null;
    };
    const approvals = scopeLines
      .filter((l) => l.approved)
      .map((l) => (gateRecords[l.project.id]?.[l.line.key]?.mih?.auditLog || []).map(stampDate).filter(Boolean).sort()[0] || null)
      .filter((iso) => kpiInRange(iso, cutoffIso))
      .sort();

    const byDate = new Map();
    approvals.forEach((iso) => byDate.set(iso, (byDate.get(iso) || 0) + 1));
    let running = 0;
    const trend = [...byDate.entries()]
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([iso, count]) => {
        running += count;
        return {
          label: formatShortDate(iso),
          value: running,
          meta: `+${count} line${count === 1 ? '' : 's'}`,
          thin: count <= 1
        };
      });

    const byProgram = new Map();
    scopedLines.forEach(({ project, approved }) => {
      const entry = byProgram.get(project.id) || { label: `${project.model} ${project.phase}`, approved: 0, total: 0 };
      entry.total += 1;
      if (approved) entry.approved += 1;
      byProgram.set(project.id, entry);
    });
    const variant = [...byProgram.entries()].map(([id, entry]) => {
      const pct = entry.total > 0 ? (entry.approved / entry.total) * 100 : 0;
      return {
        key: id,
        label: entry.label,
        value: pct,
        pct,
        valueText: `${entry.approved}/${entry.total}`,
        meta: `${entry.approved}/${entry.total} · ${pct >= 100 ? 'achieved' : 'open'}`,
        barClass: pct >= 100 ? 'bg-emerald-500' : 'bg-amber-500'
      };
    });

    const blocking = new Map();
    scopeLines.forEach(({ project, line, approved }) => {
      if (approved) return;
      const gates = gateRecords[project.id]?.[line.key] || {};
      const firstOpen = NPI_GATES.find((g) => (gates[g.id]?.status || 'Pending') !== 'Approved');
      const key = firstOpen ? `${firstOpen.code} ${firstOpen.short}` : 'Not started';
      blocking.set(key, (blocking.get(key) || 0) + 1);
    });
    const pareto = [...blocking.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([label, value]) => ({ key: label, label, value }));

    // Same honest measure as the dashboard tile: on-time achievement against lines
    // already due, with all-line coverage kept as the separate forecast figure.
    const mihToday = todayIso();
    const summary = summarizeMihAchievement(
      scopeLines.map(({ project, line, approved: isApproved }) => ({
        fatpMih: line.fatpMih || project.mihDate || '',
        approved: isApproved,
        approvedAt: mihApprovalIso(gateRecords, project.id, line.key, mihToday)
      })),
      { today: mihToday }
    );
    const forecastText = `forecast ${summary.forecastAchieved}/${summary.tracked} lines`;
    return {
      headline: {
        value: summary.pct,
        text: summary.due > 0 ? `${summary.pct.toFixed(0)}%` : '—'
      },
      scopeLabel:
        summary.due > 0
          ? `FY${summary.fiscalYear} · ${summary.onTime}/${summary.due} due lines on time · ${forecastText}`
          : `FY${summary.fiscalYear} · no lines due yet${
              summary.nextDue ? ` · next ${summary.nextDue}` : ''
            } · ${forecastText}`,
      trend,
      variant,
      pareto
    };
  }
};

// --- Target label placement, shared with the report deck chart --------------------
// KpiTrendChart and reportBarChartSvg (Part6) hang the same two-line target label:
// "target" over the value, 9px lines TARGET_LABEL_GAP apart, anchored TARGET_LABEL_INSET
// inside the right edge, with TARGET_LABEL_AIR of air before the plot edge. The
// gutter is derived, not estimated: a target-line chart only ever prints the KPIs
// whose target is drawn, and they all format to five characters, so the widest line
// is "98.0%" — 25.95 units here at 390px, 26.5 in the deck's 400-unit chart.
const TARGET_LABEL_INSET = 4;
const TARGET_LABEL_GAP = 10;
const TARGET_LABEL_AIR = 13;
const TARGET_LABEL_WIDEST = { trend: 25.95, deck: 26.5 };
const targetLabelGutter = (widestLineWidth) =>
  Math.ceil(widestLineWidth + TARGET_LABEL_INSET + TARGET_LABEL_AIR);

function KpiTrendChart({ points, target, unit, digits, colorClass, fillClass, thinNote }) {
  const [activeIdx, setActiveIdx] = useState(null);
  const wrapRef = useRef(null);
  const [chartW, setChartW] = useState(640);

  // The viewBox follows the rendered width: a fixed 640-wide box inside a narrow
  // modal used to shrink every label to ~4px and letterbox the plot.
  useEffect(() => {
    const el = wrapRef.current;
    if (!el || typeof ResizeObserver === 'undefined') return undefined;
    const measure = () => {
      const width = Math.round(el.getBoundingClientRect().width);
      // The floor follows the narrowest panel the chart can sit in: the modal's
      // 320px viewport leaves ~250px of content, and a 280 floor overflowed it.
      if (width > 0) setChartW(Math.max(240, Math.min(960, width)));
    };
    measure();
    const observer = new ResizeObserver(measure);
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  if (!points || points.length === 0) return null;
  const hasThin = points.some((p) => p.thin);
  const W = chartW;
  const H = 190;
  const padL = 38;
  // The target label takes a right gutter so it never prints over the newest point
  // or the dashed line; targetLabelGutter (above) resolves it to the 43 units this
  // chart measured at 390px.
  const hasTarget = target !== null && target !== undefined;
  const targetValueText = hasTarget ? `${target.toFixed(digits)}${unit}` : '';
  const padR = hasTarget ? targetLabelGutter(TARGET_LABEL_WIDEST.trend) : 16;
  const padT = 14;
  const padB = 26;

  const values = points.map((p) => p.value);
  const candidates = hasTarget ? values.concat(target) : values;
  let minV = Math.min(...candidates);
  let maxV = Math.max(...candidates);
  if (maxV - minV < 1) {
    minV -= 1;
    maxV += 1;
  }
  const span = maxV - minV;
  const xOf = (i) =>
    points.length === 1
      ? padL + (W - padL - padR) / 2
      : padL + (i / (points.length - 1)) * (W - padL - padR);
  const yOf = (v) => padT + (1 - (v - minV) / span) * (H - padT - padB);

  const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xOf(i).toFixed(1)},${yOf(p.value).toFixed(1)}`).join(' ');
  const area = `${line} L${xOf(points.length - 1).toFixed(1)},${H - padB} L${xOf(0).toFixed(1)},${H - padB} Z`;
  const yTicks = [minV, minV + span / 2, maxV];
  const xTickIdx = points.length <= 4 ? points.map((_, i) => i) : [0, Math.floor((points.length - 1) / 2), points.length - 1];
  // Centre the two 9px lines on the target line, then keep the block on the canvas
  // when the target sits on an edge: the top bound clears the first line's
  // ascender, the bottom bound leaves the second line's descenders 3px above the
  // plot floor. Same bounds as the deck chart.
  const targetLabelTop = hasTarget
    ? Math.min(Math.max(yOf(target) - 5, 10), H - padB - (TARGET_LABEL_GAP + 3))
    : 0;

  return (
    <div ref={wrapRef}>
    <svg
      viewBox={`0 0 ${W} ${H}`}
      className="w-full"
      style={{ display: 'block', height: 'auto' }}
      role="group"
      aria-label={`KPI trend chart, ${points.length} point${points.length === 1 ? '' : 's'} from ${points[0].label} to ${points[points.length - 1].label}. Use Tab to step through each point.`}
    >
      {yTicks.map((v) => (
        <g key={`y${v}`}>
          <line x1={padL} x2={W - padR} y1={yOf(v)} y2={yOf(v)} className="stroke-slate-200 dark:stroke-slate-700" strokeWidth="1" />
          <text x={padL - 6} y={yOf(v) + 3} textAnchor="end" aria-hidden="true" className="fill-slate-400 dark:fill-slate-500" style={{ fontSize: '9px' }}>
            {v.toFixed(digits)}{unit}
          </text>
        </g>
      ))}

      <path d={area} className={fillClass || 'fill-blue-500/10'} />
      <path d={line} fill="none" className={colorClass || 'stroke-blue-600 dark:stroke-blue-400'} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />

      {hasTarget && (
        <g>
          <line
            x1={padL}
            x2={W - padR}
            y1={yOf(target)}
            y2={yOf(target)}
            className="stroke-rose-400 dark:stroke-rose-500"
            strokeWidth="1"
            strokeDasharray="5 4"
          />
          <text x={W - TARGET_LABEL_INSET} y={targetLabelTop} textAnchor="end" aria-hidden="true" className="fill-rose-500 dark:fill-rose-400" style={{ fontSize: '9px' }}>
            target
          </text>
          <text x={W - TARGET_LABEL_INSET} y={targetLabelTop + TARGET_LABEL_GAP} textAnchor="end" aria-hidden="true" className="fill-rose-500 dark:fill-rose-400" style={{ fontSize: '9px', fontWeight: 700 }}>
            {targetValueText}
          </text>
        </g>
      )}

      {points.map((p, i) => {
        const isActive = activeIdx === i;
        const label = `${p.label}: ${p.value.toFixed(digits)}${unit}${p.meta ? ` · ${p.meta}` : ''}${p.thin ? ' (thin sample)' : ''}`;
        return (
          <g
            key={`p${i}`}
            tabIndex={0}
            role="img"
            aria-label={label}
            onFocus={() => setActiveIdx(i)}
            onBlur={() => setActiveIdx(null)}
            onMouseEnter={() => setActiveIdx(i)}
            onMouseLeave={() => setActiveIdx(null)}
            className="outline-none cursor-pointer"
          >
            {/* Generous invisible hit area so the point is easy to focus and hover. */}
            <circle cx={xOf(i)} cy={yOf(p.value)} r="11" className="fill-transparent" />
            {isActive && (
              <circle cx={xOf(i)} cy={yOf(p.value)} r="8" className="fill-none stroke-blue-500 dark:stroke-blue-300" strokeWidth="1.5" />
            )}
            {p.thin ? (
              <>
                <circle
                  cx={xOf(i)}
                  cy={yOf(p.value)}
                  r="4"
                  className="fill-white dark:fill-slate-900 stroke-amber-500 dark:stroke-amber-400"
                  strokeWidth="1.5"
                  strokeDasharray="2 2"
                />
                <circle cx={xOf(i)} cy={yOf(p.value)} r="1.4" className="fill-amber-500 dark:fill-amber-400" />
              </>
            ) : (
              <circle cx={xOf(i)} cy={yOf(p.value)} r="3" className="fill-white dark:fill-slate-900 stroke-blue-600 dark:stroke-blue-400" strokeWidth="2" />
            )}
            <title>{label}</title>
          </g>
        );
      })}

      {xTickIdx.map((i) => (
        <text key={`x${i}`} x={xOf(i)} y={H - 8} textAnchor={i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle'} aria-hidden="true" className="fill-slate-400 dark:fill-slate-500" style={{ fontSize: '9px' }}>
          {points[i].label}
        </text>
      ))}
    </svg>
    {hasThin && thinNote && (
      <p className="text-[10px] text-amber-700 dark:text-amber-300 mt-1 flex items-start gap-1.5">
        <span aria-hidden="true" className="inline-block w-2 h-2 mt-1 rounded-full border border-dashed border-amber-500 shrink-0" />
        <span>{thinNote}</span>
      </p>
    )}
    </div>
  );
}

function KpiParetoRows({ rows, unit, emptyText, groupNoun, activeKey, onSelect }) {
  if (!rows || rows.length === 0) {
    return <div className="p-4 text-xs text-slate-400 dark:text-slate-400">{emptyText || 'No loss records in this range.'}</div>;
  }
  const total = rows.reduce((sum, r) => sum + r.value, 0);
  const interactive = typeof onSelect === 'function';

  // Cap the table to the vital few: contributors up to ~80% cumulative, plus two
  // rows for context — the long tail is folded into a single "Others" row.
  const shown = [];
  let running = 0;
  let cut = rows.length;
  for (let i = 0; i < rows.length; i += 1) {
    shown.push(rows[i]);
    running += rows[i].value;
    if (total > 0 && running / total >= 0.8) {
      const contextRows = rows.slice(i + 1, i + 3);
      shown.push(...contextRows);
      cut = i + 1 + contextRows.length;
      break;
    }
  }

  const tail = rows.slice(cut);
  const displayRows =
    tail.length > 0
      ? shown.concat([
          {
            key: '__others__',
            label: `Others (${tail.length} ${groupNoun || 'items'})`,
            value: tail.reduce((sum, r) => sum + r.value, 0),
            isOthers: true,
            // The drill-down needs the real modes behind the folded row; without
            // them it could only show the aggregate, not the records.
            keys: tail.map((r) => r.key)
          }
        ])
      : shown;

  // Bars read as a decline and the longest bar fills the track. Include the
  // folded Others aggregate in the scale: when the tail is larger than the top
  // mode, capping Others at the top mode's width makes the two look tied. The
  // percentage columns still use the whole-range total.
  const barMax = displayRows.reduce((max, row) => Math.max(max, row.value), 0);
  let cumulative = 0;

  return (
    <div className="space-y-1.5">
      {displayRows.map((row) => {
        const share = total > 0 ? (row.value / total) * 100 : 0;
        const barShare = barMax > 0 ? (row.value / barMax) * 100 : 0;
        const before = cumulative;
        cumulative += share;
        const vital = !row.isOthers && before < 80;
        const active = activeKey === row.key;
        const Row = interactive ? 'button' : 'div';
        return (
          <Row
            key={row.key}
            type={interactive ? 'button' : undefined}
            onClick={interactive ? () => onSelect(row) : undefined}
            aria-pressed={interactive ? active : undefined}
            title={interactive ? `Show the production records behind ${row.label}` : undefined}
            className={`w-full text-left flex flex-col gap-1 sm:flex-row sm:items-center sm:gap-2 text-[11px] break-inside-avoid rounded-md ${
              active
                ? 'bg-blue-50 dark:bg-blue-950/60 ring-1 ring-blue-300 dark:ring-blue-800 px-1.5 py-1 -mx-1.5'
                : interactive
                ? 'px-1.5 py-1 -mx-1.5 hover:bg-slate-50 dark:hover:bg-slate-800/60'
                : ''
            }`}
          >
            {/* The label gets the full width on its own line below sm: the modal is
                310px wide at a 375px viewport, and side-by-side every failure mode
                was cut at 105px while the bar kept a 48px floor. */}
            <span
              className={`min-w-0 sm:w-44 truncate ${row.isOthers ? 'italic text-slate-500 dark:text-slate-400' : 'text-slate-600 dark:text-slate-400'}`}
              title={row.label}
            >
              {row.label}
            </span>
            <span className="flex w-full min-w-0 items-center gap-2 sm:flex-1">
              <span
                className="block flex-1 min-w-[3rem] h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"
                title={row.isOthers ? 'Others is a group of smaller contributors; its bar uses the same scale as the other rows' : undefined}
              >
                <span
                  className={`block h-full ${row.isOthers ? 'bg-slate-400 dark:bg-slate-600' : vital ? 'bg-rose-500' : 'bg-rose-300 dark:bg-rose-800'}`}
                  style={{ width: `${Math.max(1, Math.min(100, barShare))}%` }}
                />
              </span>
              <span className={`w-14 sm:w-20 shrink-0 text-right font-semibold tabular-nums ${row.isOthers ? 'text-slate-500 dark:text-slate-400' : 'text-slate-700 dark:text-slate-300'}`}>
                {Math.round(row.value).toLocaleString()} {unit}
              </span>
              <span className="w-9 sm:w-12 shrink-0 text-right tabular-nums text-slate-500 dark:text-slate-400">{share.toFixed(0)}%</span>
              {/* Below sm the cumulative column is dropped so the bar keeps its
                  width; the footer stops promising it there. */}
              <span
                className={`hidden sm:inline-block w-16 shrink-0 text-right font-semibold tabular-nums ${vital ? 'text-rose-600 dark:text-rose-400' : 'text-slate-400 dark:text-slate-400'}`}
                title="cumulative share"
              >
                {cumulative.toFixed(0)}%
              </span>
            </span>
          </Row>
        );
      })}
      <div className="text-[10px] text-slate-400 dark:text-slate-400 pt-1">
        {tail.length > 0
          ? `Showing the top ${shown.length} of ${rows.length} contributors — bars are scaled to the largest row (including Others); solid bars cover the vital few (first 80% of loss)`
          : 'Bars are scaled to the largest row; solid bars are the vital few — the modes/categories making up the first 80% of total loss'}
        <span className="hidden sm:inline">; percentages are share of total and the last column is cumulative</span>
        {tail.length > 0 ? `; the remaining ${tail.length} are grouped as Others.` : '.'}
      </div>
    </div>
  );
}

/**
 * UPH, cycle time and line balance for an efficiency deep dive. The Overview
 * card and the modal render this one block so their figures and labels cannot
 * drift apart.
 */
function KpiEfficiencyDiagnostics({ analysis, headingClass, headingTag: Heading = 'h3' }) {
  if (!analysis) return null;
  const singleLine = analysis.lines.length === 1;
  return (
    <section>
      <Heading className={`${headingClass} mb-2`}>UPH, Cycle Time &amp; Line Balance</Heading>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
        {[
          ['Actual UPH', analysis.uph.toFixed(0), 'net good ÷ planned hr'],
          ['Run-rate UPH', analysis.runUph.toFixed(0), 'input ÷ run hr'],
          ['Cycle time', `${analysis.ctSec.toFixed(1)} s`, `run rate ${analysis.ctRunSec.toFixed(1)} s`],
          ['Downtime CT cost', `${analysis.ctLossSec.toFixed(1)} s`, 'lost per good unit'],
          ['Line balance', `${analysis.balanceRate.toFixed(0)}%`, singleLine ? 'single line in scope' : `bottleneck ${analysis.bottleneckLabel}`]
        ].map(([label, value, sub]) => (
          <div
            key={label}
            className="rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/60 p-2.5"
          >
            <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{label}</div>
            <div className="text-sm font-bold tabular-nums text-slate-900 dark:text-slate-100 mt-0.5">{value}</div>
            <div className="text-[10px] text-slate-400 dark:text-slate-500 truncate" title={sub}>
              {sub}
            </div>
          </div>
        ))}
      </div>

      <div className="mt-3 space-y-1.5">
        {analysis.lines.map((line) => {
          const bottleneck = line.key === analysis.bottleneckKey;
          return (
            <div key={line.key} className="flex items-center gap-2 text-[11px]">
              <span
                className={`w-28 sm:w-40 shrink-0 truncate ${bottleneck ? 'font-semibold text-rose-600 dark:text-rose-400' : 'text-slate-600 dark:text-slate-400'}`}
                title={line.label}
              >
                {line.label}
              </span>
              <div className="flex-1 min-w-[3rem] h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                <div
                  className={`h-full ${bottleneck ? 'bg-rose-500' : 'bg-blue-500 dark:bg-blue-600'}`}
                  style={{ width: `${Math.max(1, (line.ctSec / analysis.maxCt) * 100)}%` }}
                />
              </div>
              <span className="w-14 sm:w-16 shrink-0 text-right font-semibold tabular-nums text-slate-700 dark:text-slate-300">{line.ctSec.toFixed(1)} s</span>
              <span className="hidden sm:inline-block w-16 shrink-0 text-right tabular-nums text-slate-500 dark:text-slate-400">{line.uph.toFixed(0)} UPH</span>
              <span
                className={`hidden sm:inline-block w-14 shrink-0 text-right tabular-nums ${bottleneck ? 'font-semibold text-rose-600 dark:text-rose-400' : 'text-slate-400 dark:text-slate-500'}`}
              >
                {line.vsFastestPct <= 0.05 ? 'best' : `+${line.vsFastestPct.toFixed(0)}%`}
              </span>
            </div>
          );
        })}
      </div>

      <p className="text-[10px] text-slate-400 dark:text-slate-500 mt-2">
        {singleLine
          ? `Cycle time = planned hours × 3,600 ÷ net good units for ${analysis.bottleneckLabel}.`
          : `Cycle time = planned hours × 3,600 ÷ net good units, across ${analysis.lines.length} lines. The bottleneck (${analysis.bottleneckLabel}) sets the pace at ${analysis.maxCt.toFixed(
              1
            )} s/unit against ${analysis.minCt.toFixed(1)} s/unit on the fastest line; perfect levelling of the same work would lift output by about +${analysis.balanceGainPct.toFixed(
              0
            )}% at the same planned hours.`}
      </p>
    </section>
  );
}

/** The production rows behind one Pareto bar or one variant row. */
function KpiDrillRecords({ selection, rows, kpiKey, onClose }) {
  const isVariant = selection.kind === 'variant';
  const totalFallout = rows.reduce((sum, row) => sum + row.fallout, 0);
  const totalSalvage = rows.reduce((sum, row) => sum + row.salvage, 0);
  const totalMatch = rows.reduce((sum, row) => sum + (row.match || 0), 0);
  const showNet = !isVariant && kpiKey === 'fy';
  const showDowntime = !isVariant && kpiKey === 'eff';
  const recordWord = rows.length === 1 ? 'record' : 'records';
  const summary = isVariant
    ? `${rows.length} ${recordWord} · fallout ${totalFallout.toLocaleString()} · salvage ${totalSalvage.toLocaleString()}`
    : showDowntime
    ? `${rows.length} ${recordWord} · ${totalMatch.toLocaleString()} matching downtime minutes`
    : `${rows.length} ${recordWord} · fallout ${totalFallout.toLocaleString()} · salvage ${totalSalvage.toLocaleString()}${
        showNet ? ` · net reject ${totalMatch.toLocaleString()}` : ''
      }`;

  return (
    <div
      className="no-print mt-3 rounded-lg border border-blue-200 dark:border-blue-800 bg-blue-50/50 dark:bg-blue-950/30 overflow-hidden"

        </div>

          type="button"
          onClick={onClose}
          aria-label="Hide production records"

          <table className="w-full min-w-[560px] text-left border-collapse text-[11px]">
            <thead className="sticky top-0 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
              <tr>

              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
              {rows.map((row, index) => (
                <tr key={row.record.id || `${row.record.date}-${index}`} className="hover:bg-white/60 dark:hover:bg-slate-900/40">
                  <td className="py-2 pl-3 pr-2 whitespace-nowrap text-slate-600 dark:text-slate-400">{row.record.date}</td>
                  <td className="py-2 px-2">
                    <div className="font-semibold text-slate-900 dark:text-slate-100">{row.record.model}</div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-500">

                  {showNet && <td className="py-2 px-2 text-right font-semibold text-slate-900 dark:text-slate-100">{row.match.toLocaleString()}</td>}

                <td className="py-2 pl-3 pr-2" colSpan={3}>Total ({rows.length})</td>
                <td className="py-2 px-2 text-right text-rose-700 dark:text-rose-300">{totalFallout.toLocaleString()}</td>
                <td className="py-2 px-2 text-right text-amber-800 dark:text-amber-200">{totalSalvage.toLocaleString()}</td>
                {showNet && <td className="py-2 px-2 text-right">{totalMatch.toLocaleString()}</td>}
                {showDowntime && <td className="py-2 pl-2 pr-3 text-right">{totalMatch.toLocaleString()} min</td>}
              </tr>

          </table>
        </div>
      )}
    </div>
  );
}

/**
 * The three derived inputs every KPI family builder reads, computed once for both
 * the modal and the inline deep-dive section on the Overview.
 */
function kpiDeepDiveSources({ projects, gateRecords, globalSide, customerFeedback, costProjects }) {
  const scopedLines = (projects || []).flatMap((project) =>
    getLineVariantsForProject(project)
      .filter((v) => globalSide === 'ALL' || v.side === globalSide)
      .map((v) => ({
        project,
        line: v,
        approved: gateRecords[project.id]?.[v.key]?.mih?.status === 'Approved'
      }))
  );
  const claims = (customerFeedback || []).filter((f) => f.category === 'Claim');
  const savingItems = (costProjects || []).map((item) => ({ item, metrics: computeCostSavingMetrics(item) }));
  return { scopedLines, claims, savingItems };
}

/**
 * The whole deep-dive view — headline, scope line, trend, variant histogram and
 * Pareto — for one KPI, range and variant scope. The modal and the Overview
 * section render the same model, so the two can never tell different stories.
 */
function buildKpiDeepDiveView({
  meta,
  kpiKey,
  records,
  claims,
  savingItems,
  scopedLines,
  gateRecords,
  rangeDays,
  rangeLabel,
  cutoffIso,
  variantFilter
}) {
  const rangedRecords = (records || [])
    .filter((r) => r.date && kpiInRange(r.date, cutoffIso))
    .sort((a, b) => a.date.localeCompare(b.date));
  const build = (variantKey) =>
    KPI_FAMILY_BUILDERS[meta.family]({
      records: records || [],
      rangedRecords,
      claims,
      savingItems,
      scopedLines,
      gateRecords,
      kpiKey,
      meta,
      cutoffIso,
      rangeDays,
      rangeLabel,
      variantKey
    });
  const all = build(null);
  const variants = all.variant.slice();
  // Keep a chosen variant as the scope even when the current range has no rows for
  // it — switching 90D → 7D should widen the data, not silently drop the filter.
  if (variantFilter !== 'ALL' && !variants.some((v) => v.key === variantFilter)) {
    variants.push({ key: variantFilter, label: variantFilter, value: 0, pct: 0, valueText: '—' });
  }
  return {
    view: variantFilter === 'ALL' ? all : build(variantFilter),
    variants,
    activeVariant: variantFilter
  };
}

function KpiDeepDiveModal({
  kpiKey,
  initialVariant = 'ALL',
  projects,
  records,
  gateRecords,
  globalSide,
  scopeFilters,
  costProjects,
  customerFeedback,
  onClose
}) {
  const [rangeId, setRangeId] = useState('90D');
  const [variantFilter, setVariantFilter] = useState(initialVariant || 'ALL');
  const [drill, setDrill] = useState(null);
  const meta = KPI_DEEP_DIVE_META[kpiKey] || KPI_DEEP_DIVE_META.fpy;
  // The process filter is the one dimension claims and cost-saving records cannot
  // honour, so the modal says so only when it is actually narrowing something.
  const processFilter = (scopeFilters || []).find((filter) => filter.key === 'process');
  const processNarrowsProduction =
    meta.family !== 'quality' && Boolean(processFilter && processFilter.value && processFilter.value !== 'ALL');
  const range = KPI_RANGE_OPTIONS.find((r) => r.id === rangeId) || KPI_RANGE_OPTIONS[1];
  const cutoffIso = range.days ? addDaysIso(todayIso(), -(range.days - 1)) : null;

  useEffect(() => {
    const onKey = (event) => {
      if (event.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const { scopedLines, claims, savingItems } = useMemo(
    () => kpiDeepDiveSources({ projects, gateRecords, globalSide, customerFeedback, costProjects }),
    [projects, gateRecords, globalSide, customerFeedback, costProjects]
  );

  // Variant scope: build once unfiltered (that also yields the option list), then
  // rebuild for the chosen variant so the headline, trend and Pareto all narrow.
  const { view, variants, activeVariant } = useMemo(
    () =>
      buildKpiDeepDiveView({
        meta,
        kpiKey,
        records,
        claims,
        savingItems,
        scopedLines,
        gateRecords,
        rangeDays: range.days,
        rangeLabel: range.label,
        cutoffIso,
        variantFilter
      }),
    [meta, kpiKey, records, claims, savingItems, scopedLines, gateRecords, cutoffIso, range.days, range.label, variantFilter]
  );

  const quality = meta.family === 'quality';
  const drillRows = useMemo(
    () => (drill ? kpiDrillRows({ records, cutoffIso, kpiKey, selection: drill }) : []),
    [records, cutoffIso, kpiKey, drill]
  );

  const handleVariantSelect = (key) => {
    const next = activeVariant === key ? 'ALL' : key;
    setVariantFilter(next);
    if (!quality || next === 'ALL') {
      setDrill(null);
      return;
    }
    setDrill({ kind: 'variant', key, label: variants.find((v) => v.key === key)?.label || key });
  };

  const handleParetoSelect = (row) => {
    if (!quality || !row) return;
    const key = row.key;
    setDrill((prev) =>
      prev && prev.kind === 'pareto' && prev.key === key
        ? null
        : {
            kind: 'pareto',
            key,
            keys: row.keys && row.keys.length ? row.keys : [row.key],
            label: row.label,
            variantKey: activeVariant === 'ALL' ? null : activeVariant
          }
    );
  };

  const variantLabel = variants.find((v) => v.key === activeVariant)?.label;
  const scopeLabel = activeVariant === 'ALL' ? view.scopeLabel : `${view.scopeLabel} · ${variantLabel}`;

  const scopePhrase = activeVariant === 'ALL' ? '' : ' for this variant';
  const emptyRange = range.days
    ? `No dated points${scopePhrase} in the last ${range.days} days — widen the range or wait for the next run.`
    : `No dated points${scopePhrase} in this period — widen the range or wait for the next run.`;

  const exportName = `${meta.title
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')}-deep-dive-${range.id}-${todayIso()}`;

  const handleExportCsv = () => {
    const blob = new Blob([kpiDeepDiveCsv(meta, view)], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${exportName}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  // Print in the light palette even when the app is in dark mode, then restore it.
  const handlePrint = () => {
    const root = document.documentElement;
    const wasDark = root.classList.contains('dark');
    const restore = () => {
      if (wasDark) root.classList.add('dark');
      window.removeEventListener('afterprint', restore);
    };
    if (wasDark) root.classList.remove('dark');
    window.addEventListener('afterprint', restore);
    setTimeout(restore, 2000);
    window.print();
  };

  return (
    <div
      className="kpi-print-overlay fixed inset-0 z-50 flex items-start justify-center p-2 sm:p-4 bg-slate-950/60 backdrop-blur-[1px] overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-label={`${meta.title} deep dive`}
      onClick={(event) => {
        if (event.target === event.currentTarget) onClose();
      }}
    >
      <div className="kpi-print-area w-full max-w-4xl my-4 sm:my-8 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden">
        <div className="px-4 py-3 sm:px-5 sm:py-4 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-start justify-between gap-3">
          <div>
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">{meta.title} · Deep Dive</h3>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">{scopeLabel}</p>
            <p className="hidden print:block text-[10px] text-slate-500 mt-0.5">
              FFM NPI Ops · {range.label} window · exported {todayIso()}
            </p>
          </div>
          <div className="flex items-center gap-2">
            <div className="text-right mr-1">
              <div className="text-xl font-bold tabular-nums text-slate-900 dark:text-slate-100">{view.headline.text}</div>
              <div className="text-[10px] text-slate-500 dark:text-slate-400">Target {meta.targetText}</div>
            </div>
            <button
              type="button"
              onClick={handleExportCsv}
              title="Download these tables as CSV"
              className="no-print inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px] font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            >
              <Download className="w-3.5 h-3.5" />
              CSV
            </button>
            <button
              type="button"
              onClick={handlePrint}
              title="Print-friendly view"
              className="no-print inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px] font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            >
              <Printer className="w-3.5 h-3.5" />
              Print
            </button>
            <button
              type="button"
              onClick={onClose}
              aria-label="Close deep dive"
              className="p-1.5 rounded-lg text-slate-400 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            >
              <X className="w-4 h-4" />
            </button>
          </div>
        </div>

        <div className="p-4 space-y-4 sm:p-5 sm:space-y-5">
          {Array.isArray(scopeFilters) && scopeFilters.length > 0 && (
            <div className="no-print flex flex-wrap items-center gap-2">
              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Scope
              </span>
              {scopeFilters.map((filter) => (
                <ScopeFilterSelect
                  key={filter.key}
                  label={filter.label}
                  ariaLabel={`${filter.ariaLabel} (deep dive)`}
                  value={filter.value}
                  options={filter.options}
                  onChange={filter.onChange}
                />
              ))}
              {processNarrowsProduction && (
                <span className="text-[10px] text-slate-400 dark:text-slate-500">
                  Claims and cost-saving records carry no process field, so Process only narrows production-based KPIs.
                </span>
              )}
            </div>
          )}

          {(variants.length > 1 || activeVariant !== 'ALL') && (
            <div className="no-print flex flex-wrap items-center gap-2">
              <label htmlFor="kpi-variant-scope" className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Variant scope
              </label>
              <select
                id="kpi-variant-scope"
                value={activeVariant}
                onChange={(e) => {
                  setVariantFilter(e.target.value);
                  setDrill(null);
                }}
                className="px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 max-w-[54%]"
              >
                <option value="ALL">All variants ({variants.length})</option>
                {variants.map((v) => (
                  <option key={v.key} value={v.key}>
                    {v.label}
                  </option>
                ))}
              </select>
              {activeVariant !== 'ALL' && (
                <button
                  type="button"
                  onClick={() => {
                    setVariantFilter('ALL');
                    setDrill(null);
                  }}
                  className="text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline"
                >
                  Clear
                </button>
              )}
            </div>
          )}

          <section>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
              <h4 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                {meta.trendHeading || 'Trend'}
              </h4>
              {meta.hasTrend !== false && (
                <div className="no-print inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800">
                  {KPI_RANGE_OPTIONS.map((option) => (
                    <button
                      key={option.id}
                      type="button"
                      onClick={() => {
                        setRangeId(option.id);
                        setDrill(null);
                      }}
                      className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                        rangeId === option.id
                          ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs'
                          : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                      }`}
                    >
                      {option.label}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {meta.hasTrend === false ? (
              <div className="p-4 rounded-lg border border-dashed border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
                {meta.trendNotice}
              </div>
            ) : view.trend.length >= 2 ? (
              <KpiTrendChart
                points={view.trend}
                target={meta.targetLine ? meta.target : null}
                unit={meta.trendUnit || meta.unit}
                digits={meta.trendDigits !== undefined ? meta.trendDigits : meta.digits}
                colorClass={meta.lineClass}
                fillClass={meta.fillClass}
                thinNote={meta.thinNote}
              />
            ) : (
              <div className="p-4 rounded-lg border border-dashed border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
                {view.trend.length === 1
                  ? `Only one dated point${scopePhrase} in this range — widen the range to see a trend.`
                  : meta.emptyTrend || emptyRange}
              </div>
            )}
          </section>

          <section>
            <h4 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-2">
              {meta.variantHeading}
              <span className="no-print ml-2 text-[10px] font-normal normal-case tracking-normal text-slate-400 dark:text-slate-500">
                {quality ? 'click a row to scope the deep dive and list its records' : 'click a row to scope the deep dive'}
              </span>
            </h4>
            <KpiBarRows
              rows={view.variant}
              emptyText="No records in this range."
              activeKey={activeVariant}
              onSelect={handleVariantSelect}
            />
            {drill?.kind === 'variant' && (
              <KpiDrillRecords selection={drill} rows={drillRows} kpiKey={kpiKey} onClose={() => setDrill(null)} />
            )}
          </section>

          <section>
            <h4 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-2">
              {meta.paretoHeading}
              {quality && (
                <span className="no-print ml-2 text-[10px] font-normal normal-case tracking-normal text-slate-400 dark:text-slate-500">
                  click a row for the records behind it
                </span>
              )}
            </h4>
            <KpiParetoRows
              rows={view.pareto}
              unit={meta.paretoUnit}
              groupNoun={meta.groupNoun}
              activeKey={drill?.kind === 'pareto' ? drill.key : undefined}
              onSelect={quality ? handleParetoSelect : undefined}
            />
            {drill?.kind === 'pareto' && (
              <KpiDrillRecords selection={drill} rows={drillRows} kpiKey={kpiKey} onClose={() => setDrill(null)} />
            )}
          </section>

          <KpiEfficiencyDiagnostics
            analysis={view.effAnalysis}
            headingClass="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400"
            headingTag="h4"
          />
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// INLINE KPI DEEP DIVE (Overview) — trend · by variant · Pareto of loss
// ============================================================================

const KPI_DEEP_DIVE_TABS = [
  { key: 'fpy', label: 'FPY' },
  { key: 'fy', label: 'Final yield' },
  { key: 'eff', label: 'Efficiency' },
  { key: 'claims', label: 'Claims' },
  { key: 'saving', label: 'Cost saving' },
  { key: 'mih', label: 'MIH' }
];

/**
 * The three charts that answer "is this KPI improving, where is it worst, and what
 * is behind the loss" without leaving the Overview. It renders the same model the
 * full deep-dive modal does, so a figure here and there can never disagree.
 */
function KpiDeepDiveSection({
  projects,
  records,
  gateRecords,
  globalSide,
  costProjects,
  customerFeedback,
  onOpenDeepDive,
  focusKpiKey,
  focusToken,
  sectionRef
}) {
  const [kpiKey, setKpiKey] = useState('fpy');
  const [rangeId, setRangeId] = useState('90D');
  const [variantFilter, setVariantFilter] = useState('ALL');
  const [drill, setDrill] = useState(null);

  // The KPI tiles above the card drive this state. The token makes a repeated
  // click on the same tile reset any drill-down and re-select its tab. A variant
  // key belongs to one family (a line, model, family or program), so it cannot
  // carry across tabs; clear it with the KPI.
  useEffect(() => {
    if (!focusKpiKey || !focusToken) return;
    setKpiKey(focusKpiKey);
    setVariantFilter('ALL');
    setDrill(null);
  }, [focusKpiKey, focusToken]);
  const meta = KPI_DEEP_DIVE_META[kpiKey] || KPI_DEEP_DIVE_META.fpy;
  const range = KPI_RANGE_OPTIONS.find((r) => r.id === rangeId) || KPI_RANGE_OPTIONS[1];
  const cutoffIso = range.days ? addDaysIso(todayIso(), -(range.days - 1)) : null;

  const { scopedLines, claims, savingItems } = useMemo(
    () => kpiDeepDiveSources({ projects, gateRecords, globalSide, customerFeedback, costProjects }),
    [projects, gateRecords, globalSide, customerFeedback, costProjects]
  );

  // Build once unfiltered for the option list, then rebuild for the chosen
  // variant so the headline, trend and Pareto all narrow with the record list.
  const { view, variants, activeVariant } = useMemo(
    () =>
      buildKpiDeepDiveView({
        meta,
        kpiKey,
        records,
        claims,
        savingItems,
        scopedLines,
        gateRecords,
        rangeDays: range.days,
        rangeLabel: range.label,
        cutoffIso,
        variantFilter
      }),
    [meta, kpiKey, records, claims, savingItems, scopedLines, gateRecords, cutoffIso, range.days, range.label, variantFilter]
  );

  const quality = meta.family === 'quality';
  const drillRows = useMemo(
    () => (drill ? kpiDrillRows({ records, cutoffIso, kpiKey, selection: drill }) : []),
    [records, cutoffIso, kpiKey, drill]
  );

  // Same interaction as the modal: clicking the active variant clears the
  // scope; selecting a different one narrows the whole view. For quality KPIs
  // the variant also opens the record list behind that line.
  const handleVariantSelect = (key) => {
    const next = activeVariant === key ? 'ALL' : key;
    setVariantFilter(next);
    if (!quality || next === 'ALL') {
      setDrill(null);
      return;
    }
    setDrill({ kind: 'variant', key, label: variants.find((v) => v.key === key)?.label || key });
  };

  const handleParetoSelect = (row) => {
    if (!quality || !row) return;
    const key = row.key;
    setDrill((prev) =>
      prev && prev.kind === 'pareto' && prev.key === key
        ? null
        : {
            kind: 'pareto',
            key,
            keys: row.keys && row.keys.length ? row.keys : [row.key],
            label: row.label,
            variantKey: activeVariant === 'ALL' ? null : activeVariant
          }
    );
  };

  const variantLabel = variants.find((v) => v.key === activeVariant)?.label;
  const scopePhrase = activeVariant === 'ALL' ? '' : ' for this variant';
  const emptyRange = range.days
    ? `No dated points${scopePhrase} in the last ${range.days} days — widen the range or wait for the next run.`
    : `No dated points${scopePhrase} in this period — widen the range or wait for the next run.`;

  const chartHeading = 'text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300';

  return (
    <section
      id="overview-kpi-deep-dive"
      ref={sectionRef}
      className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden"
    >
      <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-start justify-between gap-3">
        <div>
          <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">KPI Deep Dive</h2>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">
            {meta.title} · trend, the worst variants, and the drivers behind the loss in the active scope
          </p>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="text-right">
            <div className="text-xl font-bold tabular-nums text-slate-900 dark:text-slate-100">{view.headline.text}</div>
            <div className="text-[10px] text-slate-500 dark:text-slate-400">
              {activeVariant === 'ALL' ? `Target ${meta.targetText}` : `${variantLabel} · Target ${meta.targetText}`}
            </div>
          </div>
          {typeof onOpenDeepDive === 'function' && (
            <button
              type="button"
              onClick={() => onOpenDeepDive(kpiKey, activeVariant)}
              className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px] font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            >
              Full deep dive
            </button>
          )}
        </div>
      </div>

      <div className="px-5 py-2.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
        <div className="inline-flex flex-wrap rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800 text-[11px]">
          {KPI_DEEP_DIVE_TABS.map((tab) => (
            <button
              key={tab.key}
              type="button"
              onClick={() => {
                setKpiKey(tab.key);
                setVariantFilter('ALL');
                setDrill(null);
              }}
              aria-pressed={kpiKey === tab.key}
              className={`px-2.5 py-1 rounded-md font-semibold transition-colors ${
                kpiKey === tab.key
                  ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs'
                  : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
              }`}
            >
              {tab.label}
            </button>
          ))}
        </div>
        <div className="flex flex-wrap items-center gap-2">
          {(variants.length > 1 || activeVariant !== 'ALL') && (
            <label className="flex items-center gap-1.5">
              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Variant scope
              </span>
              <select
                value={activeVariant}
                onChange={(e) => {
                  setVariantFilter(e.target.value);
                  setDrill(null);
                }}
                aria-label="Scope the inline KPI deep dive to a variant"
                className="px-2.5 py-1.5 text-[11px] font-semibold border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 max-w-[210px]"
              >
                <option value="ALL">All variants ({variants.length})</option>
                {variants.map((v) => (
                  <option key={v.key} value={v.key}>
                    {v.label}
                  </option>
                ))}
              </select>
            </label>
          )}
          {meta.hasTrend !== false && (
            <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800">
              {KPI_RANGE_OPTIONS.map((option) => (
                <button
                  key={option.id}
                  type="button"
                  onClick={() => {
                    setRangeId(option.id);
                    setDrill(null);
                  }}
                  aria-pressed={rangeId === option.id}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    rangeId === option.id
                      ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs'
                      : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                  }`}
                >
                  {option.label}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="p-5 space-y-5">
        <section>
          <h3 className={`${chartHeading} mb-2`}>{meta.trendHeading || 'Trend'}</h3>
          {meta.hasTrend === false ? (
            <div className="p-4 rounded-lg border border-dashed border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
              {meta.trendNotice}
            </div>
          ) : view.trend.length >= 2 ? (
            <KpiTrendChart
              points={view.trend}
              target={meta.targetLine ? meta.target : null}
              unit={meta.trendUnit || meta.unit}
              digits={meta.trendDigits !== undefined ? meta.trendDigits : meta.digits}
              colorClass={meta.lineClass}
              fillClass={meta.fillClass}
              thinNote={meta.thinNote}
            />
          ) : (
            <div className="p-4 rounded-lg border border-dashed border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
              {view.trend.length === 1
                ? 'Only one dated point in this range — widen the range to see a trend.'
                : meta.emptyTrend || emptyRange}
            </div>
          )}
        </section>

        {/* grid-cols-1 keeps the implicit track shrinkable: without it the auto
            track sized to the rows' min-content and pushed 58px past the card. */}
        <div className="grid grid-cols-1 gap-5 xl:grid-cols-2">
          <section>
            <h3 className={`${chartHeading} mb-2`}>
              {meta.variantHeading}
              <span className="ml-2 text-[10px] font-normal normal-case tracking-normal text-slate-400 dark:text-slate-500">
                {quality ? 'click a row to scope the deep dive and list its records' : 'click a row to scope the deep dive'}
              </span>
            </h3>
            <KpiBarRows
              rows={view.variant}
              emptyText="No records in this range."
              activeKey={activeVariant === 'ALL' ? undefined : activeVariant}
              onSelect={handleVariantSelect}
            />
          </section>
          <section>
            <h3 className={`${chartHeading} mb-2`}>
              {meta.paretoHeading}
              {quality && (
                <span className="ml-2 text-[10px] font-normal normal-case tracking-normal text-slate-400 dark:text-slate-500">
                  click a row for the records behind it
                </span>
              )}
            </h3>
            <KpiParetoRows
              rows={view.pareto}
              unit={meta.paretoUnit}
              groupNoun={meta.groupNoun}
              activeKey={drill?.kind === 'pareto' ? drill.key : undefined}
              onSelect={quality ? handleParetoSelect : undefined}
            />
          </section>
        </div>

        <KpiEfficiencyDiagnostics analysis={view.effAnalysis} headingClass={chartHeading} />

        {drill && (
          <KpiDrillRecords selection={drill} rows={drillRows} kpiKey={kpiKey} onClose={() => setDrill(null)} />
        )}
      </div>
    </section>
  );
}

// ============================================================================
// VIEW 10: TEAM MEMBERS, PRODUCT ASSIGNMENT & WORKLOAD (CRUD)
// ============================================================================

function TeamMembersView({
  members,
  projects,
  tasks,
  gateRecords,
  scheduleOverrides,
  onOpenNew,
  onEdit,
  onDelete,
  onOpenTask,
  onAssignTaskOwner,
  onOpenGate
}) {
  const [search, setSearch] = useState('');
  const [roleFilter, setRoleFilter] = useState('ALL');
  const [productFilter, setProductFilter] = useState('ALL');
  // What the workload column is currently showing the records behind.
  const [drilldown, setDrilldown] = useState(null);

  // Roles actually held, in roster order — a filter never offers an empty option.
  const roleOptions = useMemo(
    () => Array.from(new Set(members.map((member) => member.role).filter(Boolean))),
    [members]
  );

  const productOptions = useMemo(() => {
    const options = [];
    members.forEach((member) => {
      options.push(...(member.products || []), ...memberExternalPrograms(member));
    });
    return distinctProductStrings(options).sort((a, b) =>
      a.localeCompare(b, undefined, { numeric: true })
    );
  }, [members]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return members
      .filter((member) => roleFilter === 'ALL' || member.role === roleFilter)
      .filter((member) => {
        if (productFilter === 'ALL') return true;
        const picked = normalizeProductKey(productFilter);
        return [...(member.products || []), ...memberExternalPrograms(member)].some(
          (product) => normalizeProductKey(product) === picked
        );
      })
      .filter((member) => {
        if (!q) return true;
        return [
          member.name,
          member.role,
          member.email,
          (member.products || []).join(', '),
          memberExternalPrograms(member).join(', ')
        ].some((value) => String(value || '').toLowerCase().includes(q));
      })
      // Load walks every gate dossier, so it is only computed for visible members.
      .map((member) => ({
        member,
        // Programs outside this workspace are listed separately: they are never a
        // typo and never a reason to read the member as portfolio-wide.
        external: memberExternalPrograms(member),
        // Keyed by the same normalisation the workload uses, so a padded or
        // re-cased stored string is flagged wherever it is counted.
        unmatchedKeys: new Set(unmatchedProducts(member.products, projects).map(normalizeProductKey)),
        workload: computeTeamWorkload(member, projects, tasks, gateRecords, members, scheduleOverrides)
      }));
  }, [members, projects, tasks, gateRecords, scheduleOverrides, search, roleFilter, productFilter]);

  const nameById = useMemo(() => {
    const map = {};
    members.forEach((member) => {
      map[member.id] = member.name;
    });
    return map;
  }, [members]);

  // Open work nobody on the roster owns. Personal counts cannot show it, so the
  // board lists it here — one row per task, soonest due first.
  const unassignedTasks = useMemo(() => {
    const modelById = {};
    projects.forEach((project) => {
      modelById[project.id] = project.model;
    });
    return unassignedOpenTasks(tasks, members)
      .map((task) => {
        const gate = NPI_GATES.find((entry) => entry.id === task.gateId);
        return { task, projectModel: modelById[task.projectId] || '', gateCode: gate?.code || '' };
      })
      .sort((a, b) => {
        const dueA = a.task.dueDate || '9999-12-31';
        const dueB = b.task.dueDate || '9999-12-31';
        if (dueA !== dueB) return dueA.localeCompare(dueB);
        return String(a.task.id).localeCompare(String(b.task.id));
      });
  }, [tasks, members, projects]);

  const summary = useMemo(() => {
    // A program counts as covered when some member names its model or its family
    // — the same rule the amber chips use, so a typo cannot inflate this card the
    // way it used to inflate workload.
    const coveredPrograms = new Set();
    let totalLoad = 0;
    let unassigned = 0;
    let externalMembers = 0;
    let withoutEmail = 0;
    let unmatchedMembers = 0;
    rows.forEach(({ member, workload, unmatchedKeys, external }) => {
      (member.products || []).forEach((product) => {
        projects.forEach((project) => {
          if (productMatchesProject(product, project)) coveredPrograms.add(project.id);
        });
      });
      totalLoad += workload.load;
      // Portfolio-wide means nothing on file at all. A program this workspace does
      // not run is still an assignment, so it cannot count as unassigned.
      if ((member.products || []).length === 0 && external.length === 0) unassigned += 1;
      if (external.length > 0) externalMembers += 1;
      if (!String(member.email || '').trim()) withoutEmail += 1;
      if (unmatchedKeys.size > 0) unmatchedMembers += 1;
    });
    return {
      programsCovered: coveredPrograms.size,
      programs: projects.length,
      totalLoad,
      unassigned,
      externalMembers,
      withoutEmail,
      unmatchedMembers
    };
  }, [rows, projects]);

  const maxLoad = useMemo(() => Math.max(1, ...rows.map((row) => row.workload.load)), [rows]);

  const selectClass =
    'px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-blue-500';

  return (
    <div className="space-y-5">
      {/* Team KPI strip: directory size, product cover and what is still missing */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Team Members</div>
          <div className="text-2xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">
            {rows.length}
            <span className="text-xs font-normal text-slate-400 dark:text-slate-400"> / {members.length}</span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {summary.unassigned} without a product assignment
            {summary.externalMembers > 0 &&
              ` · ${summary.externalMembers} assigned outside this workspace`}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Programs Covered</div>
          <div className="text-2xl font-bold text-blue-700 dark:text-blue-300 tabular-nums">
            {summary.programsCovered}
            <span className="text-xs font-normal text-slate-400 dark:text-slate-400"> / {summary.programs}</span>
          </div>
          <div
            className={`text-[11px] ${
              summary.unmatchedMembers > 0
                ? 'font-semibold text-amber-700 dark:text-amber-300'
                : 'text-slate-500 dark:text-slate-400'
            }`}
          >
            {summary.unmatchedMembers > 0
              ? `${summary.unmatchedMembers} member${summary.unmatchedMembers === 1 ? '' : 's'} hold${
                  summary.unmatchedMembers === 1 ? 's' : ''
                } a product that matches no program`
              : 'Every assigned product is a live program'}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Open Workload</div>
          <div className="text-2xl font-bold text-amber-700 dark:text-amber-300 tabular-nums">
            {summary.totalLoad}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            open tasks + signatures still owed
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Email on File</div>
          <div
            className={`text-2xl font-bold tabular-nums ${
              summary.withoutEmail > 0 ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-700 dark:text-emerald-300'
            }`}
          >
            {rows.length - summary.withoutEmail}
            <span className="text-xs font-normal text-slate-400 dark:text-slate-400"> / {rows.length}</span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {summary.withoutEmail > 0 ? `${summary.withoutEmail} member(s) still need an address` : 'Everyone reachable'}
          </div>
        </div>
      </div>

      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
              Unassigned work
              <span
