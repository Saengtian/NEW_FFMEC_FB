<script type="text/babel" data-presets="react">
// ============================================================================
// VIEW 7: PROJECTS & COST SAVING MODULE (VA/VE, YIELD, HC & AUTOMATION)
// ============================================================================
// VIEW 7: PROJECTS & COST SAVING MODULE (NMB REV3 20261118: DASHBOARD & PROJECTS)
// ============================================================================

function CostSavingView({
  items,
  allItemsCount,
  onOpenNew,
  onEdit,
  onDelete,
  onUpdateStage,
  onUpdateFeasibility,
  onImportFile
}) {
  const [subTab, setSubTab] = useState('dashboard'); // 'dashboard' | 'projects'
  const [feasFilter, setFeasFilter] = useState('ALL');
  const [familyFilter, setFamilyFilter] = useState('ALL');
  const [search, setSearch] = useState('');

  const filteredItems = useMemo(() => {
    return items.filter((item) => {
      if (feasFilter !== 'ALL' && item.feasibility !== feasFilter) return false;
      if (familyFilter !== 'ALL' && item.familyGroup !== familyFilter) return false;
      if (search.trim()) {
        const q = search.toLowerCase();
        return (
          item.id.toLowerCase().includes(q) ||
          item.title.toLowerCase().includes(q) ||
          item.model.toLowerCase().includes(q) ||
          (item.vendor || '').toLowerCase().includes(q) ||
          (item.owner || '').toLowerCase().includes(q) ||
          (item.notes || '').toLowerCase().includes(q)
        );
      }
      return true;
    });
  }, [items, feasFilter, familyFilter, search]);

  const summary = useMemo(() => {
    let totalHc = 0;
    let committedQuotedThb = 0;
    let allocatedBudgetThb = 0;
    let annualSavingThb = 0;
    let goCount = 0;
    let pendingCount = 0;
    let noGoCount = 0;
    const byFamily = {};

    filteredItems.forEach((item) => {
      const m = computeCostSavingMetrics(item);
      totalHc += m.hc;
      committedQuotedThb += m.quotedCostThb;
      allocatedBudgetThb += m.budgetThb;
      annualSavingThb += m.annualSavingThb;

      if (item.feasibility === 'Go') goCount += 1;
      else if (item.feasibility === 'No-go') noGoCount += 1;
      else pendingCount += 1;

      const fam = item.familyGroup || 'Other';
      if (!byFamily[fam]) {
        byFamily[fam] = { family: fam, count: 0, hc: 0, quotedThb: 0, annualSavingThb: 0, go: 0 };
      }
      byFamily[fam].count += 1;
      byFamily[fam].hc += m.hc;
      byFamily[fam].quotedThb += m.quotedCostThb;
      byFamily[fam].annualSavingThb += m.annualSavingThb;
      if (item.feasibility === 'Go') byFamily[fam].go += 1;
    });

    const authorizedBudgetThb =
      filteredItems.length === allItemsCount && allItemsCount === INITIAL_COST_PROJECTS.length
        ? NMB_AUTHORIZED_BUDGET_THB
        : Math.max(allocatedBudgetThb, committedQuotedThb);
    const surplusThb = authorizedBudgetThb - committedQuotedThb;

    return {
      count: filteredItems.length,
      familyCount: Object.keys(byFamily).length,
      totalHc,
      committedQuotedThb,
      authorizedBudgetThb,
      surplusThb,
      annualSavingThb,
      goCount,
      pendingCount,
      noGoCount,
      familyBreakdown: Object.values(byFamily).sort((a, b) => b.hc - a.hc)
    };
  }, [filteredItems, allItemsCount]);

  const feasibilityStyle = (status) => {
    if (status === 'Go') return 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700';
    if (status === 'No-go') return 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-300 dark:border-rose-700';
    return 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-300 dark:border-amber-700';
  };

  return (
    <div className="space-y-6">
      {/* Executive Dashboard KPI Strip (Synced with Cost_initiative_and_automation_Dashboard) */}
      <div className="grid grid-cols-2 lg:grid-cols-6 gap-3.5">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3.5 space-y-1">
          <div className="text-[11px] font-medium text-slate-500 dark:text-slate-400">Total Initiatives</div>
          <div className="text-2xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">{summary.count}</div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {summary.familyCount} Product Families
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-emerald-200 dark:border-emerald-800 p-3.5 space-y-1">
          <div className="text-[11px] font-semibold text-emerald-700 dark:text-emerald-300">HC Reduction</div>
          <div className="text-2xl font-bold text-emerald-700 dark:text-emerald-300 tabular-nums">
            {summary.totalHc} <span className="text-xs font-semibold">HC</span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            Target: {NMB_HC_TARGET} HC · {formatThbCompact(summary.annualSavingThb)}/yr
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3.5 space-y-1">
          <div className="text-[11px] font-medium text-slate-500 dark:text-slate-400">Committed &amp; Quoted</div>
          <div className="text-xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">
            {formatThbCompact(summary.committedQuotedThb)}
          </div>
          <div className="text-[10px] text-slate-400 dark:text-slate-400 tabular-nums">
            {formatThbExact(summary.committedQuotedThb)}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3.5 space-y-1">
          <div className="text-[11px] font-medium text-slate-500 dark:text-slate-400">Authorized Budget</div>
          <div className="text-xl font-bold text-blue-700 dark:text-blue-300 tabular-nums">
            {formatThbCompact(summary.authorizedBudgetThb)}
          </div>
          <div className="text-[10px] text-slate-400 dark:text-slate-400 tabular-nums">
            {formatThbExact(summary.authorizedBudgetThb)}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3.5 space-y-1">
          <div className="text-[11px] font-medium text-slate-500 dark:text-slate-400">Budget Surplus</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              summary.surplusThb >= 0 ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-600 dark:text-rose-400'
            }`}
          >
            {formatThbCompact(summary.surplusThb)}
          </div>
          <div className="text-[10px] text-slate-400 dark:text-slate-400 tabular-nums">
            {formatThbExact(summary.surplusThb)}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3.5 space-y-1">
          <div className="text-[11px] font-medium text-slate-500 dark:text-slate-400">Feasibility Gate</div>
          <div className="text-xs font-bold tabular-nums pt-1 flex flex-wrap gap-1.5">
            <span className="px-1.5 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
              {summary.goCount} Go
            </span>
            <span className="px-1.5 py-0.5 rounded bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border border-amber-200 dark:border-amber-800">
              {summary.pendingCount} Pend
            </span>
            <span className="px-1.5 py-0.5 rounded bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800">
              {summary.noGoCount} No-go
            </span>
          </div>
          <div className="text-[10px] text-slate-400 dark:text-slate-400">ROI Cap ≤ {NMB_MAX_ROI_MONTHS} mo</div>
        </div>
      </div>

      {/* Main Module Card with 2 Sheet Tabs: Dashboard / Projects */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
          <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800 text-xs">
            {[
              { id: 'dashboard', label: 'Dashboard' },
              { id: 'projects', label: `Projects (${filteredItems.length})` },
            ].map((t) => (
              <button
                key={t.id}
                type="button"
                onClick={() => setSubTab(t.id)}
                className={`px-3 py-1.5 rounded-md font-semibold transition-colors ${
                  subTab === t.id
                    ? 'bg-slate-900 dark:bg-slate-700 text-white shadow-2xs'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <label className="px-2.5 py-1.5 rounded-lg border border-blue-200 dark:border-blue-800 bg-blue-50 dark:bg-blue-950 hover:bg-blue-100 dark:hover:bg-blue-900 text-blue-700 dark:text-blue-300 text-xs font-semibold inline-flex items-center gap-1.5 cursor-pointer">
              <Upload className="w-3.5 h-3.5" />
              <span>Import CSV / Excel</span>
              <input
                type="file"
                accept=".csv,.xlsx,.xls"
                className="hidden"
                onChange={(e) => {
                  const f = e.target.files?.[0];
                  if (f) onImportFile(f);
                  e.target.value = '';
                }}
              />
            </label>
            <button
              type="button"
              onClick={() => exportCostProjectsCsv(filteredItems)}
              className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold inline-flex items-center gap-1.5"
            >
              <Download className="w-3.5 h-3.5" />
              <span>Export CSV</span>
            </button>
            <button
              type="button"
              onClick={onOpenNew}
              className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-xs font-semibold inline-flex items-center gap-1.5"
            >
              <Plus className="w-3.5 h-3.5" />
              <span>New Initiative</span>
            </button>
          </div>
        </div>

        {/* SUB-TAB 1: EXECUTIVE DASHBOARD */}
        {subTab === 'dashboard' && (
          <div className="p-5 space-y-5">
            {/* Family Breakdown Cards */}
            <div>
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                  Automation &amp; Cost Saving Breakdown by Product Family
                </h3>
                <span className="text-[11px] text-slate-500 dark:text-slate-400">
                  Source: Cost initiative and automation projects_Rev3_20261118 (for NMB)
                </span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                {summary.familyBreakdown.map((f) => {
                  const share = summary.totalHc > 0 ? (f.hc / summary.totalHc) * 100 : 0;
                  return (
                    <button
                      key={f.family}
                      type="button"
                      onClick={() => {
                        setFamilyFilter(f.family);
                        setSubTab('projects');
                      }}
                      className="text-left p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/70 hover:border-blue-300 dark:hover:border-blue-700 hover:bg-blue-50/30 dark:hover:bg-blue-950/30 transition-colors space-y-2"
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-bold text-slate-900 dark:text-slate-100">{f.family}</span>
                        <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 tabular-nums">
                          {f.count} projects
                        </span>
                      </div>
                      <div className="flex items-baseline justify-between tabular-nums">
                        <span className="text-xl font-extrabold text-emerald-700 dark:text-emerald-300">{f.hc} HC</span>
                        <span className="text-xs font-semibold text-slate-700 dark:text-slate-300">
                          {formatThbCompact(f.quotedThb)} quoted
                        </span>
                      </div>
                      <div className="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                        <div
                          className="h-full bg-blue-600 rounded-full"
                          style={{ width: `${Math.min(100, share)}%` }}
                        />
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
                        <span>{f.go} Go approved</span>
                        <span>{share.toFixed(0)}% of HC</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Budget Utilization & Top Committed Investments */}
            <div className="grid grid-cols-1 gap-4">
              <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                    Authorized Budget Utilization (THB)
                  </span>
                  <span className="text-xs font-bold text-blue-700 dark:text-blue-300 tabular-nums">
                    {summary.authorizedBudgetThb > 0
                      ? ((summary.committedQuotedThb / summary.authorizedBudgetThb) * 100).toFixed(1)
                      : 0}
                    % Used
                  </span>
                </div>
                <div className="w-full h-3 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden border border-slate-200 dark:border-slate-800">
                  <div
                    className="h-full bg-blue-600 rounded-full"
                    style={{
                      width: `${Math.min(
                        100,
                        summary.authorizedBudgetThb > 0
                          ? (summary.committedQuotedThb / summary.authorizedBudgetThb) * 100
                          : 0
                      )}%`
                    }}
                  />
                </div>
                <div className="grid grid-cols-3 gap-2 text-xs tabular-nums pt-1">
                  <div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-400">Committed &amp; Quoted</div>
                    <div className="font-bold text-slate-900 dark:text-slate-100">
                      {formatThbExact(summary.committedQuotedThb)}
                    </div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-400">Feasibility Surplus</div>
                    <div className="font-bold text-emerald-700 dark:text-emerald-300">
                      {formatThbExact(summary.surplusThb)}
                    </div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-400">Authorized Cap</div>
                    <div className="font-bold text-blue-700 dark:text-blue-300">
                      {formatThbExact(summary.authorizedBudgetThb)}
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        )}

        {/* SUB-TAB 2: PROJECTS PORTFOLIO TABLE (CRUD) */}
        {subTab === 'projects' && (
          <div>
            <div className="px-5 py-3 bg-slate-50/70 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2.5">
              <div className="flex flex-wrap items-center gap-2">
                <div className="relative">
                  <Search className="w-3.5 h-3.5 text-slate-400 dark:text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Search project, vendor, model..."
                    className="pl-8 pr-3 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 focus:outline-none focus:border-blue-500 w-52"
                  />
                </div>

                <select
                  value={familyFilter}
                  onChange={(e) => setFamilyFilter(e.target.value)}
                  className="px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 font-semibold text-slate-700 dark:text-slate-300"
                >
                  <option value="ALL">All Families</option>
                  {['MacMini', 'MB16"', 'MB14"', 'iMac'].map((f) => (
                    <option key={f} value={f}>
                      {f}
                    </option>
                  ))}
                </select>

                <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-0.5 text-[11px]">
                  {['ALL', ...FEASIBILITY_STATUSES].map((st) => (
                    <button
                      key={st}
                      type="button"
                      onClick={() => setFeasFilter(st)}
                      className={`px-2 py-1 rounded-md font-semibold transition-colors ${
                        feasFilter === st
                          ? 'bg-slate-900 dark:bg-slate-700 text-white'
                          : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 dark:dark:hover:bg-slate-600'
                      }`}
                    >
                      {st === 'ALL' ? 'All' : st}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  <tr>
                    <th className="py-2.5 px-4 min-w-[230px]">ID &amp; Project Opportunity</th>
                    <th className="py-2.5 px-2.5 whitespace-nowrap">Family · Model</th>
                    <th className="py-2.5 px-2.5 whitespace-nowrap">Vendor</th>
                    <th className="py-2.5 px-2 text-right whitespace-nowrap">HC</th>
                    <th className="py-2.5 px-2.5 text-right whitespace-nowrap">Budget (THB)</th>
                    <th className="py-2.5 px-2.5 text-right whitespace-nowrap">Quoted / Actual</th>
                    <th className="py-2.5 px-2.5 text-right whitespace-nowrap">Est. Save / Yr</th>
                    <th className="py-2.5 px-2 text-right whitespace-nowrap">ROI (Mo)</th>
                    <th className="py-2.5 px-2.5 whitespace-nowrap">Feasibility</th>
                    <th className="py-2.5 px-2.5 whitespace-nowrap">Status / Stage</th>
                    <th className="py-2.5 px-4 text-right whitespace-nowrap">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                  {filteredItems.map((item) => {
                    const m = computeCostSavingMetrics(item);
                    const overRoi = m.roiMonths > NMB_MAX_ROI_MONTHS;
                    return (
                      <tr key={item.id} className="hover:bg-slate-50/90 dark:hover:bg-slate-800/90 transition-colors">
                        <td className="py-2.5 px-4">
                          <div className="flex items-center gap-1.5">
                            <span className="font-mono text-[10px] font-bold text-slate-400 dark:text-slate-400">
                              {item.id}
                            </span>
                            <span className="font-bold text-slate-900 dark:text-slate-100">{item.title}</span>
                          </div>
                          {item.notes && (
                            <div className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-1" title={item.notes}>
                              {item.notes}
                            </div>
                          )}
                        </td>
                        <td className="py-2.5 px-2.5 whitespace-nowrap">
                          <div className="font-bold text-slate-900 dark:text-slate-100">{item.familyGroup}</div>
                          <div className="text-[10px] text-slate-500 dark:text-slate-400">
                            {item.model} · {item.fyTarget || 'FY2026'}
                          </div>
                        </td>
                        <td className="py-2.5 px-2.5 whitespace-nowrap text-slate-700 dark:text-slate-300 font-medium">
                          {item.vendor || '—'}
                        </td>
                        <td className="py-2.5 px-2 text-right font-bold text-emerald-700 dark:text-emerald-300 whitespace-nowrap">
                          {m.hc}
                        </td>
                        <td className="py-2.5 px-2.5 text-right text-slate-600 dark:text-slate-400 whitespace-nowrap">
                          {m.budgetThb > 0 ? formatThbCompact(m.budgetThb) : '—'}
                        </td>
                        <td className="py-2.5 px-2.5 text-right font-semibold text-slate-900 dark:text-slate-100 whitespace-nowrap">
                          {m.quotedCostThb > 0 ? formatThbExact(m.quotedCostThb) : '฿0'}
                        </td>
                        <td className="py-2.5 px-2.5 text-right font-bold text-emerald-700 dark:text-emerald-300 whitespace-nowrap">
                          {formatThbCompact(m.annualSavingThb)}
                        </td>
                        <td
                          className={`py-2.5 px-2 text-right font-bold whitespace-nowrap ${
                            overRoi
                              ? 'text-rose-600 dark:text-rose-400'
                              : m.roiMonths > 0
                              ? 'text-slate-800 dark:text-slate-200'
                              : 'text-emerald-600 dark:text-emerald-400'
                          }`}
                        >
                          {m.roiMonths > 0 ? `${m.roiMonths.toFixed(1)}m` : '0m'}
                        </td>
                        <td className="py-2.5 px-2.5 whitespace-nowrap">
                          <select
                            aria-label={`Feasibility for ${item.id}`}
                            value={item.feasibility}
                            onChange={(e) => onUpdateFeasibility(item.id, e.target.value)}
                            className={`px-2 py-1 rounded-md border text-[11px] font-bold cursor-pointer ${feasibilityStyle(
                              item.feasibility
                            )}`}
                          >
                            {FEASIBILITY_STATUSES.map((fs) => (
                              <option key={fs} value={fs}>
                                {fs}
                              </option>
                            ))}
                          </select>
                        </td>
                        <td className="py-2.5 px-2.5 whitespace-nowrap">
                          <select
                            aria-label={`Stage for ${item.id}`}
                            value={item.stage}
                            onChange={(e) => onUpdateStage(item.id, e.target.value)}
                            className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-[11px] font-medium text-slate-700 dark:text-slate-300 cursor-pointer max-w-[165px]"
                          >
                            {COST_SAVING_STAGES.map((st) => (
                              <option key={st} value={st}>
                                {st}
                              </option>
                            ))}
                          </select>
                        </td>
                        <td className="py-2.5 px-4 text-right whitespace-nowrap">
                          <div className="inline-flex items-center gap-1">
                            <button
                              type="button"
                              onClick={() => onEdit(item)}
                              title="Edit Initiative"
                              className="p-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 hover:bg-blue-50 dark:hover:bg-blue-950"
                            >

function CustomerFeedbackView({
  items,
  onOpenNew,
  onEdit,
  onDelete,
  onToggle8D,
  onUpdateStatus,
  onImportFile
}) {
  const [locationFilter, setLocationFilter] = useState('ALL');
  const [issueCatFilter, setIssueCatFilter] = useState('ALL');
  const [typeFilter, setTypeFilter] = useState('ALL');
  const [statusFilter, setStatusFilter] = useState('ALL');
  const [search, setSearch] = useState('');

  const filteredItems = useMemo(() => {
    return items.filter((c) => {
      if (locationFilter !== 'ALL' && c.location !== locationFilter) return false;
      if (issueCatFilter !== 'ALL' && c.issueCategory !== issueCatFilter) return false;
      if (typeFilter !== 'ALL' && c.category !== typeFilter) return false;
      if (statusFilter === 'Open' && c.nmbStatus !== 'Open' && c.customerStatus !== 'Open') {
        return false;
      }
      if (statusFilter === 'Closed' && (c.nmbStatus !== 'Closed' || c.customerStatus !== 'Closed')) {
        return false;
      }
      if (search.trim()) {
        const q = search.toLowerCase();
        return (
          c.id.toLowerCase().includes(q) ||
          (c.facaNo || '').toLowerCase().includes(q) ||
          c.model.toLowerCase().includes(q) ||
          c.location.toLowerCase().includes(q) ||
          (c.issueItem || '').toLowerCase().includes(q) ||
          (c.remark || '').toLowerCase().includes(q)
        );
      }
      return true;
    });
  }, [items, locationFilter, issueCatFilter, typeFilter, statusFilter, search]);

  // Claims against the annual ceiling are an organisation-wide KPI, so they are
  // counted over every record with the same rule as the KPI tile — page filters
  // narrow the list, never the ceiling.
  const claimsFy = useMemo(
    () => items.filter((c) => c.category === 'Claim' && isInKpiFiscalYear(c.feedbackDate)).length,
    [items]
  );

  const stats = useMemo(() => {
    let totalNg = 0;
    let openNmb = 0;
    let openCust = 0;
    let claims = 0;
    let faCount = 0;
    let feedbackCount = 0;
    let npiCount = 0;
    let mpCount = 0;
    const byCategory = {};
    const byLocation = {};

    filteredItems.forEach((c) => {
      totalNg += Number(c.ngQty) || 0;
      if (c.nmbStatus === 'Open') openNmb += 1;
      if (c.customerStatus === 'Open') openCust += 1;
      if (c.category === 'Claim') claims += 1;
      else if (c.category === 'FA') faCount += 1;
      else feedbackCount += 1;
      if (c.build === 'MP') mpCount += 1;
      else npiCount += 1;

      byCategory[c.issueCategory] = (byCategory[c.issueCategory] || 0) + 1;
      byLocation[c.location] = (byLocation[c.location] || 0) + 1;
    });

    const closedBoth = filteredItems.filter(
      (c) => c.nmbStatus === 'Closed' && c.customerStatus === 'Closed'
    ).length;
    const closureRate = filteredItems.length > 0 ? (closedBoth / filteredItems.length) * 100 : 100;

    return {
      total: filteredItems.length,
      totalNg,
      openNmb,
      openCust,
      claims,
      faCount,
      feedbackCount,
      npiCount,
      mpCount,
      closureRate,
      byCategory: Object.entries(byCategory).sort((a, b) => b[1] - a[1]),
      byLocation: Object.entries(byLocation).sort((a, b) => b[1] - a[1])
    };
  }, [filteredItems]);

  return (
    <div className="space-y-6">
      {/* Executive KPI Strip */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3.5">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Feedback Cases (all dates)</div>
          <div className="text-2xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">{stats.total}</div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            NPI: {stats.npiCount} · MP: {stats.mpCount}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Total NG Qty</div>
          <div className="text-2xl font-bold text-rose-600 dark:text-rose-400 tabular-nums">
            {stats.totalNg.toLocaleString()}{' '}
            <span className="text-xs font-normal text-slate-400 dark:text-slate-400">pcs</span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Across {stats.byLocation.length} FATP sites</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-amber-200 dark:border-amber-800 p-4 space-y-1">
          <div className="text-xs font-semibold text-amber-800 dark:text-amber-200">Open Action Cases</div>
          <div className="text-2xl font-bold text-amber-700 dark:text-amber-300 tabular-nums">
            {Math.max(stats.openNmb, stats.openCust)}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            NMB Open: {stats.openNmb} · Cust Open: {stats.openCust}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Type Split (FA / FB / Claim)</div>
          <div className="text-sm font-bold text-slate-900 dark:text-slate-100 tabular-nums pt-1">
            {stats.faCount} FA · {stats.feedbackCount} FB · {stats.claims} Claim
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            Annual Claim Ceiling: &le; {KPI_TARGETS.customerClaims} ·{' '}
            <span
              className={
                claimsFy > KPI_TARGETS.customerClaims
                  ? 'text-rose-600 dark:text-rose-400 font-semibold'
                  : 'text-slate-600 dark:text-slate-300'
              }
            >
              {claimsFy} in FY{KPI_FISCAL_YEAR}
            </span>
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-emerald-200 dark:border-emerald-800 p-4 space-y-1 col-span-2 lg:col-span-1">
          <div className="text-xs font-semibold text-emerald-700 dark:text-emerald-300">8D Closure Rate</div>
          <div className="text-2xl font-bold text-emerald-700 dark:text-emerald-300 tabular-nums">
            {stats.closureRate.toFixed(0)}%
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Both NMB &amp; Customer Closed</div>
        </div>
      </div>

      {/* Interactive Issue Category & Location Pareto Strip */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-2.5">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
              By Issue Category
            </span>
            {issueCatFilter !== 'ALL' && (
              <button
                type="button"
                onClick={() => setIssueCatFilter('ALL')}
                className="text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline"
              >
                Clear
              </button>
            )}
          </div>
          <div className="flex flex-wrap gap-2">
            {stats.byCategory.map(([cat, count]) => {
              const active = issueCatFilter === cat;
              return (
                <button
                  key={cat}
                  type="button"
                  onClick={() => setIssueCatFilter(active ? 'ALL' : cat)}
                  className={`px-3 py-1.5 rounded-lg border text-xs font-semibold inline-flex items-center gap-2 transition-colors ${
                    active

                type="file"

        <div className="overflow-x-auto">

            <div className="p-8 text-center text-xs text-slate-500 dark:text-slate-400">

              <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">

                  <th className="py-2.5 px-2.5 whitespace-nowrap">Model · Build</th>

                  <th className="py-2.5 px-3.5 text-right whitespace-nowrap">Actions</th>

              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                {filteredItems.map((c) => (
                  <tr key={c.id} className="hover:bg-slate-50/90 dark:hover:bg-slate-800/90 transition-colors">
                    <td className="py-2.5 px-3.5 whitespace-nowrap">
                      <div className="font-bold text-slate-900 dark:text-slate-100">{c.location}</div>
                      <div className="text-[10px] text-slate-400 dark:text-slate-400">{c.feedbackDate}</div>
                    </td>
                    <td className="py-2.5 px-2.5 whitespace-nowrap">
                      <div className="font-bold text-slate-900 dark:text-slate-100">{c.model}</div>
                      <div className="text-[10px] text-slate-500 dark:text-slate-400">
                        {c.build} · {c.buildConfig}
                      </div>
                    </td>
                    <td className="py-2.5 px-3">
                      <div className="flex items-center gap-1.5">
                        <span className="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-[10px] font-bold">
                          {c.issueCategory}
                        </span>
                        <span className="font-semibold text-slate-900 dark:text-slate-100">{c.issueItem}</span>
                      </div>
                      {c.remark && (
                        <div className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-1" title={c.remark}>
                          {c.remark}
                        </div>
                      )}
                    </td>
                    <td className="py-2.5 px-2 text-right font-bold text-rose-600 dark:text-rose-400 whitespace-nowrap">
                      {c.ngQty}
                    </td>
                    <td className="py-2.5 px-2.5 whitespace-nowrap">
                      <span
                        className={`inline-flex px-1.5 py-0.5 rounded text-[10px] font-bold border ${
                          c.category === 'Claim'
                            ? 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800'
                            : c.category === 'FA'
                            ? 'bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800'
                            : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800'
                        }`}
                      >
                        {c.category}
                      </span>
                      {c.facaNo && (
                        <div className="text-[10px] font-mono text-slate-400 dark:text-slate-400 mt-0.5">{c.facaNo}</div>
                      )}
                    </td>
                    <td className="py-2.5 px-3 whitespace-nowrap">
                      <div className="inline-flex items-center gap-1">
                        {EIGHT_D_STEPS.map((st) => {
                          const closed = c.eightD?.[st.key] === 'Closed';
                          return (
                            <button
                              key={st.key}
                              type="button"
                              onClick={() => onToggle8D(c.id, st.key)}
                              title={`Toggle ${st.label} (${closed ? 'Closed' : 'Open'})`}
                              className={`px-1.5 py-0.5 rounded text-[10px] font-bold border transition-colors ${
                                closed
                                  ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700 hover:bg-emerald-100 dark:hover:bg-emerald-900'
                                  : 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-300 dark:border-amber-700 hover:bg-amber-100 dark:hover:bg-amber-900'
                              }`}
                            >
                              {st.label}
                            </button>
                          );
                        })}
                      </div>
                    </td>
                    <td className="py-2.5 px-2.5 whitespace-nowrap">
                      <select
                        aria-label={`NMB Status for ${c.id}`}
                        value={c.nmbStatus}
                        onChange={(e) => onUpdateStatus(c.id, 'nmbStatus', e.target.value)}
                        className={`px-2 py-1 rounded-md border text-[11px] font-bold cursor-pointer ${
                          c.nmbStatus === 'Closed'
                            ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'
                            : 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-200 dark:border-amber-800'
                        }`}
                      >
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                      </select>
                    </td>
                    <td className="py-2.5 px-2.5 whitespace-nowrap">
                      <select
                        aria-label={`Customer Status for ${c.id}`}
                        value={c.customerStatus}
                        onChange={(e) => onUpdateStatus(c.id, 'customerStatus', e.target.value)}
                        className={`px-2 py-1 rounded-md border text-[11px] font-bold cursor-pointer ${
                          c.customerStatus === 'Closed'
                            ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'
                            : 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800'
                        }`}
                      >
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                      </select>
                    </td>
                    <td className="py-2.5 px-3.5 text-right whitespace-nowrap">
                      <div className="inline-flex items-center gap-1">
                        <button
                          type="button"
                          onClick={() => onEdit(c)}
                          title="Edit Case"
                          className="p-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 hover:bg-blue-50 dark:hover:bg-blue-950"
                        >
                          <Pencil className="w-3.5 h-3.5" />
                        </button>
                        <button
                          type="button"
                          onClick={() => onDelete(c)}
                          title="Delete Case"
                          className="p-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-rose-700 dark:hover:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </section>
    </div>
  );
}

function CustomerFeedbackModal({ initialItem = null, defaultModel, onClose, onSubmit }) {
  const isEditing = Boolean(initialItem);
  const [form, setForm] = useState(() =>
    initialItem
      ? { ...initialItem, eightD: { ...(initialItem.eightD || {}) } }
      : {
          location: 'QSMC',
          feedbackDate: todayIso(),
          facaNo: '',
          severity: 'Major',
          model: defaultModel || 'X3082',
          familyGroup: inferFamilyFromModel(defaultModel || 'X3082'),
          dateCode: '2647',
          build: 'NPI',
          phase: 'EVT',
          buildConfig: 'EVT',
          side: 'RHS & LHS',
          issueCategory: 'Function',
          issueItem: '',
          ngQty: 1,
          rtvDate: '',
          category: 'FA',
          eightD: { d1d3: 'Open', d4: 'Open', d5: 'Open', d6: 'Open', d7: 'Open', d8: 'Open' },
          nmbStatus: 'Open',
          customerStatus: 'Open',
          remark: ''
        }
  );

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.issueItem.trim()) return;
    onSubmit(form);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-[1px]">
      <form
        onSubmit={handleSubmit}
        className="w-full max-w-xl bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs"
      >
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">
            {isEditing ? `Edit Customer Feedback (${initialItem.id})` : 'Log Customer Feedback / FACA Case'}
          </h3>
          <button type="button" onClick={onClose} className="text-slate-400 dark:text-slate-400 hover:text-slate-600 dark:hover:text-slate-400">
            <X className="w-4 h-4" />
          </button>
        </div>

        <div className="p-5 space-y-3.5">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Location *</label>
              <select
                value={form.location}
                onChange={(e) => setForm({ ...form, location: e.target.value })}
                className="w-full px-2.5 py-2 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900"
              >
                {CUSTOMER_FEEDBACK_LOCATIONS.map((loc) => (
                  <option key={loc} value={loc}>
                    {loc}
                  </option>
                ))}
              </select>
            </div>
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Feedback Date</label>
              <input
                type="date"
                value={form.feedbackDate}
                onChange={(e) => setForm({ ...form, feedbackDate: e.target.value })}
                className="w-full px-2 py-2 border border-slate-200 dark:border-slate-800 rounded-lg"
              />
            </div>
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">FACA #</label>
              <input
                value={form.facaNo}
                onChange={(e) => setForm({ ...form, facaNo: e.target.value })}
                placeholder="FACA-2611-XX"
                className="w-full px-2.5 py-2 border border-slate-200 dark:border-slate-800 rounded-lg font-mono"
              />
            </div>
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Severity</label>
              <select
                value={form.severity}
                onChange={(e) => setForm({ ...form, severity: e.target.value })}
                className="w-full px-2.5 py-2 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900"
              >
                {FEEDBACK_SEVERITIES.map((s) => (
                  <option key={s} value={s}>

                  </option>
                ))}

            </div>
          </div>

/**
 * Fallback for a clipboard the frame refuses to write to: shows the exact
 * export text, already selected, so it can still be copied by hand.
 */
function WorkspaceExportModal({ json, revision, reason, onClose }) {
  const textareaRef = useRef(null);
  const [status, setStatus] = useState('idle'); // idle | copied | blocked

  useEffect(() => {
    const el = textareaRef.current;
    if (!el) return;
    el.focus();
    el.select();
  }, []);

  const copyAgain = async () => {
    try {
      if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') {
        throw new Error('no clipboard API');
      }
      await navigator.clipboard.writeText(json);
      setStatus('copied');
      return;
    } catch (err) {
      // Fall through to copying the current selection instead.
    }
    const el = textareaRef.current;
    let copied = false;
    if (el) {
      el.focus();
      el.select();
      try {
        copied = document.execCommand('copy');
      } catch (err) {
        copied = false;
      }
    }
    setStatus(copied ? 'copied' : 'blocked');
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-[1px]">
      <div className="w-full max-w-2xl max-h-[90vh] flex flex-col bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs">
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2 text-slate-700 dark:text-slate-200">
            <ClipboardCheck className="w-4 h-4 shrink-0" />
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">Workspace JSON</h3>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <span className="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-[10px] font-semibold text-slate-600 dark:text-slate-300 tabular-nums">
              Rev #{revision} · {Math.round(json.length / 1024)} KB
            </span>
            <button
              type="button"
              onClick={onClose}
              aria-label="Close"
              className="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400"
            >
              <X className="w-4 h-4" />
            </button>
          </div>
        </div>

        <div className="px-5 py-3 space-y-2 overflow-y-auto">
          <p className="text-[11px] text-slate-600 dark:text-slate-400 leading-relaxed">
            {reason ? `The clipboard was blocked (${reason}). ` : ''}
            The text below is the complete loaded workspace. Copy it, save it as a .json file, and import it
            on the preview machine with <code className="font-mono text-slate-800 dark:text-slate-200">bun run state:import &lt;file&gt;</code>.
          </p>
          <textarea
            ref={textareaRef}
            readOnly
            spellCheck={false}
            value={json}
            className="w-full h-64 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 font-mono text-[10px] leading-snug text-slate-700 dark:text-slate-300 resize-none"
          />
          {status === 'blocked' && (
            <p className="text-[11px] text-amber-700 dark:text-amber-300">
              Automatic copy is blocked too — the text is selected; press Ctrl+C (⌘C on macOS).
            </p>
          )}
        </div>

        <div className="px-5 py-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
          <span className="text-[10px] text-slate-500 dark:text-slate-400">
            {status === 'copied' ? 'Copied to the clipboard.' : 'Includes the revision and all nine workspace slices.'}
          </span>
          <div className="flex items-center gap-2 shrink-0">
            <button
              type="button"
              onClick={onClose}
              className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-300"
            >
              Close
            </button>
            <button
              type="button"
              onClick={copyAgain}
              className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-xs font-semibold text-white"
            >
              {status === 'copied' ? 'Copied' : 'Copy again'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SyncConflictModal({ revision, remoteMeta, local, remote, loading, error, onKeepLocal, onUseRemote }) {
  const [showDiff, setShowDiff] = useState(false);
  const slices = useMemo(() => (remote ? diffWorkspacePayloads(local, remote) : []), [local, remote]);
  const totals = slices.reduce(
    (acc, item) => ({
      onlyMine: acc.onlyMine + item.onlyMine.length,
      onlyTheirs: acc.onlyTheirs + item.onlyTheirs.length,
      differing: acc.differing + item.differing.length
    }),
    { onlyMine: 0, onlyTheirs: 0, differing: 0 }
  );
  const changeCount = totals.onlyMine + totals.onlyTheirs + totals.differing;
  const chip = (list, limit = 5) => {
    if (list.length === 0) return null;
    return (
      <div className="mt-0.5 text-[10px] leading-relaxed text-slate-500 dark:text-slate-400 break-words">
        {list.slice(0, limit).join(' · ')}
        {list.length > limit ? ` · +${list.length - limit} more` : ''}
      </div>
    );
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-[1px]">
      <div className="w-full max-w-xl max-h-[90vh] flex flex-col bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs">
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div className="flex items-center gap-2 text-amber-700 dark:text-amber-300">
            <AlertTriangle className="w-4 h-4 shrink-0" />
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">Save conflict</h3>
          </div>
          <span className="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-[10px] font-semibold text-slate-600 dark:text-slate-300 tabular-nums">
            Their save · Rev #{revision}
          </span>
        </div>

        <div className="px-5 py-4 space-y-3 overflow-y-auto">
          <p className="text-slate-600 dark:text-slate-400 leading-relaxed">
            Another user saved to the sheet while you had unsaved edits.{' '}
            <span className="font-semibold text-slate-800 dark:text-slate-200">
              Your edits are still in this browser and have not been overwritten.
            </span>{' '}
            Choose which version to keep.
          </p>

          {remoteMeta && (remoteMeta.lastSavedBy || remoteMeta.lastSavedAt) && (
            <p className="text-[11px] text-slate-500 dark:text-slate-400">
              Their version: {remoteMeta.lastSavedBy || 'another user'}
              {remoteMeta.lastSavedAt ? ` · ${String(remoteMeta.lastSavedAt).replace('T', ' ').slice(0, 16)}` : ''}
            </p>
          )}

          {loading && (
            <p className="text-[11px] text-slate-500 dark:text-slate-400">Loading their version for comparison…</p>
          )}

          {!loading && error && (
            <p className="text-[11px] text-rose-700 dark:text-rose-300">
              Could not read their version ({error}). You can still keep and save yours.
            </p>
          )}

          {!loading && remote && (
            <div className="rounded-lg border border-slate-200 dark:border-slate-800 overflow-hidden">
              <button
                type="button"
                onClick={() => setShowDiff((prev) => !prev)}
                className="w-full px-3 py-2 flex items-center justify-between gap-2 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-left"
              >
                <span className="font-semibold text-slate-700 dark:text-slate-200">
                  {changeCount === 0 ? 'No differences detected' : `${changeCount} differing record(s)`}
                </span>
                <span className="text-[10px] text-blue-700 dark:text-blue-300 font-semibold">
                  {showDiff ? 'Hide differences' : 'Review differences'}
                </span>
              </button>

              {!showDiff && changeCount > 0 && (
                <div className="px-3 py-2 text-[10px] text-slate-500 dark:text-slate-400 flex flex-wrap gap-x-3 gap-y-1">
                  <span>Only in yours: <b className="text-slate-700 dark:text-slate-200">{totals.onlyMine}</b></span>
                  <span>Only in theirs: <b className="text-slate-700 dark:text-slate-200">{totals.onlyTheirs}</b></span>
                  <span>Changed on both sides: <b className="text-slate-700 dark:text-slate-200">{totals.differing}</b></span>
                </div>
              )}

              {showDiff && (
                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                  {slices.length === 0 && (
                    <div className="px-3 py-2 text-[11px] text-slate-500 dark:text-slate-400">
                      Both versions contain the same records.
                    </div>
                  )}
                  {slices.map((item) => (
                    <div key={item.slice} className="px-3 py-2 space-y-1">
                      <div className="font-semibold text-slate-800 dark:text-slate-200">{item.label}</div>
                      {item.onlyTheirs.length > 0 && (
                        <div>
                          <span className="text-[10px] font-bold text-emerald-700 dark:text-emerald-300">Only in theirs</span>
                          {chip(item.onlyTheirs)}
                        </div>
                      )}
                      {item.onlyMine.length > 0 && (
                        <div>
                          <span className="text-[10px] font-bold text-blue-700 dark:text-blue-300">Only in yours</span>
                          {chip(item.onlyMine)}
                        </div>
                      )}
                      {item.differing.length > 0 && (
                        <div>
                          <span className="text-[10px] font-bold text-amber-700 dark:text-amber-300">Changed on both sides</span>
                          {chip(item.differing)}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-end gap-2">
          <button
            type="button"
            onClick={onUseRemote}
            disabled={!remote || loading}
            className="px-3.5 py-2 rounded-lg font-semibold text-rose-700 dark:text-rose-300 bg-white dark:bg-slate-900 border border-rose-200 dark:border-rose-800 hover:bg-rose-50 dark:hover:bg-rose-950 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Use their version
          </button>
          <button
            type="button"
            onClick={onKeepLocal}
            className="px-4 py-2 rounded-lg font-semibold bg-slate-900 dark:bg-slate-700 text-white hover:bg-slate-800 dark:hover:bg-slate-600"
          >
            Keep my version
          </button>
        </div>
      </div>
    </div>
  );
}
