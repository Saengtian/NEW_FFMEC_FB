                className={`px-1.5 py-0.5 rounded text-[10px] font-bold tabular-nums border ${
                  unassignedTasks.length > 0
                    ? 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-300 dark:border-amber-800'
                    : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-800'
                }`}
              >
                {unassignedTasks.length}
              </span>
            </h2>
            <p className="text-[11px] text-slate-500 dark:text-slate-400">
              Open tasks whose owner is not on the roster — they count for nobody until someone claims them.
            </p>
          </div>
          {unassignedTasks.length === 0 && (
            <span className="text-[11px] font-semibold text-emerald-700 dark:text-emerald-300">
              Every open task has a roster owner
            </span>
          )}
        </div>

        {unassignedTasks.length > 0 && (
          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 dark:bg-slate-800/60 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <tr>
                  <th className="px-4 py-2 font-bold">Task</th>
                  <th className="px-3 py-2 font-bold">Program · Gate</th>
                  <th className="px-3 py-2 font-bold">Due</th>
                  <th className="px-3 py-2 font-bold">Owner on file</th>
                  <th className="px-3 py-2 font-bold">Claim</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                {unassignedTasks.map(({ task, projectModel, gateCode }) => (
                  <tr key={task.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/60 transition-colors">
                    <td className="px-4 py-2.5">
                      <button
                        type="button"
                        onClick={() => onOpenTask(task.id)}
                        title={`Open ${task.id}`}
                        className="text-left group"
                      >
                        <div className="text-[10px] font-mono font-bold text-slate-500 dark:text-slate-400">
                          {task.id} · {task.status}
                        </div>
                        <div className="font-semibold text-slate-800 dark:text-slate-100 leading-snug group-hover:text-blue-700 dark:group-hover:text-blue-300">
                          {task.title}
                        </div>
                      </button>
                    </td>
                    <td className="px-3 py-2.5 text-slate-600 dark:text-slate-300 whitespace-nowrap">
                      {projectModel || '—'}
                      {gateCode ? ` · ${gateCode}` : ''}
                    </td>
                    <td className="px-3 py-2.5 text-slate-600 dark:text-slate-300 tabular-nums whitespace-nowrap">
                      {task.dueDate || '—'}
                    </td>
                    <td className="px-3 py-2.5">
                      <span className="font-medium text-slate-700 dark:text-slate-300">
                        {String(task.owner || '').trim() || 'No owner'}
                      </span>
                      {task.ownerId && (
                        <div className="text-[10px] text-slate-400 dark:text-slate-500">
                          stored member {task.ownerId} is not on the roster
                        </div>
                      )}
                    </td>
                    <td className="px-3 py-2.5">
                      <select
                        value=""
                        onChange={(event) => {
                          if (event.target.value) onAssignTaskOwner(task.id, event.target.value);
                        }}
                        aria-label={`Assign ${task.id} to a roster member`}
                        className={selectClass}
                      >
                        <option value="">Assign to…</option>
                        {members.map((member) => (
                          <option key={member.id} value={member.id}>
                            {member.name} · {member.role}
                          </option>
                        ))}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>

      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        {/* Toolbar: search, role, product, add */}
        <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center gap-2 justify-between">
          <div className="flex flex-wrap items-center gap-2">
            <div className="relative">
              <Search className="w-3.5 h-3.5 absolute left-2.5 top-2 text-slate-400 dark:text-slate-500" />
              <input
                type="search"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Name, role, email or product"
                className="pl-8 pr-2.5 py-1.5 w-56 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs focus:outline-none focus:border-blue-500"
              />
            </div>
            <select value={roleFilter} onChange={(e) => setRoleFilter(e.target.value)} className={selectClass}>
              <option value="ALL">All roles</option>
              {roleOptions.map((role) => (
                <option key={role} value={role}>
                  {role}
                </option>
              ))}
            </select>
            <select
              value={productFilter}
              onChange={(e) => setProductFilter(e.target.value)}
              className={selectClass}
            >
              <option value="ALL">All products</option>
              {productOptions.map((product) => (
                <option key={product} value={product}>
                  {product}
                </option>
              ))}
            </select>
          </div>

          <button
            type="button"
            onClick={onOpenNew}
            className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition-colors"
          >
            <Plus className="w-3.5 h-3.5" />
            <span>Add member</span>
          </button>
        </div>

        {rows.length === 0 ? (
          <div className="p-8 text-center text-xs text-slate-400 dark:text-slate-400">
            No team member matches this filter.
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 dark:bg-slate-800/60 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <tr>
                  <th className="px-4 py-2 font-bold">Member</th>
                  <th className="px-3 py-2 font-bold">Role</th>
                  <th className="px-3 py-2 font-bold">Reports to</th>
                  <th className="px-3 py-2 font-bold">Products</th>
                  <th className="px-3 py-2 font-bold">Workload</th>
                  <th className="px-3 py-2 font-bold text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                {rows.map(({ member, workload, unmatchedKeys, external }) => (
                  <tr key={member.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/60 transition-colors">
                    <td className="px-4 py-2.5">
                      <div className="font-bold text-slate-900 dark:text-slate-100">{member.name}</div>
                      {String(member.email || '').trim() ? (
                        <a
                          href={`mailto:${member.email}`}
                          className="text-[10px] text-blue-700 dark:text-blue-300 hover:underline inline-flex items-center gap-1"
                        >
                          <Mail className="w-3 h-3" />
                          {member.email}
                        </a>
                      ) : (
                        <span className="text-[10px] text-slate-400 dark:text-slate-500">No email on file</span>
                      )}
                    </td>
                    <td className="px-3 py-2.5 text-slate-600 dark:text-slate-300">{member.role}</td>
                    <td className="px-3 py-2.5 text-slate-600 dark:text-slate-300">
                      {nameById[member.reportsTo] || '—'}
                    </td>
                    <td className="px-3 py-2.5">
                      {(member.products || []).length === 0 && external.length === 0 ? (
                        <span className="text-slate-400 dark:text-slate-500">Portfolio-wide</span>
                      ) : (
                        <span className="flex flex-wrap items-center gap-1">
                          {(member.products || []).length === 0 && (
                            <span className="text-[10px] text-slate-400 dark:text-slate-500">
                              No program in this workspace
                            </span>
                          )}
                          {(member.products || []).map((product, index) => {
                            const orphan = unmatchedKeys.has(normalizeProductKey(product));
                            return (
                              // Legacy rows can repeat a product; the index keeps the keys unique.
                              <span
                                key={`${product}-${index}`}
                                title={
                                  orphan
                                    ? `No program uses ${product} — it adds no lines or tasks to the workload`
                                    : `${product} is a live program`
                                }
                                className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded border text-[10px] font-semibold ${
                                  orphan
                                    ? 'border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200'
                                    : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200'
                                }`}
                              >
                                {orphan && <AlertTriangle className="w-2.5 h-2.5 shrink-0" />}
                                {product}
                              </span>
                            );
                          })}
                          {external.map((product) => (
                            <span
                              key={`external-${product}`}
                              title={`${product} is not a program in this workspace — kept on file; it adds no lines, tasks or signatures here`}
                              className="inline-flex items-center px-1.5 py-0.5 rounded border border-dashed border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-[10px] font-semibold text-slate-500 dark:text-slate-400"
                            >
                              {product}
                            </span>
                          ))}
                        </span>
                      )}
                    </td>
                    <td className="px-3 py-2.5 min-w-[190px]">
                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => setDrilldown({ member, workload, focus: 'tasks' })}
                          title={`Open ${member.name}'s workload`}
                          aria-label={`Open ${member.name}'s workload`}
                          className="w-8 text-right font-bold tabular-nums text-slate-900 dark:text-slate-100 hover:text-blue-700 dark:hover:text-blue-300 hover:underline"
                        >
                          {workload.load}
                        </button>
                        <div className="flex-1 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                          <div
                            className={`h-full ${
                              workload.load >= maxLoad && workload.load > 0
                                ? 'bg-amber-500'
                                : 'bg-blue-500 dark:bg-blue-600'
                            }`}
                            style={{ width: `${Math.max(2, (workload.load / maxLoad) * 100)}%` }}
                          />
                        </div>
                      </div>
                      <div className="text-[10px] text-slate-500 dark:text-slate-400 tabular-nums mt-0.5">
                        <button
                          type="button"
                          onClick={() => setDrilldown({ member, workload, focus: 'tasks' })}
                          title={`Show ${member.name}'s open tasks`}
                          className="hover:text-blue-700 dark:hover:text-blue-300 hover:underline"
                        >
                          {workload.openTasks.length} open task{workload.openTasks.length === 1 ? '' : 's'}
                        </button>
                        {' · '}
                        <button
                          type="button"
                          onClick={() => setDrilldown({ member, workload, focus: 'signOffs' })}
                          title={`Show the dossiers waiting for ${member.name}'s signature`}
                          className="hover:text-blue-700 dark:hover:text-blue-300 hover:underline"
                        >
                          {workload.signOffs.length} signature{workload.signOffs.length === 1 ? '' : 's'} owed
                        </button>
                        {` · ${workload.lines} line${workload.lines === 1 ? '' : 's'}`}
                        {workload.lines === 0 && workload.externalPrograms.length > 0 && (
                          <span className="text-slate-400 dark:text-slate-500"> outside this workspace</span>
                        )}
                      </div>
                    </td>
                    <td className="px-3 py-2.5">
                      <div className="flex items-center justify-end gap-1">
                        <button
                          type="button"
                          onClick={() => onEdit(member)}
                          title={`Edit ${member.name}`}
                          aria-label={`Edit ${member.name}`}
                          className="p-1.5 rounded-md text-slate-400 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 hover:bg-blue-50 dark:hover:bg-blue-950 transition-colors"
                        >
                          <Pencil className="w-3.5 h-3.5" />
                        </button>
                        <button
                          type="button"
                          onClick={() => onDelete(member)}
                          title={`Remove ${member.name}`}
                          aria-label={`Remove ${member.name}`}
                          className="p-1.5 rounded-md text-slate-400 dark:text-slate-400 hover:text-rose-700 dark:hover:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950 transition-colors"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        <div className="px-4 py-2.5 border-t border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 text-[10px] text-slate-500 dark:text-slate-400">
          Workload is derived from the plan: the member's own open tasks plus the gate signatures still owed. A
          program or family covers its lines; a dashed program is outside this workspace, so it stays on file but
          adds nothing here; an amber product matches no program (a typo) and also adds nothing; and a member with
          nothing on file is measured across the portfolio. A task with no roster match counts for nobody — it is
          listed under Unassigned work so someone can claim it. Click a count to see the records behind it.
        </div>
      </section>

      {drilldown && (
        <TeamWorkloadDrawer
          member={drilldown.member}
          workload={drilldown.workload}
          focus={drilldown.focus}
          onClose={() => setDrilldown(null)}
          onOpenTask={(taskId) => {
            setDrilldown(null);
            onOpenTask(taskId);
          }}
          onOpenGate={(projectId, lineKey, gateId) => {
            setDrilldown(null);
            onOpenGate(projectId, lineKey, gateId);
          }}
        />
      )}
    </div>
  );
}

/**
 * The records behind one member's workload: the open tasks on their products and
 * the gate dossiers still missing their signature. Each row opens the thing it
 * names — the task drawer, or the gate at the dossier's own program and line.
 */
function TeamWorkloadDrawer({ member, workload, focus, onClose, onOpenTask, onOpenGate }) {
  const [tab, setTab] = useState(focus === 'signOffs' ? 'signOffs' : 'tasks');
  const tabs = [
    { id: 'tasks', label: 'Open tasks', count: workload.openTasks.length },
    { id: 'signOffs', label: 'Signatures owed', count: workload.signOffs.length }
  ];
  const items = tab === 'tasks' ? workload.openTasks : workload.signOffs;

  // The soonest deadline in the list and how many signatures share that line and
  // date: the number that actually holds a build, as opposed to a total count.
  const nextDeadline = useMemo(() => {
    const dated = workload.signOffs.filter((item) => item.dueIso);
    if (dated.length === 0) return null;
    const first = dated[0];
    const count = dated.filter(
      (item) =>
        item.dueIso === first.dueIso && item.projectId === first.projectId && item.lineKey === first.lineKey
    ).length;
    return { first, count, daysLeft: diffDaysIso(todayIso(), first.dueIso) };
  }, [workload.signOffs]);

  return (
    <div className="fixed inset-0 z-50 flex justify-end bg-slate-950/40 backdrop-blur-[1px]">
      <div className="w-full max-w-lg bg-white dark:bg-slate-900 h-full shadow-2xl border-l border-slate-200 dark:border-slate-800 flex flex-col">
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-start justify-between gap-3">
          <div>
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">{member.name}</h3>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
              {member.role} · {workload.load} open item{workload.load === 1 ? '' : 's'} across{' '}
              {workload.lines} line{workload.lines === 1 ? '' : 's'}
            </p>
            {workload.externalPrograms.length > 0 && (
              <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">
                Outside this workspace: {workload.externalPrograms.join(', ')} — kept on file, no lines or
                signatures here.
              </p>
            )}
          </div>
          <button
            type="button"
            onClick={onClose}
            aria-label="Close"
            className="p-1.5 rounded-lg text-slate-400 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
          >
            <X className="w-4 h-4" />
          </button>
        </div>

        <div className="px-5 pt-3 flex flex-wrap items-center gap-1.5">
          {tabs.map((item) => (
            <button
              key={item.id}
              type="button"
              onClick={() => setTab(item.id)}
              className={`px-3 py-1.5 rounded-lg text-[11px] font-semibold border transition-colors ${
                tab === item.id
                  ? 'bg-slate-900 dark:bg-slate-700 text-white border-slate-900 dark:border-slate-700'
                  : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'
              }`}
            >
              {item.label} ({item.count})
            </button>
          ))}
        </div>

        <div className="flex-1 overflow-y-auto px-5 py-3 space-y-2 text-xs">
          {tab === 'signOffs' && nextDeadline && (
            <div
              className={`px-3 py-2 rounded-lg border text-[11px] font-semibold ${
                nextDeadline.daysLeft < 0
                  ? 'border-rose-300 dark:border-rose-800 bg-rose-50 dark:bg-rose-950 text-rose-800 dark:text-rose-200'
                  : 'border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200'
              }`}
            >
              {nextDeadline.count} signature{nextDeadline.count === 1 ? '' : 's'} blocking{' '}
              {nextDeadline.first.projectModel} · {nextDeadline.first.lineKey},{' '}
              <span className="tabular-nums">
                {nextDeadline.first.gateStatus || 'Pending'} {formatMonthDay(nextDeadline.first.dueIso)}
              </span>
              <div className="font-normal mt-0.5">
                {nextDeadline.daysLeft < 0
                  ? `${Math.abs(nextDeadline.daysLeft)} day${Math.abs(nextDeadline.daysLeft) === 1 ? '' : 's'} past the plan date`
                  : `${nextDeadline.daysLeft} day${nextDeadline.daysLeft === 1 ? '' : 's'} left in the plan`}
              </div>
            </div>
          )}

          {items.length === 0 ? (
            <p className="py-8 text-center text-slate-400 dark:text-slate-500">
              {tab === 'tasks'
                ? 'No open tasks assigned to this member.'
                : 'No signatures outstanding for this member.'}
            </p>
          ) : (
            items.map((item, index) =>
              tab === 'tasks' ? (
                <button
                  key={`${item.id}-${index}`}
                  type="button"
                  onClick={() => onOpenTask(item.id)}
                  className="w-full text-left p-3 rounded-lg border border-slate-200 dark:border-slate-800 hover:border-blue-300 dark:hover:border-blue-800 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors flex items-start gap-2"
                >
                  <div className="flex-1 min-w-0">
                    <div className="text-[10px] font-mono font-bold text-slate-500 dark:text-slate-400">
                      {item.id} · {item.projectModel}
                      {item.gateCode ? ` · ${item.gateCode} ${item.gateShort}` : ''}
                    </div>
                    <div className="font-semibold text-slate-800 dark:text-slate-100 leading-snug mt-0.5">
                      {item.title}
                    </div>
                    <div className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">
                      Due {item.dueDate || '—'}
                    </div>
                  </div>
                  <StatusBadge status={item.status} />
                  <ChevronRight className="w-3.5 h-3.5 shrink-0 text-slate-300 dark:text-slate-600" />
                </button>
              ) : (
                <button
                  key={`${item.projectId}-${item.lineKey}-${item.gateId}-${index}`}
                  type="button"
                  onClick={() => onOpenGate(item.projectId, item.lineKey, item.gateId)}
                  className="w-full text-left p-3 rounded-lg border border-slate-200 dark:border-slate-800 hover:border-blue-300 dark:hover:border-blue-800 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors flex items-start gap-2"
                >
                  <div className="flex-1 min-w-0">
                    <div className="text-[10px] font-mono font-bold text-slate-500 dark:text-slate-400">
                      {item.projectModel} · {item.lineKey}
                    </div>
                    <div className="font-semibold text-slate-800 dark:text-slate-100 leading-snug mt-0.5">
                      {item.gateCode} {item.gateShort}
                    </div>
                    <div
                      className={`text-[10px] mt-0.5 ${
                        item.dueIso && diffDaysIso(todayIso(), item.dueIso) < 0
                          ? 'font-semibold text-rose-600 dark:text-rose-400'
                          : 'text-slate-500 dark:text-slate-400'
                      }`}
                    >
                      {/* The matrix's own prefix + mm/dd, so the same gate reads the
                          same here: Dep. 01/03, Active 12/28, Pending 12/05. */}
                      <span className="font-semibold tabular-nums">
                        {item.dueIso
                          ? `${item.gateStatus || 'Pending'} ${formatMonthDay(item.dueIso)}`
                          : 'No plan date'}
                      </span>
                      {item.dueIso && (
                        <span className="ml-1 tabular-nums opacity-90">
                          {diffDaysIso(todayIso(), item.dueIso) < 0
                            ? `· ${Math.abs(diffDaysIso(todayIso(), item.dueIso))}d overdue`
                            : diffDaysIso(todayIso(), item.dueIso) === 0
                              ? '· due today'
                              : `· ${diffDaysIso(todayIso(), item.dueIso)}d left`}
                        </span>
                      )}
                      {' · '}
                      {item.decision === 'Rejected' ? 'rejected — must be re-signed' : 'awaiting the signature'}
                    </div>
                  </div>
                  <StatusBadge status={item.decision} />
                  <ChevronRight className="w-3.5 h-3.5 shrink-0 text-slate-300 dark:text-slate-600" />
                </button>
              )
            )
          )}
        </div>

        <div className="px-5 py-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-[10px] text-slate-500 dark:text-slate-400">
          Counted from the live plan, never stored on the member: each signature carries the date its line's gate
          sequence needs it by, and the list runs closest deadline first. A member with no product assignment is
          measured across the whole portfolio.
        </div>
      </div>
    </div>
  );
}

function TeamMemberModal({ member, members, projects = [], onClose, onSubmit }) {
  // Only real assignments are offered — a program model, or a family that covers
  // every program in it. Anything else on file stays visible instead of being
  // dropped behind the user's back: a typo as a flagged product, a program this
  // workspace does not run in the dashed list.
  const models = programModels(projects);
  const families = programFamilies(projects);
  const programChoices = [...models, ...families];
  const namesProgram = (product) =>
    programChoices.some((choice) => normalizeProductKey(choice) === normalizeProductKey(product));

  const [form, setForm] = useState(() => {
    const products = (member?.products || []).map(String);
    const external = (member?.externalProducts || []).map(String);
    // An outside entry that names a live program is a program assignment;
    // promoting it on open keeps one string from sitting in both states.
    return {
      name: member?.name || '',
      role: member?.role || TEAM_ROLES[0],
      reportsTo: member?.reportsTo || '',
      email: member?.email || '',
      products: Array.from(new Set([...products, ...external.filter(namesProgram)])),
      externalProducts: external.filter((product) => !namesProgram(product))
    };
  });
  const [externalDraft, setExternalDraft] = useState('');
  const [error, setError] = useState('');

  const unmatched = unmatchedProducts(form.products, projects);

  const toggleProduct = (model) => {
    const key = normalizeProductKey(model);
    const selected = form.products.some((product) => normalizeProductKey(product) === key);
    setForm({
      ...form,
      products: selected
        ? form.products.filter((product) => normalizeProductKey(product) !== key)
        : [...form.products, model]
    });
  };

  // Removes every spelling of one product, so the warning cannot survive a click
  // because the stored string was padded or differently cased.
  const removeProduct = (product) => {
    const key = normalizeProductKey(product);
    setForm({ ...form, products: form.products.filter((entry) => normalizeProductKey(entry) !== key) });
  };

  const removeExternalProduct = (product) => {
    const key = normalizeProductKey(product);
    setForm({
      ...form,
      externalProducts: form.externalProducts.filter((entry) => normalizeProductKey(entry) !== key)
    });
  };

  // A program outside this workspace is typed, not picked. If what was typed is
  // actually a live model or family, it is selected as one instead of being filed
  // as outside — the two lists can never hold the same program.
  const addExternalProduct = () => {
    const value = externalDraft.trim();
    if (!value) return;
    const key = normalizeProductKey(value);
    const known = programChoices.find((choice) => normalizeProductKey(choice) === key);
    if (known) {
      if (!form.products.some((entry) => normalizeProductKey(entry) === key)) {
        setForm({ ...form, products: [...form.products, known] });
      }
    } else if (!form.externalProducts.some((entry) => normalizeProductKey(entry) === key)) {
      setForm({ ...form, externalProducts: [...form.externalProducts, value] });
    }
    setExternalDraft('');
  };

  const productChip = (product) => {
    const selected = form.products.some(
      (entry) => normalizeProductKey(entry) === normalizeProductKey(product)
    );
    return (
      <button
        key={product}
        type="button"
        aria-pressed={selected}
        onClick={() => toggleProduct(product)}
        className={`px-2 py-1 rounded-md border text-[11px] font-semibold transition-colors ${
          selected
            ? 'bg-blue-600 border-blue-600 text-white'
            : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-400 dark:hover:border-blue-700'
        }`}
      >
        {product}
      </button>
    );
  };

  const handleSubmit = (event) => {
    event.preventDefault();
    const name = form.name.trim();
    if (!name) {
      setError('Enter the member name.');
      return;
    }
    const email = form.email.trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setError('Enter a full email address, e.g. name@minebea.co.th');
      return;
    }
    onSubmit({
      name,
      role: form.role,
      reportsTo: form.reportsTo,
      email,
      // A picked model keeps the program's own spelling; a leftover string is
      // kept as typed until someone removes it.
      products: distinctProductStrings(
        form.products.map((product) => {
          const match = programChoices.find((choice) => normalizeProductKey(choice) === normalizeProductKey(product));
          return match || product;
        })
      ),
      externalProducts: distinctProductStrings(form.externalProducts)
    });
  };

  const managerOptions = members.filter((m) => !member || m.id !== member.id);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-[1px]">
      <form
        onSubmit={handleSubmit}
        className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs"
      >
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div>
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">
              {member ? `Edit ${member.name}` : 'Add Team Member'}
            </h3>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
              Who is on the program, which products they carry and how to reach them.
            </p>
          </div>
          <button
            type="button"
            onClick={onClose}
            aria-label="Close"
            className="text-slate-400 dark:text-slate-400 hover:text-slate-600 dark:hover:text-slate-400"
          >
            <X className="w-4 h-4" />
          </button>
        </div>

        <div className="p-5 space-y-3.5">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Name</label>
              <input
                type="text"
                required
                value={form.name}
                onChange={(e) => setForm({ ...form, name: e.target.value })}
                placeholder="e.g. Patcharapong"
                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 focus:outline-none focus:border-blue-500"
              />
            </div>
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Role</label>
              <select
                value={form.role}
                onChange={(e) => setForm({ ...form, role: e.target.value })}
                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 focus:outline-none focus:border-blue-500"
              >
                {TEAM_ROLES.map((role) => (
                  <option key={role} value={role}>
                    {role}
                  </option>
                ))}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Email</label>
              <input
                type="email"
                value={form.email}
                onChange={(e) => setForm({ ...form, email: e.target.value })}
                placeholder="name@minebea.co.th"
                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 focus:outline-none focus:border-blue-500"
              />
            </div>
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Reports to</label>
              <select
                value={form.reportsTo}
                onChange={(e) => setForm({ ...form, reportsTo: e.target.value })}
                className="w-full px-3 py-2 border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 focus:outline-none focus:border-blue-500"
              >
                <option value="">— None —</option>
                {managerOptions.map((manager) => (
                  <option key={manager.id} value={manager.id}>
                    {manager.name} · {manager.role}
                  </option>
                ))}
              </select>
            </div>
          </div>

          <div>
            <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">
              Product assignment
            </label>
            <div className="p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 space-y-1.5">
              {programChoices.length === 0 ? (
                <span className="text-[10px] text-slate-500 dark:text-slate-400">
                  No NPI program exists yet — every member is portfolio-wide until one is created.
                </span>
              ) : (
                <>
                  {models.length > 0 && (
                    <div className="space-y-1">
                      <div className="text-[9px] uppercase tracking-wider text-slate-400 dark:text-slate-500">
                        Programs
                      </div>
                      <div className="flex flex-wrap gap-1.5">{models.map(productChip)}</div>
                    </div>
                  )}
                  {families.length > 0 && (
                    <div className="space-y-1">
                      <div className="text-[9px] uppercase tracking-wider text-slate-400 dark:text-slate-500">
                        Families
                      </div>
                      <div className="flex flex-wrap gap-1.5">{families.map(productChip)}</div>
                    </div>
                  )}
                </>
              )}
              <div className="space-y-1 border-t border-slate-200 dark:border-slate-800 pt-1.5">
                <div className="text-[9px] uppercase tracking-wider text-slate-400 dark:text-slate-500">
                  Outside this workspace
                </div>
                <div className="flex flex-wrap items-center gap-1.5">
                  {form.externalProducts.length === 0 && (
                    <span className="text-[10px] text-slate-400 dark:text-slate-500">None</span>
                  )}
                  {form.externalProducts.map((product) => (
                    <span
                      key={`external-${product}`}
                      className="inline-flex items-center gap-1 px-2 py-1 rounded-md border border-dashed border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-[11px] font-semibold text-slate-500 dark:text-slate-400"
                    >
                      {product}
                      <button
                        type="button"
                        onClick={() => removeExternalProduct(product)}
                        aria-label={`Remove ${product}`}
                        className="text-slate-400 hover:text-rose-600 dark:hover:text-rose-400"
                      >
                        <X className="w-2.5 h-2.5" />
                      </button>
                    </span>
                  ))}
                  <input
                    type="text"
                    value={externalDraft}
                    onChange={(e) => setExternalDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        addExternalProduct();
                      }
                    }}
                    placeholder="e.g. X3439"
                    aria-label="Add a program outside this workspace"
                    className="w-28 px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-[11px] focus:outline-none focus:border-blue-500"
                  />
                  <button
                    type="button"
                    onClick={addExternalProduct}
                    className="px-2 py-1 rounded-md border border-slate-200 dark:border-slate-700 text-[11px] font-semibold text-slate-600 dark:text-slate-300 hover:border-blue-400 dark:hover:border-blue-700"
                  >
                    Add
                  </button>
                </div>
              </div>
            </div>
            <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">
              A program model or a family covers its lines. A program this workspace does not run belongs in the
              dashed list: it stays on file and covers nothing here. Leave both lists empty for a portfolio-wide
              role — workload then counts every program.
            </p>

            {unmatched.length > 0 && (
              <div
                role="alert"
                className="mt-2 px-2.5 py-2 rounded-lg border border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950 text-[10px] text-amber-800 dark:text-amber-200 space-y-1"
              >
                <div className="flex items-start gap-1.5 font-semibold">
                  <AlertTriangle className="w-3.5 h-3.5 shrink-0 mt-0.5" />
                  <span>
                    No program uses {unmatched.join(', ')}. On file it matches nothing, so it adds no lines or tasks
                    to this member's workload.
                  </span>
                </div>
                <div className="flex flex-wrap gap-1 pl-5">
                  {unmatched.map((product) => (
                    <button
                      key={product}
                      type="button"
                      onClick={() => removeProduct(product)}
                      className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-amber-400 dark:border-amber-700 hover:bg-amber-100 dark:hover:bg-amber-900"
                    >
                      Remove {product}
                      <X className="w-2.5 h-2.5" />
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {error && <p className="text-[11px] font-semibold text-rose-600 dark:text-rose-400">{error}</p>}
        </div>

        <div className="px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
          <button
            type="button"
            onClick={onClose}
            className="px-3.5 py-2 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
          >
            Cancel
          </button>
          <button type="submit" className="px-4 py-2 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-700">
            {member ? 'Save changes' : 'Add member'}
          </button>
        </div>
      </form>
    </div>
  );
}

function DeleteTeamMemberModal({ member, reports, workload, onClose, onConfirm }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-[1px]">
      <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs">
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">Remove Team Member</h3>
          <button
            type="button"
            onClick={onClose}
            aria-label="Close"
            className="text-slate-400 dark:text-slate-400 hover:text-slate-600 dark:hover:text-slate-400"
          >
            <X className="w-4 h-4" />
          </button>
        </div>

        <div className="p-5 space-y-3">
          <p className="text-slate-600 dark:text-slate-400 leading-relaxed">
            Remove this member from the team directory? Their tasks, gate dossiers and audit trail stay exactly as
            they are — this only removes the directory entry.
          </p>
          <div className="p-3 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800 space-y-1">
            <div className="font-bold text-slate-900 dark:text-slate-100">
              {member.name} · {member.role}
            </div>
            <div className="text-[11px] text-slate-500 dark:text-slate-400">
              {[
                ...(member.products || []),
                ...memberExternalPrograms(member).map((product) => `${product} (outside this workspace)`)
              ].join(', ') || 'Portfolio-wide'}{' '}
              · workload {workload.load} ({workload.openTasks.length} open tasks,{' '}
              {workload.signOffs.length} signatures owed)
            </div>
            {reports.length > 0 && (
              <div className="text-[11px] text-amber-700 dark:text-amber-300">
                {reports.length} member{reports.length === 1 ? '' : 's'} report to them and move under — None —
              </div>
            )}
          </div>
        </div>

        <div className="px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
          <button
            type="button"
            onClick={onClose}
            className="px-3.5 py-2 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
          >
            Cancel
          </button>
          <button
            type="button"
            onClick={onConfirm}
            className="px-4 py-2 rounded-lg font-semibold bg-rose-600 text-white hover:bg-rose-700"
          >
            Remove member
          </button>
        </div>
      </div>
    </div>
  );
}

</script>
