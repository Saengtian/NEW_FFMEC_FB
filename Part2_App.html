<script type="text/babel" data-presets="react">
// ============================================================================
// MAIN APPLICATION SHELL
// ============================================================================

/**
 * Debounced save scheduling with an explicit flush path. Without flush(), a
 * pending auto-save is cancelled when the tab closes and those edits are lost.
 */
function createSaveScheduler(options) {
  const {
    delayMs = 2500,
    setTimeoutFn = (fn, ms) => setTimeout(fn, ms),
    clearTimeoutFn = (id) => clearTimeout(id),
    send
  } = options;
  let timerId = null;
  let pending = false;
  let pendingArgs = null;

  const cancel = () => {
    if (timerId !== null) clearTimeoutFn(timerId);
    timerId = null;
    pending = false;
    pendingArgs = null;
  };

  const schedule = (sendArgs) => {
    cancel();
    pending = true;
    pendingArgs = sendArgs;
    timerId = setTimeoutFn(() => {
      const args = pendingArgs;
      timerId = null;
      pending = false;
      pendingArgs = null;
      send(...args);
    }, delayMs);
  };

  const flush = (sendArgs) => {
    if (!pending) return false;
    const args = sendArgs || pendingArgs;
    cancel();
    send(...args);
    return true;
  };

  return { schedule, flush, cancel, hasPending: () => pending };
}

/** Toast lifecycle keyed by identity, not message text. */
function createToastController(options) {
  const {
    durationMs = 3600,
    setTimeoutFn = (fn, ms) => setTimeout(fn, ms),
    clearTimeoutFn = (id) => clearTimeout(id),
    onChange
  } = options;
  let nextId = 1;
  let activeId = null;
  let timerId = null;

  return {
    show(message, tone = 'success') {
      if (timerId !== null) clearTimeoutFn(timerId);
      const id = nextId++;
      activeId = id;
      onChange({ id, message, tone });
      timerId = setTimeoutFn(() => {
        timerId = null;
        if (activeId === id) {
          activeId = null;
          onChange(null);
        }
      }, durationMs);
    }
  };
}

/** Interpret a saveWorkspaceState response, including a stale-client conflict. */
function resolveSaveResult(res, currentRevision) {
  if (res && res.ok === false && res.conflict) {
    return { conflict: true, revision: Number(res.revision) || 0, warnings: [] };
  }
  return {
    conflict: false,
    revision: Number(res?.revision) || (Number(currentRevision) || 0) + 1,
    // A committed save can carry warnings (e.g. the sign-off ledger append
    // failed afterwards). They are shown, not treated as a failed save.
    warnings: Array.isArray(res?.warnings) ? res.warnings.map(String).filter(Boolean) : []
  };
}

/**
 * One Global Scope dropdown. Family, model, phase, side and process all render
 * through this component so their sizing, focus ring and light/dark colors can
 * never drift apart again.
 */
function ScopeFilterSelect({ label, ariaLabel, value, options, allLabel, onChange, fullWidthOnMobile = false }) {
  const optionClass = 'bg-white text-slate-900 dark:bg-slate-900 dark:text-slate-100';
  return (
    <div
      className={`inline-flex min-w-0 items-center gap-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-2 py-1 shadow-2xs ${
        fullWidthOnMobile ? 'col-span-2 w-full sm:col-auto sm:w-auto' : ''
      }`}
    >
      <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">{label}</span>
      <select
        aria-label={ariaLabel}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className="w-full max-w-none cursor-pointer bg-transparent pr-1 text-xs font-bold text-slate-900 focus:outline-none dark:text-slate-100 sm:w-auto sm:max-w-[11rem]"
      >
        <option value="ALL" className={optionClass}>
          {allLabel} ({options.length})
        </option>
        {options.map((option) => (
          <option key={option} value={option} className={optionClass}>
            {option}
          </option>
        ))}
      </select>
    </div>
  );
}

function App() {
  const [activeView, setActiveView] = useState('overview');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // Theme is applied to <html> by the bootstrap script in Index.html before paint;
  // this state only mirrors it so the toggle icon matches.
  const [theme, setTheme] = useState(() =>
    typeof document !== 'undefined' && document.documentElement.classList.contains('dark') ? 'dark' : 'light'
  );

  const toggleTheme = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.classList.toggle('dark', next === 'dark');
    try {
      localStorage.setItem('ffm-theme', next);
    } catch (e) {}
    setTheme(next);
  };

  const [projects, setProjects] = useState(INITIAL_PROJECTS);
  const [tasks, setTasks] = useState(() => INITIAL_TASKS.map(normalizeTask));
  const [gateRecords, setGateRecords] = useState(() => createInitialGateRecords());
  const [productionRecords, setProductionRecords] = useState(INITIAL_PRODUCTION_RECORDS);
  const [masterSpecs, setMasterSpecs] = useState(INITIAL_MASTER_SPECS);
  const [cpkRecords, setCpkRecords] = useState(() =>
    migrateCpkRecords(INITIAL_CPK_RECORDS, INITIAL_MASTER_SPECS)
  );
  const [costProjects, setCostProjects] = useState(INITIAL_COST_PROJECTS);
  const [customerFeedback, setCustomerFeedback] = useState(INITIAL_CUSTOMER_FEEDBACK);
  const [teamMembers, setTeamMembers] = useState(INITIAL_TEAM_MEMBERS);
  const [selectedProjectId, setSelectedProjectId] = useState('PRJ-X4151');
  const [selectedGateId, setSelectedGateId] = useState('mbo');
  const [selectedLineKey, setSelectedLineKey] = useState('ME11-RHS');
  const [selectedLineKeys, setSelectedLineKeys] = useState(['ME11-RHS']);

  // Global Top-Header Dependency Filter Scope (Family <-> Model <-> Phase <-> Side)
  const [globalFamily, setGlobalFamily] = useState('ALL');
  const [globalModel, setGlobalModel] = useState('ALL');
  const [globalPhase, setGlobalPhase] = useState('ALL');
  const [globalProcess, setGlobalProcess] = useState('ALL');
  const [globalSide, setGlobalSide] = useState('ALL');

  const [activeTaskDrawerId, setActiveTaskDrawerId] = useState(null);
  const [newProjectModalOpen, setNewProjectModalOpen] = useState(false);
  const [editingProject, setEditingProject] = useState(null);
  const [deletingProject, setDeletingProject] = useState(null);
  const [newTaskModalOpen, setNewTaskModalOpen] = useState(false);
  const [newProdRecordModalOpen, setNewProdRecordModalOpen] = useState(false);
  const [editingProdRecord, setEditingProdRecord] = useState(null);
  const [deletingProdRecord, setDeletingProdRecord] = useState(null);
  const [matrixModalState, setMatrixModalState] = useState(null);
  const [deletingMatrixRow, setDeletingMatrixRow] = useState(null);
  const [scheduleOverrides, setScheduleOverrides] = useState({});
  const [editingScheduleTarget, setEditingScheduleTarget] = useState(null);
  const [activeCpkChartRecord, setActiveCpkChartRecord] = useState(null);
  const [editingMasterSpec, setEditingMasterSpec] = useState(null);
  const [newMasterSpecModalOpen, setNewMasterSpecModalOpen] = useState(false);
  const [cpkImportModalOpen, setCpkImportModalOpen] = useState(false);
  const [cpkUploadHistory, setCpkUploadHistory] = useState([]);
  const [lastUploadBatch, setLastUploadBatch] = useState(null);
  const [newCostModalOpen, setNewCostModalOpen] = useState(false);
  const [editingCostProject, setEditingCostProject] = useState(null);
  const [deletingCostProject, setDeletingCostProject] = useState(null);
  const [newFeedbackModalOpen, setNewFeedbackModalOpen] = useState(false);
  const [editingFeedback, setEditingFeedback] = useState(null);
  const [deletingFeedback, setDeletingFeedback] = useState(null);
  const [newTeamMemberModalOpen, setNewTeamMemberModalOpen] = useState(false);
  const [editingTeamMember, setEditingTeamMember] = useState(null);
  const [deletingTeamMember, setDeletingTeamMember] = useState(null);
  const [costImportDraft, setCostImportDraft] = useState(null);
  const [feedbackImportDraft, setFeedbackImportDraft] = useState(null);
  const [syncConflict, setSyncConflict] = useState(null);
  const [stateHistory, setStateHistory] = useState(null);
  const [specCorrection, setSpecCorrection] = useState(null);
  const [workspaceExportCopy, setWorkspaceExportCopy] = useState(null);
  const [signOffModal, setSignOffModal] = useState(null);
  const [kpiDrilldown, setKpiDrilldown] = useState(null);
  const [toast, setToast] = useState(null);
  const toastControllerRef = useRef(null);
  if (!toastControllerRef.current) {
    toastControllerRef.current = createToastController({ onChange: (value) => setToast(value) });
  }

  const showToast = (message, tone = 'success') => {
    toastControllerRef.current.show(message, tone);
  };

  // ==========================================================================
  // GOOGLE APPS SCRIPT / GOOGLE SHEETS LIVE CLOUD SYNC ENGINE
  // ==========================================================================
  const isGasEnv = typeof window !== 'undefined' && !!(window.google && window.google.script && window.google.script.run);
  // Real IDs come only from the server-injected config; the local-preview
  // fallback must not duplicate deployment identifiers.
  const serverCfg = (typeof window !== 'undefined' && window.__FFM_GAS_CONFIG__) || {
    spreadsheetId: 'LOCAL_PREVIEW',
    sheetUrl: '',
    webAppUrl: '',
    userEmail: 'local-preview@minebea.co.th'
  };

  const [cloudSync, setCloudSync] = useState({
    status: isGasEnv ? 'loading' : 'local', // loading | synced | saving | error | local
    revision: 0,
    lastSavedAt: null,
    lastSavedBy: null,
    userEmail: serverCfg.userEmail || '',
    sheetUrl: serverCfg.sheetUrl,
    errorMsg: null
  });
  const hasLoadedCloudRef = useRef(false);
  const isHydratingRef = useRef(false);
  const revisionRef = useRef(0);
  const pushRef = useRef(null);
  const saveSchedulerRef = useRef(null);
  const restoreInputRef = useRef(null);
  const syncConflictRef = useRef(null);

  if (!saveSchedulerRef.current) {
    saveSchedulerRef.current = createSaveScheduler({
      delayMs: 2500,
      send: (...args) => { if (pushRef.current) pushRef.current(...args); }
    });
  }

  const buildWorkspacePayload = () => ({
    projects,
    tasks,
    gateRecords,
    productionRecords,
    masterSpecs,
    cpkRecords,
    costProjects,
    customerFeedback,
    teamMembers,
    scheduleOverrides
  });

  const hydrateFromPayload = (data) => {
    if (!data || typeof data !== 'object') return null;
    let frozenLimits = 0;
    let purgedEvidence = 0;
    let removedFabricated = 0;
    isHydratingRef.current = true;
    try {
      if (Array.isArray(data.projects)) setProjects(data.projects);
      if (Array.isArray(data.tasks)) setTasks(data.tasks.map(normalizeTask));
      if (data.gateRecords && typeof data.gateRecords === 'object') {
        // Stored dossiers can still carry Drive links the old seed invented, which
        // open a 404. Drop them here so a save writes the cleaned dossiers back.
        const purged = purgePlaceholderEvidence(data.gateRecords);
        purgedEvidence = purged.removed;
        setGateRecords(purged.records);
      }
      if (Array.isArray(data.productionRecords)) setProductionRecords(data.productionRecords);
      const loadedSpecs = Array.isArray(data.masterSpecs)
        ? applyProvisionalLimitDefaults(data.masterSpecs)
        : null;
      if (loadedSpecs) setMasterSpecs(loadedSpecs);
      if (Array.isArray(data.cpkRecords)) {
        const specsForCpk = loadedSpecs || masterSpecs;
        const frozen = migrateCpkRecords(data.cpkRecords, specsForCpk);
        // Rows saved before limits were frozen stay judged by their own date; the
        // count lets the loader persist this backfill without waiting for an edit.
        frozenLimits = frozen.reduce(
          (count, rec, idx) => count + (rec !== data.cpkRecords[idx] ? 1 : 0),
          0
        );
        const cleanedCpk = stripLegacyFabricatedCpkRows(frozen);
        removedFabricated = frozen.length - cleanedCpk.length;
        setCpkRecords(backfillSeedCpkSamples(cleanedCpk));
      }
      if (Array.isArray(data.costProjects)) setCostProjects(data.costProjects);
      if (Array.isArray(data.customerFeedback)) setCustomerFeedback(data.customerFeedback);
      if (Array.isArray(data.teamMembers)) setTeamMembers(data.teamMembers);
      if (data.scheduleOverrides && typeof data.scheduleOverrides === 'object') setScheduleOverrides(data.scheduleOverrides);
    } catch (err) {
      console.error('hydrateFromPayload failed:', err);
      showToast('Failed to apply loaded data: ' + (err && err.message ? err.message : String(err)), 'error');
      isHydratingRef.current = false;
      return;
    }
    setTimeout(() => {
      isHydratingRef.current = false;
    }, 150);
    return { frozenLimits, purgedEvidence, removedFabricated };
  };

  // ---------------------------------------------------------------------------
  // Save conflict: another user saved first. Local edits are kept in the browser
  // and nothing is reloaded over them until the user picks a version.
  // ---------------------------------------------------------------------------
  const updateSyncConflict = (next) => {
    const value = typeof next === 'function' ? next(syncConflictRef.current) : next;
    syncConflictRef.current = value;
    setSyncConflict(value);
  };

  const openSyncConflict = (revision) => {
    saveSchedulerRef.current.cancel();
    setCloudSync((prev) => ({
      ...prev,
      status: 'error',
      revision,
      errorMsg: `Save conflict: another user saved Rev #${revision}. Your edits are still here — choose which version to keep.`
    }));
    updateSyncConflict({ revision, remote: null, remoteMeta: null, loading: isGasEnv, error: null });
    showToast(`Another user saved Rev #${revision}. Your edits were kept — resolve the conflict.`, 'error');
    if (!isGasEnv) return;
    // Read their copy without applying it: only the explicit choice applies it.
    window.google.script.run
      .withSuccessHandler((res) => {
        updateSyncConflict((prev) => {
          if (!prev) return prev;
          if (res && res.initialized && res.data) {
            return {
              ...prev,
              revision: Number(res.revision) || prev.revision,
              remote: res.data,
              remoteMeta: { lastSavedBy: res.lastSavedBy || null, lastSavedAt: res.lastSavedAt || null },
              loading: false,
              error: null
            };
          }
          return { ...prev, loading: false, error: res?.error || 'the saved copy could not be read' };
        });
      })
      .withFailureHandler((err) => {
        const msg = err && err.message ? err.message : String(err || 'the saved copy could not be read');
        updateSyncConflict((prev) => (prev ? { ...prev, loading: false, error: msg } : prev));
      })
      .loadWorkspaceState();
  };

  // Options: toast (announce success), refreshMirrors (explicit saves rebuild
  // the server's derived reporting tabs; autosaves never do), expectedRevision
  // (defaults to the loaded revision), payload (restores pass the parsed backup,
  // because state has not re-rendered yet).
  const pushToGoogleSheet = (summaryText = 'Auto-sync from FFM NPI Ops', { toast = false, refreshMirrors = false, expectedRevision: expectedRevisionOption, payload } = {}) => {
    if (!isGasEnv) {
      if (toast) showToast('Running in Local Preview mode (deploy to GAS for Google Sheets sync).', 'info');
      return;
    }
    if (syncConflictRef.current && expectedRevisionOption === undefined) {
      if (toast) showToast('Resolve the save conflict first — your edits are still in the browser.', 'info');
      return;
    }
    setCloudSync((prev) => ({ ...prev, status: 'saving', errorMsg: null }));
    const payloadJson = JSON.stringify(payload || buildWorkspacePayload());
    const expectedRevision = expectedRevisionOption !== undefined ? expectedRevisionOption : revisionRef.current;
    window.google.script.run
      .withSuccessHandler((res) => {
        const outcome = resolveSaveResult(res, revisionRef.current);
        if (outcome.conflict) {
          openSyncConflict(outcome.revision);
          return;
        }
        revisionRef.current = outcome.revision;
        setCloudSync((prev) => ({
          ...prev,
          status: 'synced',
          revision: outcome.revision,
          lastSavedAt: res?.lastSavedAt || new Date().toISOString(),
          lastSavedBy: res?.lastSavedBy || prev.userEmail,
          userEmail: res?.userEmail || prev.userEmail,
          errorMsg: outcome.warnings.length ? outcome.warnings.join(' ') : null
        }));
        if (outcome.warnings.length) {
          showToast(outcome.warnings[0], 'error');
        } else if (toast) {
          showToast(`Synced to Google Sheet (Rev #${outcome.revision})`, 'success');
        }
      })
      .withFailureHandler((err) => {
        const msg = (err && err.message) ? err.message : String(err || 'Sync failed');
        setCloudSync((prev) => ({ ...prev, status: 'error', errorMsg: msg }));
        showToast(`Sheet sync error: ${msg}`, 'error');
      })
      .saveWorkspaceState(payloadJson, summaryText, expectedRevision, refreshMirrors);
  };
  pushRef.current = pushToGoogleSheet;

  const handleConflictKeepLocal = () => {
    const conflict = syncConflictRef.current;
    if (!conflict) return;
    updateSyncConflict(null);
    showToast(`Keeping your version — saving it over Rev #${conflict.revision}.`, 'info');
    pushToGoogleSheet('Conflict resolved: kept local edits', {
      toast: true,
      refreshMirrors: true,
      expectedRevision: conflict.revision
    });
  };

  const handleConflictUseRemote = () => {
    const conflict = syncConflictRef.current;
    if (!conflict || !conflict.remote) return;
    hydrateFromPayload(conflict.remote);
    revisionRef.current = conflict.revision;
    setCloudSync((prev) => ({
      ...prev,
      status: 'synced',
      revision: conflict.revision,
      lastSavedBy: conflict.remoteMeta?.lastSavedBy || prev.lastSavedBy,
      lastSavedAt: conflict.remoteMeta?.lastSavedAt || prev.lastSavedAt,
      errorMsg: null
    }));
    updateSyncConflict(null);
    showToast(`Loaded the other user's version (Rev #${conflict.revision}).`, 'info');
  };

  // ---------------------------------------------------------------------------
  // State history: every save archives the copy it replaced. Restoring one loads
  // it and saves it as the next revision, so the state being replaced stays in
  // the history too.
  // ---------------------------------------------------------------------------
  const closeStateHistory = () => setStateHistory(null);

  const openStateHistory = () => {
    if (!isGasEnv) {
      showToast('State history is available once the app is deployed to Google Sheets.', 'info');
      return;
    }
    setStateHistory({
      loading: true,
      error: null,
      limit: 5,
      current: null,
      revisions: [],
      selected: null,
      data: null,
      meta: null,
      loadingRevision: false,
      restoring: false
    });
    window.google.script.run
      .withSuccessHandler((res) => {
        setStateHistory((prev) =>
          prev
            ? {
                ...prev,
                loading: false,
                limit: Number(res?.limit) || 5,
                current: res?.current || null,
                revisions: Array.isArray(res?.revisions) ? res.revisions : [],
                error: res && res.ok === false ? res.error || 'The saved history could not be read.' : null
              }
            : prev
        );
      })
      .withFailureHandler((err) => {
        const msg = err && err.message ? err.message : String(err || 'The saved history could not be read');
        setStateHistory((prev) => (prev ? { ...prev, loading: false, error: msg } : prev));
      })
      .listStateRevisions();
  };

  const selectStateHistoryRevision = (revision) => {
    setStateHistory((prev) =>
      prev ? { ...prev, selected: revision, data: null, meta: null, loadingRevision: true, error: null } : prev
    );
    window.google.script.run
      .withSuccessHandler((res) => {
        setStateHistory((prev) => {
          if (!prev || prev.selected !== revision) return prev;
          if (!res || res.ok === false) {
            return { ...prev, loadingRevision: false, error: (res && res.error) || 'That revision could not be read.' };
          }
          return {
            ...prev,
            loadingRevision: false,
            data: res.data || null,
            meta: { lastSavedAt: res.lastSavedAt || null, lastSavedBy: res.lastSavedBy || null }
          };
        });
      })
      .withFailureHandler((err) => {
        const msg = err && err.message ? err.message : String(err || 'That revision could not be read');
        setStateHistory((prev) =>
          prev && prev.selected === revision ? { ...prev, loadingRevision: false, error: msg } : prev
        );
      })
      .loadStateRevision(revision);
  };

  const restoreStateHistoryRevision = (revision) => {
    const panel = stateHistory;
    if (!panel || !panel.data) return;
    if (syncConflictRef.current) {
      showToast('Resolve the save conflict before restoring a revision.', 'info');
      return;
    }
    setStateHistory((prev) => (prev ? { ...prev, restoring: true, error: null } : prev));
    // Keep any slice the old copy does not carry, then freeze Cpk limits exactly
    // as a normal load would, so the save and the screen agree.
    const restored = { ...buildWorkspacePayload(), ...panel.data };
    if (Array.isArray(restored.cpkRecords)) {
      restored.cpkRecords = migrateCpkRecords(restored.cpkRecords, restored.masterSpecs || masterSpecs);
    }
    hydrateFromPayload(restored);
    pushToGoogleSheet(`Restored Rev #${revision} from state history`, {
      toast: true,
      refreshMirrors: true,
      expectedRevision: revisionRef.current,
      payload: restored
    });
    setStateHistory(null);
  };

  const loadFromGoogleSheet = (showNotice = false) => {
    if (!isGasEnv) return;
    setCloudSync((prev) => ({ ...prev, status: 'loading', errorMsg: null }));
    window.google.script.run
      .withSuccessHandler((res) => {
        if (res && res.corrupted) {
          hasLoadedCloudRef.current = true;
          setCloudSync((prev) => ({
            ...prev,
            status: 'error',
            revision: res.revision || 0,
            errorMsg: res.error || 'Stored workspace data is invalid.'
          }));
          showToast(res.error || 'Stored workspace data is invalid. Sync paused.', 'error');
          return;
        }
        if (res && res.initialized && res.data) {
          let backfill = { frozenLimits: 0, purgedEvidence: 0, removedFabricated: 0 };
          try {
            backfill = hydrateFromPayload(res.data) || backfill;
          } catch (err) {
            console.error('hydrateFromPayload threw:', err);
            showToast('Failed to apply loaded data: ' + (err && err.message ? err.message : String(err)), 'error');
          }
          hasLoadedCloudRef.current = true;
          revisionRef.current = res.revision || 1;
          setCloudSync((prev) => ({
            ...prev,
            status: 'synced',
            revision: res.revision || 1,
            lastSavedAt: res.lastSavedAt || null,
            lastSavedBy: res.lastSavedBy || null,
            userEmail: res.userEmail || prev.userEmail,
            sheetUrl: res.sheetUrl || prev.sheetUrl,
            errorMsg: null
          }));
          // A loaded copy that needed cleaning is saved back without waiting for
          // an edit, so the next reader never sees the stale rows.
          const backfillNotes = [];
          if (backfill.frozenLimits > 0) {
            backfillNotes.push(`Froze measurement-time Cpk limits on ${backfill.frozenLimits} record(s)`);
          }
          if (backfill.purgedEvidence > 0) {
            backfillNotes.push(`Removed ${backfill.purgedEvidence} placeholder Drive link(s)`);
          }
          if (backfill.removedFabricated > 0) {
            backfillNotes.push(`Removed ${backfill.removedFabricated} fabricated Cpk seed row(s)`);
          }
          if (backfillNotes.length > 0) saveSchedulerRef.current.schedule(backfillNotes);
          if (showNotice) showToast(`Reloaded workspace from Google Sheet (Rev #${res.revision || 1})`, 'success');
        } else {
          // First run on an empty Sheet: seed baseline data automatically
          hasLoadedCloudRef.current = true;
          setCloudSync((prev) => ({
            ...prev,
            status: 'saving',
            userEmail: res?.userEmail || prev.userEmail,
            sheetUrl: res?.sheetUrl || prev.sheetUrl
          }));
          const seedPayload = JSON.stringify(buildWorkspacePayload());
          window.google.script.run
            .withSuccessHandler((seedRes) => {
              revisionRef.current = seedRes?.revision || 1;
              setCloudSync((prev) => ({
                ...prev,
                status: 'synced',
                revision: seedRes?.revision || 1,
                lastSavedAt: seedRes?.lastSavedAt || new Date().toISOString(),
                lastSavedBy: seedRes?.lastSavedBy || prev.userEmail,
                errorMsg: null
              }));
              showToast('Initialized Google Sheet database with FFM NPI baseline.', 'success');
            })
            .withFailureHandler((err) => {
              const msg = (err && err.message) ? err.message : String(err || 'Init failed');
              setCloudSync((prev) => ({ ...prev, status: 'error', errorMsg: msg }));
              showToast(`Sheet initialization error: ${msg}`, 'error');
            })
            .initializeDatabase(seedPayload);
        }
      })
      .withFailureHandler((err) => {
        hasLoadedCloudRef.current = true;
        const msg = (err && err.message) ? err.message : String(err || 'Load failed');
        setCloudSync((prev) => ({ ...prev, status: 'error', errorMsg: msg }));
        showToast(`Failed to load from Google Sheet: ${msg}`, 'error');
      })
      .loadWorkspaceState();
  };

  // Load workspace from Google Sheets on initial mount
  useEffect(() => {
    if (isGasEnv) {
      loadFromGoogleSheet(false);
    }
  }, []);

  const buildWorkspaceExport = () => ({

        throw new Error('this browser exposes no clipboard API');

      await navigator.clipboard.writeText(json);

        const parsed = JSON.parse(String(ev.target?.result || '{}'));
        const payload = parsed.data || parsed;
        if (!payload.projects || !Array.isArray(payload.projects)) {

  const syncGateSelectionToScope = (nextFamily, nextModel, nextSide) => {

  const handleGlobalFamilyChange = (nextFamily) => {

    const validModels = new Set(familyEntries.map((item) => item.model));
    const validPhases = new Set(familyEntries.map((item) => item.phase));
    const validSides = new Set();
    familyEntries.forEach((item) => item.sides.forEach((s) => validSides.add(s)));

    let resolvedModel = globalModel;
    let resolvedSide = globalSide;
    if (globalModel !== 'ALL' && !validModels.has(globalModel)) {
      resolvedModel = 'ALL';
      setGlobalModel('ALL');
    }
    if (globalPhase !== 'ALL' && !validPhases.has(globalPhase)) {
      setGlobalPhase('ALL');
    }
    if (globalSide !== 'ALL' && !validSides.has(globalSide)) {
      resolvedSide = 'ALL';
      setGlobalSide('ALL');
    }
    syncGateSelectionToScope(nextFamily, resolvedModel, resolvedSide);
  };

  const handleGlobalModelChange = (nextModel) => {
    setGlobalModel(nextModel);
    if (nextModel === 'ALL') {
      syncGateSelectionToScope(globalFamily, 'ALL', globalSide);
      return;
    }

    const modelEntries = scopeCatalog.filter((item) => item.model === nextModel);
    const validFamilies = new Set(modelEntries.map((item) => item.family));
    const validPhases = new Set(modelEntries.map((item) => item.phase));
    const validSides = new Set();
    modelEntries.forEach((item) => item.sides.forEach((s) => validSides.add(s)));

    let resolvedSide = globalSide;
    if (globalFamily !== 'ALL' && !validFamilies.has(globalFamily)) {

      setGlobalFamily('ALL');

      setGlobalSide('ALL');

    const validFamilies = new Set(phaseEntries.map((item) => item.family));
    const validModels = new Set(phaseEntries.map((item) => item.model));
    const validSides = new Set();
    phaseEntries.forEach((item) => item.sides.forEach((s) => validSides.add(s)));

      setGlobalFamily('ALL');

    if (globalModel !== 'ALL' && !validModels.has(globalModel)) {

        if (globalPhase !== 'ALL' && p.phase !== globalPhase) return false;
        if (globalSide !== 'ALL' && !getSideList(p.side).includes(globalSide)) return false;

      })
      .sort((a, b) => {
        const modelCmp = a.model.localeCompare(b.model);

        const pA = PHASE_ORDER.indexOf(a.phase) === -1 ? 99 : PHASE_ORDER.indexOf(a.phase);

      .sort((a, b) => {
        const modelCmp = a.model.localeCompare(b.model);
        if (modelCmp !== 0) return modelCmp;
        const pA = PHASE_ORDER.indexOf(a.phase) === -1 ? 99 : PHASE_ORDER.indexOf(a.phase);
        const pB = PHASE_ORDER.indexOf(b.phase) === -1 ? 99 : PHASE_ORDER.indexOf(b.phase);

  const handleSaveBuildMatrixRow = (projectId, originalRow, form) => {

    const nextRow = {

      side: cleanSide,

    };

    const oldKey = originalRow ? `${originalRow.config}-${originalRow.side || 'RHS'}` : null;
    const newKey = `${cleanConfig}-${cleanSide}`;
    const isEditing = Boolean(originalRow);

    setProjects((prev) =>
      prev.map((p) => {
        if (p.id !== projectId) return p;
        const exists = p.buildMatrix.some(
          (r) => `${r.config}-${r.side || 'RHS'}` === oldKey
        );
        const updatedMatrix =
          isEditing && exists
            ? p.buildMatrix.map((r) =>
                `${r.config}-${r.side || 'RHS'}` === oldKey ? nextRow : r
              )
            : [...p.buildMatrix, nextRow];
        return { ...p, buildMatrix: updatedMatrix };
      })
    );

    // Sync Gate Sign-Off dossier for this specific Config x Side line
    setGateRecords((prev) => {
      const projLines = { ...(prev[projectId] || {}) };
      const currentGateIdx = Math.max(
        0,
        NPI_GATES.findIndex((g) => g.id === project.currentGateId)
      );

      if (isEditing && oldKey && oldKey !== newKey && projLines[oldKey]) {
        projLines[newKey] = projLines[oldKey];
        delete projLines[oldKey];
      } else if (!projLines[newKey]) {
        const variant = {
          key: newKey,
          config: cleanConfig,
          side: cleanSide,
          apnRev: nextRow.apnRev,
          code7E: nextRow.code7E,
          vendors: nextRow.vendors,
          qty: nextRow.total
        };
        const gMap = {};
        NPI_GATES.forEach((g, idx) => {
          const st =
            idx < currentGateIdx ? 'Approved' : idx === currentGateIdx ? 'In Review' : 'Pending';
          gMap[g.id] = createSingleGateDossier(
            project,
            g,
            variant,
            st,
            project.leader,
            project.owner
          );

        projLines[newKey] = gMap;

      return { ...prev, [projectId]: projLines };

  const handleSaveMasterSpec = (form, existingId = null) => {
    const effectiveFrom = String(form.effectiveFrom || todayIso()).slice(0, 10);
    const limits = {
      specType: form.specType || 'two-sided',
      lsl: form.specType === 'upper' ? 0 : Number(form.lsl),

      usl: form.specType === 'lower' ? null : Number(form.usl),

      // Confirming or un-confirming limits is a limit-status change: it is

    };
    const identity = {
      code: form.code.toUpperCase().trim(),
      name: form.name.trim(),
      model: (form.model || '').trim().toUpperCase(),
      station: form.station || PRODUCTION_STATIONS[3],

    if (!existingId) {
      const id = `SPEC-${form.code.toUpperCase().replace(/[^A-Z0-9]/g, '')}-${Date.now().toString().slice(-3)}`;
      const spec = {
        id,
        ...identity,
        ...limits,
        effectiveFrom,
        revisions: [{ id: `${id}-R1`, effectiveFrom, ...limits, updatedAt: stamp, updatedBy: actor }]
      };
      setMasterSpecs((prev) => [...prev, spec]);
      showToast(`Added Master Specification: ${spec.name} (limits effective ${effectiveFrom})`);
      setEditingMasterSpec(null);
      setNewMasterSpecModalOpen(false);
      return;
    }

    const existing = masterSpecs.find((s) => s.id === existingId);
    if (!existing) return;

    // Limit history is append-only: changing limits on an existing effective
    // date would restate the window used to judge records from that date.
    const applied = applySpecLimitEdit(existing, limits, effectiveFrom, stamp, actor);
    if (!applied || applied.rejected) {
      // Limits for that date are already on file and Cpk records measured under
      // the revision keep their frozen limits, so correcting it is an explicit
      // choice that says how many records would be re-frozen.
      const revision = getSpecRevisions(existing).find((rev) => rev.effectiveFrom === effectiveFrom);
      const affected = revision ? recordsFrozenToRevision(cpkRecords, existing.id, revision.id) : [];
      setEditingMasterSpec(null);
      setNewMasterSpecModalOpen(false);
      if (revision && affected.length > 0) {
        setSpecCorrection({
          spec: existing,
          revisionId: revision.id,
          effectiveFrom,
          limits,
          affected,
          previous: specLimitSnapshot(revision)
        });
      } else {
        showToast(
          `Updated ${existing.name}: limits effective ${effectiveFrom} are already on file — choose another effective date`,
          'warning'
        );
      }
      return;
    }
    const history = applied.history;
    const latestRevision = history[history.length - 1];
    const nextSpec = {
      ...existing,
      ...identity,
      ...specLimitSnapshot(latestRevision),
      effectiveFrom: latestRevision.effectiveFrom,
      revisions: history
    };

    setMasterSpecs((prev) => prev.map((s) => (s.id === existingId ? nextSpec : s)));
    if (applied.outcome === 'revision') {
      showToast(
        `Updated ${nextSpec.name}: new limit revision effective ${latestRevision.effectiveFrom} (${history.length} on file)`,
        'warning'
      );
    } else {
      showToast(`Updated ${nextSpec.name} (limits unchanged, effective ${latestRevision.effectiveFrom})`);
    }
    setEditingMasterSpec(null);
    setNewMasterSpecModalOpen(false);
  };

      const numClean = (v) => Number(String(v || '0').replace(/[^0-9.-]/g, '')) || 0;

            : '';
          const model = rawModel || 'X3784';
          const provided = { title: String(r[titleCol]).trim() };
          if (rawModel) provided.model = rawModel;
          if (familyCol) {
            const family = String(r[familyCol] || '').trim();
            if (family) provided.familyGroup = family;
          }
          if (vendorCol) {
            const vendor = String(r[vendorCol] || '').trim();
            if (vendor) provided.vendor = vendor;
          }
          if (hcCol) provided.hcReduction = numClean(r[hcCol]);
          if (budgetCol) provided.budgetThb = numClean(r[budgetCol]);
          if (costCol) provided.quotedCostThb = numClean(r[costCol]);
          if (feasCol) {
            const rawFeas = String(r[feasCol] || '').toLowerCase();
            provided.feasibility = rawFeas.includes('no')
              ? 'No-go'
              : rawFeas.includes('go')
              ? 'Go'
              : 'Pending';
          }
          if (statusCol) {
            const stage = String(r[statusCol] || '').trim();
            if (stage) provided.stage = stage;
          }
          return {
            fileId: idCol ? String(r[idCol] || '').trim() : '',
            matchKey: `${normKey(provided.title)}|${model}`,
            provided,
            addRecord: {
              title: provided.title,
              model,
              familyGroup: provided.familyGroup || inferFamilyFromModel(model),
              phase: 'EVT',
              side: model === 'X3784' ? 'Single' : 'RHS & LHS',
              category: 'Assembly Automation',
              vendor: provided.vendor || 'NMB Internal',
              hcReduction: provided.hcReduction || 0,
              budgetThb: provided.budgetThb || 0,
              quotedCostThb: provided.quotedCostThb || 0,
              feasibility: provided.feasibility || 'Pending',
              stage: provided.stage || 'RFP / Studying',
              fyTarget: provided.fyTarget || `FY${currentFiscalYear()}`,
              owner: 'NMB Eng',
              notes: `Imported from ${file.name}`
            }
          };
        });

      if (parsed.length === 0) {
        showToast('No valid rows parsed from file.', 'warning');
        return;
      }

      const existingById = new Map(costProjects.map((p) => [String(p.id), p]));
      const seenKeys = new Set();
      const matchedIds = new Set();
      const adds = [];
      const updates = [];
      let unchangedCount = 0;
      let duplicateCount = 0;

      const sameValue = (a, b) => {
        if (typeof a === 'number' || typeof b === 'number') return Number(a) === Number(b);
        return String(a === undefined || a === null ? '' : a) === String(b === undefined || b === null ? '' : b);
      };

      parsed.forEach((row) => {
        const dedupeKey = row.fileId ? `id:${row.fileId}` : row.matchKey;
        let match = row.fileId ? existingById.get(row.fileId) : null;
        if (!match) {
          match = costProjects.find(
            (p) => `${normKey(p.title)}|${String(p.model || '').toUpperCase()}` === row.matchKey
          );
        }
        if (seenKeys.has(dedupeKey) || (match && matchedIds.has(match.id))) {
          duplicateCount += 1;
          return;
        }
        seenKeys.add(dedupeKey);
        if (match) {
          matchedIds.add(match.id);
          const changed = Object.keys(row.provided).filter(
            (key) => !sameValue(match[key], row.provided[key])
          );
          if (changed.length === 0) {
            unchangedCount += 1;
            return;
          }
          updates.push({
            id: match.id,
            label: `${match.id} · ${row.provided.title}`,
            fields: row.provided,
            changed: changed.map((key) => fieldLabels[key] || key)
          });
          return;
        }
        adds.push(row.addRecord);
      });

      setCostImportDraft({
        kind: 'cost',
        fileName: file.name,
        adds,
        updates,
        keptIds: Array.from(matchedIds),
        removed: costProjects.filter((p) => !matchedIds.has(p.id)),
        unchangedCount,
        duplicateCount
      });
    } catch (err) {
      showToast(err?.message || 'Failed to import cost CSV/Excel file.', 'warning');
    }
  };

  const handleConfirmCostImport = (mode) => {
    const draft = costImportDraft;
    if (!draft) return;
    setCostProjects((prev) => {
      const fieldsById = new Map(draft.updates.map((u) => [u.id, u.fields]));
      const keptIds = new Set(draft.keptIds || []);
      const withUpdates = (item) =>
        fieldsById.has(item.id) ? { ...item, ...fieldsById.get(item.id) } : item;
      const updated = prev.map(withUpdates);
      // Numbers stay monotonic across a replace: ids of dropped rows are not
      // handed to the new ones.
      const addRecords = (used) => {
        let pool = used.slice();
        return draft.adds.map((record) => {
          const next = { ...record, id: nextId('CI-', pool) };
          pool = [next, ...pool];
          return next;
        });
      };
      if (mode === 'replace') {
        // Every row the file matched is kept, even when no field changed.
        const kept = updated.filter((item) => keptIds.has(item.id));
        return [...addRecords(prev), ...kept];
      }
      return [...addRecords(updated), ...updated];
    });
    setCostImportDraft(null);
    showToast(
      mode === 'replace'
        ? `Replaced cost initiatives from ${draft.fileName}: ${draft.adds.length} added, ${draft.updates.length} updated, ${draft.removed.length} removed`
        : `Merged ${draft.adds.length} new · ${draft.updates.length} updated cost initiatives from ${draft.fileName}`
    );
  };

  const handleDeleteCostProject = (proj) => {
    setCostProjects((prev) => prev.filter((c) => c.id !== proj.id));
    setDeletingCostProject(null);
    showToast(`Deleted cost saving project ${proj.id}`, 'warning');
  };

  const handleSaveFeedback = (form, existingId = null) => {
    const cleanModel = (form.model || 'X3082').toUpperCase().trim();
    const existingCase = existingId ? customerFeedback.find((c) => c.id === existingId) : null;
    // `no` is the same never-reused sequence as the CF-26- id, so deleting a case
    // cannot hand its number to the next one. An edited case keeps the number it
    // was filed under.
    const newCaseId = nextId('CF-26-', customerFeedback);
    const clean = {
      id: existingId || newCaseId,
      no: existingCase ? existingCase.no || caseNoFromId(existingId) : caseNoFromId(newCaseId),
      location: form.location || 'QSMC',
      feedbackDate: form.feedbackDate || todayIso(),
      facaNo: (form.facaNo || '').trim(),
      severity: form.severity || 'Major',
      model: cleanModel,
      familyGroup: form.familyGroup || inferFamilyFromModel(cleanModel),
      dateCode: (form.dateCode || '').trim(),
      build: form.build || 'NPI',
      phase: form.phase || (form.build === 'MP' ? 'MP' : 'EVT'),
      buildConfig: (form.buildConfig || form.phase || 'EVT').trim(),
      side: form.side || (cleanModel === 'X3784' ? 'Single' : 'RHS & LHS'),
      issueCategory: form.issueCategory || 'Function',
      issueItem: (form.issueItem || '').trim(),
      ngQty: Math.max(1, Number(form.ngQty) || 1),
      rtvDate: form.rtvDate || '',
      category: form.category || 'FA',
      eightD: form.eightD || {
        d1d3: 'Open',
        d4: 'Open',
        d5: 'Open',
        d6: 'Open',
        d7: 'Open',
        d8: 'Open'
      },
      nmbStatus: form.nmbStatus || 'Open',
      customerStatus: form.customerStatus || 'Open',
      remark: (form.remark || '').trim()
    };

    if (existingId) {
      setCustomerFeedback((prev) => prev.map((c) => (c.id === existingId ? clean : c)));
      showToast(`Updated customer feedback ${clean.id}`);
    } else {
      setCustomerFeedback((prev) => [clean, ...prev]);
      showToast(`Logged customer feedback ${clean.id} (${clean.model})`);
    }
    setNewFeedbackModalOpen(false);
    setEditingFeedback(null);
  };

  const handleDeleteFeedback = (item) => {
    setCustomerFeedback((prev) => prev.filter((c) => c.id !== item.id));
    setDeletingFeedback(null);
    showToast(`Deleted feedback case ${item.id}`, 'warning');
  };

  const handleToggleFeedback8D = (id, stepKey) => {
    setCustomerFeedback((prev) =>
      prev.map((c) => {
        if (c.id !== id) return c;
        const nextVal = c.eightD?.[stepKey] === 'Closed' ? 'Open' : 'Closed';
        const nextEightD = { ...(c.eightD || {}), [stepKey]: nextVal };
        const allClosed = EIGHT_D_STEPS.every((s) => nextEightD[s.key] === 'Closed');
        return {
          ...c,
          eightD: nextEightD,
          nmbStatus: allClosed ? 'Closed' : 'Open'
        };
      })
    );
  };

  const handleUpdateFeedbackStatus = (id, field, value) => {
    setCustomerFeedback((prev) =>
      prev.map((c) => (c.id === id ? { ...c, [field]: value } : c))
    );
    showToast(`Updated ${id} ${field === 'nmbStatus' ? 'NMB' : 'Customer'} status to ${value}`);
  };

  const handleImportFeedbackCsv = async (file) => {
    try {
      const { headers, rows } = await parseUploadedTabularFile(file);
      if (!rows || rows.length === 0) {
        showToast('No feedback rows found in uploaded file.', 'warning');
        return;
      }

      const findCol = createColumnFinder(headers);

      const locCol = findCol(['location', 'customer', 'site']);
      const dateCol = findCol(['feedbackdate', 'date']);
      const facaCol = findCol(['faca', 'facano']);
      const sevCol = findCol(['severity']);
      const modelCol = findCol(['model', 'product']);
      const dcCol = findCol(['datecode']);
      const buildCol = findCol(['build']);
      const cfgCol = findCol(['buildconfig', 'config']);
      const issueCatCol = findCol(['issuecategory']);
      const issueItemCol = findCol(['issueitem', 'issue', 'defect']);
      const qtyCol = findCol(['ngqty', 'qty']);
      const rtvCol = findCol(['rtvreceiveddate', 'rtv']);
      const catCol = findCol(['category']);
      const nmbStCol = findCol(['nmbstatus']);
      const custStCol = findCol(['customerstatus']);
      const remarkCol = findCol(['remark', 'notes']);
      const stepCols = EIGHT_D_STEPS.map((step) => ({
        key: step.key,
        col: findCol(
          step.key === 'd1d3' ? ['d1d3', 'd13'] : step.key === 'd8' ? ['finald8', 'd8'] : [step.key]
        )
      }));

      if (!modelCol || !issueItemCol) {
        showToast('Could not detect Model or Issue Item columns in uploaded file.', 'warning');
        return;
      }

      const normStatus = (v) => (String(v || '').toLowerCase().includes('closed') ? 'Closed' : 'Open');
      const stepStatus = (v) => {
        const text = String(v || '').trim().toLowerCase();
        if (!text) return null;
        return text.includes('closed') ? 'Closed' : 'Open';
      };
      const inferPhaseFromConfig = (buildVal, cfgVal) => {
        const c = String(cfgVal || '').toUpperCase();
        if (String(buildVal || '').toUpperCase() === 'MP' || c === 'MP') return 'MP';
        if (c.includes('P1')) return 'P1';
        if (c.includes('P2')) return 'P2';
        if (c.includes('EVT')) return 'EVT';
        if (c.includes('DVT') || c.includes('PRB')) return 'DVT';
        if (c.includes('PVT')) return 'PVT';
        return 'EVT';
      };
      const normKey = (v) => String(v || '').trim().toLowerCase().replace(/\s+/g, ' ');

      // `provided` holds only what the file states, so a merge keeps values the
      // upload does not mention (statuses, 8D steps, remarks, ...).
      const parsed = rows
        .filter((r) => String(r[modelCol] || '').trim() && String(r[issueItemCol] || '').trim())
        .map((r) => {
          const model = String(r[modelCol]).toUpperCase().trim();
          const build = buildCol ? String(r[buildCol] || '').trim() : '';
          const buildConfig = cfgCol ? String(r[cfgCol] || '').trim() : '';
          const nmbStatus = nmbStCol ? normStatus(r[nmbStCol]) : 'Open';
          const provided = { model, issueItem: String(r[issueItemCol]).trim() };
          if (locCol) {
            const location = String(r[locCol] || '').trim();
            if (location) provided.location = location;
          }
          if (dateCol) {
            const date = String(r[dateCol] || '').replace(/^B1/, '').trim();
            if (date) provided.feedbackDate = date;
          }
          if (facaCol) provided.facaNo = String(r[facaCol] || '').trim();
          if (sevCol) {
            const severity = String(r[sevCol] || '').trim();
            if (severity) provided.severity = severity;
          }
          if (dcCol) provided.dateCode = String(r[dcCol] || '').trim();
          if (buildCol) provided.build = build || 'NPI';
          if (cfgCol) provided.buildConfig = buildConfig || build || 'EVT';
          if (buildCol || cfgCol) provided.phase = inferPhaseFromConfig(build || 'NPI', buildConfig || build);
          if (issueCatCol) {
            const issueCategory = String(r[issueCatCol] || '').trim();
            if (issueCategory) provided.issueCategory = issueCategory;
          }
          if (qtyCol) {
            provided.ngQty = Math.max(1, Number(String(r[qtyCol] || '1').replace(/[^0-9]/g, '')) || 1);
          }
          if (rtvCol) provided.rtvDate = String(r[rtvCol] || '').trim();
          if (catCol) {
            const category = String(r[catCol] || '').trim();
            if (category) provided.category = category;
          }
          if (nmbStCol) provided.nmbStatus = nmbStatus;
          if (custStCol) provided.customerStatus = normStatus(r[custStCol]);
          if (remarkCol) provided.remark = String(r[remarkCol] || '').trim();

          const fileSteps = {};
          stepCols.forEach(({ key, col }) => {
            if (!col) return;
            const status = stepStatus(r[col]);
            if (status) fileSteps[key] = status;
          });
          const defaultStep = nmbStatus === 'Closed' ? 'Closed' : 'Open';

          return {
            matchKey: `${model}|${normKey(provided.issueItem)}`,
            provided,
            fileSteps,
            addRecord: {
              location: provided.location || 'QSMC',
              feedbackDate: provided.feedbackDate || todayIso(),
              facaNo: provided.facaNo || '',
              severity: provided.severity || 'Major',
              model,
              familyGroup: inferFamilyFromModel(model),
              dateCode: provided.dateCode || '',
              build: provided.build || 'NPI',
              phase: provided.phase || (provided.build === 'MP' ? 'MP' : 'EVT'),
              buildConfig: provided.buildConfig || provided.phase || 'EVT',
              side: model === 'X3784' || model === 'X2977' ? 'Single' : 'RHS & LHS',
              issueCategory: provided.issueCategory || 'Function',
              issueItem: provided.issueItem,
              ngQty: provided.ngQty || 1,
              rtvDate: provided.rtvDate || '',
              category: provided.category || 'Feedback',
              eightD: EIGHT_D_STEPS.reduce(
                (acc, step) => ({ ...acc, [step.key]: fileSteps[step.key] || defaultStep }),
                {}
              ),
              nmbStatus,
              customerStatus: provided.customerStatus || 'Open',
              remark: provided.remark || ''
            }
          };
        });

      if (parsed.length === 0) {
        showToast('No valid feedback entries parsed from file.', 'warning');
        return;
      }

      const seenKeys = new Set();
      const matchedIds = new Set();
      const adds = [];
      const updates = [];
      let unchangedCount = 0;
      let duplicateCount = 0;

      const sameValue = (a, b) => {
        if (a && b && typeof a === 'object' && typeof b === 'object') {
          return JSON.stringify(a) === JSON.stringify(b);
        }
        if (typeof a === 'number' || typeof b === 'number') return Number(a) === Number(b);
        return String(a === undefined || a === null ? '' : a) === String(b === undefined || b === null ? '' : b);
      };

      const fieldLabels = {
        model: 'model',
        location: 'location',
        feedbackDate: 'date',
        facaNo: 'FACA',
        severity: 'severity',
        dateCode: 'date code',
        build: 'build',
        buildConfig: 'build config',
        phase: 'phase',
        issueCategory: 'issue category',
        issueItem: 'issue item',
        ngQty: 'NG qty',
        rtvDate: 'RTV date',
        category: 'category',
        nmbStatus: 'NMB status',
        customerStatus: 'customer status',
        remark: 'remark',
        eightD: '8D steps'
      };

      parsed.forEach((row) => {
        // Match order: FACA number, then model + issue + date, then a single
        // model + issue candidate. Ambiguous rows fall through to "add".
        let match = null;
        if (row.provided.facaNo) {
          const facaKey = normKey(row.provided.facaNo);
          match = customerFeedback.find((c) => normKey(c.facaNo) === facaKey) || null;
        }
        if (!match && row.provided.feedbackDate) {
          const dateKey = normKey(row.provided.feedbackDate);
          match =
            customerFeedback.find(
              (c) =>
                `${String(c.model || '').toUpperCase()}|${normKey(c.issueItem)}` === row.matchKey &&
                normKey(c.feedbackDate) === dateKey
            ) || null;
        }
        if (!match) {
          const candidates = customerFeedback.filter(
            (c) => `${String(c.model || '').toUpperCase()}|${normKey(c.issueItem)}` === row.matchKey
          );
          if (candidates.length === 1) match = candidates[0];
        }

        const dedupeKey = match ? `id:${match.id}` : row.matchKey;
        if (seenKeys.has(dedupeKey)) {
          duplicateCount += 1;
          return;
        }
        seenKeys.add(dedupeKey);

        if (match) {
          matchedIds.add(match.id);
          const fields = { ...row.provided };
          if (Object.keys(row.fileSteps).length > 0) {
            fields.eightD = { ...(match.eightD || {}), ...row.fileSteps };
          }
          const changed = Object.keys(fields).filter((key) => !sameValue(match[key], fields[key]));
          if (changed.length === 0) {
            unchangedCount += 1;
            return;
          }
          updates.push({
            id: match.id,
            label: `${match.id} · ${match.model} · ${match.issueItem}`,
            fields,
            changed: changed.map((key) => fieldLabels[key] || key)
          });
          return;
        }
        adds.push(row.addRecord);
      });

      setFeedbackImportDraft({
        kind: 'feedback',
        fileName: file.name,
        adds,
        updates,
        keptIds: Array.from(matchedIds),
        removed: customerFeedback.filter((c) => !matchedIds.has(c.id)),
        unchangedCount,
        duplicateCount
      });
    } catch (err) {
      showToast(err?.message || 'Failed to parse customer feedback file.', 'warning');
    }
  };

  const handleConfirmFeedbackImport = (mode) => {
    const draft = feedbackImportDraft;
    if (!draft) return;
    setCustomerFeedback((prev) => {
      const fieldsById = new Map(draft.updates.map((u) => [u.id, u.fields]));
      const keptIds = new Set(draft.keptIds || []);
      const withUpdates = (item) =>
        fieldsById.has(item.id) ? { ...item, ...fieldsById.get(item.id) } : item;
      const updated = prev.map(withUpdates);
      const buildRecord = (record, used) => {
        const id = nextId('CF-26-', used);
        return { ...record, id, no: caseNoFromId(id) };
      };
      // Numbers stay monotonic across a replace: ids of dropped rows are not
      // handed to the new ones.
      const addRecords = (used) => {
        let pool = used.slice();
        return draft.adds.map((record) => {
          const next = buildRecord(record, pool);
          pool = [next, ...pool];
          return next;
        });
      };
      if (mode === 'replace') {
        // Every row the file matched is kept, even when no field changed.
        const kept = updated.filter((item) => keptIds.has(item.id));
        return [...addRecords(prev), ...kept];
      }
      return [...addRecords(updated), ...updated];
    });
    setFeedbackImportDraft(null);
    showToast(
      mode === 'replace'
        ? `Replaced feedback cases from ${draft.fileName}: ${draft.adds.length} added, ${draft.updates.length} updated, ${draft.removed.length} removed`
        : `Merged ${draft.adds.length} new · ${draft.updates.length} updated feedback cases from ${draft.fileName}`
    );
  };

  const handleToggleCriterion = (projectId, lineKeysInput, gateId, criterionId) => {
    const targetKeys = Array.isArray(lineKeysInput) ? lineKeysInput : [lineKeysInput];
    setGateRecords((prev) => {
      const projLines = prev[projectId] || {};
      const primaryKey = targetKeys[0];
      const primaryCriteria = projLines[primaryKey]?.[gateId]?.criteria || [];
      const critIdx = primaryCriteria.findIndex((c) => c.id === criterionId);
      if (critIdx < 0) return prev;
      // A partly ticked scope fills on click: only a criterion already ticked on
      // every selected line clears. Following one line instead would silently
      // uncheck the lines that had it ticked.
      const allTicked = targetKeys.every(
        (k) => projLines[k]?.[gateId]?.criteria?.[critIdx]?.checked
      );
      const nextChecked = !allTicked;

      const updatedProjLines = { ...projLines };
      targetKeys.forEach((k) => {
        const gate = updatedProjLines[k]?.[gateId];
        if (!gate || gate.status === 'Approved') return;
        updatedProjLines[k] = {
          ...updatedProjLines[k],
          [gateId]: {
            ...gate,
            criteria: gate.criteria.map((c, idx) =>
              idx === critIdx ? { ...c, checked: nextChecked } : c
            )
          }
        };
      });

      return { ...prev, [projectId]: updatedProjLines };
    });
  };

  const handleSubmitApproverDecision = (
    projectId,
    lineKeysInput,
    gateId,
    approverIdx,
    decision,
    remark,
    signerEmail
  ) => {
    const targetKeys = Array.isArray(lineKeysInput) ? lineKeysInput : [lineKeysInput];
    // Identity comes from the signed-in Google session, never a typed name.
    const signer = String(signerEmail || '').trim();
    if (!signer) {
      showToast(
        'Your Google identity is unavailable, so this sign-off was not recorded. Reload and grant access, then retry.',
        'error'
      );
      return;
    }
    const isMulti = targetKeys.length > 1;
    const stamp = `Today ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    setGateRecords((prev) => {
      const updatedProjLines = { ...prev[projectId] };

      targetKeys.forEach((k) => {
        const gate = updatedProjLines[k]?.[gateId];
        if (!gate || gate.status === 'Approved') return;
        const targetApprover = gate.approvers[approverIdx];
        const resolvedName = signer;
        const nextApprovers = gate.approvers.map((a, idx) =>
          idx === approverIdx
            ? { ...a, name: resolvedName, decision, remark, updatedAt: stamp }
            : a
        );

        const hasRejected = nextApprovers.some((a) => a.decision === 'Rejected');
        const hasConditional = nextApprovers.some((a) => a.decision === 'Conditional');

        let nextStatus = 'In Review';
        if (hasRejected) nextStatus = 'Blocked';
        else if (hasConditional) nextStatus = 'Conditional';

        const logEntry = {
          actor: `${resolvedName} (${targetApprover.role})`,
          action: `${k} · Signed: ${decision}${isMulti ? ` (Multi-Config: ${targetKeys.length} lines)` : ''}`,
          time: stamp,
          note: remark || 'No additional remarks.'
        };

        updatedProjLines[k] = {
          ...updatedProjLines[k],
          [gateId]: {
            ...gate,
            status: nextStatus,
            approvers: nextApprovers,
            auditLog: [logEntry, ...gate.auditLog]
          }
        };
      });

      return { ...prev, [projectId]: updatedProjLines };
    });

    setSignOffModal(null);
    showToast(
      isMulti
        ? `Recorded ${decision} across ${targetKeys.length} selected lines (${targetKeys.join(', ')})`
        : `Recorded ${decision} for ${targetKeys[0]}`,
      decision === 'Rejected' ? 'warning' : 'success'
    );
  };

  // Append a Google Drive evidence link to one or more gate dossiers.
  const handleAddGateEvidence = (projectId, lineKeysInput, gateId, evidenceInput) => {
    const targetKeys = Array.isArray(lineKeysInput) ? lineKeysInput : [lineKeysInput];
    const label = (evidenceInput?.label || '').trim();
    const url = (evidenceInput?.url || '').trim();
    if (!label || !url) return;

    const stamp = `Today ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    const actor = evidenceInput?.addedBy || 'PEN-81-0002 Gate Board';

    setGateRecords((prev) => {
      const updatedProjLines = { ...prev[projectId] };
      targetKeys.forEach((k, idx) => {
        const gate = updatedProjLines[k]?.[gateId];
        if (!gate) return;
        const entry = {
          id: `${projectId}-${k}-${gateId}-ev-${Date.now()}-${idx}`,
          label,
          url,
          addedBy: actor,
          addedAt: stamp
        };
        updatedProjLines[k] = {
          ...updatedProjLines[k],
          [gateId]: {
            ...gate,
            evidence: [entry, ...(Array.isArray(gate.evidence) ? gate.evidence : [])],
            auditLog: [
              {
                actor,
                action: `${k} · Evidence linked: ${label}`,
                time: stamp,
                note: url
              },
              ...gate.auditLog
            ]
          }
        };
      });
      return { ...prev, [projectId]: updatedProjLines };
    });

    showToast(
      targetKeys.length > 1
        ? `Evidence saved to ${targetKeys.length} selected lines`
        : `Evidence saved to ${targetKeys[0]}`,
      'success'
    );
  };

  const handleFinalizeGate = (projectId, lineKeysInput, gateId) => {
    const proj = projectMap[projectId];
    const targetKeys = Array.isArray(lineKeysInput) ? lineKeysInput : [lineKeysInput];

    const currentIdx = NPI_GATES.findIndex((g) => g.id === gateId);
    if (currentIdx > 0) {
      const prevGate = NPI_GATES[currentIdx - 1];
      const unreadyPrev = targetKeys.filter(
        (k) => gateRecords[projectId]?.[k]?.[prevGate.id]?.status !== 'Approved'
      );
      if (unreadyPrev.length > 0) {
        showToast(
          `Dependency Hold: ${prevGate.code} (${prevGate.short}) must be Approved first on ${unreadyPrev.join(', ')}.`,
          'warning'
        );
        return;
      }
    }

    const eligibleKeys = targetKeys.filter((k) => {
      const gate = gateRecords[projectId]?.[k]?.[gateId];
      if (!gate || gate.status === 'Approved') return false;
      const allCriteriaDone = gate.criteria.every((c) => c.checked);
      const hasRejection = gate.approvers.some((a) => a.decision === 'Rejected');
      const allSigned = gate.approvers.every(
        (a) => a.decision === 'Approved' || a.decision === 'Conditional'
      );
      return allCriteriaDone && !hasRejection && allSigned;
    });

    if (eligibleKeys.length === 0) {
      showToast(
        'Complete all exit criteria and resolve pending/rejected sign-offs on the selected line(s) first.',
        'warning'
      );
      return;
    }

    const nextGate = NPI_GATES[currentIdx + 1];
    const stamp = `Today ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    setGateRecords((prev) => {

      eligibleKeys.forEach((k) => {

        lineObj[gateId] = {

          status: 'Approved',
          auditLog: [

              actor: 'PEN-81-0002 Gate Board',
              action: `${k} · Gate ${gateMap[gateId].code} (${gateMap[gateId].short}) Approved & Locked`,
              time: stamp,
              note: nextGate

                : `All 9 NPI gates completed for ${k}.`
            },
            ...lineObj[gateId].auditLog

        };

        if (nextGate && lineObj[nextGate.id].status === 'Pending') {
          lineObj[nextGate.id] = { ...lineObj[nextGate.id], status: 'In Review' };
        }
        updatedProjLines[k] = lineObj;
      });

      if (nextGate) {
        const allLinesCleared = getLineVariantsForProject(proj).every(
          (v) => updatedProjLines[v.key]?.[gateId]?.status === 'Approved'
        );
        if (allLinesCleared) {
          setProjects((pPrev) =>
            pPrev.map((p) =>
              p.id === projectId ? { ...p, currentGateId: nextGate.id, status: 'On Track' } : p
            )
          );
          setSelectedGateId(nextGate.id);
        }
      }

      return { ...prev, [projectId]: updatedProjLines };
    });

    showToast(
      `Approved ${gateMap[gateId].code} (${gateMap[gateId].short}) for ${eligibleKeys.join(', ')}!`
    );
