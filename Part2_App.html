                  <BuildTimelineGanttView
                    projects={scopedProjects}
                    gateRecords={gateRecords}
                    globalSide={globalSide}
                    scheduleOverrides={scheduleOverrides}
                    onOpenGate={navigateToGate}
                    onEditSchedule={(target) => setEditingScheduleTarget(target)}
                    onReschedule={({ project, rowKeys, schedule }) =>
                      handleSaveScheduleOverride(project.id, rowKeys, schedule)
                    }
                  />
                );
              case 'tasks':
                return (
                  <TasksManagerView
                    tasks={scopedTasks}
                    onSelectTask={(id) => setActiveTaskDrawerId(id)}
                    onUpdateTaskStatus={handleUpdateTaskStatus}
                    onOpenNewTask={() => setNewTaskModalOpen(true)}
                  />
                );
              case 'gates':
                return (
                  <GateSignOffView
                    projects={scopedProjects.length > 0 ? scopedProjects : projects}
                    selectedProject={
                      scopedProjects.find((p) => p.id === selectedProject.id) ||
                      scopedProjects[0] ||
                      selectedProject
                    }
                    onSelectProject={(id) => {
                      setSelectedProjectId(id);
                      const p = projects.find((x) => x.id === id);
                      if (p) {
                        const variants = getLineVariantsForProject(p).filter(
                          (v) => globalSide === 'ALL' || v.side === globalSide
                        );
                        const firstLine = variants[0]?.key || getLineVariantsForProject(p)[0]?.key || 'ME11-RHS';
                        setSelectedGateId(p.currentGateId);
                        setSelectedLineKey(firstLine);
                        setSelectedLineKeys([firstLine]);
                      }
                    }}
                    globalSide={globalSide}
                    selectedLineKey={selectedLineKey}
                    selectedLineKeys={selectedLineKeys}
                    onUpdateSelectedLines={(keys, primaryKey) => {
                      setSelectedLineKeys(keys);
                      if (primaryKey) setSelectedLineKey(primaryKey);
                    }}
                    selectedGateId={selectedGateId}
                    onSelectGate={setSelectedGateId}
                    gateRecords={gateRecords}
                    tasks={tasks}
                    onOpenGate={navigateToGate}
                    onToggleCriterion={handleToggleCriterion}
                    onOpenSignOffModal={(approverIdx, targetKeys) =>
                      setSignOffModal({
                        projectId: (
                          scopedProjects.find((p) => p.id === selectedProject.id) ||
                          scopedProjects[0] ||
                          selectedProject
                        ).id,
                        lineKeys: targetKeys,
                        gateId: selectedGateId,
                        approverIndex: approverIdx
                      })
                    }
                    onFinalizeGate={handleFinalizeGate}
                    onAddEvidence={handleAddGateEvidence}
                    onSelectTask={(id) => setActiveTaskDrawerId(id)}
                  />
                );
              case 'cpk':
                return (
                  <CpkMasterSpecsView
                    masterSpecs={masterSpecs}
                    cpkRecords={scopedCpkRecords}
                    uploadHistory={cpkUploadHistory}
                    lastUploadBatch={lastUploadBatch}
                    onOpenCpkChart={(rec) => setActiveCpkChartRecord(rec)}
                    onOpenCpkImport={() => setCpkImportModalOpen(true)}
                    onGenerateFfmSpecs={handleGenerateFfmMasterSpecs}
                    onOpenNewSpec={() => setNewMasterSpecModalOpen(true)}
                    onEditSpec={(spec) => setEditingMasterSpec(spec)}
                    onDeleteSpec={handleDeleteMasterSpec}
                  />
                );
              case 'costs':
                return (
                  <CostSavingView
                    items={scopedCostProjects}
                    allItemsCount={costProjects.length}
                    onOpenNew={() => setNewCostModalOpen(true)}
                    onEdit={(item) => setEditingCostProject(item)}
                    onDelete={(item) => setDeletingCostProject(item)}
                    onUpdateStage={handleUpdateCostStage}
                    onUpdateFeasibility={handleUpdateCostFeasibility}
                    onImportFile={handleImportCostCsv}
                  />
                );
              case 'feedback':
                return (
                  <CustomerFeedbackView
                    items={scopedCustomerFeedback}
                    onOpenNew={() => setNewFeedbackModalOpen(true)}
                    onEdit={(item) => setEditingFeedback(item)}
                    onDelete={(item) => setDeletingFeedback(item)}
                    onToggle8D={handleToggleFeedback8D}
                    onUpdateStatus={handleUpdateFeedbackStatus}
                    onImportFile={handleImportFeedbackCsv}
                  />
                );
              case 'production':
                return (
                  <ProductionRecordsView
                    records={scopedProductionRecords}
                    onOpenNewRecord={() => setNewProdRecordModalOpen(true)}
                    onEditRecord={(rec) => setEditingProdRecord(rec)}
                    onDeleteRecord={(rec) => setDeletingProdRecord(rec)}
                  />
                );
              case 'team':
                return (
                  <TeamMembersView
                    members={teamMembers}
                    projects={projects}
                    tasks={tasks}
                    gateRecords={gateRecords}
                    scheduleOverrides={scheduleOverrides}
                    onOpenNew={() => setNewTeamMemberModalOpen(true)}
                    onEdit={(member) => setEditingTeamMember(member)}
                    onDelete={(member) => setDeletingTeamMember(member)}
                    onOpenTask={(taskId) => setActiveTaskDrawerId(taskId)}
                    onAssignTaskOwner={handleAssignTaskOwner}
                    onOpenGate={(projectId, lineKey, gateId) => navigateToGate(projectId, gateId, lineKey)}
                  />
                );
              case 'reports':
                return (
                  <ReportsView
                    projects={scopedProjects}
                    records={scopedProductionRecords}
                    costProjects={scopedCostProjects}
                    customerFeedback={scopedCustomerFeedback}
                    gateRecords={gateRecords}
                    scopeLabel={
                      [
                        globalFamily !== 'ALL' ? globalFamily : '',
                        globalModel !== 'ALL' ? globalModel : '',
                        globalPhase !== 'ALL' ? globalPhase : '',
                        globalSide !== 'ALL' ? globalSide : ''
                      ]
                        .filter(Boolean)
                        .join(' · ') || 'All programs'
                    }
                  />
                );
              default:
                return null;
            }
          })()}
        </main>
      </div>

      {/* Task Detail Slide-Over Drawer */}
      {activeDrawerTask && (
        <TaskDetailDrawer
          task={activeDrawerTask}
          project={projectMap[activeDrawerTask.projectId]}
          gate={gateMap[activeDrawerTask.gateId]}
          onClose={() => setActiveTaskDrawerId(null)}
          onUpdateStatus={(st) => handleUpdateTaskStatus(activeDrawerTask.id, st)}
          onUpdateCategory={(category) => handleUpdateTaskCategory(activeDrawerTask.id, category)}
          onAddNote={(txt) => handleAddTaskNote(activeDrawerTask.id, txt)}
          onJumpToGate={() => {
            const pid = activeDrawerTask.projectId;
            const gid = activeDrawerTask.gateId;
            setActiveTaskDrawerId(null);
            navigateToGate(pid, gid);
          }}
        />
      )}

      {/* New NPI Program Modal */}
      {kpiDrilldown && (
        <KpiDeepDiveModal
          kpiKey={kpiDrilldown}
          projects={scopedProjects}
          records={scopedProductionRecords}
          gateRecords={gateRecords}
          globalSide={globalSide}
          scopeFilters={scopeFilters}
          costProjects={scopedCostProjects}
          customerFeedback={scopedCustomerFeedback}
          onClose={() => setKpiDrilldown(null)}
        />
      )}

      {newProjectModalOpen && (
        <NewProjectModal
          onClose={() => setNewProjectModalOpen(false)}
          onSubmit={handleCreateProject}
        />
      )}

      {editingProject && (
        <ProjectSettingsModal
          project={editingProject}
          familyGroups={projectFamilyGroupOptions(projects)}
          onClose={() => setEditingProject(null)}
          onSubmit={handleUpdateProject}
        />
      )}

      {deletingProject && (
        <DeleteProjectModal
          project={deletingProject}
          impact={projectDeletionImpact(
            deletingProject.id,
            tasks,
            gateRecords,
            scheduleOverrides
          )}
          onClose={() => setDeletingProject(null)}
          onConfirm={() => handleDeleteProject(deletingProject)}
        />
      )}

      {/* New Task Modal */}
      {newTaskModalOpen && (
        <NewTaskModal
          projects={projects}
          members={teamMembers}
          onClose={() => setNewTaskModalOpen(false)}
          onSubmit={handleCreateTask}
        />
      )}

      {/* New / Edit Production Record Modal */}
      {(newProdRecordModalOpen || editingProdRecord) && (
        <NewProductionRecordModal
          initialRecord={editingProdRecord}
          onClose={() => {
            setNewProdRecordModalOpen(false);
            setEditingProdRecord(null);
          }}
          onSubmit={(form) => {
            if (editingProdRecord) {
              handleUpdateProductionRecord(editingProdRecord.id, form);
            } else {
              handleAddProductionRecord(form);
            }
          }}
        />
      )}

      {/* Delete Production Record Confirmation Modal */}
      {deletingProdRecord && (
        <DeleteProductionRecordModal
          record={deletingProdRecord}
          onClose={() => setDeletingProdRecord(null)}
          onConfirm={() => handleDeleteProductionRecord(deletingProdRecord)}
        />
      )}

      {/* Build Matrix Row Create / Edit Modal */}
      {matrixModalState && (
        <BuildMatrixRowModal
          project={matrixModalState.project}
          initialRow={matrixModalState.row}
          onClose={() => setMatrixModalState(null)}
          onSubmit={(form) =>
            handleSaveBuildMatrixRow(
              matrixModalState.project.id,
              matrixModalState.row || null,
              form
            )
          }
        />
      )}

      {/* Delete Build Matrix Row Confirmation Modal */}
      {deletingMatrixRow && (
        <DeleteBuildMatrixRowModal
          project={deletingMatrixRow.project}
          row={deletingMatrixRow.row}
          onClose={() => setDeletingMatrixRow(null)}
          onConfirm={() =>
            handleDeleteBuildMatrixRow(
              deletingMatrixRow.project.id,
              deletingMatrixRow.row
            )
          }
        />
      )}

      {/* Edit Gantt Schedule Modal */}
      {editingScheduleTarget && (
        <EditScheduleModal
          target={editingScheduleTarget}
          onClose={() => setEditingScheduleTarget(null)}
          onSubmit={(scheduleForm) =>
            handleSaveScheduleOverride(
              editingScheduleTarget.project.id,
              editingScheduleTarget.rowKeys,
              scheduleForm
            )
          }
        />
      )}

      {/* Interactive Process Capability (Cpk) Chart Modal */}
      {activeCpkChartRecord && (
        <ProcessCapabilityChartModal
          record={activeCpkChartRecord}
          spec={masterSpecs.find((s) => s.id === activeCpkChartRecord.specId)}
          onClose={() => setActiveCpkChartRecord(null)}
          onUpdateMeasurement={handleUpdateCpkMeasurement}
          onEditMasterSpec={(spec) => {
            setActiveCpkChartRecord(null);
            setEditingMasterSpec(spec);
          }}
        />
      )}

      {/* Create / Edit Master Specification Modal */}
      {(newMasterSpecModalOpen || editingMasterSpec) && (
        <MasterSpecModal
          initialSpec={editingMasterSpec}
          modelOptions={masterSpecModelOptions}
          onClose={() => {
            setNewMasterSpecModalOpen(false);
            setEditingMasterSpec(null);
          }}
          onSubmit={(form) => handleSaveMasterSpec(form, editingMasterSpec?.id || null)}
        />
      )}

      {/* Excel / CSV Process Capability Import Pipeline Modal */}
      {cpkImportModalOpen && (
        <CpkImportPipelineModal
          masterSpecs={masterSpecs}
          defaultModel={globalModel !== 'ALL' ? globalModel : selectedProject?.model || 'X4151'}
          defaultPhase={globalPhase !== 'ALL' ? globalPhase : 'EVT'}
          defaultSide={globalSide !== 'ALL' ? globalSide : 'RHS'}
          onClose={() => setCpkImportModalOpen(false)}
          onImport={handleImportCpkRecords}
        />
      )}

      {/* Create / Edit Cost Saving Project Modal */}
      {(newCostModalOpen || editingCostProject) && (
        <CostSavingModal
          initialItem={editingCostProject}
          defaultModel={globalModel !== 'ALL' ? globalModel : selectedProject?.model || 'X4151'}
          defaultFamily={globalFamily !== 'ALL' ? globalFamily : 'MB14"'}
          defaultPhase={globalPhase !== 'ALL' ? globalPhase : 'EVT'}
          onClose={() => {
            setNewCostModalOpen(false);
            setEditingCostProject(null);
          }}
          onSubmit={(form) => handleSaveCostProject(form, editingCostProject?.id || null)}
        />
      )}

      {/* Delete Cost Saving Project Confirmation Modal */}
      {deletingCostProject && (
        <DeleteCostSavingModal
          item={deletingCostProject}
          onClose={() => setDeletingCostProject(null)}
          onConfirm={() => handleDeleteCostProject(deletingCostProject)}
        />
      )}

      {/* Create / Edit Customer Feedback Modal */}
      {(newFeedbackModalOpen || editingFeedback) && (
        <CustomerFeedbackModal
          initialItem={editingFeedback}
          defaultModel={globalModel !== 'ALL' ? globalModel : 'X3082'}
          onClose={() => {
            setNewFeedbackModalOpen(false);
            setEditingFeedback(null);
          }}
          onSubmit={(form) => handleSaveFeedback(form, editingFeedback?.id || null)}
        />
      )}

      {/* Delete Customer Feedback Confirmation Modal */}
      {deletingFeedback && (
        <DeleteCustomerFeedbackModal
          item={deletingFeedback}
          onClose={() => setDeletingFeedback(null)}
          onConfirm={() => handleDeleteFeedback(deletingFeedback)}
        />
      )}

      {/* Create / Edit Team Member Modal */}
      {(newTeamMemberModalOpen || editingTeamMember) && (
        <TeamMemberModal
          member={editingTeamMember}
          members={teamMembers}
          projects={projects}
          onClose={() => {
            setNewTeamMemberModalOpen(false);
            setEditingTeamMember(null);
          }}
          onSubmit={(form) => handleSaveTeamMember(form, editingTeamMember?.id || null)}
        />
      )}

      {/* Delete Team Member Confirmation Modal */}
      {deletingTeamMember && (
        <DeleteTeamMemberModal
          member={deletingTeamMember}
          reports={teamMembers.filter((m) => m.reportsTo === deletingTeamMember.id)}
          workload={computeTeamWorkload(deletingTeamMember, projects, tasks, gateRecords, teamMembers, scheduleOverrides)}
          onClose={() => setDeletingTeamMember(null)}
          onConfirm={() => handleDeleteTeamMember(deletingTeamMember.id)}
        />
      )}

      {/* Cost initiative CSV / Excel import preview (merge or replace) */}
      {costImportDraft && (
        <ImportMergePreviewModal
          kind="cost"
          fileName={costImportDraft.fileName}
          summary={{
            added: costImportDraft.adds.length,
            updated: costImportDraft.updates.length,
            removed: costImportDraft.removed.length,
            unchanged: costImportDraft.unchangedCount,
            duplicates: costImportDraft.duplicateCount
          }}
          samples={[
            ...costImportDraft.adds.slice(0, 6).map((item) => ({
              tag: 'Add',
              primary: item.title,
              secondary: `${item.model} · ${item.familyGroup} · ${item.stage}`
            })),
            ...costImportDraft.updates.slice(0, 6).map((change) => ({
              tag: 'Update',
              primary: change.label,
              secondary: `Changes: ${change.changed.join(', ')}`
            }))
          ]}
          removedSamples={costImportDraft.removed.slice(0, 6).map((item) => `${item.id} · ${item.title}`)}
          onClose={() => setCostImportDraft(null)}
          onConfirm={handleConfirmCostImport}
        />
      )}

      {/* Customer feedback CSV / Excel import preview (merge or replace) */}
      {feedbackImportDraft && (
        <ImportMergePreviewModal
          kind="feedback"
          fileName={feedbackImportDraft.fileName}
          summary={{
            added: feedbackImportDraft.adds.length,
            updated: feedbackImportDraft.updates.length,
            removed: feedbackImportDraft.removed.length,
            unchanged: feedbackImportDraft.unchangedCount,
            duplicates: feedbackImportDraft.duplicateCount
          }}
          samples={[
            ...feedbackImportDraft.adds.slice(0, 6).map((item) => ({
              tag: 'Add',
              primary: `${item.model} · ${item.issueItem}`,
              secondary: `${item.location} · ${item.feedbackDate} · ${item.category}`
            })),
            ...feedbackImportDraft.updates.slice(0, 6).map((change) => ({
              tag: 'Update',
              primary: change.label,
              secondary: `Changes: ${change.changed.join(', ')}`
            }))
          ]}
          removedSamples={feedbackImportDraft.removed.slice(0, 6).map(
            (item) => `${item.id} · ${item.model} · ${item.issueItem}`
          )}
          onClose={() => setFeedbackImportDraft(null)}
          onConfirm={handleConfirmFeedbackImport}
        />
      )}

      {/* Correcting limits on an existing effective date that frozen records used */}
      {specCorrection && (
        <SpecCorrectionModal
          name={specCorrection.spec.name}
          code={specCorrection.spec.code}
          unit={specCorrection.spec.unit}
          effectiveFrom={specCorrection.effectiveFrom}
          previous={specCorrection.previous}
          next={specCorrection.limits}
          affected={specCorrection.affected}
          onCancel={() => setSpecCorrection(null)}
          onApply={handleApplySpecCorrection}
        />
      )}

      {/* State history: preview a save's per-slice changes and restore it */}
      {stateHistory && (
        <StateHistoryPanel
          current={stateHistory.current}
          revisions={stateHistory.revisions}
          limit={stateHistory.limit}
          loading={stateHistory.loading}
          error={stateHistory.error}
          selected={stateHistory.selected}
          selectedMeta={stateHistory.meta}
          data={stateHistory.data}
          loadingRevision={stateHistory.loadingRevision}
          restoring={stateHistory.restoring}
          local={buildWorkspacePayload()}
          blockedReason={
            syncConflict
              ? 'Resolve the save conflict first.'
              : cloudSync.status === 'saving' || cloudSync.status === 'loading'
              ? 'Wait for the current sync to finish.'
              : null
          }
          onSelect={selectStateHistoryRevision}
          onRestore={restoreStateHistoryRevision}
          onClose={closeStateHistory}
        />
      )}

      {/* Save conflict: local edits are kept until the user picks a version */}
      {syncConflict && (
        <SyncConflictModal
          revision={syncConflict.revision}
          remoteMeta={syncConflict.remoteMeta}
          local={buildWorkspacePayload()}
          remote={syncConflict.remote}
          loading={syncConflict.loading}
          error={syncConflict.error}
          onKeepLocal={handleConflictKeepLocal}
          onUseRemote={handleConflictUseRemote}
        />
      )}

      {/* Blocked clipboard: the same export text, pre-selected for a manual copy */}
      {workspaceExportCopy && (
        <WorkspaceExportModal
          json={workspaceExportCopy.json}
          revision={workspaceExportCopy.revision}
          reason={workspaceExportCopy.reason}
          onClose={() => setWorkspaceExportCopy(null)}
        />
      )}

      {/* Functional Gate Sign-Off Modal */}
      {signOffModal && (() => {
        const modalProj = projectMap[signOffModal.projectId];
        const modalPrimaryKey = signOffModal.lineKeys?.[0];
        const modalDossier =
          gateRecords[signOffModal.projectId]?.[modalPrimaryKey]?.[signOffModal.gateId];
        const modalApprover = modalDossier?.approvers?.[signOffModal.approverIndex];
        if (!modalProj || !modalApprover) return null;
        return (
          <ApproverSignOffModal
            project={modalProj}
            selectedLineKeys={signOffModal.lineKeys}
            allLineVariants={getLineVariantsForProject(modalProj)}
            gate={gateMap[signOffModal.gateId]}
            approver={modalApprover}
            signerEmail={cloudSync.userEmail || ''}
            onClose={() => setSignOffModal(null)}
            onSubmit={(decision, remark, targetKeys, signerEmail) =>
              handleSubmitApproverDecision(
                signOffModal.projectId,
                targetKeys,
                signOffModal.gateId,
                signOffModal.approverIndex,
                decision,
                remark,
                signerEmail
              )
            }
          />
        );
      })()}

      {/* Toast Notification */}
      {toast && (
        <div
          className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-2 ${
            toast.tone === 'warning'
              ? 'bg-amber-950 text-amber-100 dark:text-amber-100 border-amber-800'
              : 'bg-slate-900 dark:bg-slate-700 text-white border-slate-700'
          }`}
        >
          <CheckCircle2 className="w-4 h-4 text-emerald-400 dark:text-emerald-400 shrink-0" />
          <span>{toast.message}</span>
        </div>
      )}
    </div>
  );
}

</script>
