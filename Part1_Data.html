function computeCostSavingMetrics(item) {
  const hc = Math.max(0, Number(item?.hcReduction) || 0);
  const budgetThb = Math.max(0, Number(item?.budgetThb) || 0);
  const quotedCostThb = Math.max(0, Number(item?.quotedCostThb) || 0);
  const extraAnnualMatThb = Math.max(0, Number(item?.annualMaterialSavingThb) || 0);

  const monthlySavingThb = hc * NMB_HC_MONTHLY_SAVING_THB + extraAnnualMatThb / 12;
  const annualSavingThb = monthlySavingThb * 12;
  const budgetVarianceThb = budgetThb - quotedCostThb;
  const roiMonths =
    quotedCostThb > 0 && monthlySavingThb > 0 ? quotedCostThb / monthlySavingThb : 0;

  return {
    hc,
    budgetThb,
    quotedCostThb,
    monthlySavingThb,
    annualSavingThb,
    budgetVarianceThb,
    roiMonths
  };
}

function formatThbCompact(val) {
  const num = Number(val) || 0;
  const abs = Math.abs(num);
  const sign = num < 0 ? '-' : '';
  if (abs >= 1000000) return `${sign}฿${(abs / 1000000).toFixed(2)}M`;
  if (abs >= 1000) return `${sign}฿${(abs / 1000).toFixed(0)}k`;
  return `${sign}฿${abs.toFixed(0)}`;
}

function formatThbExact(val) {
  const num = Number(val) || 0;
  return `฿${Math.round(num).toLocaleString()}`;
}

function exportCostProjectsCsv(items) {
  const header =
    'ID,ProjectTitle,Model,Family,Phase,Category,Vendor,HCReduction,BudgetTHB,QuotedActualTHB,MonthlySavingTHB,AnnualSavingTHB,ROIMonths,Feasibility,Stage,FYTarget,Owner';
  const rows = items.map((p) => {
    const m = computeCostSavingMetrics(p);
    return [
      csvText(p.id),
      csvText(p.title),
      csvText(p.model),
      csvText(p.familyGroup),
      csvText(p.phase),
      csvText(p.category),
      csvText(p.vendor),
      m.hc,
      m.budgetThb,
      m.quotedCostThb,
      Math.round(m.monthlySavingThb),
      Math.round(m.annualSavingThb),
      m.roiMonths.toFixed(1),
      csvText(p.feasibility),
      csvText(p.stage),
      csvText(p.fyTarget || 'FY2026'),
      csvText(p.owner)
    ].join(',');
  });
  triggerCsvDownload('Cost_initiative_and_automation_Projects_Export.csv', [header, ...rows].join('\n'));
}

function exportCustomerFeedbackCsv(items) {
  const header =
    'No,Location,FeedbackDate,FACA,Severity,Model,Family,DateCode,Build,BuildConfig,IssueCategory,IssueItem,NGQty,RTVDate,Category,D1-D3,D4,D5,D6,D7,FinalD8,NMBStatus,CustomerStatus,Remark';
  const rows = items.map((c, idx) =>
    [
      c.no || idx + 1,
      csvText(c.location),
      csvText(c.feedbackDate),
      csvText(c.facaNo || ''),
      csvText(c.severity || ''),
      csvText(c.model),
      csvText(c.familyGroup || ''),
      csvText(c.dateCode || ''),
      csvText(c.build || ''),
      csvText(c.buildConfig || ''),
      csvText(c.issueCategory || ''),
      csvText(c.issueItem || ''),
      c.ngQty || 0,
      csvText(c.rtvDate || ''),
      csvText(c.category || 'Feedback'),
      csvText(c.eightD?.d1d3 || 'Open'),
      csvText(c.eightD?.d4 || 'Open'),
      csvText(c.eightD?.d5 || 'Open'),
      csvText(c.eightD?.d6 || 'Open'),
      csvText(c.eightD?.d7 || 'Open'),
      csvText(c.eightD?.d8 || 'Open'),
      csvText(c.nmbStatus || 'Open'),
      csvText(c.customerStatus || 'Open'),
      csvText(c.remark || '')
    ].join(',')
  );
  triggerCsvDownload('FFM_Customer_feedback_Export.csv', [header, ...rows].join('\n'));
}

// Tasks & AIL categories — every action item carries one of these.
const TASK_CATEGORIES = ['Yield and Scrap', 'Cost reduction', 'Customer feedback', 'DOE'];

// Items logged before the category field existed stay "Uncategorised" until someone sets them.
const TASK_UNCATEGORISED = 'Uncategorised';

const TASK_CATEGORY_STYLES = {
  'Yield and Scrap': 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800',
  'Cost reduction': 'bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800',
  'Customer feedback': 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-200 dark:border-amber-800',
  DOE: 'bg-violet-50 dark:bg-violet-950 text-violet-700 dark:text-violet-300 border-violet-200 dark:border-violet-800',
  [TASK_UNCATEGORISED]: 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800'
};

function normalizeTask(task) {
  if (!task || typeof task !== 'object') return task;
  const category = TASK_CATEGORIES.includes(task.category) ? task.category : TASK_UNCATEGORISED;
  return { ...task, category };
}

// Production stations map onto the numbered process steps used by tasks and the AIL register.
const PROCESS_STEP_BY_STATION = {
  'Bearing Assy (FDB)': '2. Rotor Assembly',
  'Rotor Assembly': '2. Rotor Assembly',
  'Pillow Stator Assy': '3. Pillow Stator Assy',
  'Fan Assembly': '4. Fan Assembly',
  'Fan Test & Accessory': '5. Fan Test & Accessory',
  'Final Inspection (OQC)': '6. Final Inspection (OQC)'
};

// One process step per entity: tasks carry it directly, production records by station.
function getProcessStep(entity) {
  if (!entity) return null;
  if (entity.processStep) return entity.processStep;
  if (entity.station) return PROCESS_STEP_BY_STATION[entity.station] || null;
  return null;
}

function computeProductionMetrics(rec) {
  const input = Math.max(0, Number(rec.input) || 0);
  const defectItems = Array.isArray(rec.defectItems) ? rec.defectItems : [];
  const downtimeEvents = Array.isArray(rec.downtimeEvents) ? rec.downtimeEvents : [];

  // Fallout = initial rejected defects before salvage
  const fallout =
    defectItems.length > 0
      ? defectItems.reduce((sum, d) => sum + Math.max(0, Number(d.falloutQty) || 0), 0)
      : Math.max(0, Number(rec.fallout) || 0);

  // Salvage = recovered/reworked units from initial fallout (clamped <= fallout per defect)
  const salvage =
    defectItems.length > 0
      ? defectItems.reduce((sum, d) => {
          const f = Math.max(0, Number(d.falloutQty) || 0);
          const s = Math.min(f, Math.max(0, Number(d.salvageQty) || 0));
          return sum + s;
        }, 0)
      : Math.min(fallout, Math.max(0, Number(rec.salvage) || 0));

  const netReject = Math.max(0, fallout - salvage);
  const downtimeMin =
    downtimeEvents.length > 0
      ? downtimeEvents.reduce((sum, e) => sum + Math.max(0, Number(e.durationMin) || 0), 0)
      : Math.max(0, (Number(rec.downtimeHr) || 0) * 60);
  const downtimeHr = downtimeMin / 60;
  const plannedTimeHr = Math.max(0, Number(rec.plannedTimeHr) || 0);
  const runTimeHr = Math.max(0, plannedTimeHr - downtimeHr);

  // FPY = (Input - Fallout) / Input
  const fpy = input > 0 ? Math.max(0, ((input - fallout) / input) * 100) : 0;
  // FY = (Input - Fallout + Salvage) / Input
  const fy = input > 0 ? Math.min(100, Math.max(0, ((input - fallout + salvage) / input) * 100)) : 0;

  const finalGood = Math.max(0, input - netReject);
  const uph = plannedTimeHr > 0 ? finalGood / plannedTimeHr : 0;
  const inputUph = runTimeHr > 0 ? input / runTimeHr : 0;
  const efficiency = inputUph > 0 ? Math.min(100, (uph / inputUph) * 100) : 0;

  return {
    input,
    plannedTimeHr,
    fallout,
    salvage,
    netReject,
    downtimeMin,
    downtimeHr,
    runTimeHr,
    fpy,
    fy,
    uph,
    efficiency
  };
}

// A gate with no dossier, and any status this list does not know, reads as unsigned.
const GANTT_GATE_UNSIGNED_TONE = GANTT_GATE_TONES.find((tone) => tone.status === 'Pending');

function ganttGateTone(status) {
  return GANTT_GATE_TONES.find((tone) => tone.status === status) || GANTT_GATE_UNSIGNED_TONE;
}

// The tone a stage bar is painted with. A row with several lines (a Compact Config
// row spans both sides) takes its weakest line, so a combined bar is never more
// optimistic than its worst line; with no line to judge, the gate is unsigned.
function ganttStageGateTone(projGateLines, rowKeys, gateId) {
  const keys = rowKeys || [];
  if (keys.length === 0) return GANTT_GATE_UNSIGNED_TONE;
  return keys.reduce((worst, key) => {
    const tone = ganttGateTone(projGateLines?.[key]?.[gateId]?.status);
    return GANTT_GATE_TONES.indexOf(tone) > GANTT_GATE_TONES.indexOf(worst) ? tone : worst;
  }, GANTT_GATE_TONES[0]);
}

function parseIsoDate(iso) {
  const [y, m, d] = (iso || todayIso()).split('-').map(Number);
  return new Date(Date.UTC(y || 2026, (m || 1) - 1, d || 1));
}

function addDaysIso(iso, deltaDays) {
  const dt = parseIsoDate(iso);
  dt.setUTCDate(dt.getUTCDate() + deltaDays);
  const y = dt.getUTCFullYear();
  const m = String(dt.getUTCMonth() + 1).padStart(2, '0');
  const d = String(dt.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function diffDaysIso(startIso, endIso) {
  const ms = parseIsoDate(endIso).getTime() - parseIsoDate(startIso).getTime();
  return Math.round(ms / 86400000);
}

function formatShortDate(iso) {
  if (!iso) return '—';
  const dt = parseIsoDate(iso);
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${months[dt.getUTCMonth()]} ${dt.getUTCDate()}`;
}

function getDefaultScheduleForRow(project, row) {
  const mih = row?.fatpMih || project?.mihDate?.split('/')[0]?.trim() || '2026-12-24';
  const etd = addDaysIso(mih, -4);
  const oqcEnd = addDaysIso(etd, -2);
  const oqcStart = addDaysIso(oqcEnd, -2);
  const mainEnd = addDaysIso(oqcStart, -1);
  const mainStart = addDaysIso(mainEnd, -5);
  const mboEnd = addDaysIso(mainStart, -1);
  const mboStart = addDaysIso(mboEnd, -2);
  const brrEnd = addDaysIso(mboStart, -1);
  const prepStart = addDaysIso(brrEnd, -5);
  const pbr = addDaysIso(mih, 4);

  return {
    prepStart,
    brrEnd,
    mboStart,
    mboEnd,
    mainStart,
    mainEnd,
    oqcStart,
    oqcEnd,
    etd,
    mih,
    pbr
  };
}

function getLineReadinessInfo(lineGates = {}) {
  const allStatuses = Object.values(lineGates).map((g) => g.status);
  if (allStatuses.includes('Blocked')) {
    return { rank: 3, label: 'Hold', tone: 'rose', hasHold: true };
  }
  if (lineGates.brr?.status === 'Approved') {
    return { rank: 0, label: 'MBO Ready', tone: 'emerald', hasHold: false };
  }
  if (lineGates.bbr?.status === 'Approved') {
    return { rank: 1, label: 'BRR Ready', tone: 'blue', hasHold: false };
  }
  return { rank: 2, label: 'Preparing', tone: 'amber', hasHold: false };
}

function buildSequencedGanttItems(project, visibleMatrix, projGateLines, scheduleOverrides, sequenceMode) {
  const enriched = visibleMatrix.map((row) => {
    const side = row.side || 'RHS';
    const key = `${row.config}-${side}`;
    const lineGates = projGateLines[key] || {};
    const readiness = getLineReadinessInfo(lineGates);
    const manual = scheduleOverrides[`${project.id}::${key}`] || null;
    const baseSchedule = manual || getDefaultScheduleForRow(project, row);
    const qty = computeBuildMatrixRow(row).totalProduction;

    return {
      row,
      side,
      key,
      readiness,
      manual,
      baseSchedule,
      qty
    };
  });

  const sidePriorityOrder =
    sequenceMode === 'rhs-first' ? ['RHS', 'LHS', 'Single'] : ['LHS', 'RHS', 'Single'];

  enriched.sort((a, b) => {
    if (sequenceMode === 'readiness') {
      if (a.readiness.rank !== b.readiness.rank) return a.readiness.rank - b.readiness.rank;
      const mihCmp = a.baseSchedule.mih.localeCompare(b.baseSchedule.mih);
      if (mihCmp !== 0) return mihCmp;
      const sCmp = sidePriorityOrder.indexOf(a.side) - sidePriorityOrder.indexOf(b.side);
      if (sCmp !== 0) return sCmp;
      return a.row.config.localeCompare(b.row.config, undefined, { numeric: true });
    }

    const sCmp = sidePriorityOrder.indexOf(a.side) - sidePriorityOrder.indexOf(b.side);
    if (sCmp !== 0) return sCmp;
    const mihCmp = a.baseSchedule.mih.localeCompare(b.baseSchedule.mih);
    if (mihCmp !== 0) return mihCmp;
    return a.row.config.localeCompare(b.row.config, undefined, { numeric: true });
  });

  const items = [];
  let seqNum = 1;
  let prevSide = null;
  let prevMainEnd = null;

  enriched.forEach((entry) => {
    if (prevSide && prevSide !== entry.side && prevMainEnd) {
      const convStart = addDaysIso(prevMainEnd, 1);
      const convEnd = addDaysIso(convStart, 1);
      items.push({
        type: 'conversion',
        id: `${project.id}-conv-${prevSide}-${entry.side}-${seqNum}`,
        fromSide: prevSide,
        toSide: entry.side,
        label: `Line Conversion ${prevSide} → ${entry.side}`,
        sublabel: 'Docking fixture, OMM nest & auto-tester changeover (2d)',
        startIso: convStart,
        endIso: convEnd
      });
    }

    const schedule = entry.manual
      ? entry.baseSchedule
      : entry.readiness.hasHold && sequenceMode === 'readiness'
      ? {
          ...entry.baseSchedule,
          mboStart: addDaysIso(entry.baseSchedule.mboStart, 4),
          mboEnd: addDaysIso(entry.baseSchedule.mboEnd, 4),
          mainStart: addDaysIso(entry.baseSchedule.mainStart, 4),
          mainEnd: addDaysIso(entry.baseSchedule.mainEnd, 4)
        }
      : entry.baseSchedule;

    items.push({
      type: 'build',
      id: `${project.id}-${entry.key}`,
      seqNum: seqNum++,
      label: entry.row.config,
      sideBadge: entry.side,
      sublabel: entry.row.vendors,
      qty: entry.qty,
      rowKeys: [entry.key],
      primaryLineKey: entry.key,
      schedule,
      hasHold: entry.readiness.hasHold,
      readiness: entry.readiness,
      isManualOverride: Boolean(entry.manual)
    });

    prevSide = entry.side;
    prevMainEnd = schedule.mainEnd;
  });

  return items;
}

function normalCdf(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp((-z * z) / 2);
  const prob =
    d * t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return z > 0 ? 1 - prob : prob;
}

function computeCapabilityStats(rec, spec) {
  if (!rec || !spec) {
    return { cpk: 0, cp: null, cpl: null, cpu: null, ppm: 0 };
  }
  const mean = Number(rec.mean) || 0;
  const sd = Math.max(0.00001, Number(rec.stdDev) || 0.00001);
  const hasLsl = spec.specType !== 'upper' && spec.lsl !== null && spec.lsl !== '';
  const hasUsl = spec.specType !== 'lower' && spec.usl !== null && spec.usl !== '';
  const lsl = hasLsl ? Number(spec.lsl) : null;
  const usl = hasUsl ? Number(spec.usl) : null;

  const cpl = lsl !== null ? (mean - lsl) / (3 * sd) : null;
  const cpu = usl !== null ? (usl - mean) / (3 * sd) : null;
  const cp = lsl !== null && usl !== null ? (usl - lsl) / (6 * sd) : null;

  let cpk = 0;
  if (cpl !== null && cpu !== null) cpk = Math.min(cpl, cpu);
  else if (cpu !== null) cpk = cpu;
  else if (cpl !== null) cpk = cpl;

  const lowerFail = lsl !== null ? normalCdf((lsl - mean) / sd) : 0;
  const upperFail = usl !== null ? 1 - normalCdf((usl - mean) / sd) : 0;
  const ppm = Math.max(0, Math.round((lowerFail + upperFail) * 1000000));

  return {
    cpk: Number.isFinite(cpk) ? cpk : 0,
    cp: cp !== null && Number.isFinite(cp) ? cp : null,
    cpl: cpl !== null && Number.isFinite(cpl) ? cpl : null,
    cpu: cpu !== null && Number.isFinite(cpu) ? cpu : null,
    ppm
  };
}

function getCpkTone(cpk) {
  if (cpk > 1.33) {
    return {
      key: 'green',
      label: 'Capable',
      cellClass: 'bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 border-emerald-300 dark:border-emerald-700 hover:bg-emerald-100 dark:hover:bg-emerald-900',
      badgeClass: 'bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 border-emerald-300 dark:border-emerald-700'
    };
  }
  if (cpk >= 1.0) {
    return {
      key: 'yellow',
      label: 'Marginal',
      cellClass: 'bg-yellow-50 dark:bg-yellow-950 text-yellow-900 dark:text-yellow-100 border-yellow-300 dark:border-yellow-700 hover:bg-yellow-100 dark:hover:bg-yellow-900',
      badgeClass: 'bg-yellow-50 dark:bg-yellow-950 text-yellow-900 dark:text-yellow-100 border-yellow-300 dark:border-yellow-700'
    };
  }
  return {
    key: 'orange',
    label: 'Incapable',
    cellClass: 'bg-orange-50 dark:bg-orange-950 text-orange-900 dark:text-orange-100 border-orange-300 dark:border-orange-700 hover:bg-orange-100 dark:hover:bg-orange-900',
    badgeClass: 'bg-orange-50 dark:bg-orange-950 text-orange-900 dark:text-orange-100 border-orange-300 dark:border-orange-700'
  };
}

function formatSpecNum(val, spec) {
  const num = Number(val);
  if (!Number.isFinite(num)) return '—';
  const abs = Math.abs(num);
  if (spec?.unit === 'N') return num.toFixed(1);
  if (abs > 0 && abs < 0.05) return num.toFixed(4);
  return num.toFixed(3);
}

function parseCsvText(text) {
  const cleaned = (text || '').replace(/^\uFEFF/, '').trim();
  if (!cleaned) return { headers: [], rows: [] };
  const lines = cleaned.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length < 2) return { headers: [], rows: [] };

  const delimiter = lines[0].includes('\t') && !lines[0].includes(',') ? '\t' : ',';
  const splitLine = (line) => {
    const out = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          cur += '"';
          i += 1;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === delimiter && !inQuotes) {
        out.push(cur.trim());
        cur = '';
      } else {
        cur += ch;
      }
    }
    out.push(cur.trim());
    return out;
  };

  const headers = splitLine(lines[0]).map((h) => h.replace(/^"|"$/g, '').trim());
  const rows = lines.slice(1).map((line) => {
    const cells = splitLine(line);
    const obj = {};
    headers.forEach((h, idx) => {
      obj[h] = cells[idx] !== undefined ? cells[idx].replace(/^"|"$/g, '').trim() : '';
    });
    return obj;
  });

  return { headers, rows };
}

async function loadSheetJsLib() {
  // Bundled by tools/build.mjs from the pinned xlsx dependency (window.XLSX).
  if (typeof XLSX !== 'undefined') return XLSX;
  if (typeof window !== 'undefined' && window.XLSX) return window.XLSX;
  throw new Error('Excel parser is missing from this build. Please upload a .csv file.');
}

async function parseUploadedTabularFile(file) {
  const name = (file?.name || '').toLowerCase();
  if (name.endsWith('.csv') || name.endsWith('.tsv') || name.endsWith('.txt')) {
    const text = await file.text();
    return parseCsvText(text);
  }
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    const XLSX = await loadSheetJsLib();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const firstSheet = wb.SheetNames[0];
    const ws = wb.Sheets[firstSheet];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (!aoa || aoa.length < 2) return { headers: [], rows: [] };
    const headers = aoa[0].map((h) => String(h || '').trim());
    const rows = aoa
      .slice(1)
      .filter((r) => r.some((cell) => String(cell || '').trim() !== ''))
      .map((r) => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = r[i] !== undefined ? r[i] : '';
        });
        return obj;
      });
    return { headers, rows };
  }
  throw new Error('Unsupported file type. Please upload .xlsx, .xls, or .csv.');
}

/**
 * Resolves an uploaded parameter column/name to a Master Spec.
 *
 * The same parameter can exist once per model plus once as an all-models spec,
 * so a plain "first match wins" would bind a X3082 upload to a X4151 limit.
 * Candidates are therefore ranked: the record's own model, then the all-models
 * spec, and only as a last resort another model's spec.
 */
function findMatchingSpec(colHeader, masterSpecs, model) {
  const norm = String(colHeader || '')
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
  if (!norm) return null;
  const modelKey = String(model || '').toUpperCase().trim();

  const candidates = masterSpecs.filter((s) => {
    const codeNorm = s.code.toLowerCase().replace(/[^a-z0-9]/g, '');
    const nameNorm = s.name.toLowerCase().replace(/[^a-z0-9]/g, '');
    return norm === codeNorm || norm === nameNorm || norm.includes(codeNorm);
  });
  if (!candidates.length) return null;

  return (
    candidates.find((s) => modelKey && String(s.model || '').toUpperCase() === modelKey) ||
    candidates.find((s) => !s.model) ||
    candidates[0]
  );
}

// ============================================================================
// EFFECTIVE-DATED MASTER SPECIFICATION REVISIONS
// ----------------------------------------------------------------------------
// A limit is only true for the window it was in force. Every spec therefore
// keeps its limit history, and a Cpk is computed with the revision whose
// `effectiveFrom` is the latest one on or before the record's measured date —
// so tightening a limit today cannot restate yesterday's capability.
// ============================================================================

const SPEC_LIMIT_FIELDS = ['specType', 'lsl', 'nominal', 'usl', 'cpkTarget'];
// Revision-less specs (everything saved before limit history existed) read as
// one baseline revision that predates every measurement.
const SPEC_BASELINE_EFFECTIVE = '2000-01-01';

function specLimitSnapshot(source) {
  const snapshot = {};
  SPEC_LIMIT_FIELDS.forEach(function (field) {
    snapshot[field] = source ? source[field] : undefined;
  });
  return snapshot;
}

/** Limit revisions, oldest first. Always returns at least one entry for a spec. */
function getSpecRevisions(spec) {
  if (!spec) return [];
  const stored = Array.isArray(spec.revisions) ? spec.revisions : [];
  const usable = stored.filter(
    (rev) => rev && typeof rev.effectiveFrom === 'string' && rev.effectiveFrom
  );
  if (usable.length === 0) {
    return [
      Object.assign(
        {
          id: `${spec.id}-R0`,
          effectiveFrom: spec.effectiveFrom || SPEC_BASELINE_EFFECTIVE,
          updatedAt: null,
          updatedBy: null,
          baseline: true
        },
        specLimitSnapshot(spec)
      )
    ];
  }
  return usable
    .slice()
    .sort((a, b) => String(a.effectiveFrom).localeCompare(String(b.effectiveFrom)));
}

/** The revision in force on a date: the latest `effectiveFrom` on or before it. */
function resolveSpecAt(spec, isoDate) {
  const revisions = getSpecRevisions(spec);
  if (revisions.length === 0) return null;
  const date = typeof isoDate === 'string' ? isoDate.slice(0, 10) : '';
  let inForce = null;
  revisions.forEach((rev) => {
    if (!date || String(rev.effectiveFrom) <= date) inForce = rev;
  });
  return {
    revision: inForce || revisions[0],
    revisions,
    // Measured before any recorded revision: the earliest limits are the honest
    // best guess, and the UI says so rather than pretending it is exact.
    predatesFirstRevision: !inForce
  };
}

// ---------------------------------------------------------------------------
// Cpk limit freeze: every Cpk record keeps the limits it was judged against, so
// correcting or revising a Master Spec later cannot change a result that has
// already been reported.
// ---------------------------------------------------------------------------

/** True when a record already carries the limits it was measured against. */
function hasFrozenSpecLimits(record) {
  return Boolean(record && record.specRevisionId && record.specType);
}

/** A copy of the record with the limits in force on its measurement date baked in. */
function withFrozenSpecLimits(record, spec) {
  if (!record) return record;
  const resolved = resolveSpecAt(spec, record.date);
  if (!resolved) return record;
  const revision = resolved.revision;
  return Object.assign({}, record, specLimitSnapshot(revision), {
    specRevisionId: revision.id,
    specEffectiveFrom: revision.effectiveFrom,
    specRevisionNumber: resolved.revisions.indexOf(revision) + 1,
    // Kept on the record too: resolving it later would guess differently once
    // the spec gains a revision that predates this measurement.
    specPredatesFirstRevision: resolved.predatesFirstRevision
  });
}

/**
 * Backfills rows saved before limits were frozen on them. Each row is frozen
 * against the revision in force on its own measurement date — exactly the
 * revision the app was already displaying for it — so no visible number moves.
 */
function migrateCpkRecords(records, specs) {
  if (!Array.isArray(records)) return records;
  const byId = new Map((Array.isArray(specs) ? specs : []).map((spec) => [spec.id, spec]));
  return records.map((record) => {
    if (hasFrozenSpecLimits(record)) return record;
    const spec = byId.get(record && record.specId);
    return spec ? withFrozenSpecLimits(record, spec) : record;
  });
}

/**
 * A spec merged with the limits the record was measured against.
 *
 * A frozen record wins over the spec's history: it keeps the limits and revision
 * captured at measurement time, even after that revision is corrected or a newer
 * one takes effect. Only legacy rows without a snapshot fall back to resolving
 * the revision from their date.
 */
function effectiveSpecForRecord(spec, record) {
  if (!spec) return null;
  const revisions = getSpecRevisions(spec);
  if (hasFrozenSpecLimits(record)) {
    const frozen = {};
    SPEC_LIMIT_FIELDS.forEach(function (field) {
      if (record[field] !== undefined) frozen[field] = record[field];
    });
    return Object.assign({}, spec, frozen, {
      effectiveFrom: record.specEffectiveFrom || '',
      revisionNumber: Number(record.specRevisionNumber) || 1,
      revisionCount: revisions.length,
      predatesFirstRevision: Boolean(record.specPredatesFirstRevision)
    });
  }
  const resolved = resolveSpecAt(spec, record && record.date);
  if (!resolved) return spec;
  return Object.assign({}, spec, specLimitSnapshot(resolved.revision), {
    effectiveFrom: resolved.revision.effectiveFrom,
    revisionNumber: resolved.revisions.indexOf(resolved.revision) + 1,
    revisionCount: resolved.revisions.length,
    predatesFirstRevision: resolved.predatesFirstRevision
  });
}

/** Cpk records whose frozen snapshot came from one specific spec revision. */
function recordsFrozenToRevision(records, specId, revisionId) {
  if (!Array.isArray(records) || !specId || !revisionId) return [];
  return records.filter(
    (record) => record && record.specId === specId && record.specRevisionId === revisionId
  );
}

/**
 * Re-freezes the records measured under one revision onto its current limits.
 * Records from other revisions, and every other field, are left untouched.
 */
function refreezeCpkRecordsToRevision(records, spec, revisionId) {
  if (!Array.isArray(records) || !spec) return records;
  const revision = getSpecRevisions(spec).find((rev) => rev.id === revisionId);
  if (!revision) return records;
  const snapshot = specLimitSnapshot(revision);
  return records.map((record) => {
    if (!record || record.specId !== spec.id || record.specRevisionId !== revisionId) return record;
    return Object.assign({}, record, snapshot);
  });
}

/**
 * Replaces one revision's limits in place — the explicit "fix a mistake on this
 * effective date" path, used only after the user confirms it. Every other
 * revision keeps its own limits, and the revision keeps its id and date.
 */
function correctSpecRevision(spec, limits, revisionId, stamp, actor) {
  if (!spec) return null;
  const history = getSpecRevisions(spec).map((rev) => ({ ...rev }));
  const index = history.findIndex((rev) => rev.id === revisionId);
  if (index === -1) return null;
  history[index] = Object.assign({}, history[index], limits, {
    id: history[index].id,
    effectiveFrom: history[index].effectiveFrom,
    updatedAt: stamp,
    updatedBy: actor
  });
  const latest = history[history.length - 1];
  return Object.assign({}, spec, specLimitSnapshot(latest), {
    effectiveFrom: latest.effectiveFrom,
    revisions: history
  });
}

/** True when two limit snapshots differ (form values arrive as strings). */
function specLimitsDiffer(a, b) {
  const left = a || {};
  const right = b || {};
  return SPEC_LIMIT_FIELDS.some(
    (field) => String(left[field] === null ? '' : left[field]) !== String(right[field] === null ? '' : right[field])
  );
}

/**
 * Apply an edit to a spec's limit history without rewriting the past.
 *
 * A different limit on a date already on file is rejected: correcting an older
 * entry would restate the window that Cpk records from that date were judged
 * against. Metadata-only edits add nothing, and a genuinely new effective date
 * appends one revision. The caller owns the identity fields and the resulting
 * spec; this helper only decides what happens to the revision history.
 */
function applySpecLimitEdit(spec, limits, effectiveFrom, stamp, actor) {
  if (!spec) return null;
  const history = getSpecRevisions(spec).map((rev) => ({ ...rev }));
  const sameDay = history.find((rev) => rev.effectiveFrom === effectiveFrom);
  const latest = history[history.length - 1];
  if (sameDay && specLimitsDiffer(sameDay, limits)) return { rejected: true, history };
  if (!sameDay && specLimitsDiffer(latest, limits)) {
    history.push({
      id: `${spec.id}-R${history.length + 1}`,
      effectiveFrom,
      ...limits,
      updatedAt: stamp,
      updatedBy: actor
    });
    history.sort((a, b) => String(a.effectiveFrom).localeCompare(String(b.effectiveFrom)));
    return { rejected: false, outcome: 'revision', history };
  }
  return { rejected: false, outcome: 'metadata', history };
}

/** "2026-11-25 · R3", or the recorded baseline, for tables and tooltips. */
function describeSpecLimits(spec) {
  const revisions = getSpecRevisions(spec);
  const latest = revisions[revisions.length - 1];
  if (!latest) return { count: 0, effectiveFrom: '', label: '—' };
  return {
    count: revisions.length,
    effectiveFrom: latest.effectiveFrom,
    label: latest.baseline
      ? `baseline (${latest.effectiveFrom})`
      : `${latest.effectiveFrom} · R${revisions.length}`
  };
}

function inferFamilyFromModel(model) {
  const m = String(model || '').toUpperCase();
  if (['X3083', 'X4152', 'X3439', 'X4285'].includes(m)) return 'MB16"';
  if (m === 'X3721') return 'iMac';
  if (m === 'X3784') return 'MacMini';
  if (m === 'X2689') return 'Display';
  return 'MB14"';
}

/**
 * Reads a measurement date from an imported cell. Only unambiguous formats are
 * accepted (ISO, YYYY/MM/DD, DD-MMM-YYYY, a Date, an Excel serial, or D/M/Y
 * when the positions cannot be confused). Anything else is refused rather than
 * guessed: a wrong date would bind the record to the wrong limit revision.
 */
function toIsoDate(value) {
  const pad = (n) => String(n).padStart(2, '0');
  if (value === null || value === undefined || value === '') return '';
  if (value instanceof Date && !Number.isNaN(value.getTime())) {
    return `${value.getFullYear()}-${pad(value.getMonth() + 1)}-${pad(value.getDate())}`;
  }
  if (typeof value === 'number' && Number.isFinite(value) && value > 20000 && value < 80000) {
    const dt = new Date(Math.round((value - 25569) * 86400000));
    return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
  }
  const text = String(value).trim();
  let m = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = text.match(/^(\d{1,2})[- ]([A-Za-z]{3,})[- ](\d{4})$/);
  if (m) {
    const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    const mi = months.indexOf(m[2].slice(0, 3).toLowerCase());
    if (mi >= 0) return `${m[3]}-${pad(mi + 1)}-${pad(m[1])}`;
  }
  m = text.match(/^(\d{1,2})[\/](\d{1,2})[\/](\d{4})$/);
  if (m) {
    const a = Number(m[1]);
    const b = Number(m[2]);
    // 4/11/2026 is either 4 Nov or 11 Apr: refuse instead of guessing.
    if (a > 12 && b <= 12) return `${m[3]}-${pad(b)}-${pad(a)}`;
    if (b > 12 && a <= 12) return `${m[3]}-${pad(a)}-${pad(b)}`;
    return '';
  }
  if (/^\d{5}$/.test(text)) return toIsoDate(Number(text));
  return '';
}

function analyzeUploadedCpkRows(headers, rows, masterSpecs, defaults, fileName) {
  const warnings = [];
  const findCol = (aliases) =>
    headers.find((h) => {
      const n = h.toLowerCase().replace(/[^a-z0-9]/g, '');
      // Short aliases (n, no, id, sn) must match exactly; substring matching
      // would wrongly pick columns such as "Mean" or "Nominal".
      return aliases.some((a) =>
        a.length <= 2 ? n === a : n === a || n.startsWith(a) || n.endsWith(a)
      );
    }) || null;

  const modelCol = findCol(['model', 'product']);
  const phaseCol = findCol(['phase', 'stage']);
  const sideCol = findCol(['side', 'fanside']);
  const configCol = findCol(['config', 'cfg']);
  const paramCol = findCol(['paramcode', 'parameter', 'param', 'speccode']);
  const meanCol = findCol(['mean', 'avg', 'average']);
  const stdCol = findCol(['stddev', 'stdev', 'sigma', 'std']);
  const nCol = findCol(['samplesize', 'count', 'qty', 'n']);
  const dateCol = findCol(['measureddate', 'testdate', 'inspectiondate', 'date']);
  let undatedRows = 0;

  // Format 1: Pre-aggregated Summary Sheet (ParamCode + Mean + StdDev)
  if (paramCol && meanCol && stdCol) {
    const records = [];
    rows.forEach((r, idx) => {
      // Resolve the model first: the same parameter code may exist per model.
      const model = String(r[modelCol] || defaults.model || 'X4151').toUpperCase().trim();
      const spec = findMatchingSpec(r[paramCol], masterSpecs, model);
      if (!spec) {
        warnings.push(`Row ${idx + 2}: Parameter "${r[paramCol]}" did not match any Master Spec.`);
        return;
      }
      if (spec.model && spec.model.toUpperCase() !== model) {
        warnings.push(
          `Row ${idx + 2}: No ${model} specification for "${r[paramCol]}"; resolved to ${spec.code} (${spec.model}).`
        );
      }
      const mean = Number(r[meanCol]);
      const sd = Number(r[stdCol]);
      if (Number.isNaN(mean) || Number.isNaN(sd) || sd <= 0) {
        warnings.push(`Row ${idx + 2}: Invalid Mean/StdDev for ${spec.code}.`);
        return;
      }
      const phase = String(r[phaseCol] || defaults.phase || 'EVT').toUpperCase().trim();
      const side = String(r[sideCol] || defaults.side || 'RHS').toUpperCase().trim();
      const config = String(r[configCol] || defaults.config || 'ME11').toUpperCase().trim();
      const sampleSize = Math.max(5, Number(r[nCol]) || 32);
      const measuredAt = toIsoDate(dateCol ? r[dateCol] : '');
      if (dateCol && !measuredAt) undatedRows += 1;

      records.push(
        withFrozenSpecLimits(
          {
            id: `CPK-IMP-${model}-${side}-${spec.code}-${idx}`,
            model,
            familyGroup: inferFamilyFromModel(model),
            phase,
            side,
            config,
            specId: spec.id,
            mean,
            stdDev: sd,
            sampleSize,
            date: measuredAt || todayIso(),
            sourceFile: fileName
          },
          spec
        )
      );
    });

    if (undatedRows > 0) {
      warnings.push(
        `${undatedRows} row(s) had no readable measurement date; they are dated ${todayIso()} and use that day's limits.`
      );
    }

    return {
      format: `Pre-Aggregated Summary (${rows.length} rows)`,
      matchedSpecs: Array.from(new Set(records.map((r) => r.specId))),
      unmappedColumns: [],
      records,
      warnings
    };
  }

  // Format 2: Wide Raw Measurement Format (e.g., OMM / Dynamic Tester export: 1 row per measured unit)
  const metaCols = new Set(
    [
      modelCol,
      phaseCol,
      sideCol,
      configCol,
      dateCol,
      findCol(['serial', 'sn', 'unit', 'sample', 'no', 'id', 'time'])
    ].filter(Boolean)
  );
  // Headers that name a known parameter. The spec itself is resolved per row
  // group below, because the same header can mean a different model's limits.
  const specHeaders = [];
  const unmappedColumns = [];

  headers.forEach((h) => {
    if (metaCols.has(h)) return;
    if (findMatchingSpec(h, masterSpecs)) {
      specHeaders.push(h);
    } else {
      const numericVals = rows
        .map((r) => r[h])
        .filter((v) => v !== '' && v !== null && v !== undefined)
        .map(Number)
        .filter((n) => !Number.isNaN(n));
      if (numericVals.length >= 2) {
        const n = numericVals.length;
        const mean = numericVals.reduce((a, b) => a + b, 0) / n;
        const variance = numericVals.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / (n - 1);
        const sd = Math.max(0.0005, Math.sqrt(variance));
        const cleanCode = h
          .toUpperCase()
          .replace(/[^A-Z0-9]+/g, '_')
          .replace(/^_|_$/g, '')
          .slice(0, 14);
        unmappedColumns.push({
          header: h,
          suggestedCode: cleanCode || 'PARAM_NEW',
          suggestedName: h.replace(/_/g, ' '),
          count: n,
          mean,
          stdDev: sd,
          suggestedLsl: Number((mean - 4.5 * sd).toFixed(4)),
          suggestedNominal: Number(mean.toFixed(4)),
          suggestedUsl: Number((mean + 4.5 * sd).toFixed(4)),
          unit: 'mm'
        });
      }
    }
  });

  if (specHeaders.length === 0) {
    warnings.push(
      'No columns matched existing Master Spec codes. Use the Auto-Generate Master Spec panel below to register uploaded columns.'
    );
    return {
      format: `Wide Raw Measurements (${rows.length} units)`,
      matchedSpecs: [],
      unmappedColumns,
      records: [],
      warnings
    };
  }

  // Group raw readings by Model x Phase x Side x Config
  const grouped = new Map();
  rows.forEach((r) => {
    const model = String((modelCol && r[modelCol]) || defaults.model || 'X4151').toUpperCase().trim();
    const phase = String((phaseCol && r[phaseCol]) || defaults.phase || 'EVT').toUpperCase().trim();
    const side = String((sideCol && r[sideCol]) || defaults.side || 'RHS').toUpperCase().trim();
    const config = String((configCol && r[configCol]) || defaults.config || 'ME11').toUpperCase().trim();
    const gKey = `${model}::${phase}::${side}::${config}`;
    if (!grouped.has(gKey)) {
      grouped.set(gKey, { model, phase, side, config, rows: [] });
    }
    grouped.get(gKey).rows.push(r);
  });

  // A group is one measurement run; its date is the latest readable one, so a
  // multi-day export resolves against the limits in force when it finished.
  const groupDate = (groupRows) => {
    if (!dateCol) return todayIso();
    const dates = groupRows
      .map((r) => toIsoDate(r[dateCol]))
      .filter(Boolean)
      .sort();
    if (dates.length) return dates[dates.length - 1];
    undatedRows += 1;
    return todayIso();
  };

  const records = [];
  grouped.forEach((grp) => {
    specHeaders.forEach((header) => {
      const spec = findMatchingSpec(header, masterSpecs, grp.model);
      if (!spec) return;
      if (spec.model && spec.model.toUpperCase() !== grp.model) {
        warnings.push(
          `Column "${header}": no ${grp.model} specification; resolved to ${spec.code} (${spec.model}).`
        );
      }
      const vals = grp.rows
        .map((r) => r[header])
        .filter((v) => v !== '' && v !== null && v !== undefined)
        .map(Number)
        .filter((n) => !Number.isNaN(n));
      if (vals.length < 2) return;

      const n = vals.length;
      const mean = vals.reduce((a, b) => a + b, 0) / n;
      const variance = vals.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / (n - 1);
      const sd = Math.max(0.0001, Math.sqrt(variance));

      records.push(
        withFrozenSpecLimits(
          {
            id: `CPK-RAW-${grp.model}-${grp.side}-${grp.config}-${spec.code}`,
            model: grp.model,
            familyGroup: inferFamilyFromModel(grp.model),
            phase: grp.phase,
            side: grp.side,
            config: grp.config,
            specId: spec.id,
            mean: Number(mean.toFixed(5)),
            stdDev: Number(sd.toFixed(5)),
            sampleSize: n,
            rawValues: vals,
            date: groupDate(grp.rows),
            sourceFile: fileName
          },
          spec
        )
      );
    });
  });

  if (undatedRows > 0) {
    warnings.push(
      `${undatedRows} group(s) had no readable measurement date; they are dated ${todayIso()} and use that day's limits.`
    );
  }

  return {
    format: `Wide Raw Measurements (${rows.length} units · ${specHeaders.length} matched params)`,
    matchedSpecs: Array.from(new Set(records.map((r) => r.specId))),
    unmappedColumns,
    records,
    warnings
  };
}

/**
 * Escapes one CSV cell and neutralizes spreadsheet formula injection: a value a
 * user typed that starts with =, +, -, @, tab or CR would otherwise run as a
 * formula when the exported file is opened in Excel.
 */
function csvText(value) {
  const text = value === null || value === undefined ? '' : String(value);
  const safe = /^[=+\-@\t\r]/.test(text.trim()) ? `'${text}` : text;
  return `"${safe.replace(/"/g, '""')}"`;
}

/**
 * Allocates the next human-readable ID for a collection, e.g. `CI-15`.
 *
 * The number is the highest suffix already in use + 1, so deleting a record can
 * never hand its ID to a new one (a reused ID would silently merge the new
 * record with stale gate/import references). The candidate is also checked
 * against the full ID set to catch suffixes the numeric scan cannot see
 * (e.g. `CI-12B`).
 */
function nextId(prefix, items) {
  const escaped = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const pattern = new RegExp(`^${escaped}(\\d+)$`);
  const used = new Set(
    (Array.isArray(items) ? items : [])
      .map((item) => String((item && item.id) || ''))
      .filter(Boolean)
  );
  let highest = 0;
  used.forEach((id) => {
    const match = id.match(pattern);
    if (match) highest = Math.max(highest, Number(match[1]));
  });
  let seq = highest + 1;
  let candidate = `${prefix}${String(seq).padStart(2, '0')}`;
  while (used.has(candidate)) {
    seq += 1;
    candidate = `${prefix}${String(seq).padStart(2, '0')}`;
  }
  return candidate;
}

/**
 * Case number shown to users. It is the numeric suffix of the `CF-26-` id, so
 * the displayed number and the id can never disagree.
 */
function caseNoFromId(id) {
  return Number(String(id).replace(/^CF-26-/, '')) || 1;
}

/**
 * Resolves uploaded column headers to aliases.
 *
 * Exact (normalized) matches win over fuzzy ones, so a file exported from this
 * app maps "IssueCategory" to the category alias instead of stealing it for
 * "issue", and "Build" is not confused with "BuildConfig". Fuzzy matching only
 * fills the gaps for hand-made sheets ("Project Title", "NG Qty").
 */
function createColumnFinder(headers) {
  const normalize = (value) => String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const normalizedHeaders = (Array.isArray(headers) ? headers : []).map((header) => ({
    label: header,
    key: normalize(header)
  }));
  return (aliases) => {
    const keys = (Array.isArray(aliases) ? aliases : [aliases]).map(normalize);
    const exact = normalizedHeaders.find((h) => keys.includes(h.key));
    if (exact) return exact.label;
    const fuzzy = normalizedHeaders.find((h) =>
      keys.some((key) =>
        key.length <= 2
          ? h.key === key || h.key.startsWith(key)
          : h.key === key || h.key.startsWith(key) || h.key.endsWith(key)
      )
    );
    return fuzzy ? fuzzy.label : null;
  };
}

// Human labels for the persisted workspace slices, used by the save-conflict diff.
const PAYLOAD_SLICE_LABELS = {
  projects: 'Programs',
  tasks: 'Tasks',
  gateRecords: 'Gate records',
  productionRecords: 'Production records',
  masterSpecs: 'Master specs',
  cpkRecords: 'Cpk measurements',
  costProjects: 'Cost initiatives',
  customerFeedback: 'Customer feedback',
  scheduleOverrides: 'Schedule overrides'
};

function payloadRecordLabel(slice, key, item) {
  if (item && typeof item === 'object') {
    if (slice === 'projects') return `${item.id || key} · ${item.model || ''}`.trim();
    if (slice === 'tasks') return `${item.id || key} · ${item.title || ''}`.trim();
    if (slice === 'masterSpecs') return `${item.code || item.id || key} · ${item.parameter || ''}`.trim();
    if (slice === 'costProjects') return `${item.id || key} · ${item.title || ''}`.trim();
    if (slice === 'customerFeedback') {
      return `${item.id || key} · ${item.model || ''} · ${item.issueItem || ''}`.trim();
    }
    if (item.id) return String(item.id);
  }
  return String(key);
}

/**
 * Compares the unsaved local workspace with the copy another user saved.
 * Returns one entry per slice that differs, split by side:
 *   onlyMine   — records this browser has that the saved copy does not
 *   onlyTheirs — records the saved copy has that this browser does not
 *   differing  — records present on both sides with different content
 * Purely read-only: nothing here mutates either payload.
 */
function diffWorkspacePayloads(local, remote) {
  const toEntries = (value) => {
    if (Array.isArray(value)) {
      return value.map((item, index) => [String(item && item.id != null ? item.id : index), item]);
    }
    if (value && typeof value === 'object') {
      return Object.keys(value).map((key) => [key, value[key]]);
    }
    return [];
  };

  const slices = [];
  Object.keys(PAYLOAD_SLICE_LABELS).forEach((slice) => {
    const mineEntries = toEntries(local && local[slice]);
    const theirsEntries = toEntries(remote && remote[slice]);
    if (mineEntries.length === 0 && theirsEntries.length === 0) return;

    const mine = new Map(mineEntries);
    const theirs = new Map(theirsEntries);
    const onlyMine = [];
    const onlyTheirs = [];
    const differing = [];

    mine.forEach((item, key) => {
      if (!theirs.has(key)) {
        onlyMine.push(payloadRecordLabel(slice, key, item));
        return;
      }
      if (JSON.stringify(item) !== JSON.stringify(theirs.get(key))) {
        differing.push(payloadRecordLabel(slice, key, item));
      }
    });
    theirs.forEach((item, key) => {
      if (!mine.has(key)) onlyTheirs.push(payloadRecordLabel(slice, key, item));
    });

    if (onlyMine.length > 0 || onlyTheirs.length > 0 || differing.length > 0) {
      slices.push({ slice, label: PAYLOAD_SLICE_LABELS[slice], onlyMine, onlyTheirs, differing });
    }
  });
  return slices;
}

function triggerCsvDownload(filename, csv) {
  // UTF-8 BOM so Excel shows Thai text and the ฿ sign instead of mojibake.
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildSampleCpkCsv(mode = 'wide') {
  if (mode === 'summary') {
    return [
      'Model,Phase,Side,Config,ParamCode,Mean,StdDev,SampleSize',
      'X4151,EVT,RHS,ME11,BRG_TIR,0.0051,0.0018,64',
      'X4151,EVT,RHS,ME11,ROT_IMB,1.75,0.65,64',
      'X4151,EVT,RHS,ME11,SLD_HT,0.37,0.042,32',
      'X4151,EVT,LHS,ME11,DYN_ZMAX,9.86,0.039,64',
      'X4151,EVT,LHS,ME11,COV_GAP,0.355,0.031,32'
    ].join('\n');
  }

  // Generate 64 realistic OMM / Dynamic Tester rows for X4151 EVT RHS & LHS
  const header = 'SerialNo,Model,Phase,Side,Config,BRG_TIR,ROT_IMB,SLD_HT,DYN_ZMAX,DYN_ZPARA,COV_GAP,FAN_FLAT';
  const lines = [header];
  const pseudoNorm = (seed) => {
    const u1 = Math.max(0.001, ((Math.sin(seed * 12.9898) * 43758.5453) % 1 + 1) % 1);
    const u2 = Math.max(0.001, ((Math.sin(seed * 78.233) * 19341.123) % 1 + 1) % 1);
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  };

  ['RHS', 'LHS'].forEach((side, sIdx) => {
    for (let i = 1; i <= 32; i++) {
      const seed = (sIdx + 1) * 100 + i;
      const tir = Math.max(0.001, 0.0051 + pseudoNorm(seed + 1) * 0.0018).toFixed(4);
      const imb = Math.max(0.2, (side === 'RHS' ? 1.75 : 1.95) + pseudoNorm(seed + 2) * 0.65).toFixed(3);
      const sld = (0.37 + pseudoNorm(seed + 3) * 0.042).toFixed(3);
      const zmax = (9.86 + pseudoNorm(seed + 4) * 0.039).toFixed(3);
      const zpara = Math.max(0.01, 0.088 + pseudoNorm(seed + 5) * 0.032).toFixed(3);
      const gap = (0.355 + pseudoNorm(seed + 6) * 0.031).toFixed(3);
      const flat = Math.max(0.01, 0.072 + pseudoNorm(seed + 7) * 0.024).toFixed(3);
      lines.push(
        `SN-4151${side[0]}-${String(i).padStart(3, '0')},X4151,EVT,${side},ME11,${tir},${imb},${sld},${zmax},${zpara},${gap},${flat}`
      );
    }
  });
  return lines.join('\n');
}

function exportMasterSpecsCsv(masterSpecs) {

// FISCAL YEAR & SHIPMENT-TO-MIH KPI HELPERS
// ============================================================================

/**
 * MinebeaMitsumi fiscal year: 1 April – 31 March. `fyStartYear` is the calendar
 * year the fiscal year opens in, so FY2026 = 2026-04-01 … 2027-03-31.
 */
const FISCAL_YEAR_START_MONTH = 4;
const KPI_FISCAL_YEAR = 2026;

function fiscalYearWindow(fyStartYear) {
  const pad = (n) => String(n).padStart(2, '0');
  const start = `${fyStartYear}-${pad(FISCAL_YEAR_START_MONTH)}-01`;
  // Day 0 of the month after the fiscal year ends = its last day.
  const end = new Date(Date.UTC(fyStartYear + 1, FISCAL_YEAR_START_MONTH - 1, 0))
    .toISOString()
    .slice(0, 10);
  return { start, end };
}

/**
 * One fiscal-year test for every KPI tile. The MIH tile has always measured against
 * the FY window above; claims and cost saving read the same window (and fiscal-year
 * tag) so "FY2026" cannot mean two different twelve-month periods on one scorecard.
 */
function isInKpiFiscalYear(iso, fiscalYear = KPI_FISCAL_YEAR) {
  const day = String(iso || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return false;
  const { start, end } = fiscalYearWindow(fiscalYear);
  return day >= start && day <= end;
}

// Cost-saving initiatives carry a fiscal-year tag rather than a date; untagged
// records keep the historical default of the current KPI fiscal year.
function isKpiFiscalYearTag(fyTarget, fiscalYear = KPI_FISCAL_YEAR) {
  return String(fyTarget || `FY${fiscalYear}`).trim().toUpperCase() === `FY${fiscalYear}`;
}

/** One fiscal window for the scorecard tile and every drill-down that explains it. */
function kpiFiscalScopeLabel(suffix) {
  const { start, end } = fiscalYearWindow(KPI_FISCAL_YEAR);
  const window = `FY${KPI_FISCAL_YEAR} ${start} to ${end}`;
  return suffix ? `All programs · ${window} · ${suffix}` : `All programs · ${window}`;
}

function stageDragReschedulePayload(drag) {

/**
 * Calendar date (YYYY-MM-DD) in the plant's time zone. Every record date, export
 * filename and "today" marker goes through this one helper: deriving a date from
 * toISOString() used UTC, so anything saved before 07:00 Bangkok landed on the
 * previous day, and a hard-coded constant froze the app on its deploy date.
 */
const APP_TIME_ZONE = 'Asia/Bangkok';
const APP_DATE_FORMATTER = new Intl.DateTimeFormat('en-GB', {
  timeZone: APP_TIME_ZONE,
  year: 'numeric',
  month: '2-digit',
  day: '2-digit'
});

function todayIso(now = new Date()) {
  const parts = APP_DATE_FORMATTER.formatToParts(now);
  const part = (type) => (parts.find((p) => p.type === type) || {}).value || '';
  return `${part('year')}-${part('month')}-${part('day')}`;
}

/**
 * Date the line's G8 MIH gate was last approved, or null when it is not approved
 * or carries no usable date. Evidence links and criterion toggles also write audit
 * entries, so only approval records are considered; an undated approval returns
 * null (it cannot be shown to be late).
 */
function mihApprovalIso(gateRecords, projectId, lineKey, today = todayIso()) {
  const gate = gateRecords?.[projectId]?.[lineKey]?.mih;
  if (!gate || gate.status !== 'Approved') return null;

  const parse = (value) => {
    const time = String(value || '');
    if (/^Today/i.test(time)) return today;
    const match = time.match(/^(\d{4}-\d{2}-\d{2})/);
    return match ? match[1] : null;
  };

  const fromApprovers = (Array.isArray(gate.approvers) ? gate.approvers : [])
    .filter((approver) => /approv/i.test(String((approver && (approver.decision || approver.status)) || '')))
    .map((approver) => parse(approver.updatedAt || approver.date || approver.signedAt || approver.time))
    .filter(Boolean);
  const fromAuditLog = (Array.isArray(gate.auditLog) ? gate.auditLog : [])
    .filter((entry) => {
      const action = String((entry && entry.action) || '');
      return /signed/i.test(action) && /approv/i.test(action);
    })
    .map((entry) => parse(entry.time))
    .filter(Boolean);

  const dates = (fromApprovers.length ? fromApprovers : fromAuditLog).sort();
  return dates.length ? dates[dates.length - 1] : null;
}

/**
 * Shipment-to-MIH achievement for one fiscal year.
 *
 * Achievement is measured only against lines whose FATP MIH date has arrived, so
 * a line that is not due yet cannot count as a miss. The all-lines figure is kept
 * separately as forecast coverage (`forecastAchieved` / `tracked`).
 *
 * A line whose approval is dated after its MIH date counts as late, not achieved;
 * an approval with no usable date is accepted (it cannot be shown to be late).
 */
function summarizeMihAchievement(lines, options = {}) {
  const { today = todayIso(), fiscalYear = KPI_FISCAL_YEAR } = options;
  const window = fiscalYearWindow(fiscalYear);
  const summary = {
    fiscalYear,
    window,
    tracked: 0,
    forecastAchieved: 0,
    due: 0,
    onTime: 0,
    late: 0,
    nextDue: null,
    pct: 0
  };

  (Array.isArray(lines) ? lines : []).forEach((entry) => {
    summary.tracked += 1;
    if (entry && entry.approved) summary.forecastAchieved += 1;

    const due = String((entry && entry.fatpMih) || '');
    if (!due) return; // an undated line is forecast only
    if (due < window.start || due > window.end) return; // outside this fiscal year

    if (due <= today) {
      summary.due += 1;
      const approvedAt = entry.approvedAt || null;
      if (entry.approved && (!approvedAt || approvedAt <= due)) {
        summary.onTime += 1;
      } else if (entry.approved) {
        summary.late += 1;
      }
    } else if (!summary.nextDue || due < summary.nextDue) {
      summary.nextDue = due;
    }
  });

  summary.pct = summary.due > 0 ? (summary.onTime / summary.due) * 100 : 0;
  return summary;
}

function getLineVariantsForProject(project) {
  if (!project) return [];
  const defaultSides = getSideList(project.side);
  const variants = [];
  (project.buildMatrix || []).forEach((row) => {
    const calc = computeBuildMatrixRow(row);
    const sides = row.side ? [row.side] : defaultSides;
    sides.forEach((side) => {
      variants.push({
        key: `${row.config}-${side}`,
        config: row.config,
        side,
        apnRev: row.apnRev || '—',
        code7E: row.code7E || '—',
        vendors: row.vendors,
        fatpMih: row.fatpMih || project.mihDate || '',
        qty: calc.totalProduction
      });
    });
  });
  return variants;
}

function computeBuildMatrixRow(row) {
  const fbu = Math.max(0, Number(row?.fbu) || 0);
  const main = Math.max(0, Number(row?.main) || 0);
  const rel = Math.max(0, Number(row?.rel) || 0);
  const mbo = Math.max(0, Number(row?.mbo) || 0);
  const iqc = Math.max(0, Number(row?.iqc) || 0);
  const oqc = Math.max(0, Number(row?.oqc) || 0);
  const doe = Math.max(0, Number(row?.doe) || 0);
  const estYieldLoss = Math.max(0, Number(row?.estYieldLoss) || 0);

  const shipmentReq = fbu + main + rel;
  const additionalReq = mbo + iqc + oqc + doe + estYieldLoss;
  const totalProduction = shipmentReq + additionalReq;

  return {
    fbu,
    main,
    rel,
    mbo,
    iqc,
    oqc,
    doe,
    estYieldLoss,
    shipmentReq,
    additionalReq,
    totalProduction
  };
}

function computeProgramGateDependency(project, gateId, lineGateMap) {
  const variants = getLineVariantsForProject(project);
  if (variants.length === 0) {
    return { status: 'Pending', approvedCount: 0, totalCount: 0, blockedLines: [], activeLines: [] };
  }

  let approvedCount = 0;
  const blockedLines = [];
  const activeLines = [];

  variants.forEach((v) => {
    const st = lineGateMap?.[v.key]?.[gateId]?.status || 'Pending';
    if (st === 'Approved') approvedCount += 1;
    else if (st === 'Blocked') blockedLines.push(v.key);
    else if (st === 'In Review' || st === 'Conditional') activeLines.push(v.key);
  });

  let status = 'Pending';
  if (approvedCount === variants.length) status = 'Approved';
  else if (blockedLines.length > 0) status = 'Blocked';
  else if (activeLines.length > 0 || approvedCount > 0) status = 'In Review';

  return { status, approvedCount, totalCount: variants.length, blockedLines, activeLines };
}

// A single Config/Side gate is signed off cross-functionally by exactly two authorized
// functions: Engineering Manager (Horikawa or Saengtian) and QA Manager (Ronilo or Panida).
function getSignOffRosterForProject() {
  return {
    em: {
      role: 'Engineering Manager',
      defaultName: 'Horikawa / Saengtian',
      options: ['Horikawa', 'Saengtian']
    },
    qa: {
      role: 'QA Manager',
      defaultName: 'Ronilo / Panida',
      options: ['Ronilo', 'Panida']
    }
  };
}

function createSingleGateDossier(project, gate, variant, initialStatus, leaderName, engName, customOverride = {}) {
  const scopeTag = `${project.model} ${project.phase} · ${variant.config} ${variant.side}`;
  const isPast = initialStatus === 'Approved';
  const isActive = initialStatus === 'In Review' || initialStatus === 'Blocked' || initialStatus === 'Conditional';
  const roster = getSignOffRosterForProject();

  const baseCriteria = getDefaultCriteriaForGate(gate.id).map((item, cIdx) => ({
    id: `${project.id}-${variant.key}-${gate.id}-c${cIdx}`,
    label: item.label,
    category: item.category,
    checked: isPast ? true : isActive ? cIdx < 2 : false
  }));

  const baseApprovers = [
    {
      role: roster.em.role,
      name: isPast ? roster.em.options[0] : roster.em.defaultName,
      options: roster.em.options,
      decision: isPast ? 'Approved' : isActive ? 'Approved' : 'Pending',
      remark: isPast ? `${scopeTag} verified under PEN-81-0002 Rev B.` : isActive ? 'Tracking FATP MIH commitment.' : '',
      updatedAt: isPast ? '2026-11-19 16:40' : isActive ? '2026-11-21 09:15' : ''
    },
    {
      role: roster.qa.role,
      name: isPast ? roster.qa.options[0] : roster.qa.defaultName,
      options: roster.qa.options,
      decision: isPast ? 'Approved' : 'Pending',
      remark: isPast ? 'IQC OMM & P1/P2 CA readiness verified.' : '',
      updatedAt: isPast ? '2026-11-20 11:30' : ''
    },
  ];

  // Evidence is append-only: the Google Drive links that back a gate decision stay
  // attached to the dossier (and its audit trail) for later retrieval.
  const evidenceFolder = `https://drive.google.com/drive/folders/1FFM-PEN81-${project.id.replace('PRJ-', '')}-${variant.key}-${gate.code}`;
  const baseEvidence = isPast
    ? [
        {
          id: `${project.id}-${variant.key}-${gate.id}-ev1`,
          label: `${gate.code} ${gate.short} · signed gate pack (PDF)`,
          url: `https://drive.google.com/file/d/1${project.id.replace('PRJ-', '')}${gate.code}RevB/view`,
          addedBy: roster.em.options[0],
          addedAt: '2026-11-20 15:00'
        },
        {
          id: `${project.id}-${variant.key}-${gate.id}-ev2`,
          label: `${gate.code} ${gate.short} · build matrix & MO SPP evidence`,
          url: evidenceFolder,
          addedBy: roster.qa.options[0],
          addedAt: '2026-11-20 15:05'
        }
      ]
    : isActive
    ? [
        {
          id: `${project.id}-${variant.key}-${gate.id}-ev1`,
          label: `${gate.code} ${gate.short} · gate evidence (in progress)`,
          url: evidenceFolder,
          addedBy: roster.em.options[0],
          addedAt: '2026-11-21 09:20'
        }
      ]
    : [];

  const gateIdx = NPI_GATES.findIndex((g) => g.id === gate.id);
  return {
    gateId: gate.id,
    status: customOverride.status || initialStatus,
    targetDate: customOverride.targetDate || `2026-12-${String(Math.min(28, 2 + gateIdx * 3)).padStart(2, '0')}`,
    criteria: customOverride.criteria || baseCriteria,
    approvers: customOverride.approvers || baseApprovers,
    evidence: customOverride.evidence || baseEvidence,
    auditLog:
      customOverride.auditLog ||
      (isPast
        ? [
            {
              actor: 'PEN-81-0002 Gate Board',
              action: `${scopeTag} · ${gate.code} (${gate.short}) Approved & Locked`,
              time: '2026-11-20 15:00',
              note: 'All individual line exit criteria satisfied.'
            }
          ]
        : [])
  };
}

function createInitialGateRecords() {
  const allRecords = {};

  INITIAL_PROJECTS.forEach((project) => {
    const variants = getLineVariantsForProject(project);
    const projectLineRecords = {};

    variants.forEach((variant) => {
      const gateMapForLine = {};
      const isX4151Batch2 = project.id === 'PRJ-X4151' && (variant.config === 'ME13' || variant.config === 'ME14');
      const isX4152KaShuiHold = project.id === 'PRJ-X4152' && (variant.config === 'ME13' || variant.config === 'ME16');

      NPI_GATES.forEach((gate, idx) => {
        let initialStatus = 'Pending';
        let customOverride = {};
        const roster = getSignOffRosterForProject();

        if (project.id === 'PRJ-X4151') {
          if (idx < 3) {
            initialStatus = 'Approved';
          } else if (idx === 3) {
            initialStatus = isX4151Batch2 ? 'Pending' : 'In Review';
            if (!isX4151Batch2) {
              customOverride = {
                targetDate: '2026-11-26',
                approvers: [
                  { role: roster.em.role, name: 'Horikawa', options: roster.em.options, decision: 'Approved', remark: 'BRR closed; Batch 1 ETD Dec 20 / MIH Dec 24 locked.', updatedAt: '2026-11-20 16:00' },
                  { role: roster.qa.role, name: roster.qa.defaultName, options: roster.qa.options, decision: 'Pending', remark: '', updatedAt: '' }
                ],
                auditLog: [
                  { actor: 'Touchakorn (Program Leader)', action: `Opened ${variant.config} ${variant.side} MBO & OK2B`, time: '2026-11-21 09:30', note: 'BRR completed; Batch 1 MBO pilot ready.' }
                ]
              };
            }
          }
        } else if (project.id === 'PRJ-X4152') {
          if (idx === 0) {
            initialStatus = isX4152KaShuiHold ? 'Blocked' : 'In Review';
            if (isX4152KaShuiHold) {
              customOverride = {
                targetDate: '2026-12-04',
                approvers: [
                  { role: roster.em.role, name: 'Horikawa', options: roster.em.options, decision: 'Approved', remark: 'Build window shifted to Dec 7–18.', updatedAt: '2026-11-20 14:00' },
                  { role: roster.qa.role, name: 'Panida', options: roster.qa.options, decision: 'Rejected', remark: `Hold ${variant.config} (${variant.side}) until 100% OMM flatness gate & FTA probe < 18.0 N verified.`, updatedAt: '2026-11-21 10:15' }
                ],
                auditLog: [
                  { actor: 'Panida (QA Manager)', action: `Hold ${variant.config} ${variant.side} in Preparing`, time: '2026-11-21 10:15', note: 'Ka Shui Mg cover bulging containment required prior to BBR/BRR.' }
                ]
              };
            } else {
              customOverride = {
                targetDate: '2026-12-04',
                approvers: [
                  { role: roster.em.role, name: 'Horikawa', options: roster.em.options, decision: 'Approved', remark: 'KHC tapered cover pull ETD Nov 27 / MIH Dec 3.', updatedAt: '2026-11-20 14:00' },
                  { role: roster.qa.role, name: roster.qa.defaultName, options: roster.qa.options, decision: 'Pending', remark: '', updatedAt: '' }
                ]
              };
            }
          }
        } else if (project.id === 'PRJ-X4026') {
          if (idx < 3) {
            initialStatus = 'Approved';
          } else if (idx === 3) {
            initialStatus = 'In Review';
            customOverride = {
              targetDate: '2026-12-21',
              approvers: [
                { role: roster.em.role, name: 'Horikawa', options: roster.em.options, decision: 'Approved', remark: 'BRR closed; FATP MIH Jan 12, 2027 confirmed.', updatedAt: '2026-11-20 15:10' },
                { role: roster.qa.role, name: roster.qa.defaultName, options: roster.qa.options, decision: 'Pending', remark: '', updatedAt: '' }
              ],
              auditLog: [
                { actor: 'Touchakorn (Program Leader)', action: `Opened ${variant.config} LHS MBO & OK2B`, time: '2026-11-21 10:00', note: 'BRR completed; staging foam splits for Dec 21 MBO.' }
              ]
            };
          }
        }

        gateMapForLine[gate.id] = createSingleGateDossier(
          project,
          gate,
          variant,
          initialStatus,
          project.leader,
          project.owner,
          customOverride
        );
      });

      projectLineRecords[variant.key] = gateMapForLine;
    });

    allRecords[project.id] = projectLineRecords;
  });

  return allRecords;
}
