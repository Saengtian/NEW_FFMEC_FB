<script type="text/babel" data-presets="react">
// ============================================================================
// INTERACTIVE PROCESS CAPABILITY (CPK) CHART MODAL & MASTER SPEC MODAL
// ============================================================================

function ProcessCapabilityChartModal({
  record,
  spec,
  onClose,
  onUpdateMeasurement,
  onEditMasterSpec
}) {
  const [meanInput, setMeanInput] = useState(record.mean);
  const [stdInput, setStdInput] = useState(record.stdDev);
  const [nInput, setNInput] = useState(record.sampleSize);
  const [hoveredBin, setHoveredBin] = useState(null);

  if (!spec) return null;

  // The limits in force on the measurement date, not the ones in force today.
  const specInForce = effectiveSpecForRecord(spec, record) || spec;

  const liveRec = {
    ...record,
    mean: Number(meanInput) || 0,
    stdDev: Math.max(0.0001, Number(stdInput) || 0.0001),
    sampleSize: Math.max(5, Number(nInput) || 32)
  };

  const stats = computeCapabilityStats(liveRec, specInForce);
  const tone = getCpkTone(stats.cpk);

  // Compute SVG chart coordinate domain covering both ±4σ and LSL/USL
  const mean = liveRec.mean;
  const sd = liveRec.stdDev;
  const hasLsl = specInForce.specType !== 'upper' && specInForce.lsl !== null && specInForce.lsl !== '';
  const hasUsl = specInForce.specType !== 'lower' && specInForce.usl !== null && specInForce.usl !== '';
  const lslVal = hasLsl ? Number(specInForce.lsl) : 0;
  const uslVal = hasUsl ? Number(specInForce.usl) : mean + 4 * sd;

  const domainCandidatesMin = [mean - 4 * sd];
  const domainCandidatesMax = [mean + 4 * sd];
  if (hasLsl || specInForce.specType === 'upper') domainCandidatesMin.push(lslVal - 0.5 * sd);
  if (hasUsl) domainCandidatesMax.push(uslVal + 0.5 * sd);

  const minX = Math.min(...domainCandidatesMin);
  const maxX = Math.max(...domainCandidatesMax);
  const spanX = Math.max(1e-6, maxX - minX);

  const svgW = 640;
  const svgH = 220;
  const padL = 32;
  const padR = 32;
  const padT = 26;
  const padB = 34;
  const plotW = svgW - padL - padR;
  const plotH = svgH - padT - padB;
  const xToPx = (val) => padL + ((val - minX) / spanX) * plotW;

  // Build 18 histogram bins (from actual uploaded rawValues when available, else normal model)
  const binCount = 18;
  const binWidth = spanX / binCount;
  const pdfAt = (x) =>
    (1 / (sd * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mean) / sd, 2));
  const peakPdf = pdfAt(mean);

  const hasUploadedRaw = Array.isArray(record.rawValues) && record.rawValues.length >= 2 &&
    Number(meanInput) === record.mean && Number(stdInput) === record.stdDev;

  const bins = Array.from({ length: binCount }, (_, idx) => {
    const start = minX + idx * binWidth;
    const end = start + binWidth;
    const mid = (start + end) / 2;
    let count = 0;

    if (hasUploadedRaw) {
      count = record.rawValues.filter((v) =>
        idx === binCount - 1 ? v >= start && v <= end : v >= start && v < end
      ).length;
    } else {
      const expectedProb = Math.max(0, normalCdf((end - mean) / sd) - normalCdf((start - mean) / sd));
      const jitter = 0.88 + (((idx * 37 + Math.round(liveRec.sampleSize)) % 25) / 100);
      count = Math.round(expectedProb * liveRec.sampleSize * jitter);
    }

    const outOfSpec =
      (hasLsl && mid < lslVal) || (hasUsl && mid > uslVal) || (specInForce.specType === 'upper' && mid < 0);
    return { idx, start, end, mid, count, outOfSpec };
  });

  const maxBinCount = Math.max(1, ...bins.map((b) => b.count));

  const curvePoints = Array.from({ length: 80 }, (_, i) => {
    const xVal = minX + (i / 79) * spanX;
    const yNorm = pdfAt(xVal) / (peakPdf || 1);
    const px = xToPx(xVal);
    const py = padT + plotH - yNorm * (plotH * 0.92);
    return `${px.toFixed(1)},${py.toFixed(1)}`;
  }).join(' ');

  const isDirty =
    Number(meanInput) !== record.mean ||
    Number(stdInput) !== record.stdDev ||
    Number(nInput) !== record.sampleSize;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/55 backdrop-blur-[1px]">
      <div className="w-full max-w-3xl max-h-[92vh] flex flex-col bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs">
        {/* Header */}
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-start justify-between gap-3 shrink-0">
          <div>
            <div className="flex flex-wrap items-center gap-2">
              <BarChart3 className="w-4 h-4 text-slate-700 dark:text-slate-300" />
              <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">
                Process Capability Chart · {spec.name} ({spec.code})
              </h3>
              <span className={`px-2 py-0.5 rounded-md border text-[11px] font-bold ${tone.badgeClass}`}>
                Cpk {stats.cpk.toFixed(2)} · {tone.label}
              </span>
              <span
                title={`Limits of revision ${specInForce.revisionNumber || 1} of ${
                  specInForce.revisionCount || 1
                }, in force from ${specInForce.effectiveFrom || 'the recorded baseline'}`}
                className="px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-[10px] font-semibold text-slate-600 dark:text-slate-300 tabular-nums"
              >
                Limits R{specInForce.revisionNumber || 1} · {specInForce.effectiveFrom || 'baseline'}
              </span>
            </div>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1">
              {record.model} {record.phase} ({record.side} · {record.config}) · {spec.station} ·{' '}
              {spec.metrology} · {spec.docRef}
              {specInForce.predatesFirstRevision && (
                <span className="ml-2 inline-flex items-center px-1.5 py-0.5 rounded bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border border-amber-200 dark:border-amber-800 font-semibold">
                  Measured before the first recorded limit revision
                </span>
              )}
              {record.sourceFile && (
                <span className="ml-2 inline-flex items-center px-1.5 py-0.5 rounded bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800 font-semibold">
                  Source: {record.sourceFile} ({hasUploadedRaw ? 'Raw Data' : 'Summary'})
                </span>
              )}
            </p>
          </div>
          <button type="button" onClick={onClose} className="text-slate-400 dark:text-slate-400 hover:text-slate-600 dark:hover:text-slate-400">
            <X className="w-4 h-4" />
          </button>
        </div>

        {/* Body */}
        <div className="p-5 space-y-4 overflow-y-auto flex-1">
          {/* Statistical Summary Strip */}
          <div className="grid grid-cols-3 sm:grid-cols-6 gap-2.5 tabular-nums text-center">
            <div className={`p-2.5 rounded-lg border ${tone.badgeClass}`}>
              <div className="text-[10px] opacity-80">Cpk</div>
              <div className="text-base font-extrabold">{stats.cpk.toFixed(2)}</div>
            </div>
            <div className="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800">
              <div className="text-[10px] text-slate-500 dark:text-slate-400">Cp</div>
              <div className="text-base font-bold text-slate-900 dark:text-slate-100">
                {stats.cp !== null ? stats.cp.toFixed(2) : '—'}
              </div>
            </div>
            <div className="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800">
              <div className="text-[10px] text-slate-500 dark:text-slate-400">Cpl / Cpu</div>
              <div className="text-xs font-bold text-slate-900 dark:text-slate-100 mt-1">
                {stats.cpl !== null ? stats.cpl.toFixed(2) : '—'} /{' '}
                {stats.cpu !== null ? stats.cpu.toFixed(2) : '—'}
              </div>
            </div>
            <div className="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800">
              <div className="text-[10px] text-slate-500 dark:text-slate-400">Mean (x̄)</div>
              <div className="text-sm font-bold text-slate-900 dark:text-slate-100 mt-0.5">
                {formatSpecNum(liveRec.mean, spec)}
              </div>
            </div>
            <div className="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800">
              <div className="text-[10px] text-slate-500 dark:text-slate-400">StdDev (σ)</div>
              <div className="text-sm font-bold text-slate-900 dark:text-slate-100 mt-0.5">
                {formatSpecNum(liveRec.stdDev, spec)}
              </div>
            </div>
            <div className="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800">
              <div className="text-[10px] text-slate-500 dark:text-slate-400">Est. OOS PPM</div>
              <div
                className={`text-sm font-bold mt-0.5 ${
                  stats.ppm > 1350 ? 'text-orange-700 dark:text-orange-300' : 'text-emerald-700 dark:text-emerald-300'
                }`}
              >
                {stats.ppm.toLocaleString()}
              </div>
            </div>
          </div>

          {/* Interactive SVG Process Capability Histogram + Normal Curve */}
          <div className="rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/60 p-3 space-y-2">
            <div className="flex flex-wrap items-center justify-between gap-2 px-1 text-[11px]">
              <span className="font-bold text-slate-700 dark:text-slate-300">
                Normal Distribution &amp; Specification Limits ({spec.unit})
              </span>
              <span className="text-slate-500 dark:text-slate-400 tabular-nums">
                {hoveredBin
                  ? `Bin [${formatSpecNum(hoveredBin.start, spec)} – ${formatSpecNum(
                      hoveredBin.end,
                      spec
                    )} ${spec.unit}]: ${hoveredBin.count} pcs`
                  : `Hover bars to inspect bin counts · n = ${liveRec.sampleSize} pcs`}
              </span>
            </div>

            <svg
              viewBox={`0 0 ${svgW} ${svgH}`}
              className="w-full h-auto bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800"
            >
              {/* Baseline Axis */}
              <line
                x1={padL}
                y1={padT + plotH}
                x2={svgW - padR}
                y2={padT + plotH}
                className="text-slate-300 dark:text-slate-600"
                stroke="currentColor"
                strokeWidth="1"
              />

              {/* Histogram Bars */}
              {bins.map((b) => {
                const bx = xToPx(b.start);
                const bw = Math.max(2, xToPx(b.end) - bx - 2);
                const bh = (b.count / maxBinCount) * (plotH * 0.88);
                const by = padT + plotH - bh;
                const isHovered = hoveredBin?.idx === b.idx;
                return (
                  <rect
                    key={b.idx}
                    x={bx + 1}
                    y={by}
                    width={bw}
                    height={bh}
                    rx="2"
                    fill={
                      b.outOfSpec
                        ? isHovered
                          ? '#ea580c'
                          : '#fb923c'
                        : stats.cpk > 1.33
                        ? isHovered
                          ? '#059669'
                          : '#34d399'
                        : stats.cpk >= 1.0
                        ? isHovered
                          ? '#ca8a04'
                          : '#facc15'
                        : isHovered
                        ? '#ea580c'
                        : '#fdba74'
                    }
                    fillOpacity="0.72"
                    className="cursor-pointer transition-colors"
                    onMouseEnter={() => setHoveredBin(b)}
                    onMouseLeave={() => setHoveredBin(null)}
                  />
                );
              })}

              {/* Gaussian Normal Bell Curve */}
              <polyline
                className="text-slate-900 dark:text-slate-100"
                fill="none"
                stroke="currentColor"
                strokeWidth="2.2"
                points={curvePoints}
                pointerEvents="none"
              />

              {/* LSL Line */}
              {hasLsl && (
                <g>
                  <line
                    x1={xToPx(lslVal)}
                    y1={padT - 6}
                    x2={xToPx(lslVal)}
                    y2={padT + plotH}
                    stroke="#dc2626"
                    strokeWidth="1.75"
                    strokeDasharray="4 3"
                  />
                  <text
                    x={xToPx(lslVal)}
                    y={14}
                    textAnchor="middle"
                    fontSize="10"
                    fontWeight="700"
                    fill="#dc2626"
                  >
                    LSL {formatSpecNum(lslVal, spec)}
                  </text>
                </g>
              )}

              {/* USL Line */}
              {hasUsl && (
                <g>
                  <line
                    x1={xToPx(uslVal)}
                    y1={padT - 6}
                    x2={xToPx(uslVal)}
                    y2={padT + plotH}
                    stroke="#dc2626"
                    strokeWidth="1.75"
                    strokeDasharray="4 3"
                  />
                  <text
                    x={xToPx(uslVal)}
                    y={14}
                    textAnchor="middle"
                    fontSize="10"
                    fontWeight="700"
                    fill="#dc2626"
                  >
                    USL {formatSpecNum(uslVal, spec)}
                  </text>
                </g>
              )}

              {/* Nominal Target Line */}
              <g>
                <line
                  x1={xToPx(Number(specInForce.nominal))}
                  y1={padT}
                  x2={xToPx(Number(specInForce.nominal))}
                  y2={padT + plotH}
                  stroke="#2563eb"
                  strokeWidth="1.25"
                  strokeDasharray="2 3"
                />
                <text
                  x={xToPx(Number(specInForce.nominal))}
                  y={svgH - 8}
                  textAnchor="middle"
                  fontSize="10"
                  fontWeight="600"
                  fill="#2563eb"
                >
                  Nom {formatSpecNum(specInForce.nominal, specInForce)}
                </text>
              </g>

              {/* Sample Mean Line */}
              <g>
                <line
                  x1={xToPx(mean)}
                  y1={padT}
                  x2={xToPx(mean)}
                  y2={padT + plotH}
                  className="text-slate-900 dark:text-slate-100"
                  stroke="currentColor"
                  strokeWidth="1.5"
                />
                <text
                  x={xToPx(mean)}
                  y={svgH - 20}
                  textAnchor="middle"
                  fontSize="10"
                  fontWeight="700"
                  className="text-slate-900 dark:text-slate-100"
                  fill="currentColor"
                >
                  x̄ {formatSpecNum(mean, spec)}
                </text>
              </g>
            </svg>
          </div>

          {/* Master Specification & Interactive Telemetry Simulator */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                  Master Specification
                </span>
                <button
                  type="button"
                  onClick={() => onEditMasterSpec(spec)}
                  className="text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline"
                >
                  Edit Master Spec →
                </button>
              </div>
              <div className="grid grid-cols-3 gap-2 text-[11px] tabular-nums">
                <div>
                  <span className="text-slate-400 dark:text-slate-400 block">LSL</span>
                  <strong className="text-slate-800 dark:text-slate-200">
                    {specInForce.specType === 'upper' ? '0 (1-sided)' : `${specInForce.lsl} ${spec.unit}`}
                  </strong>
                </div>
                <div>
                  <span className="text-slate-400 dark:text-slate-400 block">Nominal</span>
                  <strong className="text-blue-700 dark:text-blue-300">
                    {specInForce.nominal} {spec.unit}
                  </strong>
                </div>
                <div>
                  <span className="text-slate-400 dark:text-slate-400 block">USL</span>
                  <strong className="text-slate-800 dark:text-slate-200">
                    {specInForce.specType === 'lower' ? '—' : `${specInForce.usl} ${spec.unit}`}
                  </strong>
                </div>
              </div>
              <div className="text-[11px] text-slate-500 dark:text-slate-400 pt-1.5 border-t border-slate-200 dark:border-slate-800 flex justify-between">
                <span>Sampling: {spec.samplingPlan}</span>
                <span>Target Cpk ≥ {Number(specInForce.cpkTarget).toFixed(2)}</span>
              </div>
              <div className="text-[10px] text-slate-400 dark:text-slate-500">
                Limits in force on {record.date || 'the measurement date'} · revision{' '}
                {specInForce.revisionNumber || 1} of {specInForce.revisionCount || 1}
              </div>
            </div>

            <div className="p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                  Update Measurement Telemetry
                </span>
                <span className="text-[10px] text-slate-400 dark:text-slate-400">Live Cpk recalculation</span>
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block mb-1">
                    Mean ({spec.unit})
                  </label>
                  <input
                    type="number"
                    step="any"
                    value={meanInput}
                    onChange={(e) => setMeanInput(e.target.value)}
                    className="w-full px-2 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg text-right tabular-nums"
                  />
                </div>
                <div>
                  <label className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block mb-1">
                    StdDev (σ)
                  </label>
                  <input
                    type="number"
                    step="any"
                    min="0.0001"
                    value={stdInput}
                    onChange={(e) => setStdInput(e.target.value)}
                    className="w-full px-2 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg text-right tabular-nums"
                  />
                </div>
                <div>
                  <label className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block mb-1">
                    Sample (n)
                  </label>
                  <input
                    type="number"
                    min="5"
                    value={nInput}
                    onChange={(e) => setNInput(e.target.value)}
                    className="w-full px-2 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg text-right tabular-nums"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* Footer */}
        <div className="px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2 shrink-0">
          <button
            type="button"
            onClick={onClose}
            className="px-3.5 py-2 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
          >
            Close
          </button>
          {isDirty && (
            <button
              type="button"
              onClick={() =>
                onUpdateMeasurement(record.id, {
                  mean: meanInput,
                  stdDev: stdInput,
                  sampleSize: nInput
                })
              }
              className="px-4 py-2 rounded-lg font-semibold bg-slate-900 dark:bg-slate-700 text-white hover:bg-slate-800 dark:hover:bg-slate-600"
            >
              Save Telemetry Update
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function MasterSpecModal({ initialSpec = null, onClose, onSubmit, modelOptions = [] }) {
  const isEditing = Boolean(initialSpec);
  const [form, setForm] = useState(() =>
    initialSpec
      ? {
          code: initialSpec.code,
          name: initialSpec.name,
          model: initialSpec.model || '',
          station: initialSpec.station,
          unit: initialSpec.unit,
          specType: initialSpec.specType || 'two-sided',
          lsl: initialSpec.lsl ?? 0,
          nominal: initialSpec.nominal ?? 0,
          usl: initialSpec.usl ?? 1,
          cpkTarget: initialSpec.cpkTarget ?? 1.33,
          metrology: initialSpec.metrology || '',
          docRef: initialSpec.docRef || '',
          samplingPlan: initialSpec.samplingPlan || ''
        }
      : {
          code: 'COV_HT',
          name: 'Cover Height Outlet',
          model: '',
          station: 'Final Inspection (OQC)',
          unit: 'mm',
          specType: 'two-sided',
          lsl: 9.7,
          nominal: 10.0,
          usl: 10.36,
          cpkTarget: 1.33,
          metrology: 'Height Gauge / OMM',
          docRef: 'SPC-OQC-02 Rev.A',
          samplingPlan: '32 pcs / Lot'
        }
  );

  // New and edited limits take effect on a date the planner chooses, so the
  // revision history stays truthful instead of rewriting past capability.
  const [effectiveFrom, setEffectiveFrom] = useState(() => todayIso());
  const revisionHistory = initialSpec ? getSpecRevisions(initialSpec).slice().reverse() : [];
  const describeRevisionLimits = (rev) => {
    const unit = form.unit ? ` ${form.unit}` : '';
    if (rev.specType === 'upper') return `≤ ${rev.usl}${unit}`;
    if (rev.specType === 'lower') return `≥ ${rev.lsl}${unit}`;
    return `${rev.lsl}–${rev.usl}${unit}`;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.code.trim() || !form.name.trim()) return;
    onSubmit({ ...form, effectiveFrom });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-[1px]">
      <form
        onSubmit={handleSubmit}
        className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs"
      >
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">
            {isEditing ? 'Edit Master Specification' : 'Add Parameter Master Specification'}
          </h3>
          <button type="button" onClick={onClose} className="text-slate-400 dark:text-slate-400 hover:text-slate-600 dark:hover:text-slate-400">
            <X className="w-4 h-4" />
          </button>
        </div>

        <div className="p-5 space-y-3.5">
          <div className="grid grid-cols-3 gap-3">
            <div>
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Param Code *</label>
              <input
                required
                value={form.code}
                onChange={(e) => setForm({ ...form, code: e.target.value })}
                className="w-full px-2.5 py-2 border border-slate-200 dark:border-slate-800 rounded-lg font-mono uppercase"
              />
            </div>
            <div className="col-span-2">
              <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Parameter Name *</label>
              <input
                required
                value={form.name}
                onChange={(e) => setForm({ ...form, name: e.target.value })}
                className="w-full px-2.5 py-2 border border-slate-200 dark:border-slate-800 rounded-lg"
              />
            </div>
          </div>

          <div>
            <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">Model</label>
            <input
              list="master-spec-model-options"

/**
 * Next unused ME## config for a project line. Deriving it from the row count
 * reused a deleted line's config, and a config+side pair is the row's identity.
 */
function nextBuildMatrixConfig(project) {
  const side = getSideList(project?.side || 'RHS & LHS')[0] || 'RHS';
  const usedKeys = new Set(
    (project?.buildMatrix || []).map(
      (row) => `${String(row.config || '').toUpperCase()}-${row.side || 'RHS'}`
    )
  );
  let configNo = 11 + (project?.buildMatrix?.length || 0);
  while (usedKeys.has(`ME${configNo}-${side}`)) configNo += 1;
  return `ME${configNo}`;
}

function ApproverSignOffModal({
  project,
  selectedLineKeys,
  allLineVariants,
  gate,
  approver,
  signerEmail,
  onClose,
  onSubmit
}) {
  const [decision, setDecision] = useState(
    approver?.decision && approver.decision !== 'Pending' ? approver.decision : 'Approved'
  );
  const [remark, setRemark] = useState(approver?.remark || '');
  const [targetKeys, setTargetKeys] = useState(selectedLineKeys || []);

  const toggleKey = (key) => {
    setTargetKeys((prev) => {
      if (prev.includes(key)) {
        if (prev.length === 1) return prev;
        return prev.filter((k) => k !== key);
      }
      return [...prev, key];
    });
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (targetKeys.length === 0 || !signerEmail) return;
    onSubmit(decision, remark, targetKeys, signerEmail);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-[1px]">
      <form
        onSubmit={handleSubmit}
        className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs"
      >
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div>
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">
              Functional Gate Sign-Off · {approver?.role}
            </h3>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
              {project?.model} {project?.phase} · {gate?.code} ({gate?.label})

          <button type="button" onClick={onClose} className="text-slate-400 dark:text-slate-400 hover:text-slate-600 dark:hover:text-slate-400">
            <X className="w-4 h-4" />

          {/* Signer identity is taken from the Google session, never a typed name */}

            <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Signing as</label>
            <div className="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/60">

          {/* Decision Selector */}
          <div>
            <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Sign-Off Decision</label>
            <div className="grid grid-cols-3 gap-2">
              {[
                { id: 'Approved', activeCls: 'bg-emerald-600 text-white border-emerald-600' },
                { id: 'Conditional', activeCls: 'bg-amber-600 text-white border-amber-600' },
                { id: 'Rejected', activeCls: 'bg-rose-600 text-white border-rose-600' }
              ].map((opt) => (
                <button
                  key={opt.id}
                  type="button"
                  onClick={() => setDecision(opt.id)}
                  className={`py-2 px-3 rounded-lg border font-bold transition-colors ${
                    decision === opt.id
                      ? opt.activeCls
                      : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'
                  }`}
                >
                  {opt.id}
                </button>
              ))}
            </div>
          </div>

          {/* Multi-Config x Side Target Selection */}
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <label className="font-semibold text-slate-700 dark:text-slate-300">
                Apply to Config × Side Lines ({targetKeys.length} selected)
              </label>
              <button
                type="button"
                onClick={() => setTargetKeys(allLineVariants.map((v) => v.key))}
                className="text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline"
              >
                Select All ({allLineVariants.length})
              </button>
            </div>
            <div className="flex flex-wrap gap-1.5 p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800 max-h-32 overflow-y-auto">
              {allLineVariants.map((v) => {
                const active = targetKeys.includes(v.key);
                return (
                  <button
                    key={v.key}
                    type="button"
                    onClick={() => toggleKey(v.key)}
                    className={`px-2.5 py-1 rounded-md border text-[11px] font-semibold transition-colors ${
                      active
                        ? 'bg-slate-900 dark:bg-slate-700 text-white border-slate-900'
                        : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800'
                    }`}
                  >
                    {active ? '✓ ' : ''}
                    {v.config} · {v.side}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Engineering Remark */}
          <div>
            <label className="font-semibold text-slate-700 dark:text-slate-300 block mb-1">
              Sign-Off Remarks / Conditions
            </label>
            <textarea
              rows={2}
              value={remark}
              onChange={(e) => setRemark(e.target.value)}
              placeholder="Enter verification evidence, Cpk note, or hold condition..."
              className="w-full px-3 py-2 border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500"
            />
          </div>
        </div>

        <div className="px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
          <button
            type="button"
            onClick={onClose}
            className="px-3.5 py-2 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
          >
            Cancel
          </button>
          <button
            type="submit"
            disabled={!signerEmail}
            className="px-4 py-2 rounded-lg font-semibold bg-slate-900 dark:bg-slate-700 text-white hover:bg-slate-800 dark:hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Record Sign-Off ({targetKeys.length})
          </button>
        </div>
      </form>
    </div>
  );
}

function CpkImportPipelineModal({
  masterSpecs,
  defaultModel,
  defaultPhase,
  defaultSide,
  onClose,
  onImport
}) {
  const [defaults, setDefaults] = useState({
    model: defaultModel || 'X4151',
    phase: defaultPhase || 'EVT',
    side: defaultSide || 'RHS',
    config: 'ME11'
  });
  const [importMode, setImportMode] = useState('upsert'); // 'upsert' | 'replace'
  const [isDragging, setIsDragging] = useState(false);
  const [isParsing, setIsParsing] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [parsedPayload, setParsedPayload] = useState(null);
  const [autoGenDrafts, setAutoGenDrafts] = useState({});

  const specMap = useMemo(() => {
    const m = {};
    masterSpecs.forEach((s) => {
      m[s.id] = s;
    });
    return m;
  }, [masterSpecs]);

  const runAnalysis = (headers, rows, fileName, nextDefaults = defaults, extraSpecs = []) => {
    const combinedSpecs = [...masterSpecs, ...extraSpecs];
    const analysis = analyzeUploadedCpkRows(headers, rows, combinedSpecs, nextDefaults, fileName);
    setParsedPayload({
      fileName,
      headers,
      rows,
      extraSpecs,
      ...analysis
    });

    // Prepare editable Auto-Generate Master Spec drafts for any unmapped numeric columns
    const drafts = {};
    (analysis.unmappedColumns || []).forEach((col) => {
      drafts[col.header] = {
        enabled: true,
        code: col.suggestedCode,
        name: col.suggestedName,
        lsl: col.suggestedLsl,
        nominal: col.suggestedNominal,
        usl: col.suggestedUsl,
        unit: col.unit || 'mm'
      };
    });
    setAutoGenDrafts(drafts);
  };

  const handleGenerateSpecsFromUnmapped = () => {
    if (!parsedPayload) return;
    const newSpecs = Object.entries(autoGenDrafts)
      .filter(([, d]) => d.enabled && d.code.trim())
      .map(([header, d], idx) => {
        const id = `SPEC-AUTO-${d.code.toUpperCase().replace(/[^A-Z0-9]/g, '')}-${Date.now().toString().slice(-3)}-${idx}`;
        const limits = {
          specType: 'two-sided',
          lsl: Number(d.lsl),
          nominal: Number(d.nominal),
          usl: Number(d.usl),
          cpkTarget: 1.33
        };
        // Generated now from this upload's distribution: effective today.
        const effectiveFrom = todayIso();
        return {
          id,
          code: d.code.toUpperCase().trim(),
          name: d.name.trim() || header,
          station: 'Final Inspection (OQC)',
          unit: d.unit.trim() || 'mm',
          ...limits,
          effectiveFrom,
          revisions: [
            { id: `${id}-R1`, effectiveFrom, ...limits, updatedAt: new Date().toISOString(), updatedBy: '' }
          ],
          metrology: 'Uploaded OMM / Tester',
          docRef: `AUTO-${parsedPayload.fileName.slice(0, 14)}`,
          samplingPlan: 'Uploaded Lot'
        };
      });

    if (newSpecs.length === 0) return;
    const mergedExtra = [...(parsedPayload.extraSpecs || []), ...newSpecs];
    runAnalysis(parsedPayload.headers, parsedPayload.rows, parsedPayload.fileName, defaults, mergedExtra);
  };

  const handleFileSelected = async (file) => {
    if (!file) return;
    setErrorMsg('');
    setIsParsing(true);
    try {
      const { headers, rows } = await parseUploadedTabularFile(file);
      if (!rows || rows.length === 0) {
        setErrorMsg('No data rows detected in the uploaded file.');
        setParsedPayload(null);
      } else {
        runAnalysis(headers, rows, file.name);
      }
    } catch (err) {
      setErrorMsg(err?.message || 'Failed to parse file.');
      setParsedPayload(null);
    } finally {
      setIsParsing(false);
    }
  };

  const handleLoadSample = (mode) => {
    setErrorMsg('');
    const csv = buildSampleCpkCsv(mode);
    const { headers, rows } = parseCsvText(csv);
    const fileName =
      mode === 'wide' ? 'X4151_EVT_OMM_Raw_Sample.csv' : 'X4151_EVT_Cpk_Summary_Sample.csv';
    runAnalysis(headers, rows, fileName);
  };

  const handleDefaultChange = (key, value) => {
    const next = { ...defaults, [key]: value };
    setDefaults(next);
    if (parsedPayload) {
      runAnalysis(parsedPayload.headers, parsedPayload.rows, parsedPayload.fileName, next);
    }
  };

  const handleCommit = () => {
    if (!parsedPayload || parsedPayload.records.length === 0) return;
    onImport(parsedPayload.records, {
      fileName: parsedPayload.fileName,
      format: parsedPayload.format,
      rawRowCount: parsedPayload.rows.length,
      importMode,
      newSpecs: parsedPayload.extraSpecs || []
    });
  };

  const effectiveSpecMap = useMemo(() => {
    const m = { ...specMap };
    (parsedPayload?.extraSpecs || []).forEach((s) => {
      m[s.id] = s;
    });
    return m;
  }, [specMap, parsedPayload]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/55 backdrop-blur-[1px]">
      <div className="w-full max-w-4xl max-h-[92vh] flex flex-col bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden text-xs">
        {/* Header */}
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3 shrink-0">
          <div className="flex items-center gap-3">
            <div className="p-2 rounded-lg bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800">
              <FileSpreadsheet className="w-5 h-5" />
            </div>
            <div>
              <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">
                Process Capability (Cpk) Data Pipeline — Excel / CSV Upload
              </h3>
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Upload raw OMM / Dynamic Tester measurements (.xlsx, .xls, .csv) or pre-aggregated Mean/StdDev sheets
              </p>
            </div>
          </div>
          <button type="button" onClick={onClose} className="text-slate-400 dark:text-slate-400 hover:text-slate-600 dark:hover:text-slate-400">
            <X className="w-4 h-4" />
          </button>
        </div>

        {/* Body */}
        <div className="p-5 space-y-4 overflow-y-auto flex-1">
          {/* Default Fallback Scope (Used when uploaded file omits Model / Phase / Side / Config columns) */}
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800">
            <div>
              <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 block mb-1">
                Default Model
              </label>
              <input
                value={defaults.model}
                onChange={(e) => handleDefaultChange('model', e.target.value.toUpperCase())}
                className="w-full px-2.5 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg font-bold uppercase"
              />
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 block mb-1">
                Default Phase
              </label>
              <select
                value={defaults.phase}
                onChange={(e) => handleDefaultChange('phase', e.target.value)}
                className="w-full px-2 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg font-semibold"
              >
                {PHASE_ORDER.map((ph) => (
                  <option key={ph} value={ph}>
                    {ph}
                  </option>
                ))}
              </select>
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 block mb-1">
                Default Side
              </label>
              <select
                value={defaults.side}
                onChange={(e) => handleDefaultChange('side', e.target.value)}
                className="w-full px-2 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg font-semibold"
              >
                <option value="RHS">RHS</option>
                <option value="LHS">LHS</option>
                <option value="Single">Single</option>
              </select>
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 block mb-1">
                Default Config
              </label>
              <input
                value={defaults.config}
                onChange={(e) => handleDefaultChange('config', e.target.value.toUpperCase())}
                className="w-full px-2.5 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg font-semibold uppercase"
              />
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 block mb-1">
                Pipeline Mode
              </label>
              <select
                value={importMode}
                onChange={(e) => setImportMode(e.target.value)}
                className="w-full px-2 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg font-semibold"
              >
                <option value="upsert">Merge / Upsert</option>
                <option value="replace">Replace Model×Phase</option>
              </select>
            </div>
          </div>

          {/* Drag-and-Drop Upload Zone */}
          <div
            onDragOver={(e) => {
              e.preventDefault();
              setIsDragging(true);
            }}
            onDragLeave={() => setIsDragging(false)}
            onDrop={(e) => {
              e.preventDefault();
              setIsDragging(false);
              const file = e.dataTransfer.files?.[0];
              if (file) handleFileSelected(file);
            }}
            className={`rounded-xl border-2 border-dashed p-6 text-center transition-colors ${
              isDragging
                ? 'border-blue-500 bg-blue-50/70 dark:bg-blue-950/70'
                : 'border-slate-300 dark:border-slate-700 bg-slate-50/60 dark:bg-slate-800/60 hover:border-slate-400 dark:hover:border-slate-600'
            }`}
          >
            <Upload className="w-7 h-7 text-slate-400 dark:text-slate-400 mx-auto mb-2" />
            <div className="text-sm font-bold text-slate-800 dark:text-slate-200">
              {isParsing
                ? 'Parsing workbook & calculating Process Capability...'
                : 'Drag & drop Excel (.xlsx, .xls) or CSV file here'}
            </div>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1 max-w-xl mx-auto">
              Auto-maps columns to Master Spec codes:{' '}
              <span className="font-mono text-slate-700 dark:text-slate-300">
                {Array.from(new Set(masterSpecs.map((s) => s.code))).join(', ')}
              </span>
            </p>

            <div className="mt-4 flex flex-wrap items-center justify-center gap-2">
              <label className="px-3.5 py-2 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white font-semibold cursor-pointer inline-flex items-center gap-1.5">
                <Upload className="w-3.5 h-3.5" />
                <span>Browse Excel / CSV</span>
                <input
                  type="file"
                  accept=".xlsx,.xls,.csv,.tsv"
                  className="hidden"
                  onChange={(e) => {
                    const f = e.target.files?.[0];
                    if (f) handleFileSelected(f);
                    e.target.value = '';
                  }}
                />
              </label>

              <button
                type="button"
                onClick={() => handleLoadSample('wide')}
                className="px-3 py-2 rounded-lg bg-blue-50 dark:bg-blue-950 hover:bg-blue-100 dark:hover:bg-blue-900 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800 font-semibold inline-flex items-center gap-1.5"
              >
                <FileSpreadsheet className="w-3.5 h-3.5" />
                <span>Load Sample OMM Raw CSV (64 pcs)</span>
              </button>

              <button
                type="button"
                onClick={() =>
                  triggerCsvDownload('FFM_Cpk_Raw_Template.csv', buildSampleCpkCsv('wide'))
                }
                className="px-3 py-2 rounded-lg bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 font-semibold inline-flex items-center gap-1.5"
              >
                <Download className="w-3.5 h-3.5" />
                <span>Raw CSV Template</span>
              </button>

              <button
                type="button"
                onClick={() =>
                  triggerCsvDownload('FFM_Cpk_Summary_Template.csv', buildSampleCpkCsv('summary'))
                }
                className="px-3 py-2 rounded-lg bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 font-semibold inline-flex items-center gap-1.5"
              >
                <Download className="w-3.5 h-3.5" />
                <span>Summary Template</span>
              </button>
            </div>
          </div>

          {errorMsg && (
            <div className="p-3 rounded-lg bg-rose-50 dark:bg-rose-950 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 font-medium flex items-center gap-2">
              <AlertTriangle className="w-4 h-4 shrink-0" />
              <span>{errorMsg}</span>
            </div>
          )}

          {/* Parsed Validation & Live Cpk Preview Table */}
          {parsedPayload && (
            <div className="space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2 px-3.5 py-2.5 rounded-lg bg-slate-900 dark:bg-slate-700 text-white">
                <div className="flex flex-wrap items-center gap-2">
                  <CheckCircle2 className="w-4 h-4 text-emerald-400 dark:text-emerald-400 shrink-0" />
                  <span className="font-bold">{parsedPayload.fileName}</span>
                  <span className="text-slate-400 dark:text-slate-400">·</span>
                  <span className="text-slate-300 dark:text-slate-300">{parsedPayload.format}</span>
                </div>
                <div className="text-[11px] text-emerald-300 dark:text-emerald-300 font-semibold tabular-nums">
                  {parsedPayload.records.length} Cpk parameter groups ready
                </div>
              </div>

              {parsedPayload.warnings.length > 0 && (
                <div className="p-3 rounded-lg bg-amber-50 dark:bg-amber-950 border border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-100 space-y-1">
                  <div className="font-bold flex items-center gap-1.5">
                    <AlertTriangle className="w-3.5 h-3.5 text-amber-600 dark:text-amber-400" />
                    <span>Pipeline Notices ({parsedPayload.warnings.length})</span>
                  </div>
                  <ul className="list-disc pl-5 space-y-0.5 text-[11px]">
                    {parsedPayload.warnings.slice(0, 4).map((w, i) => (
                      <li key={i}>{w}</li>
                    ))}
                  </ul>
                </div>
              )}

              {/* Auto-Generate Master Specifications for Unmapped Uploaded Columns */}
              {parsedPayload.unmappedColumns && parsedPayload.unmappedColumns.length > 0 && (
                <div className="p-3.5 rounded-xl bg-blue-50/70 dark:bg-blue-950/70 border border-blue-200 dark:border-blue-800 space-y-2.5">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div className="font-bold text-blue-950 dark:text-blue-100">
                        Unmapped Numeric Columns Detected ({parsedPayload.unmappedColumns.length})
                      </div>
                      <p className="text-[11px] text-blue-800/80 dark:text-blue-200/80">
                        Auto-generate Master Specifications from uploaded columns to match &amp; include them in the Cpk Dashboard:
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={handleGenerateSpecsFromUnmapped}
                      className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-[11px] inline-flex items-center gap-1.5"
                    >
                      <Plus className="w-3.5 h-3.5" />
                      <span>Generate &amp; Match Selected Specs</span>
                    </button>
                  </div>

                  <div className="overflow-x-auto bg-white dark:bg-slate-900 rounded-lg border border-blue-200/80 dark:border-blue-800/80">
                    <table className="w-full text-left border-collapse text-[11px]">
                      <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase text-slate-500 dark:text-slate-400">
                        <tr>
                          <th className="py-1.5 px-2.5 w-8">Use</th>
                          <th className="py-1.5 px-2">Uploaded Column</th>
                          <th className="py-1.5 px-2">Spec Code</th>
                          <th className="py-1.5 px-2 text-right">LSL</th>
                          <th className="py-1.5 px-2 text-right">Nominal</th>
                          <th className="py-1.5 px-2 text-right">USL</th>
                          <th className="py-1.5 px-2 w-16">Unit</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {parsedPayload.unmappedColumns.map((col) => {
                          const d = autoGenDrafts[col.header];
                          if (!d) return null;
                          return (
                            <tr key={col.header}>
                              <td className="py-1.5 px-2.5">
                                <input
                                  type="checkbox"
                                  checked={d.enabled}
                                  onChange={(e) =>
                                    setAutoGenDrafts((prev) => ({
                                      ...prev,
                                      [col.header]: { ...prev[col.header], enabled: e.target.checked }
                                    }))
                                  }
                                />
                              </td>
                              <td className="py-1.5 px-2 font-mono font-semibold text-slate-800 dark:text-slate-200">
                                {col.header} <span className="text-slate-400 dark:text-slate-400">(n={col.count})</span>
                              </td>
                              <td className="py-1.5 px-2">
                                <input
                                  value={d.code}
                                  onChange={(e) =>
                                    setAutoGenDrafts((prev) => ({
                                      ...prev,
                                      [col.header]: { ...prev[col.header], code: e.target.value }
                                    }))
                                  }
                                  className="w-28 px-1.5 py-1 border border-slate-200 dark:border-slate-800 rounded font-mono uppercase"
                                />
                              </td>
                              <td className="py-1.5 px-2">
                                <input
                                  type="number"
                                  step="any"
                                  value={d.lsl}
                                  onChange={(e) =>
                                    setAutoGenDrafts((prev) => ({
                                      ...prev,
                                      [col.header]: { ...prev[col.header], lsl: e.target.value }
                                    }))
                                  }
                                  className="w-20 px-1.5 py-1 border border-slate-200 dark:border-slate-800 rounded text-right tabular-nums"
                                />
                              </td>
                              <td className="py-1.5 px-2">
                                <input
                                  type="number"
                                  step="any"
                                  value={d.nominal}
                                  onChange={(e) =>
                                    setAutoGenDrafts((prev) => ({
                                      ...prev,
                                      [col.header]: { ...prev[col.header], nominal: e.target.value }
                                    }))
                                  }
                                  className="w-20 px-1.5 py-1 border border-slate-200 dark:border-slate-800 rounded text-right tabular-nums"
                                />
                              </td>
                              <td className="py-1.5 px-2">
                                <input
                                  type="number"
                                  step="any"
                                  value={d.usl}
                                  onChange={(e) =>
                                    setAutoGenDrafts((prev) => ({
                                      ...prev,
                                      [col.header]: { ...prev[col.header], usl: e.target.value }
                                    }))
                                  }
                                  className="w-20 px-1.5 py-1 border border-slate-200 dark:border-slate-800 rounded text-right tabular-nums"
                                />
                              </td>
                              <td className="py-1.5 px-2">
                                <input
                                  value={d.unit}
                                  onChange={(e) =>
                                    setAutoGenDrafts((prev) => ({
                                      ...prev,
                                      [col.header]: { ...prev[col.header], unit: e.target.value }
                                    }))
                                  }
                                  className="w-14 px-1.5 py-1 border border-slate-200 dark:border-slate-800 rounded"
                                />
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {parsedPayload.records.length > 0 && (
                <div className="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">
                  <div className="overflow-x-auto max-h-64">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400 sticky top-0">
                        <tr>
                          <th className="py-2 px-3">Model · Phase · Side · Config</th>
                          <th className="py-2 px-3">Parameter (Master Spec)</th>
                          <th className="py-2 px-2.5 text-right">n</th>
                          <th className="py-2 px-2.5 text-right">Mean (x̄)</th>
                          <th className="py-2 px-2.5 text-right">StdDev (σ)</th>
                          <th className="py-2 px-2.5 text-right">Est. PPM</th>
                          <th className="py-2 px-3 text-center">Calc. Cpk</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                        {parsedPayload.records.map((rec) => {
                          const spec = effectiveSpecMap[rec.specId];
                          const stats = computeCapabilityStats(rec, effectiveSpecForRecord(spec, rec));
                          const tone = getCpkTone(stats.cpk);
                          return (
                            <tr key={rec.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/80">
                              <td className="py-2 px-3 whitespace-nowrap font-semibold text-slate-800 dark:text-slate-200">
                                {rec.model} · {rec.phase} · {rec.side} ({rec.config})
                              </td>
                              <td className="py-2 px-3 whitespace-nowrap">
                                <span className="font-bold text-slate-900 dark:text-slate-100">{spec?.name}</span>{' '}
                                <span className="text-[10px] font-mono text-slate-400 dark:text-slate-400">
                                  ({spec?.code})
                                </span>
                                <span
                                  className={
                                    spec?.model
                                      ? 'ml-1.5 px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-[10px] font-semibold text-slate-600 dark:text-slate-300'
                                      : 'ml-1.5 text-[10px] text-slate-400 dark:text-slate-500'
                                  }
                                  title={
                                    spec?.model
                                      ? `Resolved to the ${spec.model} specification`
                                      : 'Resolved to the all-models specification'
                                  }
                                >
                                  {spec?.model || 'all models'}
                                </span>
                              </td>
                              <td className="py-2 px-2.5 text-right text-slate-600 dark:text-slate-400">
                                {rec.sampleSize}
                              </td>
                              <td className="py-2 px-2.5 text-right text-slate-800 dark:text-slate-200">
                                {formatSpecNum(rec.mean, spec)}
                              </td>
                              <td className="py-2 px-2.5 text-right text-slate-600 dark:text-slate-400">
                                {formatSpecNum(rec.stdDev, spec)}
                              </td>
                              <td className="py-2 px-2.5 text-right text-slate-600 dark:text-slate-400">
                                {stats.ppm.toLocaleString()}
                              </td>
                              <td className="py-2 px-3 text-center">
                                <span
                                  className={`inline-block px-2 py-0.5 rounded border font-bold ${tone.badgeClass}`}
                                >
                                  {stats.cpk.toFixed(2)}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>

        {/* Footer */}
        <div className="px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2 shrink-0">
          <span className="text-[11px] text-slate-500 dark:text-slate-400">
            Uploaded raw datasets automatically power the interactive histogram in the Process Capability Chart.
          </span>
          <div className="flex items-center gap-2">
            <button
              type="button"
              onClick={onClose}
              className="px-3.5 py-2 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
            >
              Cancel
            </button>
            <button
              type="button"
              disabled={!parsedPayload || parsedPayload.records.length === 0}
              onClick={handleCommit}
              className="px-4 py-2 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-40 transition-colors"
            >
              Update Cpk Dashboard ({parsedPayload?.records?.length || 0} Matched)
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

</script>
