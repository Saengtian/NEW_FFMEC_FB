                      </tr>
                    </tfoot>
                  </table>
                )}
              </div>
            </div>
          </section>
        );
      })}
    </div>
  );
}

// ============================================================================
// VIEW 2B: NPI BUILD TIMELINE (INTERACTIVE GANTT MODULE)
// ============================================================================

function BuildTimelineGanttView({
  projects,
  gateRecords,
  globalSide,
  scheduleOverrides,
  onOpenGate,
  onEditSchedule,
  onReschedule
}) {
  const [groupMode, setGroupMode] = useState('side'); // 'side' | 'config'
  const [sequenceMode, setSequenceMode] = useState('lhs-first'); // 'lhs-first' | 'rhs-first' | 'readiness'
  const [zoomLevel, setZoomLevel] = useState('week'); // 'week' | 'day'
  const [collapsedProjects, setCollapsedProjects] = useState({}); // projectId -> true
  const boardScrollRef = useRef(null);

  // Direct manipulation of the stage bars: a drag is only a preview until the
  // pointer is released, so Escape / pointercancel leaves the plan untouched.
  const [stageDrag, setStageDrag] = useState(null);
  // A drop that would break the sequence is refused, and says why here.
  const [stageMoveError, setStageMoveError] = useState(null);
  const stageDragRef = useRef(null);
  const suppressClickRef = useRef(false);
  const rescheduleRef = useRef(onReschedule);
  rescheduleRef.current = onReschedule;

  const commitStageDrag = useCallback((drag) => {
    if (!drag || !drag.deltaDays) return;
    const stage = GANTT_STAGES.find((s) => s.id === drag.stageId);
    const base = drag.schedule || {};
    if (!stage) return;
    let startIso = base[stage.startKey];
    let endIso = base[stage.endKey];
    if (!startIso || !endIso) return;

    if (drag.mode !== 'resize-end') startIso = addDaysIso(startIso, drag.deltaDays);
    if (drag.mode !== 'resize-start') endIso = addDaysIso(endIso, drag.deltaDays);
    // A stage never collapses or inverts: the dragged edge stops at the far one.
    if (diffDaysIso(startIso, endIso) < 0) {
      if (drag.mode === 'resize-start') startIso = endIso;
      else endIso = startIso;
    }

    const schedule = { ...base, [stage.startKey]: startIso, [stage.endKey]: endIso };
    suppressClickRef.current = true;

    // The plan is only saved when the moved stage still fits between its
    // neighbours and inside the line's MIH; otherwise the bar stays where it was.
    const conflict = stageMoveConflict(schedule, stage.id);
    if (conflict) {
      const when = formatShortDate(conflict.limitIso);
      setStageMoveError(
        conflict.kind === 'before-previous'
          ? `${conflict.stage.label} would start before ${conflict.other.label} finishes (${when}). The schedule was not changed.`
          : conflict.kind === 'after-next'
          ? `${conflict.stage.label} would end after ${conflict.other.label} starts (${when}). The schedule was not changed.`
          : `${conflict.stage.label} would end after FATP MIH (${when}). The schedule was not changed.`
      );
      return;
    }
    setStageMoveError(null);

    if (rescheduleRef.current) {
      rescheduleRef.current(
        stageDragReschedulePayload({
          project: drag.project,
          rowKeys: drag.rowKeys,
          schedule
        })
      );
    }
  }, []);

  const isStageDragging = Boolean(stageDrag);

  // Window-level listeners, so a fast drag that leaves the bar still tracks.
  useEffect(() => {
    if (!isStageDragging) return undefined;
    const onMove = (event) => {
      const drag = stageDragRef.current;
      if (!drag) return;
      const deltaDays = Math.round((event.clientX - drag.startX) / drag.dayWidthPx);
      if (deltaDays === drag.deltaDays) return;
      // A zero-delta drag is indistinguishable from a click, which still opens the gate.
      suppressClickRef.current = false;
      const next = { ...drag, deltaDays };
      stageDragRef.current = next;
      setStageDrag(next);
    };
    const finish = (commit) => {
      const drag = stageDragRef.current;
      stageDragRef.current = null;
      setStageDrag(null);
      if (commit) commitStageDrag(drag);
    };
    const onPointerUp = () => finish(true);
    const onPointerCancel = () => finish(false);
    const onKeyDown = (event) => {
      if (event.key === 'Escape') finish(false);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerCancel);
    window.addEventListener('keydown', onKeyDown);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerCancel);
      window.removeEventListener('keydown', onKeyDown);
    };
  }, [isStageDragging, commitStageDrag]);

  const startStageDrag = (event, project, row, stage, mode) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    const schedule = row.schedule || {};
    if (!schedule[stage.startKey] || !schedule[stage.endKey]) return;
    event.preventDefault();
    event.stopPropagation();
    suppressClickRef.current = false;
    const drag = {
      project,
      rowId: row.id,
      stageId: stage.id,
      mode,
      rowKeys: row.rowKeys,
      schedule,
      startX: event.clientX,
      deltaDays: 0,
      dayWidthPx
    };
    stageDragRef.current = drag;
    setStageDrag(drag);
  };

  // Build normalized rows with side-priority or readiness-driven sequencing
  const timelineGroups = useMemo(() => {
    return projects.map((project) => {
      const visibleMatrix = [...(project.buildMatrix || [])].filter(
        (r) => globalSide === 'ALL' || (r.side || 'RHS') === globalSide
      );

      const projGateLines = gateRecords[project.id] || {};
      let items = [];

      if (groupMode === 'side') {
        items = buildSequencedGanttItems(
          project,
          visibleMatrix,
          projGateLines,
          scheduleOverrides,
          sequenceMode
        );
      } else {
        // Grouped by Config (R+L combined)
        const byConfig = new Map();
        visibleMatrix
          .sort((a, b) => a.config.localeCompare(b.config, undefined, { numeric: true }))
          .forEach((row) => {
            if (!byConfig.has(row.config)) byConfig.set(row.config, []);
            byConfig.get(row.config).push(row);
          });

        let idx = 1;
        byConfig.forEach((cfgRows, cfg) => {
          const rowKeys = cfgRows.map((r) => `${r.config}-${r.side || 'RHS'}`);
          const primaryKey = rowKeys[0];
          const primaryRow = cfgRows[0];
          const schedule =
            scheduleOverrides[`${project.id}::${primaryKey}`] ||
            getDefaultScheduleForRow(project, primaryRow);
          const hasHold = rowKeys.some((k) =>
            Object.values(projGateLines[k] || {}).some((g) => g.status === 'Blocked')
          );
          const readiness = hasHold
            ? { rank: 3, label: 'Hold', tone: 'rose', hasHold: true }
            : getLineReadinessInfo(projGateLines[primaryKey] || {});
          const totalQty = cfgRows.reduce(
            (sum, r) => sum + computeBuildMatrixRow(r).totalProduction,
            0
          );
          const sidesLabel = cfgRows.map((r) => r.side || 'RHS').join(' + ');

          items.push({
            type: 'build',
            id: `${project.id}-${cfg}`,
            seqNum: idx++,
            label: cfg,
            sideBadge: sidesLabel,
            sublabel: primaryRow.vendors,
            qty: totalQty,
            rowKeys,
            primaryLineKey: primaryKey,
            schedule,
            hasHold,
            readiness,
            isManualOverride: Boolean(scheduleOverrides[`${project.id}::${primaryKey}`])
          });
        });
      }

      return { project, items };
    });
  }, [projects, gateRecords, globalSide, scheduleOverrides, groupMode, sequenceMode]);

  const allBuildRows = useMemo(
    () =>
      timelineGroups.flatMap((g) =>
        g.items
          .filter((item) => item.type === 'build')
          .map((r) => ({ ...r, project: g.project }))
      ),
    [timelineGroups]
  );

  const totalConversions = useMemo(
    () =>
      timelineGroups.reduce(
        (sum, g) => sum + g.items.filter((item) => item.type === 'conversion').length,
        0
      ),
    [timelineGroups]
  );

  // Compute dynamic timeline bounds across all visible schedules
  const timelineBounds = useMemo(() => {
    let minIso = '2026-11-15';
    let maxIso = '2027-02-02';

    if (allBuildRows.length > 0) {
      const starts = [];
      const ends = [];
      const pushIso = (iso) => {
        if (typeof iso === 'string' && iso) {
          starts.push(iso);
          ends.push(iso);
        }
      };
      // Every staged date counts, not only preStart / PBR: a manually shifted
      // schedule can run past both, which used to clip its bars off the canvas.
      allBuildRows.forEach((r) => Object.values(r.schedule || {}).forEach(pushIso));
      timelineGroups.forEach((g) =>
        g.items.forEach((item) => {
          if (item.type !== 'conversion') return;
          pushIso(item.startIso);
          pushIso(item.endIso);
        })
      );
      starts.sort();
      ends.sort();
      if (starts[0]) minIso = addDaysIso(starts[0], -3);
      if (ends[ends.length - 1]) maxIso = addDaysIso(ends[ends.length - 1], 5);
    }

    const totalDays = Math.max(21, diffDaysIso(minIso, maxIso));
    return { minIso, maxIso, totalDays };
  }, [allBuildRows, timelineGroups]);

  const dayWidthPx = zoomLevel === 'day' ? 28 : 14;
  const chartWidthPx = timelineBounds.totalDays * dayWidthPx;

  const getOffsetPx = (iso) => diffDaysIso(timelineBounds.minIso, iso) * dayWidthPx;

  // Generate month headers and week/day tick lines
  const calendarTicks = useMemo(() => {
    const months = [];
    const weeks = [];
    const days = [];
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    let currentMonthKey = null;
    for (let i = 0; i < timelineBounds.totalDays; i++) {
      const iso = addDaysIso(timelineBounds.minIso, i);
      const dt = parseIsoDate(iso);
      const mKey = `${dt.getUTCFullYear()}-${dt.getUTCMonth()}`;
      if (mKey !== currentMonthKey) {
        months.push({
          key: mKey,
          label: `${monthNames[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`,
          startIdx: i,
          span: 1
        });
        currentMonthKey = mKey;
      } else {
        months[months.length - 1].span += 1;
      }

      const dayOfWeek = dt.getUTCDay(); // 0=Sun, 1=Mon
      if (dayOfWeek === 1 || i === 0) {
        weeks.push({
          iso,
          idx: i,
          label: `${monthNames[dt.getUTCMonth()]} ${dt.getUTCDate()}`
        });
      }

      days.push({
        iso,
        idx: i,
        dayNum: dt.getUTCDate(),
        isWeekend: dayOfWeek === 0 || dayOfWeek === 6
      });
    }

    return { months, weeks, days };
  }, [timelineBounds]);

  // Summary KPIs
  const summaryStats = useMemo(() => {
    const upcomingMihs = allBuildRows
      .map((r) => ({
        model: r.project.model,
        config: `${r.label} ${r.sideBadge}`,
        mih: r.schedule.mih,
        daysLeft: diffDaysIso(todayIso(), r.schedule.mih)
      }))
      .filter((x) => x.daysLeft >= 0)
      .sort((a, b) => a.daysLeft - b.daysLeft);

    const heldCount = allBuildRows.filter((r) => r.hasHold).length;

    return {
      nextMih: upcomingMihs[0] || null,
      heldCount,
      totalRows: allBuildRows.length
    };
  }, [allBuildRows]);

  const todayOffsetPx = getOffsetPx(todayIso());
  const showTodayLine = todayOffsetPx >= 0 && todayOffsetPx <= chartWidthPx;

  const sequenceLabelMap = {
    'lhs-first': 'LHS All Configs → Convert → RHS',
    'rhs-first': 'RHS All Configs → Convert → LHS',
    readiness: 'Build Readiness Priority (Ready First)'
  };

  if (projects.length === 0) {
    return (
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-10 text-center text-xs text-slate-500 dark:text-slate-400">
        No NPI programs match the current Global Scope. Reset filters above to view the build timeline.
      </div>
    );
  }

  return (
    <div className="space-y-5">
      {/* Timeline KPI Summary Strip */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Active Sequence Rule</div>
          <div className="text-sm font-bold text-slate-900 dark:text-slate-100 leading-snug">
            {sequenceLabelMap[sequenceMode]}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            {formatShortDate(timelineBounds.minIso)} – {formatShortDate(timelineBounds.maxIso)} ·{' '}
            {summaryStats.totalRows} runs
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Next FATP MIH Target</div>
          {summaryStats.nextMih ? (
            <>
              <div className="text-base font-bold text-emerald-700 dark:text-emerald-300 tabular-nums">
                {formatShortDate(summaryStats.nextMih.mih)}{' '}
                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">
                  (T-{summaryStats.nextMih.daysLeft}d)
                </span>
              </div>
              <div className="text-[11px] text-slate-500 dark:text-slate-400">
                {summaryStats.nextMih.model} · {summaryStats.nextMih.config}
              </div>
            </>
          ) : (
            <div className="text-base font-bold text-slate-400 dark:text-slate-400">—</div>
          )}
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Line Conversions (LHS ↔ RHS)</div>
          <div className="text-xl font-bold text-amber-700 dark:text-amber-300 tabular-nums">
            {totalConversions}{' '}
            <span className="text-xs font-normal text-slate-400 dark:text-slate-400">
              ({totalConversions * 2}d changeover)
            </span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            Minimized by batching configs per side
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Gate Holds on Schedule</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              summaryStats.heldCount > 0 ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-700 dark:text-emerald-300'
            }`}
          >
            {summaryStats.heldCount}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {summaryStats.heldCount > 0
              ? 'Ka Shui OMM / IQC containment holds'
              : 'All scheduled lines clear'}
          </div>
        </div>
      </div>

      {/* Interactive Gantt Board */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        {/* Toolbar: Sequence Priority + View Mode + Zoom */}
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-3">
            {/* Sequence Priority Control */}
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Line Sequence Priority:
              </span>
              <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800">
                <button
                  type="button"
                  onClick={() => {
                    setGroupMode('side');
                    setSequenceMode('lhs-first');
                  }}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    groupMode === 'side' && sequenceMode === 'lhs-first'
                      ? 'bg-sky-600 text-white shadow-2xs'
                      : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
                  }`}
                >
                  LHS → Convert → RHS
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setGroupMode('side');
                    setSequenceMode('rhs-first');
                  }}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${

                      );

                    const etdPx = getOffsetPx(row.schedule.etd);

                    const daysToMih = diffDaysIso(todayIso(), row.schedule.mih);
                    const mihChipClass =

                                    className="absolute top-0 bottom-0 bg-slate-100/50 dark:bg-slate-800/50 pointer-events-none"

                            const startIso = row.schedule[st.startKey];
                            const endIso = row.schedule[st.endKey];
                            if (!startIso || !endIso) return null;
                            const leftPx = getOffsetPx(startIso);
                            const spanDays = Math.max(1, diffDaysIso(startIso, endIso) + 1);
                            const widthPx = Math.max(16, spanDays * dayWidthPx);
                            // The fill and the click share one line: whichever line set the
                            // tone, which on a Compact Config row may be the LHS one.
                            const stageGate = ganttStageGateDriver(rowGateLines, row.rowKeys, st.gateId);
                            const tone = stageGate.tone;

                            const drag =
                              stageDrag && stageDrag.rowId === row.id && stageDrag.stageId === st.id
                                ? stageDrag
                                : null;
                            const dragPx = drag ? drag.deltaDays * dayWidthPx : 0;
                            let barLeft = leftPx;
                            let barWidth = widthPx;
                            if (drag) {
                              if (drag.mode === 'resize-start') {
                                const shift = Math.min(dragPx, barWidth - dayWidthPx);
                                barLeft += shift;
                                barWidth -= shift;
                              } else if (drag.mode === 'resize-end') {
                                barWidth = Math.max(dayWidthPx, barWidth + dragPx);
                              } else {
                                barLeft += dragPx;
                              }
                            }

                            // The badge previews the dates the drop would commit.
                            let preview = null;
                            if (drag) {
                              let pStart = startIso;
                              let pEnd = endIso;
                              if (drag.mode !== 'resize-end') pStart = addDaysIso(pStart, drag.deltaDays);
                              if (drag.mode !== 'resize-start') pEnd = addDaysIso(pEnd, drag.deltaDays);
                              if (diffDaysIso(pStart, pEnd) < 0) {
                                if (drag.mode === 'resize-start') pStart = pEnd;
                                else pEnd = pStart;
                              }
                              preview = { start: pStart, end: pEnd, days: diffDaysIso(pStart, pEnd) + 1 };
                            }

                            return (
                              <button
                                key={st.id}
                                type="button"
                                onClick={() => {
                                  // A committed drag ends with a click; it must not also open the gate.
                                  if (suppressClickRef.current) {
                                    suppressClickRef.current = false;
                                    return;
                                  }
                                  onOpenGate(project.id, st.gateId, stageGate.lineKey || row.primaryLineKey);
                                }}
                                onPointerDown={(event) => startStageDrag(event, project, row, st, 'move')}
                                title={`${project.model} ${row.sideBadge} ${row.label} · ${st.label}: ${formatShortDate(
                                  startIso
                                )} – ${formatShortDate(endIso)} · ${spanDays}d · Gate ${tone.label}${
                                  stageGate.differs ? ` · Driven by ${stageGate.lineKey}` : ''
                                } · Drag to move, drag an edge to resize, click to open Gate Sign-Off`}
                                style={{
                                  left: `${barLeft}px`,
                                  width: `${barWidth}px`,
                                  touchAction: 'none'
                                }}
                                className={`group absolute top-2.5 h-7 rounded-md border px-1.5 text-[10px] font-bold tracking-tight flex items-center whitespace-nowrap shadow-sm hover:shadow-md hover:ring-2 hover:ring-slate-900/25 dark:hover:ring-white/40 transition-all cursor-grab active:cursor-grabbing select-none ${
                                  tone.barClass
                                } ${row.hasHold && st.id === 'prep' ? 'ring-2 ring-rose-500 ring-offset-1' : ''}`}
                              >
                                {/* Stage cue: the tone owns the fill, this edge keeps Prep / MBO / Main / OQC apart */}
                                <span
                                  aria-hidden="true"
                                  className={`pointer-events-none absolute inset-y-0 left-0 w-[3px] rounded-l-[5px] ${st.edgeClass}`}
                                />
                                <span
                                  role="presentation"
                                  onPointerDown={(event) => startStageDrag(event, project, row, st, 'resize-start')}
                                  style={{ touchAction: 'none' }}
                                  className="absolute inset-y-0 left-0 w-2 cursor-ew-resize rounded-l-md bg-white/30 opacity-0 group-hover:opacity-100 group-active:opacity-100 transition-opacity"
                                />
                                <span className="relative flex min-w-0 items-center gap-1 pl-1">
                                  <span aria-hidden="true" className="shrink-0 text-[9px] leading-none opacity-90">
                                    {st.glyph}
                                  </span>
                                  <span className="min-w-0 truncate">
                                    {barWidth >= 72 ? st.label : st.shortLabel}
                                  </span>
                                </span>
                                <span
                                  role="presentation"
                                  onPointerDown={(event) => startStageDrag(event, project, row, st, 'resize-end')}
                                  style={{ touchAction: 'none' }}
                                  className="absolute inset-y-0 right-0 w-2 cursor-ew-resize rounded-r-md bg-white/30 opacity-0 group-hover:opacity-100 group-active:opacity-100 transition-opacity"
                                />
                                {preview && (
                                  <span className="pointer-events-none absolute -top-6 left-0 z-30 rounded bg-slate-900/95 dark:bg-slate-700 px-1.5 py-0.5 text-[10px] font-bold text-white shadow-lg tabular-nums">
                                    {formatShortDate(preview.start)} – {formatShortDate(preview.end)} · {preview.days}d
                                  </span>
                                )}
                              </button>
                            );
                          })}

                          {/* ETD Milestone Marker */}
                          <button
                            type="button"
                            onClick={() => onOpenGate(project.id, 'ship', row.primaryLineKey)}
                            title={`${project.model} ${row.sideBadge} ${row.label} · ETD Shipment: ${formatShortDate(row.schedule.etd)}`}
                            style={{ left: `${etdPx + dayWidthPx / 2 - 6}px` }}
                            className="absolute top-4 w-3 h-3 rotate-45 bg-cyan-500 border border-cyan-800 hover:scale-125 transition-transform z-10"
                          />

                          {/* FATP MIH Milestone Diamond */}
                          <button
                            type="button"
                            onClick={() => onOpenGate(project.id, 'mih', row.primaryLineKey)}
                            title={`${project.model} ${row.sideBadge} ${row.label} · FATP MIH Target: ${formatShortDate(row.schedule.mih)}`}
                            style={{ left: `${mihPx + dayWidthPx / 2 - 7}px` }}
                            className="absolute top-3.5 w-3.5 h-3.5 rotate-45 bg-emerald-600 border-2 border-white dark:border-slate-800 shadow-sm ring-1 ring-emerald-700 hover:scale-125 transition-transform z-10"
                          />

                          {/* PBR Closure Dot */}
                          <button
                            type="button"
                            onClick={() => onOpenGate(project.id, 'pbr', row.primaryLineKey)}
                            title={`${project.model} ${row.sideBadge} ${row.label} · PBR Target: ${formatShortDate(row.schedule.pbr)}`}
                            style={{ left: `${pbrPx + dayWidthPx / 2 - 5}px` }}
                            className="absolute top-[19px] w-2.5 h-2.5 rounded-full bg-slate-800 dark:bg-slate-600 border border-white dark:border-slate-800 shadow-xs hover:scale-125 transition-transform z-10"
                          />

                          {/* Today Vertical Reference Line */}
                          {showTodayLine && (
                            <div
                              style={{ left: `${todayOffsetPx}px` }}
                              className="absolute top-0 bottom-0 w-px border-l border-dashed border-rose-500 pointer-events-none z-10"
                            />
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Footer Helper Bar */}
        <div className="px-5 py-2.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400">
          <div className="inline-flex items-center gap-1.5">
            <Flag className="w-3.5 h-3.5 text-rose-500 dark:text-rose-400" />
            <span>
              Dashed red vertical line marks <strong className="text-slate-700 dark:text-slate-300">Today ({formatShortDate(todayIso())}, {todayIso().slice(0, 4)})</strong>.
            </span>
          </div>
          <span>
            Bar colour follows each line's gate sign-off (Compact Config shows its weakest line); the
            stage name is printed on the bar. Drag a bar to move it, drag an edge to resize it (Esc
            cancels); click a bar or milestone diamond to open its Gate Sign-Off dossier.
          </span>
        </div>
      </section>
    </div>
  );
}

// ============================================================================
// VIEW 4: NPI GATE PASS SIGN-OFF CENTER (MULTI-CONFIG & DEPENDENCY LOCKS)
// ============================================================================

function GateSignOffView({
  projects,
  selectedProject,
  onSelectProject,
  globalSide,
  selectedLineKey,
  selectedLineKeys,
  onUpdateSelectedLines,
  selectedGateId,
  onSelectGate,
  gateRecords,
  scheduleOverrides = {},
  tasks,
  onToggleCriterion,
  onOpenSignOffModal,
  onFinalizeGate,
  onAddEvidence,
  onOpenGate,
  onSelectTask
}) {
  const allLineVariants = useMemo(
    () =>
      getLineVariantsForProject(selectedProject).filter(
        (v) => globalSide === 'ALL' || v.side === globalSide
      ),
    [selectedProject, globalSide]
  );

  const validKeys = useMemo(() => {
    const allowed = new Set(allLineVariants.map((v) => v.key));
    const kept = selectedLineKeys.filter((k) => allowed.has(k));
    if (kept.length > 0) return kept;
    return allLineVariants[0] ? [allLineVariants[0].key] : [];
  }, [allLineVariants, selectedLineKeys]);

  const primaryKey = validKeys.includes(selectedLineKey) ? selectedLineKey : validKeys[0];
  const projectLineGates = gateRecords[selectedProject.id] || {};
  const activeDossier = projectLineGates[primaryKey]?.[selectedGateId];
  const activeGateMeta = NPI_GATES.find((g) => g.id === selectedGateId) || NPI_GATES[0];
  const activeGateIdx = NPI_GATES.findIndex((g) => g.id === activeGateMeta.id);

  // KPI strip: the portfolio count spans the scope, the rest is the selected program.
  const portfolioLineCount = projects.reduce(
    (sum, p) =>
      sum + getLineVariantsForProject(p).filter((v) => globalSide === 'ALL' || v.side === globalSide).length,
    0
  );

  let programApprovedGates = 0;
  let programBlockedGates = 0;
  let programTotalGates = 0;
  let programPendingSignOffs = 0;
  let programPendingGateCount = 0;
  allLineVariants.forEach((v) => {
    const lineGates = projectLineGates[v.key] || {};
    NPI_GATES.forEach((g) => {
      const dossier = lineGates[g.id];
      programTotalGates += 1;
      if (!dossier) return;
      if (dossier.status === 'Approved') programApprovedGates += 1;
      if (dossier.status === 'Blocked') programBlockedGates += 1;
      if (dossier.status === 'In Review' || dossier.status === 'Blocked' || dossier.status === 'Conditional') {
        const open = (dossier.approvers || []).filter(
          (a) => a.decision === 'Pending' || a.decision === 'Rejected'
        ).length;
        programPendingSignOffs += open;
        if (open > 0) programPendingGateCount += 1;
      }
    });
  });

  const programTasks = tasks.filter((t) => t.projectId === selectedProject.id);
  const programOpenTasks = programTasks.filter((t) => t.status !== 'Done').length;
  const programBlockedTasks = programTasks.filter((t) => t.status === 'Blocked').length;
  const programLabel = `${selectedProject.model} ${selectedProject.phase}`;

  const [evidenceFormOpen, setEvidenceFormOpen] = useState(false);
  const [evidenceLabel, setEvidenceLabel] = useState('');
  const [evidenceUrl, setEvidenceUrl] = useState('');
  const [evidenceError, setEvidenceError] = useState('');
  // Only real, hand-attached links are listed here: a placeholder or malformed
  // URL would be a clickable dead end instead of the evidence it claims to be.
  const evidenceItems = (Array.isArray(activeDossier?.evidence) ? activeDossier.evidence : []).filter(
    (ev) => isOpenableEvidenceUrl(ev && ev.url)
  );

  const handleSubmitEvidence = (event) => {
    event.preventDefault();
    const label = evidenceLabel.trim();
    const url = evidenceUrl.trim();
    if (!label || !url) return;
    if (!/^https?:\/\//i.test(url)) {
      setEvidenceError('Paste the full link, starting with https://');
      return;
    }
    onAddEvidence(selectedProject.id, validKeys, selectedGateId, { label, url });
    setEvidenceLabel('');
    setEvidenceUrl('');
    setEvidenceError('');
    setEvidenceFormOpen(false);
  };

  const uniqueConfigs = Array.from(new Set(allLineVariants.map((v) => v.config)));
  const linkedTasks = tasks.filter(
    (t) => t.projectId === selectedProject.id && t.gateId === selectedGateId
  );

  // Readiness is measured per selected Config × Side line, because Approve & Lock
  // only signs the lines that actually cleared their criteria and signers.
  const lineReadiness = validKeys.map((key) => {
    const dossier = projectLineGates[key]?.[selectedGateId];
    const reasons = [];
    if (!dossier) {
      reasons.push('no gate dossier');
    } else if (dossier.status === 'Approved') {
      reasons.push('already approved');
    } else {
      const open = (dossier.criteria || []).filter((c) => !c.checked).length;

      if (missing > 0) reasons.push(`${missing} signature${missing === 1 ? '' : 's'} missing`);
    }
    return { key, status: dossier?.status || 'Pending', reasons, ready: reasons.length === 0 };

                    <tr key={app.role} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/80">
                      <td className="py-3 px-4 font-bold text-slate-900 dark:text-slate-100 whitespace-nowrap">
                        {app.role}
                      </td>
                      <td className="py-3 px-3 text-slate-700 dark:text-slate-300 whitespace-nowrap">{app.name}</td>
                      <td className="py-3 px-3 whitespace-nowrap">
                        <StatusBadge status={app.decision} />
                      </td>
                      <td
                        className="py-3 px-3 text-slate-500 dark:text-slate-400 max-w-[220px] truncate"
                        title={app.remark}
                      >
                        {app.remark || '—'}
                      </td>
                      <td className="py-3 px-4 text-right whitespace-nowrap">
                        <button
                          type="button"
                          disabled={scopeLocked}
                          onClick={() => onOpenSignOffModal(idx, validKeys)}
                          className="px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-900 hover:text-white text-[11px] font-semibold text-slate-700 dark:text-slate-300 disabled:opacity-40 transition-colors"
                        >
                          Sign Off
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {validKeys.length > 1 && (
              <div className="border-t border-slate-200 dark:border-slate-800 px-4 py-2.5 space-y-1">
                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                  Readiness by line
                </div>
                {lineReadiness.map((r) => (
                  <div key={r.key} className="flex items-center gap-2 text-[11px] min-w-0">
                    {r.ready ? (
                      <CheckCircle2 className="w-3 h-3 shrink-0 text-emerald-600 dark:text-emerald-400" />
                    ) : (
                      <Clock className="w-3 h-3 shrink-0 text-slate-400 dark:text-slate-500" />
                    )}
                    <span className="font-semibold text-slate-700 dark:text-slate-300 shrink-0 w-20">
                      {r.key}
                    </span>
                    <span className="text-slate-500 dark:text-slate-400 truncate">
                      {r.ready ? `Ready · ${r.status}` : r.reasons.join(' · ')}
                    </span>
                  </div>
                ))}
                <p className="text-[10px] text-slate-400 dark:text-slate-500 pt-0.5">
                  Approve &amp; Lock signs the ready lines only; the rest stay at {activeGateMeta.code}.
                </p>
              </div>
            )}
          </div>

          {/* Gate Evidence · Google Drive links retained with the signed dossier */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div>
                <div className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                  Gate Evidence · Google Drive ({evidenceItems.length})
                </div>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">
                  {validKeys.length > 1
                    ? `Links attach to all ${validKeys.length} selected lines and are logged in the audit trail`
                    : 'Append-only reference links kept with the signed dossier'}
                </p>
              </div>
              <button
                type="button"
                onClick={() => {
                  setEvidenceFormOpen((open) => !open);
                  setEvidenceError('');
                }}
                className="px-2.5 py-1 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-[11px] font-semibold inline-flex items-center gap-1.5 transition-colors"
              >
                <Plus className="w-3 h-3" />
                <span>{evidenceFormOpen ? 'Close' : 'Add Drive link'}</span>
              </button>
            </div>

            {evidenceFormOpen && (
              <form
                onSubmit={handleSubmitEvidence}
                className="p-3.5 space-y-2 border-b border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/50"
              >
                <div>
                  <label className="text-[11px] font-semibold text-slate-700 dark:text-slate-300 block mb-1">
                    Evidence label
                  </label>
                  <input
                    type="text"
                    value={evidenceLabel}
                    onChange={(e) => setEvidenceLabel(e.target.value)}
                    placeholder="e.g. IQC OMM flatness report"
                    required
                    className="w-full px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 bg-white dark:bg-slate-900"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-semibold text-slate-700 dark:text-slate-300 block mb-1">
                    Google Drive link
                  </label>
                  <input
                    type="url"
                    value={evidenceUrl}
                    onChange={(e) => setEvidenceUrl(e.target.value)}
                    placeholder="https://drive.google.com/drive/folders/..."
                    required
                    className="w-full px-2.5 py-1.5 text-xs font-mono border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 bg-white dark:bg-slate-900"
                  />
                  <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">
                    Share the folder or file with the gate board first — reviewers need read access.
                  </p>
                </div>
                {evidenceError && (
                  <p className="text-[10px] font-semibold text-rose-600 dark:text-rose-400">{evidenceError}</p>
                )}
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setEvidenceFormOpen(false);
                      setEvidenceError('');
                    }}
                    className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 text-[11px] font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-2.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-semibold"
                  >
                    Attach link
                  </button>
                </div>
              </form>
            )}

            <div className="divide-y divide-slate-100 dark:divide-slate-800 max-h-56 overflow-y-auto">
              {evidenceItems.length === 0 ? (
                <div className="p-4 text-xs text-slate-400 dark:text-slate-400">
                  No Drive link yet — attach the folder or file that holds this gate's evidence.
                </div>
              ) : (
                evidenceItems.map((ev) => (
                  <div key={ev.id} className="px-3.5 py-2.5">
                    <a
                      href={ev.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      title={`Open ${ev.url}`}
                      className="text-xs font-semibold text-blue-700 dark:text-blue-300 hover:underline inline-flex items-center gap-1.5 max-w-full"
                    >
                      <ExternalLink className="w-3.5 h-3.5 shrink-0" />
                      <span className="truncate">{ev.label}</span>
                    </a>
                    <a
                      href={ev.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      title={`Open ${ev.url}`}
                      className="block text-[10px] font-mono text-slate-400 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-300 hover:underline truncate mt-0.5 pl-5"
                    >
                      {ev.url}
                    </a>
                    <div className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5 pl-5">
                      {ev.addedBy} · {ev.addedAt}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Audit Trail */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                Gate Sign-Off Audit Trail
              </div>
              <span className="text-[10px] font-semibold text-slate-400 dark:text-slate-500">
                {primaryKey} · newest first
              </span>
            </div>
            <div className="divide-y divide-slate-100 dark:divide-slate-800 max-h-56 overflow-y-auto">
              {activeDossier.auditLog.length === 0 ? (
                <div className="p-4 text-xs text-slate-400 dark:text-slate-400">No sign-off actions recorded yet.</div>
              ) : (
                activeDossier.auditLog.map((entry, idx) => (
                  <div key={idx} className="p-3.5 text-xs space-y-0.5">
                    <div className="flex items-center justify-between gap-2">
                      <strong className="text-slate-800 dark:text-slate-200">{entry.actor}</strong>
                      <span className="text-[11px] text-slate-400 dark:text-slate-400 tabular-nums">{entry.time}</span>
                    </div>
                    <div className="font-semibold text-blue-700 dark:text-blue-300">{entry.action}</div>
                    <div className="text-slate-600 dark:text-slate-400">{entry.note}</div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      </div>

      {/* Step 3 · Portfolio view, after the gate in hand */}
      <div className="space-y-2">
        <div className="flex flex-wrap items-baseline justify-between gap-2 px-1">
          <h3 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
            Portfolio Dependency Matrix
          </h3>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">
            All programs · click any gate cell to load that dossier above
          </p>
        </div>
        <GateWorkstreamMatrix
          projects={projects}
          gateRecords={gateRecords}
          globalSide={globalSide}
          scheduleOverrides={scheduleOverrides}
          onOpenGate={onOpenGate}
        />
      </div>
    </div>
  );
}

// ============================================================================
// VIEW 5: PRODUCTION RECORDS (CALCULATED FPY, FY, UPH & EFFICIENCY)
// ============================================================================

function ProductionRecordsView({ records, onOpenNewRecord, onEditRecord, onDeleteRecord, onImportFile }) {
  const [searchQuery, setSearchQuery] = useState('');
  const [stationFilter, setStationFilter] = useState('ALL');
  const [expandedIds, setExpandedIds] = useState({});

  const toggleExpand = (id) => {
    setExpandedIds((prev) => ({ ...prev, [id]: !prev[id] }));
  };

  const filteredRecords = useMemo(() => {
    return records.filter((r) => {
      if (stationFilter !== 'ALL' && r.station !== stationFilter) return false;
      if (!searchQuery.trim()) return true;
      const q = searchQuery.toLowerCase();
      const defectMatch = (r.defectItems || []).some((d) =>
        d.mode.toLowerCase().includes(q)
      );
      const dtMatch = (r.downtimeEvents || []).some(
        (e) =>
          e.reason.toLowerCase().includes(q) || e.category.toLowerCase().includes(q)
      );
      return (
        r.model.toLowerCase().includes(q) ||
        r.phase.toLowerCase().includes(q) ||
        (r.station || '').toLowerCase().includes(q) ||
        r.config.toLowerCase().includes(q) ||
        r.side.toLowerCase().includes(q) ||
        defectMatch ||
        dtMatch
      );
    });
  }, [records, stationFilter, searchQuery]);

  const totals = useMemo(() => {
    const agg = filteredRecords.reduce(
      (acc, r) => {
        const m = computeProductionMetrics(r);
        return {
          input: acc.input + r.input,
          fallout: acc.fallout + m.fallout,
          salvage: acc.salvage + m.salvage,
          plannedTimeHr: acc.plannedTimeHr + r.plannedTimeHr,
          downtimeHr: acc.downtimeHr + m.downtimeHr
        };
      },
      { input: 0, fallout: 0, salvage: 0, plannedTimeHr: 0, downtimeHr: 0 }
    );
    return {
      ...agg,
      ...computeProductionMetrics(agg)
    };
  }, [filteredRecords]);

  return (
    <div className="space-y-6">
      {/* Calculated Summary KPI Strip */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Total Input Qty</div>
          <div className="text-xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">
            {totals.input.toLocaleString()} <span className="text-xs font-normal text-slate-400 dark:text-slate-400">pcs</span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            Fallout {totals.fallout} · Salvage {totals.salvage}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated FPY</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              totals.fpy >= KPI_TARGETS.fpy ? 'text-emerald-700 dark:text-emerald-300' : 'text-amber-700 dark:text-amber-300'
            }`}
          >
            {totals.fpy.toFixed(2)}%
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">(Input − Fallout) / Input</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated FY</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              totals.fy >= KPI_TARGETS.fy ? 'text-emerald-700 dark:text-emerald-300' : 'text-amber-700 dark:text-amber-300'
            }`}
          >
            {totals.fy.toFixed(2)}%
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">(Input − Fallout + Salvage) / Input</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated Output UPH</div>
          <div className="text-xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">
            {totals.uph.toFixed(1)}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            Planned {totals.plannedTimeHr.toFixed(1)}h · DT {totals.downtimeHr.toFixed(2)}h
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1 col-span-2 lg:col-span-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated Efficiency</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              totals.efficiency >= KPI_TARGETS.efficiency ? 'text-emerald-700 dark:text-emerald-300' : 'text-amber-700 dark:text-amber-300'
            }`}
          >
            {totals.efficiency.toFixed(1)}%
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Output UPH / Input UPH</div>
        </div>
      </div>

      {/* Main Production Records Ledger */}
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 className="text-sm font-semibold text-slate-900 dark:text-slate-100">Production Records</h2>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
              Expand any row to inspect multi-item Fallout / Salvage defects and Downtime events by Station / Process
            </p>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <select
              aria-label="Filter by Station or Process"
              value={stationFilter}
              onChange={(e) => setStationFilter(e.target.value)}
              className="px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 font-medium"
            >
              <option value="ALL">All Stations / Processes</option>
              {PRODUCTION_STATIONS.map((st) => (
                <option key={st} value={st}>
                  {st}
                </option>
              ))}
            </select>

            <div className="relative">
              <Search className="w-3.5 h-3.5 text-slate-400 dark:text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search defect, downtime, config..."
                className="pl-8 pr-3 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 w-52"
              />
            </div>
            {typeof onImportFile === 'function' && (
              <label
                className="px-2.5 py-1.5 rounded-lg border border-blue-200 dark:border-blue-800 bg-blue-50 dark:bg-blue-950 hover:bg-blue-100 dark:hover:bg-blue-900 text-blue-700 dark:text-blue-300 text-xs font-semibold inline-flex items-center gap-1.5 cursor-pointer"
                title="Every row goes through the same rules as the form; refused rows are named with their reason."
              >
                <Upload className="w-3.5 h-3.5" />
                <span>Import CSV / Excel</span>
                <input
                  type="file"
                  accept=".csv,.xlsx,.xls"
                  className="hidden"
                  aria-label="Import production records from CSV or Excel"
                  onChange={(e) => {
                    const picked = e.target.files && e.target.files[0];
                    if (picked) onImportFile(picked);
                    e.target.value = '';
                  }}
                />
              </label>
            )}
            <button
              type="button"
              onClick={onOpenNewRecord}
              className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition-colors"
            >
              <Plus className="w-3.5 h-3.5" />
              <span>Log Record</span>
            </button>
          </div>
        </div>

        <div className="overflow-x-auto">
          {filteredRecords.length === 0 ? (
            <div className="p-10 text-center text-xs text-slate-500 dark:text-slate-400">
              No production records match the current Global Scope, station, or search filter.
            </div>
          ) : (
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <tr>
                  <th className="py-3 pl-3 pr-1 w-8" />
                  <th className="py-3 px-2.5 whitespace-nowrap">Product</th>
                  <th className="py-3 px-2 whitespace-nowrap">Phase</th>
                  <th className="py-3 px-2.5 whitespace-nowrap">Station / Process</th>
                  <th className="py-3 px-2 whitespace-nowrap">Config</th>
                  <th className="py-3 px-2 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Side</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap">Input</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap">Fallout</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Salvage</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap">Planned (h)</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Downtime</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">FPY</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">FY</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">UPH</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">Eff.</th>
                  <th className="py-3 pl-2 pr-4 text-right whitespace-nowrap">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                {filteredRecords.map((r) => {
                  const m = computeProductionMetrics(r);
                  const isExpanded = Boolean(expandedIds[r.id]);
                  const defectList = r.defectItems || [];
                  const downtimeList = r.downtimeEvents || [];
                  const falloutCount = defectList.filter((d) => (Number(d.falloutQty) || 0) > 0).length;
                  const salvageCount = defectList.filter((d) => (Number(d.salvageQty) || 0) > 0).length;

                  return (
                    <React.Fragment key={r.id}>
                      <tr
                        onClick={() => toggleExpand(r.id)}
                        className={`cursor-pointer transition-colors ${
                          isExpanded ? 'bg-blue-50/40 dark:bg-blue-950/40' : 'hover:bg-slate-50/90 dark:hover:bg-slate-800/90'
                        }`}
                      >
                        <td className="py-2.5 pl-3 pr-1 text-slate-400 dark:text-slate-400">
                          {isExpanded ? (
                            <ChevronDown className="w-4 h-4 text-blue-600 dark:text-blue-400" />
                          ) : (
                            <ChevronRight className="w-4 h-4" />
                          )}
                        </td>
                        <td className="py-2.5 px-2.5 whitespace-nowrap">
                          <div className="font-bold text-slate-900 dark:text-slate-100">{r.model}</div>
                          <div className="text-[10px] text-slate-400 dark:text-slate-400">{r.date}</div>
                        </td>
                        <td className="py-2.5 px-2 whitespace-nowrap">
                          <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                            {r.phase}
                          </span>
                        </td>
                        <td className="py-2.5 px-2.5 whitespace-nowrap">
                          <span className="inline-flex items-center px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-800 text-[11px] font-semibold">
                            {r.station || 'Fan Assembly'}
                          </span>
                        </td>
                        <td className="py-2.5 px-2 whitespace-nowrap font-semibold text-slate-800 dark:text-slate-200">
                          {r.config}
                        </td>
                        <td className="py-2.5 px-2 whitespace-nowrap border-r border-slate-200/70 dark:border-slate-800/70">
                          <span
                            className={`inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold border ${
                              r.side === 'RHS'
                                ? 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800'
                                : 'bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800'
                            }`}
                          >
                            {r.side}
                          </span>
                        </td>
                        <td className="py-2.5 px-2.5 text-right font-semibold text-slate-900 dark:text-slate-100">
                          {r.input.toLocaleString()}

// ============================================================================
// VIEW 6: PROCESS CAPABILITY (CPK) & MASTER SPECIFICATIONS
// ============================================================================

// Columns are model · config · side contexts, not averages: one latest reading
// per spec stays visible for each context in the given record set.
function buildCpkColumnModel(records) {
  const columns = new Map();
  (records || []).forEach((r) => {
    const key = [r.model, r.phase, r.config, r.side].join('\u0000');
    if (!columns.has(key)) {
      columns.set(key, { key, model: r.model, phase: r.phase, config: r.config, side: r.side, bySpec: {} });
    }
    const col = columns.get(key);
    const prev = col.bySpec[r.specId];
    if (!prev || String(r.date || '') >= String(prev.date || '')) col.bySpec[r.specId] = r;
  });

  // Phase, then model, side and config; this also puts every phase's columns in
  // one run so the header can span them with a single colSpan.
  const sorted = Array.from(columns.values()).sort(
    (a, b) =>
      orderedRank(PHASE_ORDER, a.phase) - orderedRank(PHASE_ORDER, b.phase) ||
      String(a.model || '').localeCompare(String(b.model || '')) ||
      orderedRank(SIDE_ORDER, a.side) - orderedRank(SIDE_ORDER, b.side) ||
      String(a.config || '').localeCompare(String(b.config || ''))
  );
  const phases = [];
  sorted.forEach((col) => {
    const last = phases[phases.length - 1];
    if (last && last.phase === col.phase) last.count += 1;
    else phases.push({ phase: col.phase, count: 1 });
  });
  return { columns: sorted, phases };
}

const CPK_FAMILY_ORDER = ['MB14"', 'MB16"', 'MacMini', 'iMac', 'Display'];

function cpkFamilyRank(family) {
  const index = CPK_FAMILY_ORDER.indexOf(family);
  if (index >= 0) return index;
  return family === 'Other' ? 99 : 50;
}

function CpkMasterSpecsView({
  masterSpecs,
  cpkRecords,
  uploadHistory = [],
  lastUploadBatch = null,
  onOpenCpkChart,
  onOpenCpkImport,
  onGenerateFfmSpecs,
  onOpenNewSpec,
  onEditSpec,
  onDeleteSpec
}) {
  const [subTab, setSubTab] = useState('transposed'); // 'transposed' | 'specs'
  const [compareSpecId, setCompareSpecId] = useState(null);
  const [uploadedOnly, setUploadedOnly] = useState(false);
  // The six placeholder CTQs have no readings yet, so the matrix — which only
  // starts a row once a reading covers the spec — would drop them entirely now
  // that the Overview panel no longer repeats them.
  const [provisionalOnly, setProvisionalOnly] = useState(false);
  const [familyFilter, setFamilyFilter] = useState('ALL');
  const [search, setSearch] = useState('');
  const [specModel, setSpecModel] = useState('ALL');

  const specMap = useMemo(() => {
    const m = {};
    masterSpecs.forEach((s) => {
      m[s.id] = s;
    });
    return m;
  }, [masterSpecs]);

  const ctqSpecCount = useMemo(
    () => masterSpecs.filter((spec) => spec.ctq !== false).length,
    [masterSpecs]
  );

  const provisionalLimitSpecs = useMemo(
    () => masterSpecs.filter((spec) => spec.ctq !== false && spec.limitsProvisional === true),
    [masterSpecs]
  );

  // One matrix, one lens. The two toolbar chips narrow different halves of the
  // same view — the provisional chip picks the rows, the upload chip picks the
  // readings — so both pressed at once let each quietly overrule the other while
  // both looked active. Turning either on now releases the other, and a chip with
  // nothing left to filter (no placeholders, no upload batch) stops applying.
  const provisionalActive = provisionalOnly && provisionalLimitSpecs.length > 0;
  const toggleProvisionalOnly = () => {
    const next = !provisionalOnly;
    setProvisionalOnly(next);
    if (next) setUploadedOnly(false);
  };
  const toggleUploadedOnly = () => {
    const next = !uploadedOnly;
    setUploadedOnly(next);
    if (next) setProvisionalOnly(false);
  };

  const activeCpkRecords = useMemo(() => {
    if (uploadedOnly && lastUploadBatch) {
      return cpkRecords.filter((r) => r.uploadBatchId === lastUploadBatch.id);
    }
    return cpkRecords;
  }, [cpkRecords, uploadedOnly, lastUploadBatch]);

  const visibleSpecsForMatrix = useMemo(() => {
    // Only parameters defined as CTQ belong in the capability matrix; rows saved
    // before the flag existed are treated as CTQ so nothing silently disappears.
    const ctqSpecs = masterSpecs.filter((spec) => spec.ctq !== false);
    if (provisionalActive) return ctqSpecs.filter((spec) => spec.limitsProvisional === true);
    if (uploadedOnly && lastUploadBatch) {
      const idSet = new Set(lastUploadBatch.matchedSpecIds);
      return ctqSpecs.filter((s) => idSet.has(s.id));
    }
    return ctqSpecs;
  }, [masterSpecs, uploadedOnly, lastUploadBatch, provisionalActive]);

  // Transposed matrix: one row per Station > Variable > Spec and one column per
  // measurement context (stage · config · side, read within a model). A cell shows
  // that context's latest reading for the spec, not an average of them.
  const cpkMatrix = useMemo(() => buildCpkColumnModel(activeCpkRecords), [activeCpkRecords]);
  const cpkColumns = cpkMatrix.columns;

  // One section per product family. Each section keeps only that family's
  // contexts, so MB14" and MB16" readings never share a column header; within a
  // section only variables with a reading in that family get a row, grouped by
  // station in process sequence.
  const cpkFamilyMatrices = useMemo(() => {
    const familyOf = (model) => inferFamilyFromModel(model) || 'Other';
    const byFamily = new Map();
    activeCpkRecords.forEach((record) => {
      const family = record.familyGroup || familyOf(record.model);
      if (!byFamily.has(family)) byFamily.set(family, []);
      byFamily.get(family).push(record);
    });
    // Under the provisional filter every placeholder CTQ is in scope, including
    // the ones no upload has reached yet, so their families need a section even
    // when the family carries no reading at all.
    if (provisionalActive) {
      provisionalLimitSpecs.forEach((spec) => {
        const family = familyOf(spec.model);
        if (!byFamily.has(family)) byFamily.set(family, []);
      });
    }

    const stageRank = (station) => orderedRank(PROCESS_STEPS, PROCESS_STEP_BY_STATION[station] || '');
    return Array.from(byFamily.entries())
      .map(([family, familyRecords]) => {
        const model = buildCpkColumnModel(familyRecords);
        const covered = new Set();
        model.columns.forEach((col) => Object.keys(col.bySpec).forEach((id) => covered.add(id)));

        const groups = new Map();
        const addRow = (spec) => {
          const station = spec.station || 'Unassigned station';
          if (!groups.has(station)) groups.set(station, []);
          groups.get(station).push(spec);
        };
        visibleSpecsForMatrix.forEach((spec) => {
          if (!covered.has(spec.id)) return;
          addRow(spec);
        });
        // A provisional CTQ with no reading is the reason this filter exists: it
        // stays listed, with every context showing "—", until a real measurement
        // arrives.
        if (provisionalActive) {
          visibleSpecsForMatrix.forEach((spec) => {
            if (covered.has(spec.id) || familyOf(spec.model) !== family) return;
            addRow(spec);
          });
        }

        return {
          family,
          columns: model.columns,
          phases: model.phases,
          groups: Array.from(groups.entries())
            .map(([station, specs]) => ({ station, specs }))
            .sort((a, b) => stageRank(a.station) - stageRank(b.station) || a.station.localeCompare(b.station))
        };
      })
      .filter((section) => section.groups.length > 0)
      .sort((a, b) => cpkFamilyRank(a.family) - cpkFamilyRank(b.family) || a.family.localeCompare(b.family));
  }, [activeCpkRecords, visibleSpecsForMatrix, provisionalActive, provisionalLimitSpecs]);

  const cpkFamilyOptions = useMemo(
    () => cpkFamilyMatrices.map((section) => section.family),
    [cpkFamilyMatrices]
  );

  // A filter left pointing at a family that no longer has a section (scope or
  // upload filter changed) falls back to All families instead of a blank matrix.
  const activeCpkFamily =
    familyFilter !== 'ALL' && !cpkFamilyOptions.includes(familyFilter) ? 'ALL' : familyFilter;
  const visibleCpkFamilyMatrices =
    activeCpkFamily === 'ALL'
      ? cpkFamilyMatrices
      : cpkFamilyMatrices.filter((section) => section.family === activeCpkFamily);

  const cpkSectionRollup = (section) => {
    let green = 0;
    let total = 0;
    let provisional = 0;
    section.columns.forEach((col) => {
      section.groups.forEach((group) => {
        group.specs.forEach((spec) => {
          const cell = cpkCells.get(`${col.key}\u0000${spec.id}`);
          if (!cell) return;
          if (cell.provisional) {
            provisional += 1;
            return;
          }
          total += 1;
          if (cell.tone.key === 'green') green += 1;
        });
      });
    });
    return { green, total, provisional, pct: total > 0 ? (green / total) * 100 : 0 };
  };

  // Every spec × context cell evaluated once: the latest reading, the limits frozen
  // on it, its capability stats and tone. The table and the rollup both read these,
  // so a reading is never judged twice through two copies of the same code.
  const cpkCells = useMemo(() => {
    const visibleIds = new Set(visibleSpecsForMatrix.map((spec) => spec.id));
    const cells = new Map();
    cpkColumns.forEach((col) => {
      Object.keys(col.bySpec).forEach((specId) => {
        if (!visibleIds.has(specId)) return;
        const spec = specMap[specId];
        if (!spec) return;
        const rec = col.bySpec[specId];
        const limits = effectiveSpecForRecord(spec, rec);
        const stats = computeCapabilityStats(rec, limits);
        const provisional = hasProvisionalLimits(limits);
        cells.set(`${col.key}\u0000${specId}`, {
          rec,
          limits,
          stats,
          provisional,
          tone: provisional ? getProvisionalLimitTone() : getCpkTone(stats.cpk)
        });
      });
    });
    return cells;
  }, [cpkColumns, visibleSpecsForMatrix, specMap]);

  const compareSpec = compareSpecId
    ? visibleSpecsForMatrix.find((spec) => spec.id === compareSpecId) || null
    : null;
  const compareGroups = useMemo(
    () =>
      !compareSpec
        ? []
        : cpkColumns
            .filter((col) => col.bySpec[compareSpec.id])
            .map(({ key, model, phase, config, side, bySpec }) => ({
              key,
              model,
              phase,
              config,
              side,
              record: bySpec[compareSpec.id]
            })),
    [compareSpec, cpkColumns]
  );

  const cpkRollup = useMemo(() => {
    const counts = { green: 0, yellow: 0, orange: 0, provisional: 0 };
    cpkCells.forEach(({ tone, provisional }) => {
      if (provisional) counts.provisional += 1;
      else counts[tone.key] += 1;
    });
    const total = counts.green + counts.yellow + counts.orange;
    return { ...counts, total, passRate: total > 0 ? (counts.green / total) * 100 : 0 };
  }, [cpkCells]);

  const specLimitText = (spec) =>
    spec.specType === 'upper'
      ? `≤ ${spec.usl}`
      : spec.specType === 'lower'
      ? `≥ ${spec.lsl}`
      : `${spec.lsl}–${spec.usl}`;

  const specModelOptions = useMemo(
    () => Array.from(new Set(masterSpecs.map((s) => s.model).filter(Boolean))).sort(),
    [masterSpecs]
  );

  // A model filter left pointing at a model whose last spec was just deleted
  // falls back to "All models" instead of showing a blank select.
  const activeSpecModel =
    specModel !== 'ALL' && !specModelOptions.includes(specModel) ? 'ALL' : specModel;

  const filteredSpecs = useMemo(() => {
    const q = search.trim().toLowerCase();
    return masterSpecs.filter((s) => {
      if (provisionalActive && s.limitsProvisional !== true) return false;
      // Specs without a model apply to every model, so they stay visible.
      if (activeSpecModel !== 'ALL' && s.model && s.model !== activeSpecModel) return false;
      if (!q) return true;
      return [s.code, s.name, s.model, s.station, s.metrology, s.docRef]
        .filter(Boolean)
        .some((v) => String(v).toLowerCase().includes(q));
    });
  }, [masterSpecs, search, activeSpecModel, provisionalActive]);

  return (
    <div className="space-y-6">
      {/* One place for the provisional CTQs: who owns the limits, when they are
          due, and the filter that narrows the matrix and the specs list to them.
          The list and the filter name the same six CTQs, so they sit together
          instead of a banner and a toolbar chip repeating each other. */}
      {provisionalLimitSpecs.length > 0 && (
        <section className="rounded-xl border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950 text-amber-900 dark:text-amber-100 overflow-hidden">
