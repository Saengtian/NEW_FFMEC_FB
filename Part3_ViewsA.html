                                <div className="px-3.5 py-2 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                                    Defects Breakdown ({defectList.length} Defects)
                                  </span>
                                  <span className="text-[11px] font-semibold tabular-nums">
                                    <span className="text-rose-600 dark:text-rose-400">Fallout: {m.fallout}</span>
                                    <span className="mx-1.5 text-slate-300 dark:text-slate-300">|</span>
                                    <span className="text-amber-700 dark:text-amber-300">Salvage: {m.salvage}</span>
                                  </span>
                                </div>
                                {defectList.length === 0 ? (
                                  <div className="p-3 text-xs text-slate-400 dark:text-slate-400">No defects recorded.</div>
                                ) : (
                                  <table className="w-full text-left border-collapse text-xs">
                                    <thead className="bg-slate-50/70 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                      <tr>
                                        <th className="py-2 px-3.5">Defect Mode</th>
                                        <th className="py-2 px-2.5 text-right text-rose-700 dark:text-rose-300">Fallout (Initial)</th>
                                        <th className="py-2 px-2.5 text-right text-emerald-700 dark:text-emerald-300">Salvage (Recov.)</th>
                                        <th className="py-2 px-3.5 text-right">Net Reject</th>
                                      </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                                      {defectList.map((d) => {
                                        const fQty = Math.max(0, Number(d.falloutQty) || 0);
                                        const sQty = Math.min(fQty, Math.max(0, Number(d.salvageQty) || 0));
                                        return (
                                          <tr key={d.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/80">
                                            <td className="py-2 px-3.5 font-medium text-slate-800 dark:text-slate-200">
                                              {d.mode}
                                            </td>
                                            <td className="py-2 px-2.5 text-right font-semibold text-rose-600 dark:text-rose-400">
                                              {fQty}
                                            </td>
                                            <td className="py-2 px-2.5 text-right font-semibold text-emerald-700 dark:text-emerald-300">
                                              {sQty}
                                            </td>
                                            <td className="py-2 px-3.5 text-right font-bold text-slate-900 dark:text-slate-100">
                                              {fQty - sQty}
                                            </td>
                                          </tr>
                                        );
                                      })}
                                    </tbody>
                                    <tfoot className="bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 font-bold tabular-nums">
                                      <tr>
                                        <td className="py-2 px-3.5 text-slate-700 dark:text-slate-300">Total</td>
                                        <td className="py-2 px-2.5 text-right text-rose-700 dark:text-rose-300">{m.fallout}</td>
                                        <td className="py-2 px-2.5 text-right text-emerald-700 dark:text-emerald-300">{m.salvage}</td>
                                        <td className="py-2 px-3.5 text-right text-slate-900 dark:text-slate-100">{m.netReject}</td>
                                      </tr>
                                    </tfoot>
                                  </table>
                                )}
                              </div>

                              {/* Multi-Event Downtime Panel */}
                              <div className="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 overflow-hidden">
                                <div className="px-3.5 py-2 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                                    Downtime Events ({downtimeList.length} Events)
                                  </span>
                                  <span className="text-[11px] font-semibold text-slate-700 dark:text-slate-300 tabular-nums">
                                    Total: {m.downtimeMin.toFixed(0)} min ({m.downtimeHr.toFixed(2)} hr)
                                  </span>
                                </div>
                                {downtimeList.length === 0 ? (
                                  <div className="p-3 text-xs text-slate-400 dark:text-slate-400">No downtime events recorded.</div>
                                ) : (
                                  <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {downtimeList.map((ev) => (
                                      <div
                                        key={ev.id}
                                        className="px-3.5 py-2 flex items-center justify-between gap-2 text-xs"
                                      >
                                        <div className="min-w-0">
                                          <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 mr-2">
                                            {ev.category}

                                          <span className="text-slate-800 dark:text-slate-200">{ev.reason}</span>

                                        <span className="font-bold text-slate-900 dark:text-slate-100 tabular-nums shrink-0">

                    </React.Fragment>
                  );
                })}
              </tbody>
              <tfoot className="bg-slate-100/90 dark:bg-slate-800/90 border-t-2 border-slate-300 dark:border-slate-700 font-bold text-slate-900 dark:text-slate-100 tabular-nums">
                <tr>
                  <td className="py-3 pl-4 pr-3" colSpan={6}>
                    Weighted Total ({filteredRecords.length} records)
                  </td>
                  <td className="py-3 px-2.5 text-right">{totals.input.toLocaleString()}</td>
                  <td className="py-3 px-2.5 text-right text-rose-700 dark:text-rose-300">{totals.fallout.toLocaleString()}</td>

                  <td className="py-3 px-2.5 text-right">{totals.plannedTimeHr.toFixed(2)}</td>

}

// ============================================================================
// VIEW 6: PROCESS CAPABILITY (CPK) & MASTER SPECIFICATIONS
// ============================================================================

function CpkMasterSpecsView({
  masterSpecs,
  cpkRecords,
  uploadHistory = [],
  lastUploadBatch = null,
  onOpenCpkChart,
  onOpenCpkImport,
  onGenerateFfmSpecs,
  onOpenNewSpec,
  onEditSpec,
  onDeleteSpec
}) {
  const [subTab, setSubTab] = useState('matrix'); // 'matrix' | 'specs'
  const [cpkFilter, setCpkFilter] = useState('ALL'); // 'ALL' | 'green' | 'yellow' | 'orange'
  const [uploadedOnly, setUploadedOnly] = useState(false);
  const [search, setSearch] = useState('');
  const [specModel, setSpecModel] = useState('ALL');

  const specMap = useMemo(() => {
    const m = {};
    masterSpecs.forEach((s) => {
      m[s.id] = s;
    });
    return m;
  }, [masterSpecs]);

  const activeCpkRecords = useMemo(() => {
    if (uploadedOnly && lastUploadBatch) {
      return cpkRecords.filter((r) => r.uploadBatchId === lastUploadBatch.id);
    }
    return cpkRecords;
  }, [cpkRecords, uploadedOnly, lastUploadBatch]);

  const visibleSpecsForMatrix = useMemo(() => {
    if (uploadedOnly && lastUploadBatch) {
      const idSet = new Set(lastUploadBatch.matchedSpecIds);
      return masterSpecs.filter((s) => idSet.has(s.id));
    }
    return masterSpecs;
  }, [masterSpecs, uploadedOnly, lastUploadBatch]);

  const kpiSummary = useMemo(() => {
    let green = 0;
    let yellow = 0;
    let orange = 0;
    activeCpkRecords.forEach((r) => {
      const spec = specMap[r.specId];
      if (!spec) return;
      const { cpk } = computeCapabilityStats(r, effectiveSpecForRecord(spec, r));
      if (cpk > 1.33) green += 1;
      else if (cpk >= 1.0) yellow += 1;
      else orange += 1;
    });
    return { total: green + yellow + orange, green, yellow, orange };
  }, [activeCpkRecords, specMap]);

  const matrixRows = useMemo(() => {
    const map = new Map();
    activeCpkRecords.forEach((r) => {
      const key = `${r.model}-${r.phase}-${r.side}`;
      if (!map.has(key)) {
        map.set(key, {
          key,
          model: r.model,
          phase: r.phase,
          side: r.side,
          config: r.config,
          sourceFile: r.sourceFile || null,
          bySpec: {}
        });
      }
      if (r.sourceFile) map.get(key).sourceFile = r.sourceFile;
      map.get(key).bySpec[r.specId] = r;
    });
    return Array.from(map.values()).sort((a, b) => {
      const m = a.model.localeCompare(b.model);
      if (m !== 0) return m;
      return SIDE_ORDER.indexOf(a.side) - SIDE_ORDER.indexOf(b.side);
    });
  }, [activeCpkRecords]);

  const specModelOptions = useMemo(
    () => Array.from(new Set(masterSpecs.map((s) => s.model).filter(Boolean))).sort(),
    [masterSpecs]
  );

  // A model filter left pointing at a model whose last spec was just deleted
  // falls back to "All models" instead of showing a blank select.
  const activeSpecModel =
    specModel !== 'ALL' && !specModelOptions.includes(specModel) ? 'ALL' : specModel;

  const filteredSpecs = useMemo(() => {
    const q = search.trim().toLowerCase();
    return masterSpecs.filter((s) => {
      // Specs without a model apply to every model, so they stay visible.
      if (activeSpecModel !== 'ALL' && s.model && s.model !== activeSpecModel) return false;
      if (!q) return true;
      return [s.code, s.name, s.model, s.station, s.metrology, s.docRef]
        .filter(Boolean)
        .some((v) => String(v).toLowerCase().includes(q));
    });
  }, [masterSpecs, search, activeSpecModel]);

  return (
    <div className="space-y-6">
      {/* Cpk Summary Strip */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Master Parameters</div>
          <div className="text-2xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">{masterSpecs.length}</div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Controlled CTQ specifications</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-emerald-200 dark:border-emerald-800 p-4 space-y-1">
          <div className="text-xs font-semibold text-emerald-700 dark:text-emerald-300">Capable (Cpk &gt; 1.33)</div>
          <div className="text-2xl font-bold text-emerald-700 dark:text-emerald-300 tabular-nums">{kpiSummary.green}</div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Green · Meets FFM ramp floor</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-yellow-300 dark:border-yellow-700 p-4 space-y-1">
          <div className="text-xs font-semibold text-yellow-800 dark:text-yellow-200">Marginal (1.0 ≤ Cpk ≤ 1.33)</div>
          <div className="text-2xl font-bold text-yellow-700 dark:text-yellow-300 tabular-nums">{kpiSummary.yellow}</div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Yellow · Tight monitoring / centering</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-orange-300 dark:border-orange-700 p-4 space-y-1">
          <div className="text-xs font-semibold text-orange-800 dark:text-orange-200">Incapable (Cpk &lt; 1.0)</div>
          <div className="text-2xl font-bold text-orange-700 dark:text-orange-300 tabular-nums">{kpiSummary.orange}</div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Orange · FACA / 100% screening required</div>
        </div>
      </div>

      {/* Sub-Navigation & Controls */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
          <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800 text-xs">
            <button
              type="button"
              onClick={() => setSubTab('matrix')}
              className={`px-3 py-1.5 rounded-md font-semibold transition-colors ${
                subTab === 'matrix'
                  ? 'bg-slate-900 dark:bg-slate-700 text-white shadow-2xs'
                  : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
              }`}
            >
              Process Capability (Cpk) Matrix
            </button>
            <button
              type="button"
              onClick={() => setSubTab('specs')}
              className={`px-3 py-1.5 rounded-md font-semibold transition-colors ${
                subTab === 'specs'
                  ? 'bg-slate-900 dark:bg-slate-700 text-white shadow-2xs'
                  : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
              }`}
            >
              Master Specifications ({masterSpecs.length})
            </button>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            {subTab === 'matrix' ? (
              <>
                {lastUploadBatch && (
                  <button
                    type="button"
                    onClick={() => setUploadedOnly((prev) => !prev)}
                    className={`px-2.5 py-1.5 rounded-lg text-[11px] font-semibold border transition-colors ${
                      uploadedOnly
                        ? 'bg-blue-600 text-white border-blue-600'
                        : 'bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800 hover:bg-blue-100 dark:hover:bg-blue-900'
                    }`}
                  >
                    {uploadedOnly ? '✓ Uploaded & Matched Only' : 'Filter: Uploaded & Matched'}
                  </button>
                )}
                <div className="inline-flex items-center gap-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-800 rounded-lg p-0.5 text-[11px]">
                  {[
                    { id: 'ALL', label: 'All' },
                    { id: 'green', label: '> 1.33 (Green)' },
                    { id: 'yellow', label: '1.0–1.33 (Yellow)' },
                    { id: 'orange', label: '< 1.0 (Orange)' }
                  ].map((opt) => (
                    <button
                      key={opt.id}
                      type="button"
                      onClick={() => setCpkFilter(opt.id)}
                      className={`px-2 py-1 rounded-md font-semibold transition-colors ${
                        cpkFilter === opt.id
                          ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs'
                          : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'
                      }`}
                    >
                      {opt.label}
                    </button>
                  ))}
                </div>
                <button
                  type="button"
                  onClick={onOpenCpkImport}
                  className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition-colors shadow-2xs"
                >
                  <Upload className="w-3.5 h-3.5" />
                  <span>Upload Excel / CSV</span>
                </button>
              </>
            ) : (
              <>
                <div className="relative">
                  <Search className="w-3.5 h-3.5 text-slate-400 dark:text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Search parameter, model, gage, doc..."
                    className="pl-8 pr-3 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 w-48"
                  />
                </div>
                <select
                  aria-label="Master Spec Model Filter"
                  value={activeSpecModel}
                  onChange={(e) => setSpecModel(e.target.value)}
                  className="px-2.5 py-1.5 text-xs font-semibold border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300"
                >
                  <option value="ALL">All models</option>
                  {specModelOptions.map((m) => (
                    <option key={m} value={m}>
                      {m}
                    </option>
                  ))}
                </select>
                <button
                  type="button"
                  onClick={onGenerateFfmSpecs}
                  className="px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950 hover:bg-blue-100 dark:hover:bg-blue-900 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800 text-xs font-semibold inline-flex items-center gap-1.5"
                >
                  <FileSpreadsheet className="w-3.5 h-3.5" />
                  <span>Generate FFM Standard Specs</span>
                </button>
                <button
                  type="button"
                  onClick={() => exportMasterSpecsCsv(masterSpecs)}
                  className="px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 text-xs font-semibold inline-flex items-center gap-1"
                >
                  <Download className="w-3.5 h-3.5" />
                  <span>Export CSV</span>
                </button>
                <button
                  type="button"
                  onClick={onOpenNewSpec}
                  className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-xs font-semibold inline-flex items-center gap-1.5"
                >
                  <Plus className="w-3.5 h-3.5" />
                  <span>Add Spec</span>
                </button>
              </>
            )}
          </div>
        </div>

        {/* Recent Data Pipeline Ingestion Strip */}
        {uploadHistory.length > 0 && subTab === 'matrix' && (
          <div className="px-5 py-2 bg-blue-50/70 dark:bg-blue-950/70 border-b border-blue-200/80 dark:border-blue-800/80 flex flex-wrap items-center justify-between gap-2 text-[11px]">
            <div className="flex items-center gap-2 text-blue-900 dark:text-blue-100">
              <FileSpreadsheet className="w-3.5 h-3.5 text-blue-600 dark:text-blue-400 shrink-0" />
              <span>
                Latest Pipeline Upload: <strong>{uploadHistory[0].fileName}</strong> ({uploadHistory[0].format}) ·{' '}
                <strong>{uploadHistory[0].recordsUpdated}</strong> Cpk parameter records updated
                {uploadHistory[0].generatedSpecCount > 0 && (
                  <> · <strong>{uploadHistory[0].generatedSpecCount}</strong> Master Specs auto-generated</>
                )}
              </span>
            </div>
            <span className="text-blue-700/80 dark:text-blue-300/80 tabular-nums">{uploadHistory[0].time}</span>
          </div>
        )}

        {/* TAB 1: Process Capability (Cpk) Matrix */}
        {subTab === 'matrix' ? (
          <div className="overflow-x-auto">
            {matrixRows.length === 0 ? (
              <div className="p-8 text-center text-xs text-slate-500 dark:text-slate-400">
                No Cpk measurements match the current scope. Upload an Excel / CSV file to populate Cpk data.
              </div>
            ) : (
              <table className="w-full text-left border-collapse text-xs">
                <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  <tr>
                    <th className="py-2.5 px-4 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">
                      Model · Phase · Side · Config
                    </th>
                    {visibleSpecsForMatrix.map((spec) => {
                      const limits = describeSpecLimits(spec);
                      return (
                        <th
                          key={spec.id}
                          className="py-2 px-2 text-center whitespace-nowrap min-w-[94px]"
                          title={`${spec.name} (${spec.docRef}) · limits effective ${limits.effectiveFrom} · ${limits.count} revision(s)`}
                        >
                          <div className="font-bold text-slate-800 dark:text-slate-200">{spec.code}</div>
                          <div className="text-[9px] font-medium text-slate-400 dark:text-slate-400 normal-case truncate max-w-[96px] mx-auto">
                            {spec.specType === 'upper'
                              ? `≤ ${spec.usl} ${spec.unit}`
                              : spec.specType === 'lower'
                              ? `≥ ${spec.lsl} ${spec.unit}`
                              : `${spec.lsl}–${spec.usl} ${spec.unit}`}
                          </div>
                        </th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                  {matrixRows.map((row) => (
                    <tr key={row.key} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/80">
                      <td className="py-2.5 px-4 whitespace-nowrap border-r border-slate-200/80 dark:border-slate-800/80">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-900 dark:text-slate-100">{row.model}</span>
                          <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                            {row.phase}
                          </span>
                          <span
                            className={`px-1.5 py-0.5 rounded text-[10px] font-bold border ${
                              row.side === 'RHS'
                                ? 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800'
                                : 'bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800'
                            }`}
                          >
                            {row.side}
                          </span>
                          <span className="text-[11px] text-slate-400 dark:text-slate-400">{row.config}</span>
                        </div>
                        {row.sourceFile && (
                          <div className="text-[10px] text-blue-600 dark:text-blue-400 font-medium mt-0.5 truncate max-w-[200px]">
                            ↑ {row.sourceFile}
                          </div>
                        )}
                      </td>
                      {visibleSpecsForMatrix.map((spec) => {
                        const rec = row.bySpec[spec.id];
                        if (!rec) {
                          return (
                            <td key={spec.id} className="py-2 px-1.5 text-center text-slate-300 dark:text-slate-300">
                              —
                            </td>
                          );
                        }
                        const specInForce = effectiveSpecForRecord(spec, rec);
                        const stats = computeCapabilityStats(rec, specInForce);
                        const tone = getCpkTone(stats.cpk);
                        if (cpkFilter !== 'ALL' && tone.key !== cpkFilter) {
                          return (
                            <td key={spec.id} className="py-2 px-1.5 text-center text-slate-200 dark:text-slate-200">
                              ·
                            </td>
                          );
                        }
                        const isFromLastUpload =
                          lastUploadBatch && rec.uploadBatchId === lastUploadBatch.id;
                        return (
                          <td key={spec.id} className="py-1.5 px-1.5 text-center">
                            <button
                              type="button"
                              onClick={() => onOpenCpkChart(rec)}
                              title={`${row.model} ${row.side} · ${spec.name}: Cpk ${stats.cpk.toFixed(
                                2
                              )} (n=${rec.sampleSize}) · limits effective ${specInForce.effectiveFrom}`}
                              className={`w-full py-1.5 px-2 rounded-md border font-bold text-xs transition-colors cursor-pointer ${
                                tone.cellClass
                              } ${isFromLastUpload ? 'ring-2 ring-blue-500/50' : ''}`}
                            >
                              <div>{stats.cpk.toFixed(2)}</div>
                              <div className="text-[9px] font-medium opacity-75">
                                n={rec.sampleSize}
                              </div>
                            </button>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        ) : (
          /* TAB 2: Master Specifications Repository Table */
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <tr>
                  <th className="py-2.5 px-4 whitespace-nowrap">Param Code</th>
                  <th className="py-2.5 px-3 whitespace-nowrap">Parameter Name</th>
                  <th className="py-2.5 px-3 whitespace-nowrap">Model</th>
                  <th className="py-2.5 px-3 whitespace-nowrap">Station / Process</th>
                  <th className="py-2.5 px-2.5 text-right whitespace-nowrap">LSL</th>
                  <th className="py-2.5 px-2.5 text-right whitespace-nowrap">Nominal</th>
                  <th className="py-2.5 px-2.5 text-right whitespace-nowrap">USL</th>
                  <th className="py-2.5 px-2 whitespace-nowrap">Unit</th>
                  <th className="py-2.5 px-2.5 text-right whitespace-nowrap">Target Cpk</th>
                  <th className="py-2.5 px-2.5 whitespace-nowrap">Limits Effective</th>
                  <th className="py-2.5 px-3 whitespace-nowrap">Metrology / Gage</th>
                  <th className="py-2.5 px-3 whitespace-nowrap">Control Plan Doc</th>
                  <th className="py-2.5 px-4 text-right whitespace-nowrap">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                {filteredSpecs.map((spec) => {
                  const limits = describeSpecLimits(spec);
                  return (
                  <tr key={spec.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/80">
                    <td className="py-2.5 px-4 font-mono font-bold text-blue-700 dark:text-blue-300 whitespace-nowrap">
                      {spec.code}
                    </td>
                    <td className="py-2.5 px-3 font-semibold text-slate-900 dark:text-slate-100 whitespace-nowrap">
                      {spec.name}
                    </td>
                    <td className="py-2.5 px-3 whitespace-nowrap">
                      {spec.model ? (
                        <span className="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 font-semibold text-slate-700 dark:text-slate-200">
                          {spec.model}
                        </span>
                      ) : (
                        <span className="text-slate-400 dark:text-slate-500">All models</span>
                      )}
                    </td>
                    <td className="py-2.5 px-3 text-slate-600 dark:text-slate-400 whitespace-nowrap">{spec.station}</td>
                    <td className="py-2.5 px-2.5 text-right text-slate-700 dark:text-slate-300">
                      {spec.specType === 'upper' ? '0 (1-sided)' : spec.lsl}
                    </td>
                    <td className="py-2.5 px-2.5 text-right font-semibold text-blue-700 dark:text-blue-300">
                      {spec.nominal}
                    </td>
                    <td className="py-2.5 px-2.5 text-right text-slate-700 dark:text-slate-300">
                      {spec.specType === 'lower' ? '—' : spec.usl}
                    </td>
                    <td className="py-2.5 px-2 text-slate-500 dark:text-slate-400">{spec.unit}</td>
                    <td className="py-2.5 px-2.5 text-right font-bold text-emerald-700 dark:text-emerald-300">
                      ≥ {Number(spec.cpkTarget).toFixed(2)}
                    </td>
                    <td className="py-2.5 px-2.5 whitespace-nowrap text-slate-600 dark:text-slate-400">
                      <span
                        title={`${limits.count} limit revision(s) on file — Cpk records use the one in force on their measurement date`}
                      >
                        {limits.label}
                      </span>
                    </td>
                    <td className="py-2.5 px-3 text-slate-600 dark:text-slate-400 whitespace-nowrap">
                      {spec.metrology}
                    </td>
                    <td className="py-2.5 px-3 font-mono text-[11px] text-slate-500 dark:text-slate-400 whitespace-nowrap">
                      {spec.docRef}
                    </td>
                    <td className="py-2.5 px-4 text-right whitespace-nowrap">
                      <div className="inline-flex items-center gap-1">
                        <button
                          type="button"
                          onClick={() => onEditSpec(spec)}
                          title="Edit Master Specification"
                          className="p-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 hover:bg-blue-50 dark:hover:bg-blue-950"
                        >
                          <Pencil className="w-3.5 h-3.5" />
                        </button>
                        <button
                          type="button"
                          onClick={() => onDeleteSpec(spec)}
                          title="Delete Master Specification"
                          className="p-1.5 rounded-md text-slate-500 dark:text-slate-400 hover:text-rose-700 dark:hover:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </section>
    </div>
  );
}

</script>
