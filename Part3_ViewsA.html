<script type="text/babel" data-presets="react">
// ============================================================================
// VIEW 1: PROGRAM OVERVIEW & GATE DEPENDENCY MATRIX (MODEL > PHASE > SIDE > CONFIG)
// ============================================================================

function OverviewView({
  projects,
  records,
  tasks,
  gateRecords,
  masterSpecs,
  cpkRecords,
  costProjects,
  customerFeedback,
  lastUploadBatch,
  globalSide,
  onOpenKpiDrilldown,
  onOpenGate,
  onOpenCpkChart,
  onOpenCpkImport,
  onSelectTask,
  onSwitchView
}) {
  const [cpkScopeMode, setCpkScopeMode] = useState('all'); // 'all' | 'uploaded'

  const blockedOrHighTasks = useMemo(
    () => tasks.filter((t) => t.status !== 'Done').slice(0, 5),
    [tasks]
  );

  const recentRecords = useMemo(() => records.slice(0, 5), [records]);

  const effectiveCpkScope =
    lastUploadBatch && cpkScopeMode === 'uploaded' ? 'uploaded' : 'all';

  const visibleDashboardSpecs = useMemo(() => {
    if (effectiveCpkScope === 'uploaded' && lastUploadBatch) {
      const idSet = new Set(lastUploadBatch.matchedSpecIds);
      return masterSpecs.filter((s) => idSet.has(s.id));
    }
    return masterSpecs;
  }, [masterSpecs, effectiveCpkScope, lastUploadBatch]);

  const cpkMatrixRows = useMemo(() => {
    const sourceRecs =
      effectiveCpkScope === 'uploaded' && lastUploadBatch
        ? cpkRecords.filter((r) => r.uploadBatchId === lastUploadBatch.id)
        : cpkRecords;

    const map = new Map();
    sourceRecs.forEach((r) => {
      const key = `${r.model}-${r.phase}-${r.side}`;
      if (!map.has(key)) {
        map.set(key, {
          key,
          model: r.model,
          phase: r.phase,
          side: r.side,
          config: r.config,
          sourceFile: r.sourceFile || null,
          bySpec: {}
        });
      }
      if (r.sourceFile) map.get(key).sourceFile = r.sourceFile;
      map.get(key).bySpec[r.specId] = r;
    });
    return Array.from(map.values()).sort((a, b) => {
      const m = a.model.localeCompare(b.model);
      if (m !== 0) return m;
      return SIDE_ORDER.indexOf(a.side) - SIDE_ORDER.indexOf(b.side);
    });
  }, [cpkRecords, effectiveCpkScope, lastUploadBatch]);

  // KPI results roll-up: weighted actuals from the in-scope production runs.
  const kpiResults = useMemo(() => {
    const totalInput = records.reduce((s, r) => s + Math.max(0, Number(r.input) || 0), 0);
    let fallout = 0;
    let salvage = 0;
    let downtimeMin = 0;
    let plannedHr = 0;
    records.forEach((r) => {
      const m = computeProductionMetrics(r);
      fallout += m.fallout;
      salvage += m.salvage;
      downtimeMin += m.downtimeMin;
      plannedHr += Math.max(0, Number(r.plannedTimeHr) || 0);
    });

    const netReject = Math.max(0, fallout - salvage);
    const finalGood = Math.max(0, totalInput - netReject);
    const fpy = totalInput > 0 ? ((totalInput - fallout) / totalInput) * 100 : 0;
    const fy = totalInput > 0 ? Math.min(100, ((totalInput - fallout + salvage) / totalInput) * 100) : 0;
    const uph = plannedHr > 0 ? finalGood / plannedHr : 0;
    const runTimeHr = Math.max(0, plannedHr - downtimeMin / 60);
    const inputUph = runTimeHr > 0 ? totalInput / runTimeHr : 0;
    const efficiency = inputUph > 0 ? Math.min(100, (uph / inputUph) * 100) : 0;

    return {
      runs: records.length,
      totalInput,
      finalGood,
      fpy,
      fy,
      uph,
      efficiency
    };
  }, [records]);

  // Process capability roll-up across the visible (scoped) Cpk matrix.
  const cpkRollup = useMemo(() => {
    let green = 0;
    let yellow = 0;
    let orange = 0;
    cpkMatrixRows.forEach((row) => {
      visibleDashboardSpecs.forEach((spec) => {
        const rec = row.bySpec[spec.id];
        if (!rec) return;
        const { cpk } = computeCapabilityStats(rec, effectiveSpecForRecord(spec, rec));
        if (cpk > 1.33) green += 1;
        else if (cpk >= 1.0) yellow += 1;
        else orange += 1;
      });
    });
    const total = green + yellow + orange;
    return { green, yellow, orange, total, passRate: total > 0 ? (green / total) * 100 : 0 };
  }, [cpkMatrixRows, visibleDashboardSpecs]);

  // FY2026 KPI scorecard: the six official targets measured against current data.
  const kpiTiles = useMemo(() => {
    // Every tile uses the MIH tile's fiscal window (1 Apr – 31 Mar), so FY2026 means
    // the same twelve months here rather than a calendar year or an all-time total.
    const claimsFy2026 = (customerFeedback || []).filter(
      (f) => f.category === 'Claim' && isInKpiFiscalYear(f.feedbackDate)
    ).length;

    const fySavingProjects = (costProjects || []).filter((item) =>
      isKpiFiscalYearTag(item.fyTarget)
    );
    const annualSavingThb = fySavingProjects.reduce(
      (sum, item) => sum + (computeCostSavingMetrics(item).annualSavingThb || 0),
      0
    );

    // Shipment to MIH is measured on time against lines already due in FY2026;
    // the all-lines coverage is reported separately as a forecast figure.
    const mihToday = todayIso();
    const mihLines = [];
    projects.forEach((project) => {
      getLineVariantsForProject(project)
        .filter((v) => globalSide === 'ALL' || v.side === globalSide)
        .forEach((v) => {
          mihLines.push({
            fatpMih: v.fatpMih || project.mihDate || '',
            approved: gateRecords[project.id]?.[v.key]?.mih?.status === 'Approved',
            approvedAt: mihApprovalIso(gateRecords, project.id, v.key, mihToday)
          });
        });
    });
    const mihSummary = summarizeMihAchievement(mihLines, { today: mihToday });

    // mode 'max' = at-or-above target is good, 'min' = at-or-below target is good.
    const build = (key, label, value, target, opts = {}) => {
      const { unit = '', digits = 1, mode = 'max', format, targetFormat, footnote } = opts;
      const fmt = format || ((v) => `${v.toFixed(digits)}${unit}`);
      const onTarget = mode === 'max' ? value >= target : value <= target;
      const headroom = mode === 'max' ? value - target : target - value;
      return {
        key,
        label,
        valueText: fmt(value),
        targetText: targetFormat ? targetFormat(target) : fmt(target),
        deltaText:
          mode === 'max'
            ? `${headroom >= 0 ? '+' : ''}${fmt(headroom)}`
            : `${Math.abs(headroom).toFixed(digits)} ${headroom >= 0 ? 'under limit' : 'over limit'}`,
        onTarget,
        barPct: Math.max(0, Math.min(100, target > 0 ? (value / target) * 100 : 0)),
        footnote
      };
    };

    const mihForecastText = `${mihSummary.forecastAchieved} of ${mihSummary.tracked} lines MIH-approved (forecast)`;
    const mihFootnote = mihSummary.due > 0
      ? `${mihSummary.onTime} of ${mihSummary.due} due lines on time \u00b7 ${mihForecastText}`
      : `${mihSummary.nextDue ? `Next MIH due ${mihSummary.nextDue}` : 'No MIH date scheduled'} \u00b7 ${mihForecastText}`;
    const mihTile = mihSummary.due > 0
      ? build('mih', 'Shipment to MIH Achieved', mihSummary.pct, KPI_TARGETS.mihAchievement, {
          digits: 0,
          unit: '%',
          footnote: mihFootnote
        })
      : {
          key: 'mih',
          label: 'Shipment to MIH Achieved',
          valueText: '\u2014',
          targetText: `${KPI_TARGETS.mihAchievement}%`,
          deltaText: 'Not yet due',
          onTarget: false,
          tone: 'neutral',
          barPct: 0,
          footnote: mihFootnote
        };

    return [
      build('fpy', 'First Pass Yield (FPY)', kpiResults.fpy, KPI_TARGETS.fpy, {
        unit: '%',
        footnote: `${kpiResults.runs} runs in scope`
      }),
      build('fy', 'Final Yield (FY)', kpiResults.fy, KPI_TARGETS.fy, {
        unit: '%',
        footnote: `${kpiResults.totalInput.toLocaleString()} units input`
      }),
      build('eff', 'Line Efficiency', kpiResults.efficiency, KPI_TARGETS.efficiency, {
        unit: '%',
        footnote: 'Input UPH vs net-good UPH'
      }),
      build('claims', 'Customer Claims FY2026', claimsFy2026, KPI_TARGETS.customerClaims, {
        digits: 0,
        mode: 'min',
        targetFormat: (v) => `\u2264 ${v}`,
        footnote: kpiFiscalScopeLabel()
      }),
      build('saving', 'Annual Cost Saving FY2026', annualSavingThb, KPI_TARGETS.annualSavingThb, {
        format: formatThbCompact,
        footnote: `${fySavingProjects.length} saving initiatives tagged FY${KPI_FISCAL_YEAR}`
      }),
      mihTile
    ];
  }, [kpiResults, costProjects, customerFeedback, projects, gateRecords, globalSide]);

  // Active NPI build progress: units actually run vs the planned build quantity.
  const buildProgress = useMemo(
    () =>
      projects.map((project) => {
        const variants = getLineVariantsForProject(project).filter(
          (v) => globalSide === 'ALL' || v.side === globalSide
        );
        const planned = variants.reduce((s, v) => s + v.qty, 0);
        const built = records
          .filter((r) => r.model === project.model && (globalSide === 'ALL' || r.side === globalSide))
          .reduce((s, r) => s + Math.max(0, Number(r.input) || 0), 0);
        const pct = planned > 0 ? Math.min(100, (built / planned) * 100) : 0;

        let passed = 0;
        variants.forEach((v) => {
          const lineGates = gateRecords[project.id]?.[v.key] || {};
          NPI_GATES.forEach((g) => {
            if (lineGates[g.id]?.status === 'Approved') passed += 1;
          });
        });
        const gateTotal = variants.length * NPI_GATES.length;

        return {
          project,
          lineCount: variants.length,
          planned,
          built,
          remaining: Math.max(0, planned - built),
          pct,
          passed,
          gateTotal,
          gatePct: gateTotal > 0 ? (passed / gateTotal) * 100 : 0,
          currentGate: NPI_GATES.find((g) => g.id === project.currentGateId)
        };
      }),
    [projects, records, gateRecords, globalSide]
  );

  return (
    <div className="space-y-6">
      {/* KPI Results Summary — quality, throughput & process capability outcomes */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">KPI Results Summary</h2>
            <p className="text-[11px] text-slate-500 dark:text-slate-400">
              Weighted actuals from {kpiResults.runs} production run{kpiResults.runs === 1 ? '' : 's'} in the
              active Global Scope ({kpiResults.totalInput.toLocaleString()} units input) against the FY2026 KPI targets
            </p>
          </div>
          <button
            type="button"
            onClick={() => onSwitchView('production')}
            className="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 inline-flex items-center gap-1"
          >
            <span>Production Ledger</span>
            <ArrowRight className="w-3.5 h-3.5" />
          </button>
        </div>

        <div className="p-4 grid grid-cols-2 md:grid-cols-3 2xl:grid-cols-6 gap-3">
          {kpiTiles.map((tile) => {
            const tone = tile.tone || (tile.onTarget ? 'good' : 'bad');
            return (
            <button
              key={tile.key}
              type="button"
              onClick={() => onOpenKpiDrilldown(tile.key)}
              title={`Open ${tile.label} deep dive`}
              aria-label={`Open ${tile.label} deep dive`}
              className="text-left rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/40 p-3 hover:border-blue-300 dark:hover:border-blue-700 hover:bg-white dark:hover:bg-slate-800/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 transition-colors"
            >
              <div className="flex items-start justify-between gap-1.5">
                <div className="text-[11px] font-medium text-slate-500 dark:text-slate-400 leading-tight">
                  {tile.label}
                </div>
                <ChevronRight className="w-3 h-3 text-slate-300 dark:text-slate-600 shrink-0" />
              </div>
              <div className="mt-1 flex flex-wrap items-baseline gap-1.5">
                <span
                  className={`text-xl font-bold tabular-nums ${
                    tone === 'good'
                      ? 'text-emerald-700 dark:text-emerald-300'
                      : tone === 'bad'
                      ? 'text-amber-700 dark:text-amber-300'
                      : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  {tile.valueText}
                </span>
                <span
                  className={`text-[10px] font-bold px-1.5 py-0.5 rounded border tabular-nums ${
                    tone === 'good'
                      ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'
                      : tone === 'bad'
                      ? 'bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                  }`}
                >
                  {tile.deltaText}
                </span>
              </div>
              <div className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5 tabular-nums">
                Target {tile.targetText}
              </div>
              <div className="mt-1.5 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                <div
                  className={`h-full ${
                    tone === 'good' ? 'bg-emerald-500' : tone === 'bad' ? 'bg-amber-500' : 'bg-slate-400 dark:bg-slate-600'
                  }`}
                  style={{ width: `${tile.barPct}%` }}
                />
              </div>
              {tile.footnote && (
                <div className="text-[10px] text-slate-400 dark:text-slate-400 mt-1 truncate" title={tile.footnote}>
                  {tile.footnote}
                </div>
              )}
            </button>
            );
          })}
        </div>
      </section>

      {/* Active NPI Build Progress — units run vs planned build quantity, gate cells passed */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800">
          <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">Active NPI Build Progress</h2>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">
            Units run against planned build quantity (FBU + Main + REL + MBO + IQC + OQC + DOE + Est. loss) and
            gate cells passed across {NPI_GATES.length} PEN-81-0002 stage gates
          </p>
        </div>

        {buildProgress.length === 0 ? (
          <div className="p-6 text-center text-xs text-slate-500 dark:text-slate-400">
            No NPI programs match the active Global Scope filter.
          </div>
        ) : (
          <div className="divide-y divide-slate-100 dark:divide-slate-800">
            {buildProgress.map((row) => (
              <button
                key={row.project.id}
                type="button"
                onClick={() => onOpenGate(row.project.id, row.project.currentGateId)}
                className="w-full text-left px-5 py-3.5 hover:bg-slate-50 dark:hover:bg-slate-800/70 transition-colors"
              >
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-sm font-bold text-slate-900 dark:text-slate-100">{row.project.model}</span>
                    <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                      {row.project.phase}
                    </span>
                    <StatusBadge status={row.project.status} />
                    <span className="text-[11px] text-slate-500 dark:text-slate-400">
                      {row.lineCount} config/side lines ·{' '}
                      <span className="font-semibold text-blue-700 dark:text-blue-300">
                        {row.currentGate?.code} {row.currentGate?.short}
                      </span>
                    </span>
                  </div>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
                    MIH {row.project.mihDate}
                  </span>
                </div>

                <div className="mt-2.5 grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2">
                  <div>
                    <div className="flex items-center justify-between gap-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                      <span>Build progress</span>
                      <span className="tabular-nums text-slate-700 dark:text-slate-300 normal-case tracking-normal">
                        {row.built.toLocaleString()} / {row.planned.toLocaleString()} ({row.pct.toFixed(1)}%)
                      </span>
                    </div>
                    <div className="mt-1 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                      <div
                        className={`h-full ${
                          row.pct >= 100 ? 'bg-emerald-500' : row.pct >= 50 ? 'bg-blue-500' : 'bg-amber-500'
                        }`}
                        style={{ width: `${row.pct}%` }}
                      />
                    </div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-400 mt-0.5 tabular-nums">
                      {row.remaining.toLocaleString()} units remaining to planned quantity
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between gap-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                      <span>Gate cells passed</span>
                      <span className="tabular-nums text-slate-700 dark:text-slate-300 normal-case tracking-normal">
                        {row.passed} / {row.gateTotal} ({row.gatePct.toFixed(0)}%)
                      </span>
                    </div>
                    <div className="mt-1 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                      <div className="h-full bg-emerald-500" style={{ width: `${row.gatePct}%` }} />
                    </div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-400 mt-0.5 tabular-nums">
                      {NPI_GATES.length} gates × {row.lineCount} lines · {row.gateTotal - row.passed} cells open
                    </div>
                  </div>
                </div>
              </button>
            ))}
          </div>
        )}
      </section>

      {/* Process Capability (Cpk) Matrix with Green / Yellow / Orange Coloration */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">
              Process Capability (Cpk) by Parameter &amp; Master Spec
            </h2>
            <p className="text-[11px] text-slate-500 dark:text-slate-400">
              Click any Cpk value to open the interactive Process Capability Chart &amp; Master Specification
            </p>
          </div>
          <div className="flex flex-wrap items-center gap-2 text-[11px]">
            {lastUploadBatch && (
              <div className="inline-flex rounded-lg border border-blue-200 dark:border-blue-800 bg-blue-50/70 dark:bg-blue-950/70 p-0.5">
                <button
                  type="button"
                  onClick={() => setCpkScopeMode('uploaded')}
                  className={`px-2 py-0.5 rounded-md font-semibold transition-colors ${
                    effectiveCpkScope === 'uploaded'
                      ? 'bg-blue-600 text-white'
                      : 'text-blue-800 dark:text-blue-200 hover:bg-blue-100 dark:hover:bg-blue-900'
                  }`}
                >
                  Uploaded &amp; Matched ({lastUploadBatch.matchedSpecIds.length})
                </button>
                <button
                  type="button"
                  onClick={() => setCpkScopeMode('all')}
                  className={`px-2 py-0.5 rounded-md font-semibold transition-colors ${
                    effectiveCpkScope === 'all'
                      ? 'bg-slate-900 dark:bg-slate-700 text-white'
                      : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
                  }`}
                >
                  All ({masterSpecs.length})
                </button>
              </div>
            )}
            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 font-semibold tabular-nums">
              Cpk &ge; 1.33 share: {cpkRollup.passRate.toFixed(0)}% ({cpkRollup.green}/{cpkRollup.total})
            </span>
            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 border border-emerald-300 dark:border-emerald-700 font-semibold">
              <span className="w-2 h-2 rounded-full bg-emerald-500" />
              Cpk &gt; 1.33
            </span>
            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-yellow-50 dark:bg-yellow-950 text-yellow-800 dark:text-yellow-200 border border-yellow-300 dark:border-yellow-700 font-semibold">
              <span className="w-2 h-2 rounded-full bg-yellow-500" />
              1.0 ≤ Cpk ≤ 1.33
            </span>
            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-orange-50 dark:bg-orange-950 text-orange-800 dark:text-orange-200 border border-orange-300 dark:border-orange-700 font-semibold">
              <span className="w-2 h-2 rounded-full bg-orange-500" />
              Cpk &lt; 1.0
            </span>
            <button
              type="button"
              onClick={onOpenCpkImport}
              className="px-2.5 py-1 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-[11px] font-semibold inline-flex items-center gap-1.5 transition-colors"
            >
              <Upload className="w-3 h-3" />
              <span>Upload Excel / CSV</span>
            </button>
            <button
              type="button"
              onClick={() => onSwitchView('cpk')}
              className="ml-1 text-xs font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 inline-flex items-center gap-1"
            >
              <span>Master Specs</span>
              <ArrowRight className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>

        {lastUploadBatch && (
          <div className="px-5 py-2 bg-blue-50/70 dark:bg-blue-950/70 border-b border-blue-200/70 dark:border-blue-800/70 flex flex-wrap items-center justify-between gap-2 text-[11px] text-blue-900 dark:text-blue-100">
            <div className="flex items-center gap-2">
              <FileSpreadsheet className="w-3.5 h-3.5 text-blue-600 dark:text-blue-400 shrink-0" />
              <span>
                Active Upload: <strong>{lastUploadBatch.fileName}</strong> ·{' '}
                <strong>{lastUploadBatch.recordsUpdated}</strong> matched Cpk cells updated
                {lastUploadBatch.generatedSpecCount > 0 && (
                  <> · <strong>{lastUploadBatch.generatedSpecCount}</strong> new Master Specs generated</>
                )}
              </span>
            </div>
            <span className="text-blue-700/80 dark:text-blue-300/80 tabular-nums">{lastUploadBatch.time}</span>
          </div>
        )}

        <div className="overflow-x-auto">
          {cpkMatrixRows.length === 0 ? (
            <div className="p-6 text-center text-xs text-slate-500 dark:text-slate-400">
              No Cpk records match the current Global Scope.
            </div>
          ) : (
            <table className="w-full text-left border-collapse text-xs">

function GateWorkstreamMatrix({ projects, gateRecords, globalSide, onOpenGate }) {
  const groupedSections = useMemo(() => {
    return projects.map((project) => {
      const variants = getLineVariantsForProject(project)
        .filter((v) => globalSide === 'ALL' || v.side === globalSide)
        .sort((a, b) => {
          const sA = SIDE_ORDER.indexOf(a.side) === -1 ? 99 : SIDE_ORDER.indexOf(a.side);
          const sB = SIDE_ORDER.indexOf(b.side) === -1 ? 99 : SIDE_ORDER.indexOf(b.side);
          if (sA !== sB) return sA - sB;
          return a.config.localeCompare(b.config, undefined, { numeric: true });
        });

      const activeRollup = computeProgramGateDependency(
        project,
        project.currentGateId,
        gateRecords[project.id] || {}
      );

      return { project, variants, activeRollup };
    });
  }, [projects, gateRecords, globalSide]);

  const renderGateCell = (project, variant, gate, gateIdx) => {
    const lineGates = gateRecords[project.id]?.[variant.key] || {};
    const dossier = lineGates[gate.id];
    const status = dossier?.status || 'Pending';

    const prevGate = gateIdx > 0 ? NPI_GATES[gateIdx - 1] : null;
    const prevApproved = !prevGate || lineGates[prevGate.id]?.status === 'Approved';
    const isDepLocked = status === 'Pending' && !prevApproved;

    let styleClass = 'bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800';
    let label = isDepLocked ? 'Dep.' : 'Pending';

    if (status === 'Approved') {
      styleClass = 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100 dark:hover:bg-emerald-900 font-bold';
      label = 'Pass';
    } else if (status === 'Blocked') {
      styleClass = 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800 hover:bg-rose-100 dark:hover:bg-rose-900 font-bold';
      label = 'Hold';
    } else if (status === 'In Review' || status === 'Conditional') {
      styleClass = 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-300 dark:border-amber-700 hover:bg-amber-100 dark:hover:bg-amber-900 font-bold';
      label = status === 'Conditional' ? 'Cond.' : 'Active';
    }

    return (
      <td key={gate.id} className="py-1.5 px-1 text-center">
        <button
          type="button"
          onClick={() => onOpenGate(project.id, gate.id, variant.key)}
          title={`${project.model} ${project.phase} · ${variant.side} ${variant.config} · ${gate.code} ${gate.label}: ${status}`}
          className={`w-full py-1 px-1.5 rounded-md border text-[11px] transition-colors ${styleClass}`}
        >
          {label}
        </button>
      </td>
    );
  };

  return (
    <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
      <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">
            Gate Pass Sign-Off &amp; Dependency Matrix (Model × Phase × Side × Config)
          </h2>
          <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
            Click any gate cell to open its individual or multi-config sign-off dossier · Ordered by Model &gt; Phase &gt; Side &gt; Config
          </p>
        </div>

        <div className="flex flex-wrap items-center gap-2 text-[11px]">
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-semibold">
            Pass
          </span>
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border border-amber-300 dark:border-amber-700 font-semibold">
            Active
          </span>
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 font-semibold">
            Hold
          </span>
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-800 font-semibold">
            Dep.
          </span>
        </div>
      </div>

      {/* Program x Phase Dependency Roll-Up Strip */}
      {groupedSections.length > 0 && (
        <div className="px-5 py-2.5 bg-slate-50/80 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center gap-3 text-xs">
          <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
            Program Roll-Up:
          </span>
          {groupedSections.map(({ project, activeRollup }) => {
            const curGate = NPI_GATES.find((g) => g.id === project.currentGateId);
            return (
              <button
                key={project.id}
                type="button"
                onClick={() => onOpenGate(project.id, project.currentGateId)}
                className="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-300 dark:hover:border-blue-700 transition-colors tabular-nums"
              >
                <strong className="text-slate-900 dark:text-slate-100">
                  {project.model} {project.phase}
                </strong>
                <span className="text-slate-400 dark:text-slate-400">·</span>
                <span className="text-blue-700 dark:text-blue-300 font-semibold">
                  {curGate?.code} {curGate?.short}
                </span>
                <span className="text-[11px] text-slate-600 dark:text-slate-400">
                  ({activeRollup.approvedCount}/{activeRollup.totalCount} pass)
                </span>
                {activeRollup.blockedLines.length > 0 && (
                  <span className="text-[10px] font-bold text-rose-600 dark:text-rose-400">
                    {activeRollup.blockedLines.length} hold
                  </span>
                )}
              </button>
            );
          })}
        </div>
      )}

      <div className="overflow-x-auto">
        {groupedSections.length === 0 ? (
          <div className="p-8 text-center text-xs text-slate-500 dark:text-slate-400">
            No NPI programs match the active Global Scope filter.
          </div>
        ) : (
          <table className="w-full text-left border-collapse text-xs">
            <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
              <tr>
                <th className="py-2.5 px-3 whitespace-nowrap">Model</th>
                <th className="py-2.5 px-2.5 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Phase</th>
                <th className="py-2.5 px-2.5 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Side</th>
                <th className="py-2.5 px-3 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Config / Qty</th>
                {NPI_GATES.map((g) => (
                  <th key={g.id} className="py-2.5 px-1.5 text-center whitespace-nowrap min-w-[68px]">
                    <div className="font-bold text-slate-700 dark:text-slate-300">{g.code}</div>
                    <div className="text-[9px] font-medium text-slate-400 dark:text-slate-400 normal-case">
                      {g.short}
                    </div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {groupedSections.map(({ project, variants }, sectionIdx) => (
                <React.Fragment key={project.id}>
                  {/* Distinct Model x Phase Group Divider Row */}
                  <tr
                    className={`bg-slate-100/90 dark:bg-slate-800/90 ${
                      sectionIdx > 0 ? 'border-t-2 border-slate-300 dark:border-slate-700' : 'border-t border-slate-200 dark:border-slate-800'
                    }`}
                  >
                    <td colSpan={4 + NPI_GATES.length} className="py-2 px-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-900 dark:text-slate-100">
                            {project.model} · {project.phase}
                          </span>
                          <span className="text-[11px] text-slate-500 dark:text-slate-400">
                            {project.familyGroup} · {project.moRange} · {project.customer}
                          </span>
                          <StatusBadge status={project.status} />
                        </div>
                        <span className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
                          {variants.length} Config × Side lines · MIH {project.mihDate}
                        </span>
                      </div>
                    </td>
                  </tr>

                  {variants.map((variant, vIdx) => {
                    const prevVariant = vIdx > 0 ? variants[vIdx - 1] : null;
                    const isNewSideGroup = prevVariant && prevVariant.side !== variant.side;

                    return (
                      <tr
                        key={`${project.id}-${variant.key}`}
                        className={`hover:bg-slate-50/90 dark:hover:bg-slate-800/90 transition-colors ${
                          isNewSideGroup
                            ? 'border-t-2 border-dashed border-slate-300 dark:border-slate-700'
                            : 'border-t border-slate-100 dark:border-slate-800'
                        }`}
                      >
                        <td className="py-2 px-3 font-bold text-slate-900 dark:text-slate-100 whitespace-nowrap">
                          {project.model}
                        </td>
                        <td className="py-2 px-2.5 whitespace-nowrap border-r border-slate-200/80 dark:border-slate-800/80">
                          <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                            {project.phase}
                          </span>
                        </td>
                        <td className="py-2 px-2.5 whitespace-nowrap border-r border-slate-200/80 dark:border-slate-800/80">
                          <span
                            className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold border ${
                              variant.side === 'RHS'
                                ? 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800'
                                : 'bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800'
                            }`}
                          >
                            {variant.side}
                          </span>
                        </td>
                        <td className="py-2 px-3 whitespace-nowrap border-r border-slate-200/80 dark:border-slate-800/80 tabular-nums">
                          <div className="flex items-center gap-1.5">
                            <span className="font-bold text-slate-800 dark:text-slate-200">{variant.config}</span>
                            <span className="text-[11px] text-slate-400 dark:text-slate-400">
                              ({variant.qty.toLocaleString()})
                            </span>
                          </div>
                          {variant.code7E && variant.code7E !== '—' && (
                            <div className="text-[10px] font-mono text-slate-400 dark:text-slate-400 truncate max-w-[160px]" title={`${variant.apnRev} · ${variant.code7E}`}>
                              {variant.code7E}
                            </div>
                          )}
                        </td>
                        {NPI_GATES.map((gate, gIdx) =>
                          renderGateCell(project, variant, gate, gIdx)
                        )}
                      </tr>
                    );
                  })}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </section>
  );
}

function ProjectsMatrixView({
  projects,
  globalSide,
  onOpenGate,
  onAddMatrixRow,
  onEditMatrixRow,
  onDeleteMatrixRow
}) {
  if (projects.length === 0) {
    return (
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-10 text-center text-xs text-slate-500 dark:text-slate-400">
        No NPI programs match the current Global Scope. Reset filters above to view all programs.
      </div>
    );
  }

  return (
    <div className="space-y-6">
      {projects.map((p) => {
        const visibleRows = [...(p.buildMatrix || [])]
          .filter((r) => globalSide === 'ALL' || (r.side || 'RHS') === globalSide)
          .sort((a, b) => {
            const cfgCmp = a.config.localeCompare(b.config, undefined, { numeric: true });
            if (cfgCmp !== 0) return cfgCmp;
            const sA = SIDE_ORDER.indexOf(a.side) === -1 ? 99 : SIDE_ORDER.indexOf(a.side);
            const sB = SIDE_ORDER.indexOf(b.side) === -1 ? 99 : SIDE_ORDER.indexOf(b.side);
            return sA - sB;
          });

        const totals = visibleRows.reduce(
          (acc, row) => {
            const c = computeBuildMatrixRow(row);
            return {
              fbu: acc.fbu + c.fbu,
              main: acc.main + c.main,
              rel: acc.rel + c.rel,

// ============================================================================
// VIEW 2B: NPI BUILD TIMELINE (INTERACTIVE GANTT MODULE)
// ============================================================================

function BuildTimelineGanttView({
  projects,
  gateRecords,
  globalSide,
  scheduleOverrides,
  onOpenGate,
  onEditSchedule,
  onReschedule
}) {
  const [groupMode, setGroupMode] = useState('side'); // 'side' | 'config'
  const [sequenceMode, setSequenceMode] = useState('lhs-first'); // 'lhs-first' | 'rhs-first' | 'readiness'
  const [zoomLevel, setZoomLevel] = useState('week'); // 'week' | 'day'
  const [collapsedProjects, setCollapsedProjects] = useState({}); // projectId -> true
  const boardScrollRef = useRef(null);

  // Direct manipulation of the stage bars: a drag is only a preview until the
  // pointer is released, so Escape / pointercancel leaves the plan untouched.
  const [stageDrag, setStageDrag] = useState(null);
  const stageDragRef = useRef(null);
  const suppressClickRef = useRef(false);
  const rescheduleRef = useRef(onReschedule);
  rescheduleRef.current = onReschedule;

  const commitStageDrag = useCallback((drag) => {
    if (!drag || !drag.deltaDays) return;
    const stage = GANTT_STAGES.find((s) => s.id === drag.stageId);
    const base = drag.schedule || {};
    if (!stage) return;
    let startIso = base[stage.startKey];
    let endIso = base[stage.endKey];
    if (!startIso || !endIso) return;

    if (drag.mode !== 'resize-end') startIso = addDaysIso(startIso, drag.deltaDays);
    if (drag.mode !== 'resize-start') endIso = addDaysIso(endIso, drag.deltaDays);
    // A stage never collapses or inverts: the dragged edge stops at the far one.
    if (diffDaysIso(startIso, endIso) < 0) {
      if (drag.mode === 'resize-start') startIso = endIso;
      else endIso = startIso;
    }

    suppressClickRef.current = true;
    if (rescheduleRef.current) {
      rescheduleRef.current(
        stageDragReschedulePayload({
          project: drag.project,
          rowKeys: drag.rowKeys,
          schedule: { ...base, [stage.startKey]: startIso, [stage.endKey]: endIso }
        })
      );
    }
  }, []);

  const isStageDragging = Boolean(stageDrag);

  // Window-level listeners, so a fast drag that leaves the bar still tracks.
  useEffect(() => {
    if (!isStageDragging) return undefined;
    const onMove = (event) => {
      const drag = stageDragRef.current;
      if (!drag) return;
      const deltaDays = Math.round((event.clientX - drag.startX) / drag.dayWidthPx);
      if (deltaDays === drag.deltaDays) return;
      // A zero-delta drag is indistinguishable from a click, which still opens the gate.
      suppressClickRef.current = false;
      const next = { ...drag, deltaDays };
      stageDragRef.current = next;
      setStageDrag(next);
    };
    const finish = (commit) => {
      const drag = stageDragRef.current;
      stageDragRef.current = null;
      setStageDrag(null);
      if (commit) commitStageDrag(drag);
    };
    const onPointerUp = () => finish(true);
    const onPointerCancel = () => finish(false);
    const onKeyDown = (event) => {
      if (event.key === 'Escape') finish(false);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerCancel);
    window.addEventListener('keydown', onKeyDown);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerCancel);
      window.removeEventListener('keydown', onKeyDown);
    };
  }, [isStageDragging, commitStageDrag]);

  const startStageDrag = (event, project, row, stage, mode) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    const schedule = row.schedule || {};
    if (!schedule[stage.startKey] || !schedule[stage.endKey]) return;
    event.preventDefault();
    event.stopPropagation();
    suppressClickRef.current = false;
    const drag = {
      project,
      rowId: row.id,
      stageId: stage.id,
      mode,
      rowKeys: row.rowKeys,
      schedule,
      startX: event.clientX,
      deltaDays: 0,
      dayWidthPx
    };
    stageDragRef.current = drag;
    setStageDrag(drag);
  };

  // Build normalized rows with side-priority or readiness-driven sequencing
  const timelineGroups = useMemo(() => {
    return projects.map((project) => {
      const visibleMatrix = [...(project.buildMatrix || [])].filter(
        (r) => globalSide === 'ALL' || (r.side || 'RHS') === globalSide
      );

      const projGateLines = gateRecords[project.id] || {};
      let items = [];

      if (groupMode === 'side') {
        items = buildSequencedGanttItems(
          project,
          visibleMatrix,
          projGateLines,
          scheduleOverrides,
          sequenceMode
        );
      } else {
        // Grouped by Config (R+L combined)
        const byConfig = new Map();
        visibleMatrix
          .sort((a, b) => a.config.localeCompare(b.config, undefined, { numeric: true }))
          .forEach((row) => {
            if (!byConfig.has(row.config)) byConfig.set(row.config, []);
            byConfig.get(row.config).push(row);
          });

        let idx = 1;
        byConfig.forEach((cfgRows, cfg) => {
          const rowKeys = cfgRows.map((r) => `${r.config}-${r.side || 'RHS'}`);
          const primaryKey = rowKeys[0];
          const primaryRow = cfgRows[0];
          const schedule =
            scheduleOverrides[`${project.id}::${primaryKey}`] ||
            getDefaultScheduleForRow(project, primaryRow);
          const hasHold = rowKeys.some((k) =>
            Object.values(projGateLines[k] || {}).some((g) => g.status === 'Blocked')
          );
          const readiness = hasHold
            ? { rank: 3, label: 'Hold', tone: 'rose', hasHold: true }
            : getLineReadinessInfo(projGateLines[primaryKey] || {});
          const totalQty = cfgRows.reduce(
            (sum, r) => sum + computeBuildMatrixRow(r).totalProduction,
            0
          );
          const sidesLabel = cfgRows.map((r) => r.side || 'RHS').join(' + ');

          items.push({
            type: 'build',
            id: `${project.id}-${cfg}`,
            seqNum: idx++,
            label: cfg,
            sideBadge: sidesLabel,
            sublabel: primaryRow.vendors,
            qty: totalQty,
            rowKeys,
            primaryLineKey: primaryKey,
            schedule,
            hasHold,
            readiness,
            isManualOverride: Boolean(scheduleOverrides[`${project.id}::${primaryKey}`])
          });
        });
      }

      return { project, items };
    });
  }, [projects, gateRecords, globalSide, scheduleOverrides, groupMode, sequenceMode]);

  const allBuildRows = useMemo(
    () =>
      timelineGroups.flatMap((g) =>
        g.items
          .filter((item) => item.type === 'build')
          .map((r) => ({ ...r, project: g.project }))
      ),
    [timelineGroups]
  );

  const totalConversions = useMemo(
    () =>
      timelineGroups.reduce(
        (sum, g) => sum + g.items.filter((item) => item.type === 'conversion').length,
        0
      ),
    [timelineGroups]
  );

  // Compute dynamic timeline bounds across all visible schedules
  const timelineBounds = useMemo(() => {
    let minIso = '2026-11-15';
    let maxIso = '2027-02-02';

    if (allBuildRows.length > 0) {
      const starts = [];
      const ends = [];
      const pushIso = (iso) => {
        if (typeof iso === 'string' && iso) {
          starts.push(iso);
          ends.push(iso);
        }
      };
      // Every staged date counts, not only preStart / PBR: a manually shifted
      // schedule can run past both, which used to clip its bars off the canvas.
      allBuildRows.forEach((r) => Object.values(r.schedule || {}).forEach(pushIso));
      timelineGroups.forEach((g) =>
        g.items.forEach((item) => {
          if (item.type !== 'conversion') return;
          pushIso(item.startIso);
          pushIso(item.endIso);
        })
      );
      starts.sort();
      ends.sort();
      if (starts[0]) minIso = addDaysIso(starts[0], -3);
      if (ends[ends.length - 1]) maxIso = addDaysIso(ends[ends.length - 1], 5);
    }

    const totalDays = Math.max(21, diffDaysIso(minIso, maxIso));
    return { minIso, maxIso, totalDays };
  }, [allBuildRows, timelineGroups]);

  const dayWidthPx = zoomLevel === 'day' ? 28 : 14;
  const chartWidthPx = timelineBounds.totalDays * dayWidthPx;

  const getOffsetPx = (iso) => diffDaysIso(timelineBounds.minIso, iso) * dayWidthPx;

  // Generate month headers and week/day tick lines
  const calendarTicks = useMemo(() => {
    const months = [];
    const weeks = [];
    const days = [];
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    let currentMonthKey = null;
    for (let i = 0; i < timelineBounds.totalDays; i++) {
      const iso = addDaysIso(timelineBounds.minIso, i);
      const dt = parseIsoDate(iso);
      const mKey = `${dt.getUTCFullYear()}-${dt.getUTCMonth()}`;
      if (mKey !== currentMonthKey) {
        months.push({
          key: mKey,
          label: `${monthNames[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`,
          startIdx: i,
          span: 1
        });
        currentMonthKey = mKey;
      } else {
        months[months.length - 1].span += 1;
      }

      const dayOfWeek = dt.getUTCDay(); // 0=Sun, 1=Mon
      if (dayOfWeek === 1 || i === 0) {
        weeks.push({
          iso,
          idx: i,
          label: `${monthNames[dt.getUTCMonth()]} ${dt.getUTCDate()}`
        });
      }

      days.push({
        iso,
        idx: i,
        dayNum: dt.getUTCDate(),
        isWeekend: dayOfWeek === 0 || dayOfWeek === 6
      });
    }

    return { months, weeks, days };
  }, [timelineBounds]);

  // Summary KPIs
  const summaryStats = useMemo(() => {
    const upcomingMihs = allBuildRows
      .map((r) => ({
        model: r.project.model,
        config: `${r.label} ${r.sideBadge}`,
        mih: r.schedule.mih,
        daysLeft: diffDaysIso(todayIso(), r.schedule.mih)
      }))
      .filter((x) => x.daysLeft >= 0)
      .sort((a, b) => a.daysLeft - b.daysLeft);

    const heldCount = allBuildRows.filter((r) => r.hasHold).length;

    return {
      nextMih: upcomingMihs[0] || null,
      heldCount,
      totalRows: allBuildRows.length
    };
  }, [allBuildRows]);

  const todayOffsetPx = getOffsetPx(todayIso());
  const showTodayLine = todayOffsetPx >= 0 && todayOffsetPx <= chartWidthPx;

  const sequenceLabelMap = {
    'lhs-first': 'LHS All Configs → Convert → RHS',
    'rhs-first': 'RHS All Configs → Convert → LHS',
    readiness: 'Build Readiness Priority (Ready First)'
  };

  if (projects.length === 0) {
    return (
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-10 text-center text-xs text-slate-500 dark:text-slate-400">
        No NPI programs match the current Global Scope. Reset filters above to view the build timeline.
      </div>
    );
  }

  return (
    <div className="space-y-5">
      {/* Timeline KPI Summary Strip */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Active Sequence Rule</div>
          <div className="text-sm font-bold text-slate-900 dark:text-slate-100 leading-snug">
            {sequenceLabelMap[sequenceMode]}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            {formatShortDate(timelineBounds.minIso)} – {formatShortDate(timelineBounds.maxIso)} ·{' '}
            {summaryStats.totalRows} runs
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Next FATP MIH Target</div>
          {summaryStats.nextMih ? (
            <>
              <div className="text-base font-bold text-emerald-700 dark:text-emerald-300 tabular-nums">
                {formatShortDate(summaryStats.nextMih.mih)}{' '}
                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">
                  (T-{summaryStats.nextMih.daysLeft}d)
                </span>
              </div>
              <div className="text-[11px] text-slate-500 dark:text-slate-400">
                {summaryStats.nextMih.model} · {summaryStats.nextMih.config}
              </div>
            </>
          ) : (
            <div className="text-base font-bold text-slate-400 dark:text-slate-400">—</div>
          )}
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Line Conversions (LHS ↔ RHS)</div>
          <div className="text-xl font-bold text-amber-700 dark:text-amber-300 tabular-nums">
            {totalConversions}{' '}
            <span className="text-xs font-normal text-slate-400 dark:text-slate-400">
              ({totalConversions * 2}d changeover)
            </span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            Minimized by batching configs per side
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Gate Holds on Schedule</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              summaryStats.heldCount > 0 ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-700 dark:text-emerald-300'
            }`}
          >
            {summaryStats.heldCount}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {summaryStats.heldCount > 0
              ? 'Ka Shui OMM / IQC containment holds'
              : 'All scheduled lines clear'}
          </div>
        </div>
      </div>

      {/* Interactive Gantt Board */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        {/* Toolbar: Sequence Priority + View Mode + Zoom */}
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-3">
            {/* Sequence Priority Control */}
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Line Sequence Priority:
              </span>
              <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800">
                <button
                  type="button"
                  onClick={() => {
                    setGroupMode('side');
                    setSequenceMode('lhs-first');
                  }}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    groupMode === 'side' && sequenceMode === 'lhs-first'
                      ? 'bg-sky-600 text-white shadow-2xs'
                      : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
                  }`}
                >
                  LHS → Convert → RHS
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setGroupMode('side');
                    setSequenceMode('rhs-first');
                  }}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    groupMode === 'side' && sequenceMode === 'rhs-first'
                      ? 'bg-indigo-600 text-white shadow-2xs'
                      : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
                  }`}
                >
                  RHS → Convert → LHS
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setGroupMode('side');
                    setSequenceMode('readiness');
                  }}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    groupMode === 'side' && sequenceMode === 'readiness'
                      ? 'bg-emerald-600 text-white shadow-2xs'
                      : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-900 dark:dark:hover:bg-slate-700'
                  }`}
                >
                  By Build Readiness
                </button>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2 text-xs">
              <button
                type="button"
                onClick={() => {
                  const el = boardScrollRef.current;
                  if (el) el.scrollTo({ left: Math.max(0, todayOffsetPx - 120), behavior: 'smooth' });

                title="Scroll the timeline so today is in view"
                className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-rose-200 dark:border-rose-800 bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 text-[11px] font-semibold hover:bg-rose-100 dark:hover:bg-rose-900 transition-colors"
              >
                <Calendar className="w-3.5 h-3.5" />
                <span>Today</span>
              </button>

              <button
                type="button"
                onClick={() => {
                  const allCollapsed = timelineGroups.every((g) => collapsedProjects[g.project.id]);
                  const next = {};
                  timelineGroups.forEach((g) => {
                    next[g.project.id] = !allCollapsed;
                  });
                  setCollapsedProjects(next);
                }}
                className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 text-[11px] font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
              >
                {timelineGroups.length > 0 && timelineGroups.every((g) => collapsedProjects[g.project.id]) ? (
                  <>
                    <ChevronDown className="w-3.5 h-3.5" />
                    <span>Expand all</span>
                  </>
                ) : (
                  <>
                    <ChevronRight className="w-3.5 h-3.5" />
                    <span>Collapse all</span>
                  </>
                )}
              </button>

              <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800">
                <button
                  type="button"
                  onClick={() => setGroupMode('side')}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    groupMode === 'side' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs' : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  Side Sequence
                </button>
                <button
                  type="button"
                  onClick={() => setGroupMode('config')}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    groupMode === 'config' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs' : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  Compact Config
                </button>
              </div>

              <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800">
                <button
                  type="button"
                  onClick={() => setZoomLevel('week')}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    zoomLevel === 'week' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs' : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  Weeks
                </button>
                <button
                  type="button"
                  onClick={() => setZoomLevel('day')}
                  className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition-colors ${
                    zoomLevel === 'day' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs' : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  Days
                </button>
              </div>
            </div>
          </div>

          {/* Stage & Conversion Legend */}
          <div className="flex flex-wrap items-center gap-3 text-[11px] pt-1 border-t border-slate-100 dark:border-slate-800">
            <span className="font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider">Legend:</span>
            {GANTT_STAGES.map((st) => (
              <span key={st.id} className="inline-flex items-center gap-1.5 text-slate-600 dark:text-slate-400 font-medium">
                <span className={`w-3 h-2.5 rounded-xs border ${st.barClass}`} />
                <span>{st.label}</span>
              </span>
            ))}
            <span className="inline-flex items-center gap-1.5 text-amber-800 dark:text-amber-200 font-semibold">
              <span className="w-3.5 h-2.5 rounded-xs border border-amber-500 bg-amber-100 dark:bg-amber-900 inline-block" />
              <span>Line Conversion (LHS ↔ RHS)</span>
            </span>
            <span className="inline-flex items-center gap-1.5 text-slate-600 dark:text-slate-400 font-medium">
              <span className="w-2.5 h-2.5 rotate-45 bg-cyan-500 border border-cyan-700 inline-block" />
              <span>ETD</span>
            </span>
            <span className="inline-flex items-center gap-1.5 text-slate-600 dark:text-slate-400 font-medium">
              <span className="w-2.5 h-2.5 rotate-45 bg-emerald-600 border border-emerald-800 inline-block" />
              <span>FATP MIH</span>
            </span>
            <span className="inline-flex items-center gap-1.5 text-slate-600 dark:text-slate-400 font-medium">
              <span className="w-2.5 h-2.5 rounded-full bg-slate-800 dark:bg-slate-600 inline-block" />
              <span>PBR</span>
            </span>
          </div>
        </div>

        {/* Split Sticky Left Column + Horizontally Scrollable Gantt Grid */}
        <div className="overflow-x-auto" ref={boardScrollRef}>
          <div style={{ minWidth: `${310 + chartWidthPx}px` }}>
            {/* Calendar Header */}
            <div className="flex border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 sticky top-0 z-10">
              <div className="w-[310px] shrink-0 px-4 py-2.5 border-r border-slate-200 dark:border-slate-800 flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800 sticky left-0 z-20">
                <span>Seq · Side · Config</span>
                <span>MIH · Edit</span>
              </div>

              <div className="relative flex-1" style={{ width: `${chartWidthPx}px` }}>
                {/* Month Row */}
                <div className="flex border-b border-slate-200/80 dark:border-slate-800/80 h-7">
                  {calendarTicks.months.map((m) => (
                    <div
                      key={m.key}
                      style={{ width: `${m.span * dayWidthPx}px` }}
                      className="px-2 flex items-center text-[11px] font-bold text-slate-700 dark:text-slate-300 border-r border-slate-200/80 dark:border-slate-800/80 truncate"
                    >
                      {m.label}
                    </div>
                  ))}
                </div>

                {/* Week / Day Row */}
                <div className="relative h-6 bg-white/80 dark:bg-slate-900/80">
                  {showTodayLine && (
                    <div
                      style={{ left: `${todayOffsetPx}px` }}
                      className="absolute top-0 bottom-0 z-10 pointer-events-none"
                    >
                      <span className="ml-[-14px] px-1 rounded-b-sm bg-rose-500 text-white text-[9px] font-bold leading-4">
                        Today
                      </span>
                    </div>
                  )}
                  {zoomLevel === 'week'
                    ? calendarTicks.weeks.map((w) => (
                        <div
                          key={w.iso}
                          style={{ left: `${w.idx * dayWidthPx}px` }}
                          className="absolute top-0 bottom-0 border-l border-slate-200 dark:border-slate-800 px-1.5 flex items-center text-[10px] font-medium text-slate-500 dark:text-slate-400 whitespace-nowrap tabular-nums"
                        >
                          {w.label}
                        </div>
                      ))
                    : calendarTicks.days.map((d) => (
                        <div
                          key={d.iso}
                          style={{ left: `${d.idx * dayWidthPx}px`, width: `${dayWidthPx}px` }}
                          className={`absolute top-0 bottom-0 border-l border-slate-100 dark:border-slate-800 flex items-center justify-center text-[10px] tabular-nums ${
                            d.iso === todayIso()
                              ? 'bg-rose-100 dark:bg-rose-900 text-rose-700 dark:text-rose-300 font-bold'
                              : d.isWeekend
                              ? 'bg-slate-100/80 dark:bg-slate-800/80 text-slate-400 dark:text-slate-400'
                              : 'text-slate-500 dark:text-slate-400'
                          }`}
                        >
                          {d.dayNum}
                        </div>
                      ))}
                </div>
              </div>
            </div>

            {/* Gantt Body */}
            <div className="relative">
              {timelineGroups.map(({ project, items }, gIdx) => {
                const isCollapsed = Boolean(collapsedProjects[project.id]);
                const groupBuildRows = items.filter((it) => it.type === 'build');
                const groupHolds = groupBuildRows.filter((it) => it.hasHold).length;
                const groupNextMih = groupBuildRows
                  .map((it) => it.schedule.mih)
                  .filter(Boolean)
                  .sort()[0];

                return (
                <div key={project.id}>
                  {/* Program Header Row */}
                  <div
                    className={`flex bg-slate-100/90 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-800 ${
                      gIdx > 0 ? 'border-t-2 border-slate-300 dark:border-slate-700' : ''
                    }`}
                  >
                    <div className="w-[310px] shrink-0 px-4 py-2 border-r border-slate-200 dark:border-slate-800 sticky left-0 z-10 bg-slate-100/95 dark:bg-slate-800/95 flex items-center justify-between gap-2">
                      <div className="min-w-0 flex items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() =>
                            setCollapsedProjects((prev) => ({ ...prev, [project.id]: !prev[project.id] }))
                          }
                          aria-expanded={!isCollapsed}
                          title={isCollapsed ? `Expand ${project.model} rows` : `Collapse ${project.model} rows`}
                          className="p-0.5 rounded text-slate-500 dark:text-slate-400 hover:bg-slate-200/70 dark:hover:bg-slate-700 transition-colors shrink-0"
                        >
                          {isCollapsed ? <ChevronRight className="w-3.5 h-3.5" /> : <ChevronDown className="w-3.5 h-3.5" />}
                        </button>
                        <span className="text-xs font-bold text-slate-900 dark:text-slate-100 truncate">
                          {project.model} · {project.phase}
                        </span>
                        <span className="text-[10px] text-slate-500 dark:text-slate-400 truncate">{project.customer}</span>
                      </div>
                      <StatusBadge status={project.status} />
                    </div>
                    <div
                      className="relative flex-1 px-3 py-2 text-[11px] text-slate-500 dark:text-slate-400 flex items-center justify-between gap-2"
                      style={{ width: `${chartWidthPx}px` }}
                    >
                      <span className="truncate">
                        {isCollapsed
                          ? `${groupBuildRows.length} runs · next MIH ${groupNextMih ? formatShortDate(groupNextMih) : '—'}${groupHolds > 0 ? ` · ${groupHolds} hold` : ''}`
                          : `${project.moRange} · ${project.lineSpec}`}
                      </span>
                      {showTodayLine && (
                        <div
                          style={{ left: `${todayOffsetPx}px` }}
                          className="absolute top-0 bottom-0 w-px bg-rose-500/70 pointer-events-none"
                        />
                      )}
                    </div>
                  </div>

                  {/* Sequenced Build & Line Conversion Rows */}
                  {!isCollapsed && items.map((item) => {
                    if (item.type === 'conversion') {
                      const leftPx = getOffsetPx(item.startIso);
                      const spanDays = Math.max(1, diffDaysIso(item.startIso, item.endIso) + 1);
                      const widthPx = Math.max(24, spanDays * dayWidthPx);

                      return (
                        <div
                          key={item.id}
                          className="flex border-y border-dashed border-amber-300 dark:border-amber-700 bg-amber-50/60 dark:bg-amber-950/60"
                        >

                                <span>
                                  {item.fromSide} → {item.toSide}

                                {item.sublabel}

                            <span className="text-[10px] font-semibold text-amber-800 dark:text-amber-200 tabular-nums shrink-0">
                              {formatShortDate(item.startIso)}
                            </span>
                          </div>

                          <div
                            className="relative h-9 flex-1"
                            style={{ width: `${chartWidthPx}px` }}
                          >
                            <div
                              style={{ left: `${leftPx}px`, width: `${widthPx}px` }}
                              title={`${item.label}: ${formatShortDate(item.startIso)} – ${formatShortDate(
                                item.endIso
                              )}`}
                              className="absolute top-1.5 h-6 rounded-md border border-dashed border-amber-500 bg-amber-200/80 dark:bg-amber-800/80 text-amber-950 dark:text-amber-100 text-[10px] font-bold px-1.5 flex items-center justify-center whitespace-nowrap overflow-hidden"
                            >
                              {widthPx >= 64 ? `Conv ${item.fromSide}→${item.toSide}` : '⇄'}
                            </div>

                            {showTodayLine && (
                              <div
                                style={{ left: `${todayOffsetPx}px` }}
                                className="absolute top-0 bottom-0 w-px border-l border-dashed border-rose-500 pointer-events-none z-10"
                              />
                            )}
                          </div>
                        </div>
                      );
                    }

                    const row = item;
                    const etdPx = getOffsetPx(row.schedule.etd);
                    const mihPx = getOffsetPx(row.schedule.mih);
                    const pbrPx = getOffsetPx(row.schedule.pbr);
                    const daysToMih = diffDaysIso(todayIso(), row.schedule.mih);
                    const mihChipClass =
                      daysToMih < 0
                        ? 'bg-rose-100 dark:bg-rose-900 text-rose-700 dark:text-rose-300 border-rose-300 dark:border-rose-700'
