<script type="text/babel" data-presets="react">
// ============================================================================
// VIEW 1: PROGRAM OVERVIEW & GATE DEPENDENCY MATRIX (MODEL > PHASE > SIDE > CONFIG)
// ============================================================================

function OverviewView({
  projects,
  records,
  tasks,
  gateRecords,
  costProjects,
  customerFeedback,
  globalSide,
  masterSpecs = [],
  cpkRecords = [],
  onOpenKpiDrilldown,
  onOpenGate,
  onSelectTask,
  onSwitchView
}) {
  const blockedOrHighTasks = useMemo(
    () => tasks.filter((t) => t.status !== 'Done').slice(0, 5),
    [tasks]
  );

  const recentRecords = useMemo(() => records.slice(0, 5), [records]);
  // A tile opens the inline deep dive, not the modal. The key and token let the
  // inline card select the matching tab even when the same tile is clicked twice.
  const [deepDiveFocus, setDeepDiveFocus] = useState({ key: null, token: 0 });
  const deepDiveRef = useRef(null);

  useEffect(() => {
    if (!deepDiveFocus.key || !deepDiveFocus.token) return;
    const node = deepDiveRef.current;
    if (!node) return;
    // The top action bar is sticky, so offset the card by its real height instead
    // of a fixed guess that breaks when the scope filters wrap.
    const header = document.querySelector('header');
    const offset = (header ? header.getBoundingClientRect().height : 0) + 16;
    const top = node.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }, [deepDiveFocus]);

  const showKpiInInlineDeepDive = (key) => {
    setDeepDiveFocus((previous) => ({ key, token: previous.token + 1 }));
  };

  // One line of capability on the landing page: counts and the Cpk ≥ 1.33 share,
  // rolled up by the same rule the Cpk matrix uses. The matrix itself stays on its
  // own view; this only keeps the signal visible without it.
  const capability = useMemo(
    () => summarizeCpkCapability(cpkRecords, masterSpecs),
    [cpkRecords, masterSpecs]
  );

  // KPI results roll-up: weighted actuals from the in-scope production runs.
  const kpiResults = useMemo(() => {
    const totalInput = records.reduce((s, r) => s + Math.max(0, Number(r.input) || 0), 0);
    let fallout = 0;
    let salvage = 0;
    let downtimeMin = 0;
    let plannedHr = 0;
    records.forEach((r) => {
      const m = computeProductionMetrics(r);
      fallout += m.fallout;
      salvage += m.salvage;
      downtimeMin += m.downtimeMin;
      plannedHr += Math.max(0, Number(r.plannedTimeHr) || 0);
    });

    const netReject = Math.max(0, fallout - salvage);
    const finalGood = Math.max(0, totalInput - netReject);
    const fpy = totalInput > 0 ? ((totalInput - fallout) / totalInput) * 100 : 0;
    const fy = totalInput > 0 ? Math.min(100, ((totalInput - fallout + salvage) / totalInput) * 100) : 0;
    const uph = plannedHr > 0 ? finalGood / plannedHr : 0;
    const runTimeHr = Math.max(0, plannedHr - downtimeMin / 60);
    const inputUph = runTimeHr > 0 ? totalInput / runTimeHr : 0;
    const efficiency = inputUph > 0 ? Math.min(100, (uph / inputUph) * 100) : 0;

    return {
      runs: records.length,
      totalInput,
      finalGood,
      fallout,
      salvage,
      downtimeMin,
      plannedHr,
      fpy,
      fy,
      uph,
      efficiency
    };
  }, [records]);

  // KPI scorecard: the six official targets measured against current data.
  const kpiTiles = useMemo(() => {
    // Every tile uses the MIH tile's fiscal window (1 Apr – 31 Mar) for the fiscal year
    // that contains today, so one FY label means the same twelve months everywhere.
    const claimsFy2026 = (customerFeedback || []).filter(
      (f) => f.category === 'Claim' && isInKpiFiscalYear(f.feedbackDate)
    ).length;
    const feedbackFyCount = (customerFeedback || []).filter((f) => isInKpiFiscalYear(f.feedbackDate)).length;

    const fySavingProjects = (costProjects || []).filter((item) =>
      isKpiFiscalYearTag(item.fyTarget)
    );
    const annualSavingThb = fySavingProjects.reduce(
      (sum, item) => sum + (computeCostSavingMetrics(item).annualSavingThb || 0),
      0
    );

    // Shipment to MIH is measured on time against lines already due this fiscal year;
    // the all-lines coverage is reported separately as a forecast figure.
    const mihToday = todayIso();
    const mihLines = [];
    projects.forEach((project) => {
      getLineVariantsForProject(project)
        .filter((v) => globalSide === 'ALL' || v.side === globalSide)
        .forEach((v) => {
          mihLines.push({
            fatpMih: v.fatpMih || project.mihDate || '',
            approved: gateRecords[project.id]?.[v.key]?.mih?.status === 'Approved',
            approvedAt: mihApprovalIso(gateRecords, project.id, v.key, mihToday)
          });
        });
    });
    const mihSummary = summarizeMihAchievement(mihLines, { today: mihToday });

    // mode 'max' = at-or-above target is good, 'min' = at-or-below target is good.
    const build = (key, label, value, target, opts = {}) => {
      const { unit = '', digits = 1, mode = 'max', format, targetFormat, footnote, drivers = [] } = opts;
      const fmt = format || ((v) => `${v.toFixed(digits)}${unit}`);
      const onTarget = mode === 'max' ? value >= target : value <= target;
      const headroom = mode === 'max' ? value - target : target - value;
      return {
        key,
        label,
        valueText: fmt(value),
        targetText: targetFormat ? targetFormat(target) : fmt(target),
        deltaText:
          mode === 'max'
            ? `${headroom >= 0 ? '+' : ''}${fmt(headroom)}`
            : `${Math.abs(headroom).toFixed(digits)} ${headroom >= 0 ? 'under limit' : 'over limit'}`,
        onTarget,
        barPct: Math.max(0, Math.min(100, target > 0 ? (value / target) * 100 : 0)),
        footnote,
        drivers
      };
    };

    const mihForecastText = `${mihSummary.forecastAchieved} of ${mihSummary.tracked} lines MIH-approved (forecast)`;
    // The MIH tile depends on due dates and sign-offs, not on production: the map
    // below says which half of that chain is missing when the tile reads "—".
    const mihDrivers = [
      { text: `${mihSummary.due} line${mihSummary.due === 1 ? '' : 's'} due`, ok: mihSummary.due > 0 },
      { text: `${mihSummary.forecastAchieved} of ${mihSummary.tracked} lines approved`, ok: true }
    ];
    const mihFootnote = mihSummary.due > 0
      ? `${mihSummary.onTime} of ${mihSummary.due} due lines on time \u00b7 ${mihForecastText}`
      : `${mihSummary.nextDue ? `Next MIH due ${mihSummary.nextDue}` : 'No MIH date scheduled'} \u00b7 ${mihForecastText}`;
    const mihTile = mihSummary.due > 0
      ? build('mih', 'Shipment to MIH Achieved', mihSummary.pct, KPI_TARGETS.mihAchievement, {
          digits: 0,
          unit: '%',
          footnote: mihFootnote,
          drivers: mihDrivers
        })
      : {
          key: 'mih',
          label: 'Shipment to MIH Achieved',
          valueText: '\u2014',
          targetText: `${KPI_TARGETS.mihAchievement}%`,
          deltaText: 'Not yet due',
          onTarget: false,
          tone: 'neutral',
          barPct: 0,
          footnote: mihFootnote,
          drivers: mihDrivers
        };

    return [
      build('fpy', 'First Pass Yield (FPY)', kpiResults.fpy, KPI_TARGETS.fpy, {
        unit: '%',
        footnote: `${kpiResults.runs} runs in scope`,
        drivers: [
          { text: `${kpiResults.runs} production run${kpiResults.runs === 1 ? '' : 's'}`, ok: kpiResults.runs > 0 },
          { text: `${kpiResults.totalInput.toLocaleString()} units input`, ok: kpiResults.totalInput > 0 }
        ]
      }),
      build('fy', 'Final Yield (FY)', kpiResults.fy, KPI_TARGETS.fy, {
        unit: '%',
        footnote: `${kpiResults.totalInput.toLocaleString()} units input`,
        drivers: [
          { text: `${Math.round(kpiResults.salvage).toLocaleString()} salvage pcs`, ok: kpiResults.runs > 0 },
          { text: `${kpiResults.totalInput.toLocaleString()} units input`, ok: kpiResults.totalInput > 0 }
        ]
      }),
      build('eff', 'Line Efficiency', kpiResults.efficiency, KPI_TARGETS.efficiency, {
        unit: '%',
        footnote: 'Input UPH vs net-good UPH',
        drivers: [
          { text: `${kpiResults.plannedHr.toFixed(1)} h planned`, ok: kpiResults.plannedHr > 0 },
          { text: `${Math.round(kpiResults.downtimeMin).toLocaleString()} min downtime`, ok: kpiResults.downtimeMin > 0 }
        ]
      }),
      build('claims', `Customer Claims FY${currentFiscalYear()}`, claimsFy2026, KPI_TARGETS.customerClaims, {
        digits: 0,
        mode: 'min',
        targetFormat: (v) => `\u2264 ${v}`,
        footnote: kpiFiscalScopeLabel(),
        drivers: [
          { text: `${feedbackFyCount} feedback case${feedbackFyCount === 1 ? '' : 's'}`, ok: feedbackFyCount > 0 },
          { text: `${claimsFy2026} claim${claimsFy2026 === 1 ? '' : 's'}`, ok: true }
        ]
      }),
      build('saving', `Annual Cost Saving FY${currentFiscalYear()}`, annualSavingThb, KPI_TARGETS.annualSavingThb, {
        format: formatThbCompact,
        footnote: `${fySavingProjects.length} saving initiatives tagged FY${currentFiscalYear()}`,
        drivers: [
          { text: `${fySavingProjects.length} initiative${fySavingProjects.length === 1 ? '' : 's'} tagged FY${currentFiscalYear()}`, ok: fySavingProjects.length > 0 }
        ]
      }),
      mihTile
    ];
  }, [kpiResults, costProjects, customerFeedback, projects, gateRecords, globalSide]);


  // Active NPI build progress: units actually run vs the planned build quantity.
  const buildProgress = useMemo(
    () =>
      projects.map((project) => {
        const variants = getLineVariantsForProject(project).filter(
          (v) => globalSide === 'ALL' || v.side === globalSide
        );
        const planned = variants.reduce((s, v) => s + v.qty, 0);
        const built = records
          .filter((r) => r.model === project.model && (globalSide === 'ALL' || r.side === globalSide))
          .reduce((s, r) => s + Math.max(0, Number(r.input) || 0), 0);
        const pct = planned > 0 ? Math.min(100, (built / planned) * 100) : 0;

        let passed = 0;
        variants.forEach((v) => {
          const lineGates = gateRecords[project.id]?.[v.key] || {};
          NPI_GATES.forEach((g) => {
            if (lineGates[g.id]?.status === 'Approved') passed += 1;
          });
        });
        const gateTotal = variants.length * NPI_GATES.length;

        return {
          project,
          lineCount: variants.length,
          planned,
          built,
          remaining: Math.max(0, planned - built),
          pct,
          passed,
          gateTotal,
          gatePct: gateTotal > 0 ? (passed / gateTotal) * 100 : 0,
          currentGate: NPI_GATES.find((g) => g.id === project.currentGateId)
        };
      }),
    [projects, records, gateRecords, globalSide]
  );

  return (
    <div className="space-y-6">
      {/* KPI Results Summary — quality and throughput outcomes */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">KPI Results Summary</h2>
            <p className="text-[11px] text-slate-500 dark:text-slate-400">
              Weighted actuals from {kpiResults.runs} production run{kpiResults.runs === 1 ? '' : 's'} in the
              active Global Scope ({kpiResults.totalInput.toLocaleString()} units input) against the FY{currentFiscalYear()} KPI targets
            </p>
          </div>
          <button
            type="button"
            onClick={() => onSwitchView('production')}
            className="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 inline-flex items-center gap-1"
          >
            <span>Production Ledger</span>
            <ArrowRight className="w-3.5 h-3.5" />
          </button>
        </div>

        <div className="p-4 grid grid-cols-2 md:grid-cols-3 2xl:grid-cols-6 gap-3">
          {kpiTiles.map((tile) => {
            const tone = tile.tone || (tile.onTarget ? 'good' : 'bad');
            return (
            <button
              key={tile.key}
              type="button"
              onClick={() => showKpiInInlineDeepDive(tile.key)}
              title={`Show ${tile.label} in the KPI deep dive`}
              aria-label={`Show ${tile.label} in the KPI deep dive`}
              aria-controls="overview-kpi-deep-dive"
              className="text-left rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/40 p-3 hover:border-blue-300 dark:hover:border-blue-700 hover:bg-white dark:hover:bg-slate-800/70 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 transition-colors"
            >
              <div className="flex items-start justify-between gap-1.5">
                <div className="text-[11px] font-medium text-slate-500 dark:text-slate-400 leading-tight">
                  {tile.label}
                </div>
                <ChevronRight className="w-3 h-3 text-slate-300 dark:text-slate-600 shrink-0" />
              </div>
              <div className="mt-1 flex flex-wrap items-baseline gap-1.5">
                <span
                  className={`text-xl font-bold tabular-nums ${
                    tone === 'good'
                      ? 'text-emerald-700 dark:text-emerald-300'
                      : tone === 'bad'
                      ? 'text-amber-700 dark:text-amber-300'
                      : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  {tile.valueText}
                </span>
                <span
                  className={`text-[10px] font-bold px-1.5 py-0.5 rounded border tabular-nums ${
                    tone === 'good'
                      ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'
                      : tone === 'bad'
                      ? 'bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                  }`}
                >
                  {tile.deltaText}
                </span>
              </div>
              <div className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5 tabular-nums">
                Target {tile.targetText}
              </div>
              <div className="mt-1.5 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                <div
                  className={`h-full ${
                    tone === 'good' ? 'bg-emerald-500' : tone === 'bad' ? 'bg-amber-500' : 'bg-slate-400 dark:bg-slate-600'
                  }`}
                  style={{ width: `${tile.barPct}%` }}
                />
              </div>
              {tile.footnote && (
                <div className="text-[10px] text-slate-400 dark:text-slate-400 mt-1 truncate" title={tile.footnote}>
                  {tile.footnote}
                </div>
              )}
            </button>
            );
          })}
        </div>
      </section>

      {/* KPI deep dive — trend, worst variants and the Pareto behind the loss, in
          the same three charts the full deep-dive modal shows. */}
      <KpiDeepDiveSection
        projects={projects}
        records={records}
        gateRecords={gateRecords}
        globalSide={globalSide}
        costProjects={costProjects}
        customerFeedback={customerFeedback}
        onOpenDeepDive={onOpenKpiDrilldown}
        focusKpiKey={deepDiveFocus.key}
        focusToken={deepDiveFocus.token}
        sectionRef={deepDiveRef}
      />

      {/* Capability in one line, and the way through to the full matrix. */}
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <button
          type="button"
          onClick={() => onSwitchView('cpk')}
          title="Open the Cpk matrix"
          className="w-full px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-left hover:bg-slate-50 dark:hover:bg-slate-800/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 transition-colors"
        >
          <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px]">
            <span className="font-semibold text-slate-600 dark:text-slate-300">Process capability</span>
            {capability.total === 0 ? (
              <span className="text-slate-500 dark:text-slate-400">
                {capability.provisional > 0
                  ? `${capability.provisional} reading${capability.provisional === 1 ? '' : 's'} on provisional limits — no valid Cpk yet`
                  : 'No Cpk readings yet — import capability data to populate this'}
              </span>
            ) : (
              <>
                <span className="inline-flex items-center gap-1 rounded border border-emerald-300 dark:border-emerald-700 bg-emerald-50 dark:bg-emerald-950 px-1.5 py-0.5 font-semibold text-emerald-800 dark:text-emerald-200 tabular-nums">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" aria-hidden="true" />
                  {capability.green} capable
                </span>
                <span className="inline-flex items-center gap-1 rounded border border-yellow-300 dark:border-yellow-700 bg-yellow-50 dark:bg-yellow-950 px-1.5 py-0.5 font-semibold text-yellow-800 dark:text-yellow-200 tabular-nums">
                  <span className="w-1.5 h-1.5 rounded-full bg-yellow-500" aria-hidden="true" />
                  {capability.yellow} marginal
                </span>
                <span className="inline-flex items-center gap-1 rounded border border-orange-300 dark:border-orange-700 bg-orange-50 dark:bg-orange-950 px-1.5 py-0.5 font-semibold text-orange-800 dark:text-orange-200 tabular-nums">
                  <span className="w-1.5 h-1.5 rounded-full bg-orange-500" aria-hidden="true" />
                  {capability.orange} incapable
                </span>
                <span className="font-semibold text-slate-600 dark:text-slate-300 tabular-nums">
                  Cpk &ge; 1.33 share: {capability.passRate.toFixed(0)}% ({capability.green}/{capability.total}{' '}
                  valid)
                </span>
                {capability.provisional > 0 && (
                  <span className="text-slate-500 dark:text-slate-400">
                    · {capability.provisional} provisional excluded
                  </span>
                )}
              </>
            )}
          </div>
          <span className="inline-flex items-center gap-1 text-xs font-semibold text-blue-600 dark:text-blue-400">
            Cpk matrix
            <ArrowRight className="w-3.5 h-3.5" />
          </span>
        </button>
      </div>

      {/* Active NPI Build Progress — units run vs planned build quantity, gate cells passed */}
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800">
          <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">Active NPI Build Progress</h2>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">
            Units run against planned build quantity (FBU + Main + REL + MBO + IQC + OQC + DOE + Est. loss) and
            gate cells passed across {NPI_GATES.length} PEN-81-0002 stage gates
          </p>
        </div>

        {buildProgress.length === 0 ? (
          <div className="p-6 text-center text-xs text-slate-500 dark:text-slate-400">
            No NPI programs match the active Global Scope filter.
          </div>
        ) : (
          <div className="divide-y divide-slate-100 dark:divide-slate-800">
            {buildProgress.map((row) => (
              <button
                key={row.project.id}
                type="button"
                onClick={() => onOpenGate(row.project.id, row.project.currentGateId)}
                className="w-full text-left px-5 py-3.5 hover:bg-slate-50 dark:hover:bg-slate-800/70 transition-colors"
              >
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-sm font-bold text-slate-900 dark:text-slate-100">{row.project.model}</span>
                    <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                      {row.project.phase}
                    </span>
                    <StatusBadge status={row.project.status} />
                    <span className="text-[11px] text-slate-500 dark:text-slate-400">
                      {row.lineCount} config/side lines ·{' '}
                      <span className="font-semibold text-blue-700 dark:text-blue-300">
                        {row.currentGate?.code} {row.currentGate?.short}
                      </span>
                    </span>
                  </div>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
                    MIH {row.project.mihDate}
                  </span>
                </div>

                <div className="mt-2.5 grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2">
                  <div>
                    <div className="flex items-center justify-between gap-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                      <span>Build progress</span>
                      <span className="tabular-nums text-slate-700 dark:text-slate-300 normal-case tracking-normal">
                        {row.built.toLocaleString()} / {row.planned.toLocaleString()} ({row.pct.toFixed(1)}%)
                      </span>
                    </div>
                    <div className="mt-1 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                      <div
                        className={`h-full ${
                          row.pct >= 100 ? 'bg-emerald-500' : row.pct >= 50 ? 'bg-blue-500' : 'bg-amber-500'
                        }`}
                        style={{ width: `${row.pct}%` }}
                      />
                    </div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-400 mt-0.5 tabular-nums">
                      {row.remaining.toLocaleString()} units remaining to planned quantity
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between gap-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                      <span>Gate cells passed</span>
                      <span className="tabular-nums text-slate-700 dark:text-slate-300 normal-case tracking-normal">
                        {row.passed} / {row.gateTotal} ({row.gatePct.toFixed(0)}%)
                      </span>
                    </div>
                    <div className="mt-1 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                      <div className="h-full bg-emerald-500" style={{ width: `${row.gatePct}%` }} />
                    </div>
                    <div className="text-[10px] text-slate-400 dark:text-slate-400 mt-0.5 tabular-nums">
                      {NPI_GATES.length} gates × {row.lineCount} lines · {row.gateTotal - row.passed} cells open
                    </div>
                  </div>
                </div>
              </button>
            ))}
          </div>
        )}
      </section>

      {/* Bottom Two-Column Split: Production Records Snapshot + Open Escalations */}
      <div className="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
        <section className="xl:col-span-7 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
          <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <div>
              <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">Recent Production Records</h2>
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Latest completed runs with calculated FPY, FY, UPH &amp; Efficiency
              </p>
            </div>
            <button
              type="button"
              onClick={() => onSwitchView('production')}
              className="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 inline-flex items-center gap-1"
            >
              <span>Full Ledger</span>
              <ArrowRight className="w-3.5 h-3.5" />
            </button>
          </div>

          <div className="overflow-x-auto">

function GateWorkstreamMatrix({ projects, gateRecords, globalSide, scheduleOverrides = {}, onOpenGate }) {
  const groupedSections = useMemo(() => {
    return projects.map((project) => {
      const variants = getLineVariantsForProject(project)
        .filter((v) => globalSide === 'ALL' || v.side === globalSide)
        .sort((a, b) => {
          const sA = SIDE_ORDER.indexOf(a.side) === -1 ? 99 : SIDE_ORDER.indexOf(a.side);
          const sB = SIDE_ORDER.indexOf(b.side) === -1 ? 99 : SIDE_ORDER.indexOf(b.side);
          if (sA !== sB) return sA - sB;
          return a.config.localeCompare(b.config, undefined, { numeric: true });
        });

      const activeRollup = computeProgramGateDependency(
        project,
        project.currentGateId,
        gateRecords[project.id] || {}
      );

      return { project, variants, activeRollup };
    });
  }, [projects, gateRecords, globalSide]);

  // Each line's plan (a dragged schedule where one exists), so a cell can name the
  // day its gate is due even before anything is signed.
  const lineSchedules = useMemo(() => {
    const map = new Map();
    projects.forEach((project) => {
      getLineVariantsForProject(project).forEach((variant) => {
        map.set(`${project.id}::${variant.key}`, lineGateSchedule(project, variant.key, scheduleOverrides));
      });
    });
    return map;
  }, [projects, scheduleOverrides]);

  const renderGateCell = (project, variant, gate, gateIdx) => {
    const lineGates = gateRecords[project.id]?.[variant.key] || {};
    const dossier = lineGates[gate.id];
    const status = dossier?.status || 'Pending';
    // A passed gate is dated when it was signed; every other cell shows the day the
    // plan needs it cleared by, so the row reads as a timeline.
    const passedIso = gateApprovalIso(gateRecords, project.id, variant.key, gate.id);
    const planIso = gateSignOffDueIso(gate.id, lineSchedules.get(`${project.id}::${variant.key}`));
    const cellDateIso = passedIso || planIso;
    const cellDate = cellDateIso ? formatMonthDay(cellDateIso) : null;

    const prevGate = gateIdx > 0 ? NPI_GATES[gateIdx - 1] : null;
    const prevApproved = !prevGate || lineGates[prevGate.id]?.status === 'Approved';
    // The label and the owed-signature list read the same rule (gateStatusPrefix).
    const label = gateStatusPrefix(status, prevApproved);

    let styleClass = 'bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800';

    if (status === 'Approved') {
      styleClass = 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100 dark:hover:bg-emerald-900 font-bold';
    } else if (status === 'Blocked') {
      styleClass = 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800 hover:bg-rose-100 dark:hover:bg-rose-900 font-bold';
    } else if (status === 'In Review' || status === 'Conditional') {
      styleClass = 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-300 dark:border-amber-700 hover:bg-amber-100 dark:hover:bg-amber-900 font-bold';
    }

    return (
      <td key={gate.id} className="py-1.5 px-1 text-center">
        <button
          type="button"
          onClick={() => onOpenGate(project.id, gate.id, variant.key)}
          title={`${project.model} ${project.phase} · ${variant.side} ${variant.config} · ${gate.code} ${gate.label}: ${status}${
            passedIso
              ? ` · passed ${formatMonthDay(passedIso)}`
              : planIso
              ? ` · planned ${formatMonthDay(planIso)}`
              : ''
          }`}
          className={`w-full py-1 px-1.5 rounded-md border text-[11px] leading-tight transition-colors ${styleClass}`}
        >
          <span className="block">{label}</span>
          <span className="block text-[9px] font-semibold tabular-nums opacity-80">
            {cellDate || '—'}
          </span>
        </button>
      </td>
    );
  };

  return (
    <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
      <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">
            Gate Pass Sign-Off &amp; Dependency Matrix (Model × Phase × Side × Config)
          </h2>
          <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
            Status and date (mm/dd) per gate: a passed gate shows the day it was signed, every other cell the day the
            plan needs it cleared by · Click any cell to open its sign-off dossier
          </p>
        </div>

        <div className="flex flex-wrap items-center gap-2 text-[11px]">
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-semibold">
            Pass
          </span>
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border border-amber-300 dark:border-amber-700 font-semibold">
            Active
          </span>
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 font-semibold">
            Hold
          </span>
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-800 font-semibold">
            Dep.
          </span>
        </div>
      </div>

      {/* Program x Phase Dependency Roll-Up Strip */}
      {groupedSections.length > 0 && (
        <div className="px-5 py-2.5 bg-slate-50/80 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center gap-3 text-xs">
          <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
            Program Roll-Up:
          </span>
          {groupedSections.map(({ project, activeRollup }) => {
            const curGate = NPI_GATES.find((g) => g.id === project.currentGateId);
            return (
              <button
                key={project.id}
                type="button"
                onClick={() => onOpenGate(project.id, project.currentGateId)}
                className="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-300 dark:hover:border-blue-700 transition-colors tabular-nums"
              >
                <strong className="text-slate-900 dark:text-slate-100">
                  {project.model} {project.phase}
                </strong>
                <span className="text-slate-400 dark:text-slate-400">·</span>
                <span className="text-blue-700 dark:text-blue-300 font-semibold">
                  {curGate?.code} {curGate?.short}
                </span>
                <span className="text-[11px] text-slate-600 dark:text-slate-400">
                  ({activeRollup.approvedCount}/{activeRollup.totalCount} pass)
                </span>
                {activeRollup.blockedLines.length > 0 && (
                  <span className="text-[10px] font-bold text-rose-600 dark:text-rose-400">
                    {activeRollup.blockedLines.length} hold
                  </span>
                )}
              </button>
            );
          })}
        </div>
      )}

      <div className="overflow-x-auto">
        {groupedSections.length === 0 ? (
          <div className="p-8 text-center text-xs text-slate-500 dark:text-slate-400">
            No NPI programs match the active Global Scope filter.
          </div>
        ) : (
          <table className="w-full text-left border-collapse text-xs">
            <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
              <tr>
                <th className="py-2.5 px-3 whitespace-nowrap">Model</th>
                <th className="py-2.5 px-2.5 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Phase</th>
                <th className="py-2.5 px-2.5 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Side</th>
                <th className="py-2.5 px-3 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Config / Qty</th>
                {NPI_GATES.map((g) => (
                  <th key={g.id} className="py-2.5 px-1.5 text-center whitespace-nowrap min-w-[68px]">
                    <div className="font-bold text-slate-700 dark:text-slate-300">{g.code}</div>
                    <div className="text-[9px] font-medium text-slate-400 dark:text-slate-400 normal-case">
                      {g.short}
                    </div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {groupedSections.map(({ project, variants }, sectionIdx) => (
                <React.Fragment key={project.id}>
                  {/* Distinct Model x Phase Group Divider Row */}
                  <tr
                    className={`bg-slate-100/90 dark:bg-slate-800/90 ${
                      sectionIdx > 0 ? 'border-t-2 border-slate-300 dark:border-slate-700' : 'border-t border-slate-200 dark:border-slate-800'
                    }`}
                  >
                    <td colSpan={4 + NPI_GATES.length} className="py-2 px-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-900 dark:text-slate-100">

                  {variants.map((variant, vIdx) => {

                    return (

                                ? 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800'

                        <td className="py-2 px-3 whitespace-nowrap border-r border-slate-200/80 dark:border-slate-800/80 tabular-nums">
                          <div className="flex items-center gap-1.5">
                            <span className="font-bold text-slate-800 dark:text-slate-200">{variant.config}</span>

function SignOffLedgerView({ gateRecords, projects }) {
  const [ledger, setLedger] = useState({
    status: 'loading',
    rows: [],
    error: '',
    unavailable: '',
    readAt: '',
    sheetUrl: ''
  });
  const [programFilter, setProgramFilter] = useState('ALL');
  const [decisionFilter, setDecisionFilter] = useState('ALL');
  const [search, setSearch] = useState('');

  const loadLedger = () => {
    const runner =
      typeof window !== 'undefined' && window.google && window.google.script && window.google.script.run;
    if (!runner) {
      setLedger({
        status: 'error',
        rows: [],
        error: 'The ledger lives in the Google Sheet, so it can only be read from the deployed app.',
        unavailable: '',
        readAt: '',
        sheetUrl: ''
      });
      return;
    }
    setLedger((prev) => ({ ...prev, status: 'loading', error: '' }));
    runner
      .withSuccessHandler((res) => {
        if (!res || res.ok === false) {
          setLedger({
            status: 'error',
            rows: [],
            error: (res && res.error) || 'The ledger could not be read.',
            unavailable: '',
            readAt: '',
            sheetUrl: (res && res.sheetUrl) || ''
          });
          return;
        }
        setLedger({
          status: 'ready',
          rows: Array.isArray(res.rows) ? res.rows : [],
          error: '',
          unavailable: String(res.unavailable || ''),
          readAt: String(res.readAt || ''),
          sheetUrl: String(res.sheetUrl || '')
        });
      })
      .withFailureHandler((err) => {
        setLedger({
          status: 'error',
          rows: [],
          error: (err && err.message) || String(err || 'The ledger could not be read.'),
          unavailable: '',
          readAt: '',
          sheetUrl: ''
        });
      })
      .getSignOffLedger();
  };

  useEffect(() => {
    loadLedger();
  }, []);

  // The seed is not an approval, so seeded decisions are excluded from "missing
  // from the ledger" — see reconcileSignOffLedger.
  const reconciliation = useMemo(() => {
    if (ledger.status !== 'ready' || ledger.unavailable) return null;
    return reconcileSignOffLedger(gateRecords, projects, ledger.rows, createInitialGateRecords());
  }, [ledger, gateRecords, projects]);

  const programOptions = useMemo(() => {
    const seen = new Map();
    ledger.rows.forEach((row) => {
      if (row.programId && !seen.has(row.programId)) seen.set(row.programId, row.program || row.programId);
    });
    return Array.from(seen.entries()).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  }, [ledger.rows]);

  const visibleRows = useMemo(() => {
    const query = search.trim().toLowerCase();
    return ledger.rows
      .filter((row) => {
        if (programFilter !== 'ALL' && row.programId !== programFilter) return false;
        if (decisionFilter !== 'ALL' && row.decision !== decisionFilter) return false;
        if (!query) return true;
        return [row.program, row.programId, row.line, row.gate, row.approver, row.role, row.remark, row.signedInEmail]
          .filter(Boolean)
          .some((value) => String(value).toLowerCase().indexOf(query) !== -1);
      })
      .sort(
        (a, b) =>
          String(b.timestamp).localeCompare(String(a.timestamp)) ||
          (Number(b.revision) || 0) - (Number(a.revision) || 0)
      );
  }, [ledger.rows, programFilter, decisionFilter, search]);

  const handleExport = () =>
    triggerCsvDownload(`FFM-signoff-ledger_${todayIso()}.csv`, signOffLedgerCsv(visibleRows));

  const decisionChip = (decision) => {
    if (decision === 'Approved')
      return 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800';
    if (decision === 'Conditional')
      return 'bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800';
    if (decision === 'Rejected')
      return 'bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800';
    return 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700';
  };

  return (
    <div className="space-y-6">
      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-start justify-between gap-3">
          <div>
            <div className="flex flex-wrap items-center gap-2">
              <h2 className="text-sm font-bold text-slate-900 dark:text-slate-100">Gate Decision Ledger</h2>
              <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300">
                Read-only
              </span>
            </div>
            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1">
              Every gate decision recorded in <span className="font-mono">SignOffLog</span>, one row per changed
              approver decision. The tab is append-only and is never edited by the app.
              {ledger.status === 'ready' && ledger.readAt && (
                <> Read at {String(ledger.readAt).slice(11, 19)} UTC.</>
              )}
            </p>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            {ledger.sheetUrl && (
              <a
                href={ledger.sheetUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-[11px] font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800"
              >
                <ExternalLink className="w-3.5 h-3.5" />
                Open SignOffLog
              </a>
            )}
            <button
              type="button"
              onClick={loadLedger}
              disabled={ledger.status === 'loading'}
              className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-[11px] font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-50"
            >
              <RefreshCw className={`w-3.5 h-3.5 ${ledger.status === 'loading' ? 'animate-spin' : ''}`} />
              Refresh
            </button>
            <button
              type="button"
              onClick={handleExport}
              disabled={ledger.status !== 'ready' || visibleRows.length === 0}
              className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-900 dark:bg-slate-700 text-white text-[11px] font-semibold hover:bg-slate-800 dark:hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              <Download className="w-3.5 h-3.5" />
              Export CSV ({visibleRows.length})
            </button>
          </div>
        </div>

        {ledger.status === 'error' && (
          <div className="px-5 py-4 text-[11px] text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-950/60 border-b border-rose-200 dark:border-rose-800">
            {ledger.error}
          </div>
        )}
        {ledger.status === 'ready' && ledger.unavailable && (
          <div className="px-5 py-4 text-[11px] text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800">
            {ledger.unavailable}
          </div>
        )}
        {ledger.status === 'loading' && (
          <div className="px-5 py-4 text-[11px] text-slate-500 dark:text-slate-400">Reading SignOffLog…</div>
        )}
      </section>

      {reconciliation && (
        <section
          className={`rounded-xl border overflow-hidden ${
            reconciliation.inSync
              ? 'border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950'
              : 'border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950'
          }`}
        >
          <div className="px-5 py-3.5 border-b border-current/10">
            <h3
              className={`text-sm font-bold flex items-center gap-1.5 ${
                reconciliation.inSync
                  ? 'text-emerald-900 dark:text-emerald-100'
                  : 'text-amber-900 dark:text-amber-100'
              }`}
            >
              {reconciliation.inSync ? (
                <ShieldCheck className="w-4 h-4" />
              ) : (
                <AlertTriangle className="w-4 h-4" />
              )}
              {reconciliation.inSync
                ? 'Ledger and saved state agree'
                : 'Ledger and saved state disagree'}
            </h3>
            <p
              className={`text-[11px] mt-1 ${
                reconciliation.inSync
                  ? 'text-emerald-800 dark:text-emerald-200'
                  : 'text-amber-800 dark:text-amber-200'
              }`}
            >
              {reconciliation.stateDecisionCount} decision(s) in the saved state ·{' '}
              {reconciliation.ledgerDecisionCount} in the ledger · {reconciliation.matched} matched
              {reconciliation.missingFromLedger.length > 0 &&
                ` · ${reconciliation.missingFromLedger.length} missing from the ledger`}
              {reconciliation.missingFromState.length > 0 &&
                ` · ${reconciliation.missingFromState.length} in the ledger with no decision in state`}
            </p>
          </div>

          {reconciliation.missingFromLedger.length > 0 && (
            <div className="px-5 py-3 space-y-1.5">
              <div className="text-[10px] font-bold uppercase tracking-wider text-amber-900 dark:text-amber-100">
                In the saved state, missing from SignOffLog
              </div>
              <p className="text-[10px] text-amber-800 dark:text-amber-200">
                These decisions were saved but never appended — the failed import this view exists to catch. Add
                them to the tab by hand, or re-save the gate after fixing the append.
              </p>
              {reconciliation.missingFromLedger.slice(0, 40).map((entry, idx) => (
                <div
                  key={`${entry.programId}-${entry.line}-${entry.gate}-${entry.approver}-${idx}`}
                  className="flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] text-amber-900 dark:text-amber-100 tabular-nums"
                >
                  <span className="font-semibold">{entry.program || entry.programId}</span>
                  <span className="text-amber-700 dark:text-amber-300">{entry.line}</span>
                  <span className="text-amber-700 dark:text-amber-300">{entry.gate}</span>
                  <span>{entry.approver}</span>
                  <span className={`px-1.5 py-0.5 rounded border text-[10px] font-bold tabular-nums ${decisionChip(entry.decision)}`}>
                    {gateStatusPrefix(entry.decision)} {formatMonthDay(entry.at)}
                  </span>
                </div>
              ))}
              {reconciliation.missingFromLedger.length > 40 && (
                <div className="text-[10px] text-amber-700 dark:text-amber-300">
                  +{reconciliation.missingFromLedger.length - 40} more — export the CSV for the full list.
                </div>
              )}
            </div>
          )}

          {reconciliation.missingFromState.length > 0 && (
            <div className="px-5 py-3 space-y-1.5 border-t border-amber-200 dark:border-amber-800">
              <div className="text-[10px] font-bold uppercase tracking-wider text-amber-900 dark:text-amber-100">
                In SignOffLog, no decision in the saved state
              </div>
              <p className="text-[10px] text-amber-800 dark:text-amber-200">
                The ledger records a decision the saved state no longer holds — the gate was reopened, or the
                program / line / approver was removed. History, not necessarily an error, but it is a divergence.
              </p>
              {reconciliation.missingFromState.slice(0, 40).map((entry, idx) => (
                <div
                  key={`${entry.programId}-${entry.line}-${entry.gate}-${entry.approver}-${idx}`}
                  className="flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] text-amber-900 dark:text-amber-100 tabular-nums"
                >
                  <span className="font-semibold">{entry.program || entry.programId}</span>
                  <span className="text-amber-700 dark:text-amber-300">{entry.line}</span>
                  <span className="text-amber-700 dark:text-amber-300">{entry.gate}</span>
                  <span>{entry.approver}</span>
                  <span className={`px-1.5 py-0.5 rounded border text-[10px] font-bold tabular-nums ${decisionChip(entry.decision)}`}>
                    {gateStatusPrefix(entry.decision)} {formatMonthDay(entry.at)}
                  </span>
                  <span className="text-amber-700 dark:text-amber-300">Rev #{entry.revision}</span>
                </div>
              ))}
            </div>
          )}
        </section>
      )}

      <section className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center gap-2">
          <select
            value={programFilter}
            onChange={(e) => setProgramFilter(e.target.value)}
            aria-label="Filter ledger by program"
            className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-[11px] font-semibold"
          >
            <option value="ALL">All programs</option>
            {programOptions.map(([id, label]) => (
              <option key={id} value={id}>
                {label}
              </option>
            ))}
          </select>
          <select
            value={decisionFilter}
            onChange={(e) => setDecisionFilter(e.target.value)}
            aria-label="Filter ledger by decision"
            className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-[11px] font-semibold"
          >
            <option value="ALL">All decisions</option>
            {SIGN_OFF_LEDGER_DECISIONS.map((decision) => (
              <option key={decision} value={decision}>
                {decision}
              </option>
            ))}
          </select>
          <div className="relative flex-1 min-w-[180px]">
            <Search className="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-400" />
            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search approver, gate, remark…"
              aria-label="Search the ledger"
              className="w-full pl-8 pr-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-[11px]"
            />
          </div>
          <span className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            {visibleRows.length} of {ledger.rows.length} row(s)
          </span>
        </div>

        {ledger.status === 'ready' && visibleRows.length === 0 ? (
          <div className="p-8 text-center text-xs text-slate-500 dark:text-slate-400">
            {ledger.rows.length === 0
              ? 'SignOffLog has no gate decisions yet. A save that changes a decision appends one row per approver.'
              : 'No ledger rows match these filters.'}
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <tr>
                  <th className="py-2.5 px-3 whitespace-nowrap">When</th>
                  <th className="py-2.5 px-2.5 whitespace-nowrap">Program</th>
                  <th className="py-2.5 px-2.5 whitespace-nowrap">Line</th>
                  <th className="py-2.5 px-2.5 whitespace-nowrap">Gate</th>
                  <th className="py-2.5 px-2.5 whitespace-nowrap">Approver</th>
                  <th className="py-2.5 px-2.5 whitespace-nowrap">Role</th>
                  <th className="py-2.5 px-2.5 whitespace-nowrap">Decision</th>
                  <th className="py-2.5 px-3">Remark</th>
                  <th className="py-2.5 px-2.5 text-right whitespace-nowrap">Rev</th>
                </tr>
              </thead>
              <tbody>
                {visibleRows.map((row, idx) => (
                  <tr
                    key={`${row.timestamp}-${row.programId}-${row.line}-${row.gate}-${row.approver}-${idx}`}
                    className="border-t border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/60"
                  >
                    <td className="py-2 px-3 whitespace-nowrap tabular-nums text-slate-600 dark:text-slate-300">
                      {String(row.timestamp).replace('T', ' ').slice(0, 16)}
                    </td>
                    <td className="py-2 px-2.5 whitespace-nowrap font-semibold text-slate-800 dark:text-slate-200">
                      {row.program || row.programId}
                      <div className="text-[10px] font-normal text-slate-400 dark:text-slate-500">{row.programId}</div>
                    </td>
                    <td className="py-2 px-2.5 whitespace-nowrap font-mono text-[11px] text-slate-600 dark:text-slate-300">
                      {row.line}
                    </td>
                    <td className="py-2 px-2.5 whitespace-nowrap text-slate-700 dark:text-slate-200">{row.gate}</td>
                    <td className="py-2 px-2.5 whitespace-nowrap text-slate-800 dark:text-slate-200">{row.approver}</td>
                    <td className="py-2 px-2.5 whitespace-nowrap text-[11px] text-slate-500 dark:text-slate-400">
                      {row.role}
                    </td>
                    <td className="py-2 px-2.5 whitespace-nowrap">
                      {/* Same prefix + mm/dd shape as the matrix cells, so the
                          ledger scans the same way: Pass 11/21. */}
                      <span
                        className={`inline-flex px-1.5 py-0.5 rounded border text-[10px] font-bold tabular-nums ${decisionChip(row.decision)}`}
                        title={`${row.decision} · ${String(row.timestamp).replace('T', ' ').slice(0, 16)}`}
                      >
                        {gateStatusPrefix(row.decision)} {formatMonthDay(row.timestamp)}
                      </span>
                    </td>
                    <td className="py-2 px-3 max-w-[280px] text-[11px] text-slate-600 dark:text-slate-300">
                      <span className="line-clamp-2" title={row.remark}>
                        {row.remark || '—'}
                      </span>
                      {row.signedInEmail && (
                        <div className="text-[10px] text-slate-400 dark:text-slate-500 truncate">{row.signedInEmail}</div>
                      )}
                    </td>
                    <td className="py-2 px-2.5 text-right whitespace-nowrap tabular-nums text-slate-500 dark:text-slate-400">
                      #{row.revision}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>
    </div>
  );
}

// ============================================================================
// VIEW 2: NPI PROJECTS & MULTI-VENDOR SPLIT BUILD MATRIX (CRUD)
// ============================================================================

function ProjectsMatrixView({
  projects,
  globalSide,
  onOpenGate,
  onAddMatrixRow,
  onEditMatrixRow,
  onDeleteMatrixRow,
  onEditProject,
  onDeleteProject,
  canDeletePrograms = true
}) {
  if (projects.length === 0) {
    return (
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-10 text-center text-xs text-slate-500 dark:text-slate-400">
        No NPI programs match the current Global Scope. Reset filters above to view all programs.
      </div>
    );
  }

  return (
    <div className="space-y-6">
      {projects.map((p) => {
        const visibleRows = [...(p.buildMatrix || [])]
          .filter((r) => globalSide === 'ALL' || (r.side || 'RHS') === globalSide)
          .sort((a, b) => {
            const cfgCmp = a.config.localeCompare(b.config, undefined, { numeric: true });
            if (cfgCmp !== 0) return cfgCmp;
            const sA = SIDE_ORDER.indexOf(a.side) === -1 ? 99 : SIDE_ORDER.indexOf(a.side);
            const sB = SIDE_ORDER.indexOf(b.side) === -1 ? 99 : SIDE_ORDER.indexOf(b.side);
            return sA - sB;
          });

        const totals = visibleRows.reduce(
          (acc, row) => {
            const c = computeBuildMatrixRow(row);
            return {
              fbu: acc.fbu + c.fbu,
              main: acc.main + c.main,
              rel: acc.rel + c.rel,
              shipmentReq: acc.shipmentReq + c.shipmentReq,
              mbo: acc.mbo + c.mbo,
              iqc: acc.iqc + c.iqc,
              oqc: acc.oqc + c.oqc,
              doe: acc.doe + c.doe,
              estYieldLoss: acc.estYieldLoss + c.estYieldLoss,
              additionalReq: acc.additionalReq + c.additionalReq,
              totalProduction: acc.totalProduction + c.totalProduction
            };
          },
          {
            fbu: 0,
            main: 0,
            rel: 0,
            shipmentReq: 0,
            mbo: 0,
            iqc: 0,
            oqc: 0,
            doe: 0,
            estYieldLoss: 0,
            additionalReq: 0,
            totalProduction: 0
          }
        );

        return (
          <section key={p.id} className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-start justify-between gap-3">
              <div className="space-y-1">
                <div className="flex flex-wrap items-center gap-2">
                  <h2 className="text-base font-bold text-slate-900 dark:text-slate-100">
                    {p.model} · {p.phase}
                  </h2>
                  <StatusBadge status={p.status} />
                  <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">{p.family}</span>
                  <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                    {p.moRange}
                  </span>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  {p.spec} · {p.lineSpec}
                </p>
                <div className="text-[11px] text-slate-500 dark:text-slate-400 flex flex-wrap gap-x-4 gap-y-1">
                  <span>
                    Manager: <strong className="text-slate-700 dark:text-slate-300">{p.pm}</strong>
                  </span>
                  <span>
                    Leader: <strong className="text-slate-700 dark:text-slate-300">{p.leader}</strong>
                  </span>
                  <span>
                    PE: <strong className="text-slate-700 dark:text-slate-300">{p.owner}</strong>
                  </span>
                  <span>
                    Customer: <strong className="text-slate-700 dark:text-slate-300">{p.customer}</strong> (ETD {p.etdDate})
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => onEditProject(p)}
                  title={`Edit ${p.model} program settings`}
                  aria-label={`Edit ${p.model} program settings`}
                  className="p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors"
                >
                  <Pencil className="w-3.5 h-3.5" />
                </button>
                <button
                  type="button"
                  onClick={() => onDeleteProject(p)}
                  disabled={!canDeletePrograms}
                  title={
                    canDeletePrograms
                      ? `Delete ${p.model} program and its gate dossiers`
                      : 'Keep at least one NPI program in the workspace'
                  }
                  aria-label={`Delete ${p.model} program`}
                  className="p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-rose-50 dark:hover:bg-rose-950 hover:text-rose-700 dark:hover:text-rose-300 text-slate-600 dark:text-slate-300 transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white dark:disabled:hover:bg-slate-900"
                >
                  <Trash2 className="w-3.5 h-3.5" />
                </button>
                <button
                  type="button"
                  onClick={() => onAddMatrixRow(p)}
                  className="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold inline-flex items-center gap-1.5 transition-colors"
                >
                  <Plus className="w-3.5 h-3.5" />
                  <span>Add Config / Side</span>
                </button>
                <button
                  type="button"
                  onClick={() => onOpenGate(p.id, p.currentGateId)}
                  className="px-3.5 py-2 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition-colors"
                >
                  <ShieldCheck className="w-4 h-4" />
                  <span>Open Gate Sign-Off</span>
                </button>
              </div>
            </div>

            <div className="p-5 space-y-2.5">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Multi-Vendor Split Build Matrix ({visibleRows.length} Config × Side Lines)
                </h3>
                <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
                  Total Production = Shipment Req. (FBU + Main + REL) + Additional Req. (MBO + IQC + OQC + DOE + Est. Loss)
                </div>
              </div>

              <div className="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-lg">
                {visibleRows.length === 0 ? (
                  <div className="p-6 text-center text-xs text-slate-500 dark:text-slate-400">
                    No Config × Side lines match the current filter. Click <strong>Add Config / Side</strong> to create one.
                  </div>
                ) : (
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-100/90 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400">
                        <th colSpan={5} className="py-1.5 px-3 border-r border-slate-200 dark:border-slate-800">
                          Config · Side · Part Identification &amp; Vendor Split
                        </th>
                        <th colSpan={4} className="py-1.5 px-2.5 text-center border-r border-slate-200 dark:border-slate-800 bg-blue-50/70 dark:bg-blue-950/70 text-blue-800 dark:text-blue-200">
                          Shipment Requirement
                        </th>
                        <th colSpan={6} className="py-1.5 px-2.5 text-center border-r border-slate-200 dark:border-slate-800 bg-amber-50/70 dark:bg-amber-950/70 text-amber-800 dark:text-amber-200">
                          Additional Requirement
                        </th>
                        <th colSpan={3} className="py-1.5 px-2.5 text-center bg-emerald-50/70 dark:bg-emerald-950/70 text-emerald-800 dark:text-emerald-200">
                          Production &amp; Schedule
                        </th>
                      </tr>
                      <tr className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        <th className="py-2 px-2.5 whitespace-nowrap">Config</th>
                        <th className="py-2 px-2 whitespace-nowrap">Side</th>
                        <th className="py-2 px-2.5 whitespace-nowrap">APN / Rev</th>
                        <th className="py-2 px-2.5 whitespace-nowrap">7E Code</th>
                        <th className="py-2 px-2.5 border-r border-slate-200 dark:border-slate-800 min-w-[200px]">Vendor Split / DOE</th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">FBU</th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">Main</th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">REL</th>
                        <th className="py-2 px-2.5 text-right whitespace-nowrap border-r border-slate-200 dark:border-slate-800 bg-blue-50/40 dark:bg-blue-950/40 text-blue-900 dark:text-blue-100 font-bold">
                          Ship Req.
                        </th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">MBO</th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">IQC</th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">OQC</th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">DOE</th>
                        <th className="py-2 px-2 text-right whitespace-nowrap">Est. Loss</th>
                        <th className="py-2 px-2.5 text-right whitespace-nowrap border-r border-slate-200 dark:border-slate-800 bg-amber-50/40 dark:bg-amber-950/40 text-amber-900 dark:text-amber-100 font-bold">
                          Add. Req.
                        </th>
                        <th className="py-2 px-2.5 text-right whitespace-nowrap bg-emerald-50/40 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-100 font-bold">
                          Total Prod.
                        </th>
                        <th className="py-2 px-2.5 text-center whitespace-nowrap">FATP MIH</th>
                        <th className="py-2 px-2.5 text-right whitespace-nowrap">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="tabular-nums">
                      {visibleRows.map((row, idx) => {
                        const c = computeBuildMatrixRow(row);
                        const prevRow = idx > 0 ? visibleRows[idx - 1] : null;
                        const isNewConfigGroup = prevRow && prevRow.config !== row.config;
                        const rowSide = row.side || 'RHS';

                        return (
                          <tr
                            key={`${row.config}-${rowSide}`}

                      <tr>
                        <td colSpan={5} className="py-2.5 px-3 border-r border-slate-200 dark:border-slate-800">

                        </td>
                        <td className="py-2.5 px-2 text-right">{totals.fbu.toLocaleString()}</td>
                        <td className="py-2.5 px-2 text-right">{totals.main.toLocaleString()}</td>
                        <td className="py-2.5 px-2 text-right">{totals.rel.toLocaleString()}</td>
                        <td className="py-2.5 px-2.5 text-right text-blue-900 dark:text-blue-100 border-r border-slate-200 dark:border-slate-800">
                          {totals.shipmentReq.toLocaleString()}

                        <td className="py-2.5 px-2 text-right">{totals.mbo.toLocaleString()}</td>
                        <td className="py-2.5 px-2 text-right">{totals.iqc.toLocaleString()}</td>
                        <td className="py-2.5 px-2 text-right">{totals.oqc.toLocaleString()}</td>
                        <td className="py-2.5 px-2 text-right">{totals.doe.toLocaleString()}</td>
                        <td className="py-2.5 px-2 text-right text-rose-700 dark:text-rose-300">

                          {totals.totalProduction.toLocaleString()}
                        </td>
