                          row.hasHold ? 'bg-rose-50/25 dark:bg-rose-950/25' : ''
                        }`}
                      >
                        {/* Sticky Left Info Cell */}
                        <div className="w-[310px] shrink-0 px-4 py-2.5 border-r border-slate-200 dark:border-slate-800 sticky left-0 z-10 bg-white dark:bg-slate-900 flex items-center justify-between gap-2">
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5">
                              <span className="w-5 h-5 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-800 text-[10px] font-bold text-slate-600 dark:text-slate-400 inline-flex items-center justify-center shrink-0 tabular-nums">
                                {row.seqNum}
                              </span>
                              <span
                                className={`px-1.5 py-0.5 rounded text-[10px] font-bold border ${
                                  row.sideBadge === 'RHS'
                                    ? 'bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800'
                                    : row.sideBadge === 'LHS'
                                    ? 'bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border-sky-200 dark:border-sky-800'
                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800'
                                }`}
                              >
                                {row.sideBadge}
                              </span>
                              <span className="text-xs font-bold text-slate-900 dark:text-slate-100">{row.label}</span>
                              {row.hasHold ? (
                                <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-100 dark:bg-rose-900 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800">
                                  HOLD
                                </span>
                              ) : sequenceMode === 'readiness' ? (
                                <span
                                  className={`px-1.5 py-0.5 rounded text-[9px] font-bold border ${
                                    row.readiness.tone === 'emerald'
                                      ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'
                                      : row.readiness.tone === 'blue'
                                      ? 'bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800'
                                      : 'bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200 border-amber-200 dark:border-amber-800'
                                  }`}
                                >
                                  {row.readiness.label}
                                </span>
                              ) : null}
                            </div>
                            <div
                              className="text-[10px] text-slate-400 dark:text-slate-400 truncate max-w-[180px] mt-0.5 pl-6"
                              title={row.sublabel}
                            >
                              {row.qty.toLocaleString()} pcs · {row.sublabel}
                            </div>
                          </div>

                          <div className="flex items-center gap-1.5 shrink-0">
                            <div className="flex flex-col items-end gap-0.5">
                              <span className="text-[11px] font-semibold text-emerald-700 dark:text-emerald-300 tabular-nums">
                                {formatShortDate(row.schedule.mih)}
                              </span>
                              <span
                                title={`${daysToMih} day${Math.abs(daysToMih) === 1 ? '' : 's'} ${daysToMih < 0 ? 'past' : 'to'} FATP MIH`}
                                className={`px-1 py-0.5 rounded border text-[9px] font-bold tabular-nums ${mihChipClass}`}
                              >
                                {daysToMih < 0 ? `Late ${Math.abs(daysToMih)}d` : `T-${daysToMih}`}
                              </span>
                            </div>
                            <button
                              type="button"
                              onClick={() =>
                                onEditSchedule({
                                  project,
                                  label: `${row.sideBadge} · ${row.label}`,
                                  rowKeys: row.rowKeys,
                                  schedule: row.schedule
                                })
                              }
                              title="Edit Schedule Dates"
                              aria-label={`Edit schedule for ${project.model} ${row.label}`}
                              className="p-1 rounded-md text-slate-400 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-300 hover:bg-blue-50 dark:hover:bg-blue-950 transition-colors"
                            >
                              <Pencil className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>

                        {/* Gantt Timeline Canvas */}
                        <div
                          className="relative h-12 flex-1"
                          style={{ width: `${chartWidthPx}px` }}
                        >
                          {/* Vertical Gridlines */}
                          {zoomLevel === 'week'
                            ? calendarTicks.weeks.map((w) => (
                                <div
                                  key={w.iso}
                                  style={{ left: `${w.idx * dayWidthPx}px` }}
                                  className="absolute top-0 bottom-0 border-l border-slate-100 dark:border-slate-800 pointer-events-none"
                                />
                              ))
                            : calendarTicks.days.map((d) =>
                                d.isWeekend ? (
                                  <div
                                    key={d.iso}
                                    style={{
                                      left: `${d.idx * dayWidthPx}px`,
                                      width: `${dayWidthPx}px`
                                    }}
                                    className="absolute top-0 bottom-0 bg-slate-100/50 dark:bg-slate-800/50 pointer-events-none"
                                  />
                                ) : null
                              )}

                          {/* Stage Bars — drag to move, drag an edge to resize */}
                          {GANTT_STAGES.map((st) => {
                            const startIso = row.schedule[st.startKey];
                            const endIso = row.schedule[st.endKey];
                            if (!startIso || !endIso) return null;
                            const leftPx = getOffsetPx(startIso);
                            const spanDays = Math.max(1, diffDaysIso(startIso, endIso) + 1);
                            const widthPx = Math.max(16, spanDays * dayWidthPx);

                            const drag =
                              stageDrag && stageDrag.rowId === row.id && stageDrag.stageId === st.id
                                ? stageDrag
                                : null;
                            const dragPx = drag ? drag.deltaDays * dayWidthPx : 0;
                            let barLeft = leftPx;
                            let barWidth = widthPx;
                            if (drag) {
                              if (drag.mode === 'resize-start') {
                                const shift = Math.min(dragPx, barWidth - dayWidthPx);
                                barLeft += shift;
                                barWidth -= shift;
                              } else if (drag.mode === 'resize-end') {
                                barWidth = Math.max(dayWidthPx, barWidth + dragPx);
                              } else {
                                barLeft += dragPx;
                              }
                            }

                            // The badge previews the dates the drop would commit.
                            let preview = null;
                            if (drag) {
                              let pStart = startIso;
                              let pEnd = endIso;
                              if (drag.mode !== 'resize-end') pStart = addDaysIso(pStart, drag.deltaDays);
                              if (drag.mode !== 'resize-start') pEnd = addDaysIso(pEnd, drag.deltaDays);
                              if (diffDaysIso(pStart, pEnd) < 0) {
                                if (drag.mode === 'resize-start') pStart = pEnd;
                                else pEnd = pStart;
                              }
                              preview = { start: pStart, end: pEnd, days: diffDaysIso(pStart, pEnd) + 1 };
                            }

                            return (
                              <button
                                key={st.id}
                                type="button"
                                onClick={() => {
                                  // A committed drag ends with a click; it must not also open the gate.
                                  if (suppressClickRef.current) {
                                    suppressClickRef.current = false;
                                    return;
                                  }
                                  onOpenGate(project.id, st.gateId, row.primaryLineKey);
                                }}
                                onPointerDown={(event) => startStageDrag(event, project, row, st, 'move')}
                                title={`${project.model} ${row.sideBadge} ${row.label} · ${st.label}: ${formatShortDate(
                                  startIso
                                )} – ${formatShortDate(endIso)} · ${spanDays}d · Drag to move, drag an edge to resize, click to open Gate Sign-Off`}
                                style={{
                                  left: `${barLeft}px`,
                                  width: `${barWidth}px`,
                                  touchAction: 'none'
                                }}
                                className={`group absolute top-2.5 h-7 rounded-md border px-1.5 text-[10px] font-semibold flex items-center whitespace-nowrap shadow-2xs hover:brightness-110 transition-all cursor-grab active:cursor-grabbing select-none ${
                                  st.barClass
                                } ${row.hasHold && st.id === 'prep' ? 'ring-2 ring-rose-500 ring-offset-1' : ''}`}
                              >
                                <span
                                  role="presentation"
                                  onPointerDown={(event) => startStageDrag(event, project, row, st, 'resize-start')}
                                  style={{ touchAction: 'none' }}
                                  className="absolute inset-y-0 left-0 w-2 cursor-ew-resize rounded-l-md bg-white/30 opacity-0 group-hover:opacity-100 group-active:opacity-100 transition-opacity"
                                />
                                <span className="min-w-0 truncate">
                                  {barWidth >= 48 ? st.label : st.id.toUpperCase()}
                                </span>
                                <span
                                  role="presentation"
                                  onPointerDown={(event) => startStageDrag(event, project, row, st, 'resize-end')}
                                  style={{ touchAction: 'none' }}
                                  className="absolute inset-y-0 right-0 w-2 cursor-ew-resize rounded-r-md bg-white/30 opacity-0 group-hover:opacity-100 group-active:opacity-100 transition-opacity"
                                />
                                {preview && (
                                  <span className="pointer-events-none absolute -top-6 left-0 z-30 rounded bg-slate-900/95 dark:bg-slate-700 px-1.5 py-0.5 text-[10px] font-bold text-white shadow-lg tabular-nums">
                                    {formatShortDate(preview.start)} – {formatShortDate(preview.end)} · {preview.days}d
                                  </span>
                                )}
                              </button>
                            );
                          })}

                          {/* ETD Milestone Marker */}
                          <button
                            type="button"
                            onClick={() => onOpenGate(project.id, 'ship', row.primaryLineKey)}
                            title={`${project.model} ${row.sideBadge} ${row.label} · ETD Shipment: ${formatShortDate(row.schedule.etd)}`}
                            style={{ left: `${etdPx + dayWidthPx / 2 - 6}px` }}
                            className="absolute top-4 w-3 h-3 rotate-45 bg-cyan-500 border border-cyan-800 hover:scale-125 transition-transform z-10"
                          />

                          {/* FATP MIH Milestone Diamond */}
                          <button
                            type="button"
                            onClick={() => onOpenGate(project.id, 'mih', row.primaryLineKey)}
                            title={`${project.model} ${row.sideBadge} ${row.label} · FATP MIH Target: ${formatShortDate(row.schedule.mih)}`}
                            style={{ left: `${mihPx + dayWidthPx / 2 - 7}px` }}
                            className="absolute top-3.5 w-3.5 h-3.5 rotate-45 bg-emerald-600 border-2 border-white dark:border-slate-800 shadow-sm ring-1 ring-emerald-700 hover:scale-125 transition-transform z-10"
                          />

                          {/* PBR Closure Dot */}
                          <button
                            type="button"
                            onClick={() => onOpenGate(project.id, 'pbr', row.primaryLineKey)}
                            title={`${project.model} ${row.sideBadge} ${row.label} · PBR Target: ${formatShortDate(row.schedule.pbr)}`}
                            style={{ left: `${pbrPx + dayWidthPx / 2 - 5}px` }}
                            className="absolute top-[19px] w-2.5 h-2.5 rounded-full bg-slate-800 dark:bg-slate-600 border border-white dark:border-slate-800 shadow-xs hover:scale-125 transition-transform z-10"
                          />

                          {/* Today Vertical Reference Line */}
                          {showTodayLine && (
                            <div
                              style={{ left: `${todayOffsetPx}px` }}
                              className="absolute top-0 bottom-0 w-px border-l border-dashed border-rose-500 pointer-events-none z-10"
                            />
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Footer Helper Bar */}
        <div className="px-5 py-2.5 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400">
          <div className="inline-flex items-center gap-1.5">
            <Flag className="w-3.5 h-3.5 text-rose-500 dark:text-rose-400" />
            <span>
              Dashed red vertical line marks <strong className="text-slate-700 dark:text-slate-300">Today ({formatShortDate(todayIso())}, {todayIso().slice(0, 4)})</strong>.
            </span>
          </div>
          <span>
            Drag a stage bar to move it, drag either edge to resize it (Esc cancels); click a bar or
            milestone diamond to open its Gate Sign-Off dossier.
          </span>
        </div>
      </section>
    </div>
  );
}

// ============================================================================
// VIEW 3: MANUFACTURING TASK MANAGER (LIST & KANBAN)
// ============================================================================

function TasksManagerView({ tasks, onSelectTask, onUpdateTaskStatus, onOpenNewTask }) {
  const [viewMode, setViewMode] = useState('list');
  const [stepFilter, setStepFilter] = useState('ALL');
  const [categoryFilter, setCategoryFilter] = useState('ALL');
  const [search, setSearch] = useState('');

  const filteredTasks = useMemo(() => {
    return tasks.filter((t) => {
      if (stepFilter !== 'ALL' && t.processStep !== stepFilter) return false;
      if (categoryFilter !== 'ALL' && t.category !== categoryFilter) return false;
      if (
        search.trim() &&
        !t.title.toLowerCase().includes(search.toLowerCase()) &&
        !t.owner.toLowerCase().includes(search.toLowerCase()) &&
        !t.id.toLowerCase().includes(search.toLowerCase())
      ) {
        return false;
      }
      return true;
    });
  }, [tasks, stepFilter, categoryFilter, search]);

  const columns = ['To Do', 'In Progress', 'Blocked', 'Done'];

  // Open AIL roll-up: counts over the whole register, not the filtered view.
  const openByCategory = useMemo(() => {
    const open = tasks.filter((t) => t.status !== 'Done');
    return {
      total: open.length,
      rows: TASK_CATEGORIES.map((category) => ({
        category,
        open: open.filter((t) => t.category === category).length
      })),
      uncategorised: open.filter((t) => !TASK_CATEGORIES.includes(t.category)).length
    };
  }, [tasks]);

  return (
    <div className="space-y-4">
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex flex-wrap items-center gap-2">
          <div className="relative">
            <Search className="w-3.5 h-3.5 text-slate-400 dark:text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search task ID, title, DRI..."
              className="pl-8 pr-3 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 w-52"
            />
          </div>

          <select
            value={stepFilter}
            onChange={(e) => setStepFilter(e.target.value)}
            className="px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300"
          >
            <option value="ALL">All Process Steps</option>
            {PROCESS_STEPS.map((s) => (
              <option key={s} value={s}>
                {s}
              </option>
            ))}
          </select>

          <select
            value={categoryFilter}
            onChange={(e) => setCategoryFilter(e.target.value)}
            aria-label="Filter tasks by category"
            className="px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300"
          >
            <option value="ALL">All Categories (AIL)</option>
            {TASK_CATEGORIES.map((c) => (
              <option key={c} value={c}>
                {c}
              </option>
            ))}
            <option value={TASK_UNCATEGORISED}>{TASK_UNCATEGORISED}</option>
          </select>
        </div>

        <div className="flex items-center gap-2">
          <div className="inline-flex rounded-lg border border-slate-200 dark:border-slate-800 p-0.5 bg-slate-50 dark:bg-slate-800 text-xs">
            <button
              type="button"
              onClick={() => setViewMode('list')}
              className={`px-2.5 py-1 rounded-md font-semibold ${
                viewMode === 'list' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs' : 'text-slate-500 dark:text-slate-400'
              }`}
            >
              List
            </button>
            <button
              type="button"
              onClick={() => setViewMode('board')}
              className={`px-2.5 py-1 rounded-md font-semibold ${
                viewMode === 'board' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-2xs' : 'text-slate-500 dark:text-slate-400'
              }`}
            >
              Kanban
            </button>
          </div>
          <button
            type="button"
            onClick={onOpenNewTask}
            className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-xs font-semibold inline-flex items-center gap-1"
          >
            <Plus className="w-3.5 h-3.5" />
            <span>Add Task</span>
          </button>
        </div>
      </div>

      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 px-4 py-3">
        <div className="flex flex-wrap items-center gap-2">
          <div className="flex items-baseline gap-1.5 mr-1">
            <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Open AIL</span>
            <span className="text-sm font-bold tabular-nums text-slate-900 dark:text-slate-100">{openByCategory.total}</span>
            <span className="text-[10px] text-slate-400 dark:text-slate-500">items not yet Done</span>
          </div>
          {openByCategory.rows.map(({ category, open }) => {
            const active = categoryFilter === category;
            return (
              <button
                key={category}
                type="button"
                onClick={() => setCategoryFilter(active ? 'ALL' : category)}
                aria-pressed={active}
                title={`${open} open ${category} item${open === 1 ? '' : 's'} — click to filter`}
                className={`inline-flex items-center gap-1.5 rounded-lg border px-1.5 py-1 transition-colors ${
                  active
                    ? 'border-blue-400 dark:border-blue-700 bg-blue-50 dark:bg-blue-950/60'
                    : 'border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'
                } ${open === 0 ? 'opacity-60' : ''}`}
              >
                <TaskCategoryBadge category={category} />
                <span className="text-xs font-bold tabular-nums text-slate-800 dark:text-slate-200 pr-0.5">{open}</span>
              </button>
            );
          })}
          {openByCategory.uncategorised > 0 && (
            <button
              type="button"
              onClick={() => setCategoryFilter(categoryFilter === TASK_UNCATEGORISED ? 'ALL' : TASK_UNCATEGORISED)}
              aria-pressed={categoryFilter === TASK_UNCATEGORISED}
              title="Open items without a category — click to filter"
              className={`inline-flex items-center gap-1.5 rounded-lg border px-1.5 py-1 transition-colors ${
                categoryFilter === TASK_UNCATEGORISED
                  ? 'border-blue-400 dark:border-blue-700 bg-blue-50 dark:bg-blue-950/60'
                  : 'border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'
              }`}
            >
              <TaskCategoryBadge category={TASK_UNCATEGORISED} />
              <span className="text-xs font-bold tabular-nums text-slate-800 dark:text-slate-200 pr-0.5">{openByCategory.uncategorised}</span>
            </button>
          )}
        </div>
      </div>

      {viewMode === 'list' ? (
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <tr>
                  <th className="py-3 px-4">ID / Program</th>
                  <th className="py-3 px-3">Task &amp; Process Step</th>
                  <th className="py-3 px-3">Category</th>
                  <th className="py-3 px-3">DRI</th>
                  <th className="py-3 px-3">Priority</th>
                  <th className="py-3 px-3">Status</th>
                  <th className="py-3 px-4 text-right">Due</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                {filteredTasks.map((t) => (
                  <tr
                    key={t.id}
                    onClick={() => onSelectTask(t.id)}
                    className="hover:bg-slate-50 dark:hover:bg-slate-800 dark:dark:hover:bg-slate-600 cursor-pointer transition-colors"
                  >
                    <td className="py-3 px-4 whitespace-nowrap font-mono text-slate-500 dark:text-slate-400">
                      <div className="font-bold text-slate-800 dark:text-slate-200">{t.id}</div>
                      <div className="text-[10px]">{t.projectId.replace('PRJ-', '')}</div>
                    </td>
                    <td className="py-3 px-3">
                      <div className="font-semibold text-slate-900 dark:text-slate-100">{t.title}</div>
                      <div className="text-[11px] text-slate-400 dark:text-slate-400">{t.processStep}</div>
                    </td>
                    <td className="py-3 px-3 whitespace-nowrap">
                      <TaskCategoryBadge category={t.category} />
                    </td>
                    <td className="py-3 px-3 whitespace-nowrap text-slate-700 dark:text-slate-300">{t.owner}</td>
                    <td className="py-3 px-3 whitespace-nowrap">
                      <StatusBadge status={t.priority} />
                    </td>
                    <td className="py-3 px-3 whitespace-nowrap">
                      <StatusBadge status={t.status} />
                    </td>
                    <td className="py-3 px-4 whitespace-nowrap text-right text-slate-600 dark:text-slate-400 tabular-nums">
                      {t.dueDate}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          {columns.map((col) => {
            const colTasks = filteredTasks.filter((t) => t.status === col);
            return (
              <div key={col} className="bg-slate-100/80 dark:bg-slate-800/80 rounded-xl border border-slate-200 dark:border-slate-800 p-3 space-y-2.5">
                <div className="flex items-center justify-between px-1">
                  <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{col}</span>
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 tabular-nums">
                    {colTasks.length}
                  </span>
                </div>
                <div className="space-y-2">
                  {colTasks.map((t) => (
                    <div
                      key={t.id}
                      onClick={() => onSelectTask(t.id)}
                      className="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 p-3 shadow-2xs hover:border-blue-300 dark:hover:border-blue-700 cursor-pointer space-y-2"
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-[10px] font-mono text-slate-400 dark:text-slate-400">
                          {t.id} · {t.projectId.replace('PRJ-', '')}
                        </span>
                        <StatusBadge status={t.priority} />
                      </div>
                      <div className="text-xs font-semibold text-slate-900 dark:text-slate-100 leading-snug">
                        {t.title}
                      </div>
                      <TaskCategoryBadge category={t.category} />
                      <div className="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-800">
                        <span>{t.owner}</span>
                        <select
                          value={t.status}
                          onClick={(e) => e.stopPropagation()}
                          onChange={(e) => onUpdateTaskStatus(t.id, e.target.value)}
                          className="text-[10px] border border-slate-200 dark:border-slate-800 rounded px-1.5 py-0.5 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300"
                        >
                          {columns.map((c) => (
                            <option key={c} value={c}>
                              {c}
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ============================================================================
// VIEW 4: NPI GATE PASS SIGN-OFF CENTER (MULTI-CONFIG & DEPENDENCY LOCKS)
// ============================================================================

function GateSignOffView({
  projects,
  selectedProject,
  onSelectProject,
  globalSide,
  selectedLineKey,
  selectedLineKeys,
  onUpdateSelectedLines,
  selectedGateId,
  onSelectGate,
  gateRecords,
  tasks,
  onToggleCriterion,
  onOpenSignOffModal,
  onFinalizeGate,
  onAddEvidence,
  onOpenGate,
  onSelectTask
}) {
  const allLineVariants = useMemo(
    () =>
      getLineVariantsForProject(selectedProject).filter(
        (v) => globalSide === 'ALL' || v.side === globalSide
      ),
    [selectedProject, globalSide]
  );

  const validKeys = useMemo(() => {
    const allowed = new Set(allLineVariants.map((v) => v.key));
    const kept = selectedLineKeys.filter((k) => allowed.has(k));
    if (kept.length > 0) return kept;
    return allLineVariants[0] ? [allLineVariants[0].key] : [];
  }, [allLineVariants, selectedLineKeys]);

  const primaryKey = validKeys.includes(selectedLineKey) ? selectedLineKey : validKeys[0];
  const projectLineGates = gateRecords[selectedProject.id] || {};
  const activeDossier = projectLineGates[primaryKey]?.[selectedGateId];
  const activeGateMeta = NPI_GATES.find((g) => g.id === selectedGateId) || NPI_GATES[0];
  const activeGateIdx = NPI_GATES.findIndex((g) => g.id === activeGateMeta.id);

  // KPI strip: the portfolio count spans the scope, the rest is the selected program.
  const portfolioLineCount = projects.reduce(
    (sum, p) =>
      sum + getLineVariantsForProject(p).filter((v) => globalSide === 'ALL' || v.side === globalSide).length,
    0
  );

  let programApprovedGates = 0;
  let programBlockedGates = 0;
  let programTotalGates = 0;
  let programPendingSignOffs = 0;
  let programPendingGateCount = 0;
  allLineVariants.forEach((v) => {
    const lineGates = projectLineGates[v.key] || {};
    NPI_GATES.forEach((g) => {
      const dossier = lineGates[g.id];
      programTotalGates += 1;
      if (!dossier) return;
      if (dossier.status === 'Approved') programApprovedGates += 1;
      if (dossier.status === 'Blocked') programBlockedGates += 1;
      if (dossier.status === 'In Review' || dossier.status === 'Blocked' || dossier.status === 'Conditional') {
        const open = (dossier.approvers || []).filter(
          (a) => a.decision === 'Pending' || a.decision === 'Rejected'
        ).length;
        programPendingSignOffs += open;
        if (open > 0) programPendingGateCount += 1;
      }
    });
  });

  const programTasks = tasks.filter((t) => t.projectId === selectedProject.id);
  const programOpenTasks = programTasks.filter((t) => t.status !== 'Done').length;
  const programBlockedTasks = programTasks.filter((t) => t.status === 'Blocked').length;
  const programLabel = `${selectedProject.model} ${selectedProject.phase}`;

  const [evidenceFormOpen, setEvidenceFormOpen] = useState(false);
  const [evidenceLabel, setEvidenceLabel] = useState('');
  const [evidenceUrl, setEvidenceUrl] = useState('');
  const [evidenceError, setEvidenceError] = useState('');
  const evidenceItems = Array.isArray(activeDossier?.evidence) ? activeDossier.evidence : [];

  const handleSubmitEvidence = (event) => {
    event.preventDefault();
    const label = evidenceLabel.trim();
    const url = evidenceUrl.trim();
    if (!label || !url) return;
    if (!/^https?:\/\//i.test(url)) {
      setEvidenceError('Paste the full link, starting with https://');
      return;
    }
    onAddEvidence(selectedProject.id, validKeys, selectedGateId, { label, url });
    setEvidenceLabel('');
    setEvidenceUrl('');
    setEvidenceError('');
    setEvidenceFormOpen(false);
  };

  const uniqueConfigs = Array.from(new Set(allLineVariants.map((v) => v.config)));
  const linkedTasks = tasks.filter(
    (t) => t.projectId === selectedProject.id && t.gateId === selectedGateId
  );

  // Readiness is measured per selected Config × Side line, because Approve & Lock
  // only signs the lines that actually cleared their criteria and signers.
  const lineReadiness = validKeys.map((key) => {
    const dossier = projectLineGates[key]?.[selectedGateId];
    const reasons = [];
    if (!dossier) {
      reasons.push('no gate dossier');
    } else if (dossier.status === 'Approved') {
      reasons.push('already approved');
    } else {
      const open = (dossier.criteria || []).filter((c) => !c.checked).length;
      if (open > 0) reasons.push(`${open} criteria open`);
      const rejected = (dossier.approvers || []).some((a) => a.decision === 'Rejected');
      if (rejected) reasons.push('signature rejected');
      const missing = (dossier.approvers || []).filter(
        (a) => a.decision !== 'Approved' && a.decision !== 'Conditional'
      ).length;
      if (missing > 0) reasons.push(`${missing} signature${missing === 1 ? '' : 's'} missing`);
    }
    return { key, status: dossier?.status || 'Pending', reasons, ready: reasons.length === 0 };
  });
  const readyKeys = lineReadiness.filter((r) => r.ready).map((r) => r.key);
  const mixedStatus = new Set(lineReadiness.map((r) => r.status)).size > 1;
  const scopeLocked = validKeys.every(
    (k) => projectLineGates[k]?.[selectedGateId]?.status === 'Approved'
  );
  const criteriaDone = validKeys.reduce((n, k) => {
    const dossier = projectLineGates[k]?.[selectedGateId];
    return n + (dossier ? dossier.criteria.filter((c) => c.checked).length : 0);
  }, 0);
  const criteriaTotal = validKeys.reduce((n, k) => {
    const dossier = projectLineGates[k]?.[selectedGateId];
    return n + (dossier ? dossier.criteria.length : 0);
  }, 0);
  const signaturesDone = validKeys.reduce((n, k) => {
    const dossier = projectLineGates[k]?.[selectedGateId];
    return (
      n +
      (dossier
        ? dossier.approvers.filter((a) => a.decision === 'Approved' || a.decision === 'Conditional')
            .length
        : 0)
    );
  }, 0);
  const signaturesTotal = validKeys.reduce((n, k) => {
    const dossier = projectLineGates[k]?.[selectedGateId];
    return n + (dossier ? dossier.approvers.length : 0);
  }, 0);
  const blockerSummary = lineReadiness
    .filter((r) => !r.ready)
    .slice(0, 2)
    .map((r) => `${r.key}: ${r.reasons.join(', ')}`)
    .join(' · ');

  const toggleLineSelection = (key) => {
    if (validKeys.includes(key)) {
      if (validKeys.length === 1) return;
      const next = validKeys.filter((k) => k !== key);
      onUpdateSelectedLines(next, next[0]);
    } else {
      onUpdateSelectedLines([...validKeys, key], key);
    }
  };

  if (!activeDossier) {
    return (
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-8 text-center text-xs text-slate-500 dark:text-slate-400">
        Select a valid Program and Config × Side line to inspect gate sign-offs.
      </div>
    );
  }

  return (
    <div className="space-y-5">
      {/* Portfolio + program KPI strip */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between gap-2 min-h-[112px]">
          <div className="flex items-start justify-between gap-2">
            <div className="text-xs font-medium text-slate-500 dark:text-slate-400">NPI Scope</div>
            <span className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded border bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700 whitespace-nowrap">
              Portfolio
            </span>
          </div>
          <div className="text-2xl font-bold text-slate-900 dark:text-slate-100 tabular-nums leading-none">
            {projects.length}{' '}
            <span className="text-xs font-normal text-slate-400 dark:text-slate-400">
              programs · {portfolioLineCount} lines
            </span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            PEN-81-0002 Rev B stage-gates across the active Global Scope
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between gap-2 min-h-[112px]">
          <div className="flex items-start justify-between gap-2">
            <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Gate Pass</div>
            <span className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded border bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800 whitespace-nowrap">
              {programLabel}
            </span>
          </div>
          <div className="text-2xl font-bold text-emerald-700 dark:text-emerald-300 tabular-nums leading-none">
            {programApprovedGates}
            <span className="text-sm font-normal text-slate-400 dark:text-slate-400">/{programTotalGates}</span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {programBlockedGates > 0 ? (
              <span className="text-rose-600 dark:text-rose-400 font-semibold">
                {programBlockedGates} line gate{programBlockedGates === 1 ? '' : 's'} on hold
              </span>
            ) : (
              'No blocked line gates'
            )}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between gap-2 min-h-[112px]">
          <div className="flex items-start justify-between gap-2">
            <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Pending Sign-Offs</div>
            <span className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded border bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800 whitespace-nowrap">
              {programLabel}
            </span>
          </div>
          <div className="text-2xl font-bold text-amber-700 dark:text-amber-300 tabular-nums leading-none">
            {programPendingSignOffs}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {programPendingGateCount} line gate{programPendingGateCount === 1 ? '' : 's'} awaiting authorized signers
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between gap-2 min-h-[112px]">
          <div className="flex items-start justify-between gap-2">
            <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Open Gate Tasks</div>
            <span className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded border bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800 whitespace-nowrap">
              {programLabel}
            </span>
          </div>
          <div className="text-2xl font-bold text-slate-900 dark:text-slate-100 tabular-nums leading-none">
            {programOpenTasks}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">
            {programBlockedTasks > 0 ? (
              <span className="text-rose-600 dark:text-rose-400 font-semibold">
                {programBlockedTasks} blocked containment item{programBlockedTasks === 1 ? '' : 's'}
              </span>
            ) : (
              'All active tasks progressing'
            )}
          </div>
        </div>
      </div>

      {/* Step 1 · Program + gate rail, with the dependency lock made visible */}
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-3">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div className="flex flex-wrap items-center gap-1.5">
            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mr-1">
              Program
            </span>
            {projects.map((p) => (
              <button
                key={p.id}
                type="button"
                onClick={() => onSelectProject(p.id)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${
                  p.id === selectedProject.id
                    ? 'bg-slate-900 dark:bg-slate-700 text-white border-slate-900'
                    : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'
                }`}
              >
                {p.model} · {p.phase}
              </button>
            ))}
          </div>

          <div className="flex flex-wrap items-center gap-2 text-[11px]">
            <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-md bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800 font-semibold">
              <ShieldCheck className="w-3.5 h-3.5" />
              {activeGateMeta.code} · {activeGateMeta.label}
            </span>
            {activeDossier.targetDate && (
              <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold tabular-nums">
                <Calendar className="w-3.5 h-3.5" />
                Target {activeDossier.targetDate}
              </span>
            )}
          </div>
        </div>

        <div className="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-9 gap-1.5">
          {NPI_GATES.map((g, idx) => {
            const roll = computeProgramGateDependency(selectedProject, g.id, projectLineGates);
            const active = g.id === selectedGateId;
            const prevGate = idx > 0 ? NPI_GATES[idx - 1] : null;
            const locked =
              Boolean(prevGate) &&
              validKeys.some(
                (k) => (projectLineGates[k]?.[prevGate.id]?.status || 'Pending') !== 'Approved'
              );
            return (
              <button
                key={g.id}
                type="button"
                onClick={() => onSelectGate(g.id)}
                title={
                  locked
                    ? `Opens after ${prevGate.code} (${prevGate.short}) is approved on every selected line`
                    : `${g.code} ${g.label}`
                }
                className={`p-2 rounded-lg border text-left transition-colors ${
                  active
                    ? 'bg-blue-600 text-white border-blue-600 shadow-xs'
                    : roll.status === 'Approved'
                    ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100 dark:hover:bg-emerald-900'
                    : roll.status === 'Blocked'
                    ? 'bg-rose-50 dark:bg-rose-950 text-rose-800 dark:text-rose-200 border-rose-200 dark:border-rose-800 hover:bg-rose-100 dark:hover:bg-rose-900'
                    : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                <div className="flex items-center justify-between text-[10px] font-bold">
                  <span>{g.code}</span>
                  <span className="tabular-nums opacity-80">
                    {roll.approvedCount}/{roll.totalCount}
                  </span>
                </div>
                <div className="text-[11px] font-semibold truncate mt-0.5">{g.short}</div>
                <div
                  className={`text-[9px] mt-0.5 truncate ${
                    active ? 'text-white/80' : locked ? 'text-slate-400 dark:text-slate-500' : 'opacity-70'
                  }`}
                >
                  {roll.status === 'Approved' ? 'Cleared' : locked ? 'Locked' : roll.status}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Step 2 · Scope, criteria and sign-off for the selected gate */}
      <div className="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
        {/* Left: scope + criteria + linked tasks */}
        <div className="xl:col-span-5 space-y-5">
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-2.5">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                Config × Side Scope ({validKeys.length} of {allLineVariants.length} selected)
              </h3>
              <div className="flex flex-wrap items-center gap-1 text-[10px]">
                <button
                  type="button"
                  onClick={() =>
                    onUpdateSelectedLines(allLineVariants.map((v) => v.key), allLineVariants[0]?.key)
                  }
                  className="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold text-slate-700 dark:text-slate-300"
                >
                  All
                </button>
                {['RHS', 'LHS'].map((sd) => {
                  const sideKeys = allLineVariants.filter((v) => v.side === sd).map((v) => v.key);
                  if (sideKeys.length === 0) return null;
                  return (
                    <button
                      key={sd}
                      type="button"
                      onClick={() => onUpdateSelectedLines(sideKeys, sideKeys[0])}
                      className="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold text-slate-700 dark:text-slate-300"
                    >
                      {sd}
                    </button>
                  );
                })}
                {uniqueConfigs.map((cfg) => {
                  const cfgKeys = allLineVariants.filter((v) => v.config === cfg).map((v) => v.key);
                  return (
                    <button
                      key={cfg}
                      type="button"
                      onClick={() => onUpdateSelectedLines(cfgKeys, cfgKeys[0])}
                      className="px-2 py-0.5 rounded bg-blue-50 dark:bg-blue-950 hover:bg-blue-100 dark:hover:bg-blue-900 font-semibold text-blue-700 dark:text-blue-300"
                    >
                      {cfg}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="flex flex-wrap gap-1.5">
              {allLineVariants.map((v) => {
                const active = validKeys.includes(v.key);
                const lineSt = projectLineGates[v.key]?.[selectedGateId]?.status || 'Pending';
                return (
                  <button
                    key={v.key}
                    type="button"
                    onClick={() => toggleLineSelection(v.key)}
                    className={`px-2.5 py-1 rounded-lg border text-[11px] font-semibold inline-flex items-center gap-1.5 transition-colors ${
                      active
                        ? 'bg-slate-900 dark:bg-slate-700 text-white border-slate-900'
                        : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'
                    }`}
                  >
                    <span>
                      {active ? '✓ ' : ''}
                      {v.config} · {v.side}
                    </span>
                    <span
                      className={`text-[9px] px-1 py-0.5 rounded ${
                        lineSt === 'Approved'
                          ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-300'
                          : lineSt === 'Blocked'
                          ? 'bg-rose-500/20 text-rose-600 dark:text-rose-300'
                          : active
                          ? 'bg-slate-700 text-slate-200'
                          : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'
                      }`}
                    >
                      {lineSt}
                    </span>
                  </button>
                );
              })}
            </div>
            <p className="text-[11px] text-slate-500 dark:text-slate-400">
              Criteria ticks, sign-offs and evidence apply to every selected line. Sign-offs are recorded per line.
            </p>
          </div>

          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <ClipboardCheck className="w-4 h-4 text-blue-600 dark:text-blue-400" />
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                  Gate Exit Criteria
                </h3>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400 tabular-nums">
                  {criteriaDone}/{criteriaTotal}

                {mixedStatus ? (
                  <span className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded border border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-200">
                    Mixed status
                  </span>
                ) : (
                  <StatusBadge status={activeDossier.status} />
                )}
              </div>
            </div>

            <div className="divide-y divide-slate-100 dark:divide-slate-800">
              {activeDossier.criteria.map((c, cIdx) => {
                const checkedCount = validKeys.reduce((n, k) => {
                  const gate = projectLineGates[k]?.[selectedGateId];
                  return n + (gate?.criteria?.[cIdx]?.checked ? 1 : 0);
                }, 0);

                const partial = checkedCount > 0 && !allChecked;

                  <label
                    key={c.id}
                    className={`flex items-start gap-3 p-3.5 text-xs ${

                      type="checkbox"
                      checked={allChecked}
                      ref={(el) => {

                      onChange={() =>

                        className={`font-medium ${

                            ? 'text-slate-400 dark:text-slate-400 line-through'
                            : 'text-slate-800 dark:text-slate-200'

                      >
                        {c.label}
                      </div>
                      <div className="flex items-center gap-2 mt-0.5">
                        <span className="text-[10px] font-semibold uppercase text-slate-400 dark:text-slate-500">

                                : 'text-slate-400 dark:text-slate-500'
                            }`}
                          >
                            {checkedCount}/{validKeys.length} lines
                          </span>
                        )}
                      </div>
                    </div>
                  </label>
                );
              })}
            </div>
          </div>

          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
              Linked Gate Tasks ({linkedTasks.length})
            </div>
            <div className="divide-y divide-slate-100 dark:divide-slate-800">
              {linkedTasks.length === 0 ? (
                <div className="p-4 text-xs text-slate-400 dark:text-slate-400">No open tasks linked to this gate.</div>
              ) : (
                linkedTasks.map((t) => (
                  <button
                    key={t.id}
                    type="button"
                    onClick={() => onSelectTask(t.id)}
                    className="w-full text-left p-3.5 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between gap-2 text-xs"
                  >
                    <span className="font-medium text-slate-800 dark:text-slate-200 truncate">{t.title}</span>
                    <StatusBadge status={t.status} />
                  </button>
                ))
              )}
            </div>
          </div>

            </div>

            {validKeys.length > 1 && (
              <div className="border-t border-slate-200 dark:border-slate-800 px-4 py-2.5 space-y-1">
                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">

                  <div key={r.key} className="flex items-center gap-2 text-[11px] min-w-0">

                      {r.key}
                    </span>
                    <span className="text-slate-500 dark:text-slate-400 truncate">
                      {r.ready ? `Ready · ${r.status}` : r.reasons.join(' · ')}

                  </div>
                ))}
                <p className="text-[10px] text-slate-400 dark:text-slate-500 pt-0.5">
                  Approve &amp; Lock signs the ready lines only; the rest stay at {activeGateMeta.code}.
                </p>
              </div>
            )}
          </div>

          {/* Gate Evidence · Google Drive links retained with the signed dossier */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div>
                <div className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                  Gate Evidence · Google Drive ({evidenceItems.length})
                </div>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">
                  {validKeys.length > 1
                    ? `Links attach to all ${validKeys.length} selected lines and are logged in the audit trail`

              </div>
              <button
                type="button"
                onClick={() => {
                  setEvidenceFormOpen((open) => !open);
                  setEvidenceError('');
                }}
                className="px-2.5 py-1 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-[11px] font-semibold inline-flex items-center gap-1.5 transition-colors"
              >
                <Plus className="w-3 h-3" />
                <span>{evidenceFormOpen ? 'Close' : 'Add Drive link'}</span>
              </button>

            {evidenceFormOpen && (
              <form
                onSubmit={handleSubmitEvidence}
                className="p-3.5 space-y-2 border-b border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/50"
              >
                <div>
                  <label className="text-[11px] font-semibold text-slate-700 dark:text-slate-300 block mb-1">
                    Evidence label
                  </label>
                  <input
                    type="text"
                    value={evidenceLabel}
                    onChange={(e) => setEvidenceLabel(e.target.value)}
                    placeholder="e.g. IQC OMM flatness report"
                    required
                    className="w-full px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 bg-white dark:bg-slate-900"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-semibold text-slate-700 dark:text-slate-300 block mb-1">
                    Google Drive link
                  </label>
                  <input
                    type="url"
                    value={evidenceUrl}
                    onChange={(e) => setEvidenceUrl(e.target.value)}
                    placeholder="https://drive.google.com/drive/folders/..."
                    required
                    className="w-full px-2.5 py-1.5 text-xs font-mono border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 bg-white dark:bg-slate-900"
                  />
                  <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">
                    Share the folder or file with the gate board first — reviewers need read access.
                  </p>
                </div>
                {evidenceError && (
                  <p className="text-[10px] font-semibold text-rose-600 dark:text-rose-400">{evidenceError}</p>
                )}
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setEvidenceFormOpen(false);
                      setEvidenceError('');

                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-2.5 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-semibold"
                  >
                    Attach link
                  </button>
                </div>
              </form>
            )}

            <div className="divide-y divide-slate-100 dark:divide-slate-800 max-h-56 overflow-y-auto">
              {evidenceItems.length === 0 ? (
                <div className="p-4 text-xs text-slate-400 dark:text-slate-400">
                  No evidence linked to this gate yet.
                </div>
              ) : (
                evidenceItems.map((ev) => (
                  <div key={ev.id} className="px-3.5 py-2.5">
                    <a
                      href={ev.url}
                      target="_blank"
                      rel="noopener noreferrer"

                      className="text-xs font-semibold text-blue-700 dark:text-blue-300 hover:underline inline-flex items-center gap-1.5 max-w-full"
                    >
                      <ExternalLink className="w-3.5 h-3.5 shrink-0" />
                      <span className="truncate">{ev.label}</span>
                    </a>
                    <div className="text-[10px] font-mono text-slate-400 dark:text-slate-400 truncate mt-0.5 pl-5">
                      {ev.url}
                    </div>
                    <div className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5 pl-5">
                      {ev.addedBy} · {ev.addedAt}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Audit Trail */}
          <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                Gate Sign-Off Audit Trail
              </div>
              <span className="text-[10px] font-semibold text-slate-400 dark:text-slate-500">
                {primaryKey} · newest first
              </span>
            </div>
            <div className="divide-y divide-slate-100 dark:divide-slate-800 max-h-56 overflow-y-auto">
              {activeDossier.auditLog.length === 0 ? (
                <div className="p-4 text-xs text-slate-400 dark:text-slate-400">No sign-off actions recorded yet.</div>
              ) : (
                activeDossier.auditLog.map((entry, idx) => (
                  <div key={idx} className="p-3.5 text-xs space-y-0.5">
                    <div className="flex items-center justify-between gap-2">
                      <strong className="text-slate-800 dark:text-slate-200">{entry.actor}</strong>
                      <span className="text-[11px] text-slate-400 dark:text-slate-400 tabular-nums">{entry.time}</span>
                    </div>
                    <div className="font-semibold text-blue-700 dark:text-blue-300">{entry.action}</div>
                    <div className="text-slate-600 dark:text-slate-400">{entry.note}</div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      </div>

      {/* Step 3 · Portfolio view, after the gate in hand */}
      <div className="space-y-2">
        <div className="flex flex-wrap items-baseline justify-between gap-2 px-1">
          <h3 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">
            Portfolio Dependency Matrix
          </h3>
          <p className="text-[11px] text-slate-500 dark:text-slate-400">
            All programs · click any gate cell to load that dossier above
          </p>
        </div>
        <GateWorkstreamMatrix
          projects={projects}
          gateRecords={gateRecords}
          globalSide={globalSide}
          onOpenGate={onOpenGate}
        />
      </div>
    </div>
  );
}

// ============================================================================
// VIEW 5: PRODUCTION RECORDS (CALCULATED FPY, FY, UPH & EFFICIENCY)
// ============================================================================

function ProductionRecordsView({ records, onOpenNewRecord, onEditRecord, onDeleteRecord }) {
  const [searchQuery, setSearchQuery] = useState('');
  const [stationFilter, setStationFilter] = useState('ALL');
  const [expandedIds, setExpandedIds] = useState({});

  const toggleExpand = (id) => {
    setExpandedIds((prev) => ({ ...prev, [id]: !prev[id] }));
  };

  const filteredRecords = useMemo(() => {
    return records.filter((r) => {
      if (stationFilter !== 'ALL' && r.station !== stationFilter) return false;
      if (!searchQuery.trim()) return true;
      const q = searchQuery.toLowerCase();
      const defectMatch = (r.defectItems || []).some((d) =>
        d.mode.toLowerCase().includes(q)
      );
      const dtMatch = (r.downtimeEvents || []).some(
        (e) =>
          e.reason.toLowerCase().includes(q) || e.category.toLowerCase().includes(q)
      );
      return (
        r.model.toLowerCase().includes(q) ||
        r.phase.toLowerCase().includes(q) ||
        (r.station || '').toLowerCase().includes(q) ||
        r.config.toLowerCase().includes(q) ||
        r.side.toLowerCase().includes(q) ||
        defectMatch ||
        dtMatch
      );
    });
  }, [records, stationFilter, searchQuery]);

  const totals = useMemo(() => {
    const agg = filteredRecords.reduce(
      (acc, r) => {
        const m = computeProductionMetrics(r);
        return {
          input: acc.input + r.input,
          fallout: acc.fallout + m.fallout,
          salvage: acc.salvage + m.salvage,
          plannedTimeHr: acc.plannedTimeHr + r.plannedTimeHr,
          downtimeHr: acc.downtimeHr + m.downtimeHr
        };
      },
      { input: 0, fallout: 0, salvage: 0, plannedTimeHr: 0, downtimeHr: 0 }
    );
    return {
      ...agg,
      ...computeProductionMetrics(agg)
    };
  }, [filteredRecords]);

  return (
    <div className="space-y-6">
      {/* Calculated Summary KPI Strip */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Total Input Qty</div>
          <div className="text-xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">
            {totals.input.toLocaleString()} <span className="text-xs font-normal text-slate-400 dark:text-slate-400">pcs</span>
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            Fallout {totals.fallout} · Salvage {totals.salvage}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated FPY</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              totals.fpy >= KPI_TARGETS.fpy ? 'text-emerald-700 dark:text-emerald-300' : 'text-amber-700 dark:text-amber-300'
            }`}
          >
            {totals.fpy.toFixed(2)}%
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">(Input − Fallout) / Input</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated FY</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              totals.fy >= KPI_TARGETS.fy ? 'text-emerald-700 dark:text-emerald-300' : 'text-amber-700 dark:text-amber-300'
            }`}
          >
            {totals.fy.toFixed(2)}%
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">(Input − Fallout + Salvage) / Input</div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated Output UPH</div>
          <div className="text-xl font-bold text-slate-900 dark:text-slate-100 tabular-nums">
            {totals.uph.toFixed(1)}
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">
            Planned {totals.plannedTimeHr.toFixed(1)}h · DT {totals.downtimeHr.toFixed(2)}h
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 space-y-1 col-span-2 lg:col-span-1">
          <div className="text-xs font-medium text-slate-500 dark:text-slate-400">Calculated Efficiency</div>
          <div
            className={`text-xl font-bold tabular-nums ${
              totals.efficiency >= KPI_TARGETS.efficiency ? 'text-emerald-700 dark:text-emerald-300' : 'text-amber-700 dark:text-amber-300'
            }`}
          >
            {totals.efficiency.toFixed(1)}%
          </div>
          <div className="text-[11px] text-slate-500 dark:text-slate-400">Output UPH / Input UPH</div>
        </div>
      </div>

      {/* Main Production Records Ledger */}
      <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 className="text-sm font-semibold text-slate-900 dark:text-slate-100">Production Records</h2>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
              Expand any row to inspect multi-item Fallout / Salvage defects and Downtime events by Station / Process
            </p>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <select
              aria-label="Filter by Station or Process"
              value={stationFilter}
              onChange={(e) => setStationFilter(e.target.value)}
              className="px-2.5 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 font-medium"
            >
              <option value="ALL">All Stations / Processes</option>
              {PRODUCTION_STATIONS.map((st) => (
                <option key={st} value={st}>
                  {st}
                </option>
              ))}
            </select>

            <div className="relative">
              <Search className="w-3.5 h-3.5 text-slate-400 dark:text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search defect, downtime, config..."
                className="pl-8 pr-3 py-1.5 text-xs border border-slate-200 dark:border-slate-800 rounded-lg focus:outline-none focus:border-blue-500 w-52"
              />
            </div>
            <button
              type="button"
              onClick={onOpenNewRecord}
              className="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white text-xs font-semibold inline-flex items-center gap-1.5 transition-colors"
            >
              <Plus className="w-3.5 h-3.5" />
              <span>Log Record</span>
            </button>
          </div>
        </div>

        <div className="overflow-x-auto">
          {filteredRecords.length === 0 ? (
            <div className="p-10 text-center text-xs text-slate-500 dark:text-slate-400">
              No production records match the current Global Scope, station, or search filter.
            </div>
          ) : (
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <tr>
                  <th className="py-3 pl-3 pr-1 w-8" />
                  <th className="py-3 px-2.5 whitespace-nowrap">Product</th>
                  <th className="py-3 px-2 whitespace-nowrap">Phase</th>
                  <th className="py-3 px-2.5 whitespace-nowrap">Station / Process</th>
                  <th className="py-3 px-2 whitespace-nowrap">Config</th>
                  <th className="py-3 px-2 whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Side</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap">Input</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap">Fallout</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Salvage</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap">Planned (h)</th>
                  <th className="py-3 px-2.5 text-right whitespace-nowrap border-r border-slate-200 dark:border-slate-800">Downtime</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">FPY</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">FY</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">UPH</th>
                  <th className="py-3 px-2 text-right whitespace-nowrap bg-slate-100/70 dark:bg-slate-800/70">Eff.</th>
                  <th className="py-3 pl-2 pr-4 text-right whitespace-nowrap">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800 tabular-nums">
                {filteredRecords.map((r) => {
                  const m = computeProductionMetrics(r);
                  const isExpanded = Boolean(expandedIds[r.id]);
                  const defectList = r.defectItems || [];
                  const downtimeList = r.downtimeEvents || [];
                  const falloutCount = defectList.filter((d) => (Number(d.falloutQty) || 0) > 0).length;
                  const salvageCount = defectList.filter((d) => (Number(d.salvageQty) || 0) > 0).length;

                  return (
                    <React.Fragment key={r.id}>
                      <tr
                        onClick={() => toggleExpand(r.id)}
                        className={`cursor-pointer transition-colors ${
