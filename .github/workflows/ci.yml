name: CI

on:
  push:

jobs:
  test:
    name: bun run test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the suite (helpers + generated-bundle freshness)
        run: bun run test
